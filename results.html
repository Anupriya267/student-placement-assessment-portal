<!DOCTYPE html>
<html>

<head>

<title>Assessment Result</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>


<body>

<div class="dashboard">

<h1>Assessment Result</h1>


<div class="card">

<h2>Student Assessment Report</h2>


<p>
<b>Student:</b> Student 1
</p>


<p>
<b>Year:</b> Final Year
</p>


<p>
<b>Assessment:</b>
Day 1 Java Placement Assessment
</p>


<p>
<b>Topic:</b>
Loops, Conditions, Operators
</p>


<p>
<b>Marks:</b>
<span id="marks"></span>
</p>


<p>
<b>Percentage:</b>
<span id="percentage"></span>%
</p>


<p>
<b>Status:</b>
Completed
</p>


<br>


<button type="button" onclick="downloadPDF()">
Download PDF Report
</button>


</div>



<!-- ================= ANSWER SHEET ================= -->

<div class="card">

<h2>Answer Sheet</h2>


<div id="answerSheet"></div>


</div>


</div>



<script>


// ================= GET RESULT =================

let score =
Number(localStorage.getItem("score")) || 0;


let total =
Number(localStorage.getItem("total")) || 12;


let percentage =
total > 0
? (score / total) * 100
: 0;



// ================= DISPLAY RESULT =================

document.getElementById("marks").innerHTML =
score + " / " + total;


document.getElementById("percentage").innerHTML =
percentage.toFixed(0);



// ================= GET ANSWER SHEET =================

let answerSheet =
JSON.parse(
    localStorage.getItem("answerSheet") || "[]"
);



// ================= DISPLAY ANSWERS =================

let answerHTML = "";


answerSheet.forEach(function(item, index){

    answerHTML += `

    <div style="
        border:1px solid #ddd;
        padding:15px;
        margin-bottom:15px;
        border-radius:8px;
    ">

        <h3>
        ${index + 1}. ${item.question}
        </h3>

        <p>
        <b>Your Answer:</b><br>
        ${escapeHTML(item.studentAnswer)}
        </p>

        <p>
        <b>Correct Answer:</b><br>
        ${escapeHTML(item.correctAnswer)}
        </p>

        <p>
        <b>Status:</b>
        ${item.status}
        </p>

    </div>

    `;

});


document.getElementById("answerSheet").innerHTML =
answerHTML;



// ================= SAFE DISPLAY =================

function escapeHTML(text){

    let div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}



// ================= DOWNLOAD PDF =================

function downloadPDF(){

    const { jsPDF } = window.jspdf;

    let doc = new jsPDF();


    let y = 20;


    // TITLE

    doc.setFontSize(18);

    doc.text(
        "STUDENT PLACEMENT ASSESSMENT REPORT",
        20,
        y
    );


    y += 10;


    doc.line(
        20,
        y,
        190,
        y
    );


    y += 15;


    // STUDENT DETAILS

    doc.setFontSize(11);

    doc.text(
        "Student: Student 1",
        20,
        y
    );

    y += 8;


    doc.text(
        "Year: Final Year",
        20,
        y
    );

    y += 8;


    doc.text(
        "Assessment: Day 1 Java Placement Assessment",
        20,
        y
    );

    y += 8;


    doc.text(
        "Topic: Loops, Conditions, Operators",
        20,
        y
    );

    y += 10;


    doc.text(
        "Marks: " + score + " / " + total,
        20,
        y
    );

    y += 8;


    doc.text(
        "Percentage: " + percentage.toFixed(0) + "%",
        20,
        y
    );

    y += 8;


    doc.text(
        "Status: Completed",
        20,
        y
    );

    y += 15;


    doc.setFontSize(15);

    doc.text(
        "ANSWER SHEET",
        20,
        y
    );

    y += 10;


    doc.setFontSize(10);


    // ================= PDF ANSWERS =================

    answerSheet.forEach(function(item, index){

        // New page if needed

        if(y > 260){

            doc.addPage();

            y = 20;

        }


        doc.setFontSize(11);

        doc.text(
            (index + 1) + ". " + item.question,
            20,
            y
        );

        y += 7;


        doc.setFontSize(9);


        // Student answer

        let studentText =
            "Your Answer: " +
            item.studentAnswer;


        let studentLines =
            doc.splitTextToSize(
                studentText,
                165
            );


        doc.text(
            studentLines,
            25,
            y
        );


        y +=
            studentLines.length * 5 + 4;



        // Correct answer

        let correctText =
            "Correct Answer: " +
            item.correctAnswer;


        let correctLines =
            doc.splitTextToSize(
                correctText,
                165
            );


        doc.text(
            correctLines,
            25,
            y
        );


        y +=
            correctLines.length * 5 + 4;



        // Status

        doc.text(
            "Status: " + item.status,
            25,
            y
        );


        y += 10;


        doc.line(
            20,
            y,
            190,
            y
        );


        y += 8;

    });



    // FOOTER

    if(y > 270){

        doc.addPage();

        y = 20;

    }


    doc.setFontSize(9);

    doc.text(
        "Generated by Student Placement Assessment Portal",
        20,
        y
    );



    // SAVE PDF

    doc.save(
        "Student_1_Day_1_Assessment_Report.pdf"
    );

}

</script>


</body>

</html>
