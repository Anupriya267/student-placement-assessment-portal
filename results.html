<!DOCTYPE html>
<html>

<head>

<title>Assessment Result</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<div class="dashboard">

<h1>Assessment Result</h1>


<!-- ================= REPORT ================= -->

<div class="card">

<h2>Student Assessment Report</h2>

<p>
<b>Student:</b> Student 1
</p>

<p>
<b>Year:</b> Final Year
</p>

<p>
<b>Assessment:</b>
Day 1 Java Placement Assessment
</p>

<p>
<b>Topic:</b>
Loops, Conditions, Operators
</p>

<p>
<b>Marks:</b>
<span id="marks"></span>
</p>

<p>
<b>Percentage:</b>
<span id="percentage"></span>%
</p>

<p>
<b>Status:</b>
Completed
</p>

<br>

<button type="button" onclick="downloadPDF()">
Download PDF Report
</button>

</div>


<!-- ================= ANSWER SHEET ================= -->

<div class="card">

<h2>Answer Sheet</h2>

<div id="answerSheet">

<p>Loading answers...</p>

</div>

</div>


</div>


<script>


// ==================================================
// GET SCORE
// ==================================================

let score =
Number(localStorage.getItem("score")) || 0;


let total =
Number(localStorage.getItem("total")) || 12;


let percentage =
total > 0
? (score / total) * 100
: 0;


// ==================================================
// DISPLAY RESULT
// ==================================================

document.getElementById("marks").textContent =
score + " / " + total;


document.getElementById("percentage").textContent =
percentage.toFixed(0);


// ==================================================
// GET ANSWER SHEET
// ==================================================

let answerSheet = [];

try {

    answerSheet =
        JSON.parse(
            localStorage.getItem("answerSheet") || "[]"
        );

} catch(error) {

    answerSheet = [];

}


// ==================================================
// DISPLAY ANSWER SHEET
// ==================================================

let answerContainer =
document.getElementById("answerSheet");


if(answerSheet.length === 0){

    answerContainer.innerHTML = `
    
    <p>
    <b>No answer sheet found.</b>
    </p>
    
    <p>
    Please complete a new assessment and submit it again.
    </p>
    
    `;

}

else{

    let answerHTML = "";

    answerSheet.forEach(function(item, index){

        answerHTML += `

        <div style="
            border:1px solid #ddd;
            padding:15px;
            margin-bottom:15px;
            border-radius:8px;
        ">

            <h3>
            ${index + 1}. ${escapeHTML(item.question)}
            </h3>

            <p>
            <b>Your Answer:</b>
            </p>

            <pre style="
                white-space:pre-wrap;
                word-wrap:break-word;
            ">${escapeHTML(item.studentAnswer)}</pre>

            <p>
            <b>Correct Answer:</b>
            </p>

            <pre style="
                white-space:pre-wrap;
                word-wrap:break-word;
            ">${escapeHTML(item.correctAnswer)}</pre>

            <p>
            <b>Status:</b>
            ${escapeHTML(item.status)}
            </p>

        </div>

        `;

    });


    answerContainer.innerHTML =
        answerHTML;

}


// ==================================================
// SAFE HTML DISPLAY
// ==================================================

function escapeHTML(text){

    if(text === undefined || text === null){

        return "";

    }

    let div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;

}


// ==================================================
// DOWNLOAD PDF
// ==================================================

function downloadPDF(){

    // Get the latest answer sheet again

    let latestAnswerSheet = [];

    try {

        latestAnswerSheet =
            JSON.parse(
                localStorage.getItem("answerSheet") || "[]"
            );

    } catch(error) {

        latestAnswerSheet = [];

    }


    const { jsPDF } = window.jspdf;


    let doc =
        new jsPDF();


    let y = 20;


    // ==================================================
    // TITLE
    // ==================================================

    doc.setFontSize(18);

    doc.text(
        "STUDENT PLACEMENT",
        20,
        y
    );

    y += 8;

    doc.text(
        "ASSESSMENT REPORT",
        20,
        y
    );

    y += 10;

    doc.line(
        20,
        y,
        190,
        y
    );

    y += 15;


    // ==================================================
    // STUDENT DETAILS
    // ==================================================

    doc.setFontSize(11);

    doc.text(
        "Student: Student 1",
        20,
        y
    );

    y += 8;

    doc.text(
        "Year: Final Year",
        20,
        y
    );

    y += 8;

    doc.text(
        "Assessment: Day 1 Java Placement Assessment",
        20,
        y
    );

    y += 8;

    doc.text(
        "Topic: Loops, Conditions, Operators",
        20,
        y
    );

    y += 10;

    doc.text(
        "Marks: " + score + " / " + total,
        20,
        y
    );

    y += 8;

    doc.text(
        "Percentage: " + percentage.toFixed(0) + "%",
        20,
        y
    );

    y += 8;

    doc.text(
        "Status: Completed",
        20,
        y
    );

    y += 15;


    // ==================================================
    // ANSWER SHEET TITLE
    // ==================================================

    doc.setFontSize(15);

    doc.text(
        "ANSWER SHEET",
        20,
        y
    );

    y += 12;


    // ==================================================
    // ANSWERS
    // ==================================================

    if(latestAnswerSheet.length === 0){

        doc.setFontSize(10);

        doc.text(
            "No answer sheet found.",
            20,
            y
        );

    }

    else{

        latestAnswerSheet.forEach(
            function(item, index){

                // New page when required

                if(y > 255){

                    doc.addPage();

                    y = 20;

                }


                // QUESTION

                doc.setFontSize(11);

                let questionText =
                    (index + 1) +
                    ". " +
                    String(item.question || "");


                let questionLines =
                    doc.splitTextToSize(
                        questionText,
                        165
                    );


                doc.text(
                    questionLines,
                    20,
                    y
                );


                y +=
                    questionLines.length * 5 + 5;


                // YOUR ANSWER

                doc.setFontSize(9);

                let studentText =
                    "Your Answer: " +
                    String(
                        item.studentAnswer || "Not Answered"
                    );


                let studentLines =
                    doc.splitTextToSize(
                        studentText,
                        160
                    );


                doc.text(
                    studentLines,
                    25,
                    y
                );


                y +=
                    studentLines.length * 5 + 4;


                // CORRECT ANSWER

                let correctText =
                    "Correct Answer: " +
                    String(
                        item.correctAnswer || ""
                    );


                let correctLines =
                    doc.splitTextToSize(
                        correctText,
                        160
                    );


                doc.text(
                    correctLines,
                    25,
                    y
                );


                y +=
                    correctLines.length * 5 + 4;


                // STATUS

                doc.text(
                    "Status: " +
                    String(item.status || ""),
                    25,
                    y
                );


                y += 8;


                // LINE

                doc.line(
                    20,
                    y,
                    190,
                    y
                );


                y += 8;

            }
        );

    }


    // ==================================================
    // FOOTER
    // ==================================================

    if(y > 275){

        doc.addPage();

        y = 20;

    }


    doc.setFontSize(9);

    doc.text(
        "Generated by Student Placement Assessment Portal",
        20,
        y
    );


    // ==================================================
    // SAVE PDF
    // ==================================================

    doc.save(
        "Student_1_Day_1_Assessment_Report.pdf"
    );

}

</script>

</body>

</html>
