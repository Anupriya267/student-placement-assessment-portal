<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Assessment Results</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.header{
    background:#1f4e78;
    color:white;
    padding:25px;
    border-radius:10px;
    margin-bottom:20px;
}

.header h1{
    margin:0 0 15px 0;
}

.info{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
}

.summary{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.summary-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(160px,1fr));
    gap:15px;
}

.box{
    border:1px solid #ddd;
    border-radius:8px;
    padding:18px;
    text-align:center;
}

.box h3{
    margin:0 0 10px 0;
}

.number{
    font-size:25px;
    font-weight:bold;
}

.questions{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.question{
    border:1px solid #ddd;
    border-radius:8px;
    padding:18px;
    margin-bottom:15px;
}

.question h3{
    margin-top:0;
}

.answer{
    background:#f5f5f5;
    padding:12px;
    border-radius:6px;
    white-space:pre-wrap;
    overflow:auto;
    font-family:Consolas,monospace;
}

.complete{
    color:#198754;
    font-weight:bold;
}

.partial{
    color:#d39e00;
    font-weight:bold;
}

.wrong{
    color:#dc3545;
    font-weight:bold;
}

.correct{
    color:#198754;
    font-weight:bold;
}

.pending{
    color:#d39e00;
    font-weight:bold;
}

button{
    background:#1f4e78;
    color:white;
    border:none;
    padding:13px 25px;
    border-radius:7px;
    cursor:pointer;
    font-size:16px;
    margin-top:10px;
}

button:hover{
    background:#163a5c;
}

</style>

</head>


<body>

<div class="container">


<!-- HEADER -->

<div class="header">

    <h1>Assessment Results</h1>

    <div class="info">

        <div>
            <strong>Student:</strong>
            <span id="studentName"></span>
        </div>

        <div>
            <strong>Year:</strong>
            <span id="studentYear"></span>
        </div>

        <div>
            <strong>Day:</strong>
            <span id="day"></span>
        </div>

        <div>
            <strong>Topic:</strong>
            <span id="topic"></span>
        </div>

    </div>

</div>


<!-- SUMMARY -->

<div class="summary">

    <h2>Result Summary</h2>

    <div class="summary-grid">


        <div class="box">

            <h3>MCQ</h3>

            <div class="number"
                 id="mcqScore">
                0/10
            </div>

        </div>


        <div class="box">

            <h3>Error Correction</h3>

            <div class="number"
                 id="errorScore">
                0/2
            </div>

        </div>


        <div class="box">

            <h3>Coding</h3>

            <div class="number"
                 id="codingScore">
                0/3
            </div>

        </div>


        <div class="box">

            <h3>Total</h3>

            <div class="number"
                 id="totalScore">
                0/15
            </div>

        </div>


        <div class="box">

            <h3>Percentage</h3>

            <div class="number"
                 id="percentage">
                0%
            </div>

        </div>


        <div class="box">

            <h3>Status</h3>

            <div class="number"
                 id="status">
                Completed
            </div>

        </div>

    </div>

</div>


<!-- QUESTIONS -->

<div class="questions">

    <h2>Answer Details</h2>

    <div id="questionContainer"></div>

</div>


<br>

<button onclick="window.location.href='student.html'">
    Back to Dashboard
</button>


</div>


<script>


/* =====================================================
   GET RESULT
===================================================== */

let result = null;


try{

    result =
        JSON.parse(
            localStorage.getItem(
                "latestAssessmentResult"
            )
        );

}catch(error){

    result = null;

}


/* =====================================================
   IF NO RESULT
===================================================== */

if(!result){

    document.getElementById(
        "questionContainer"
    ).innerHTML =

        "<p>No assessment result found.</p>";

}


/* =====================================================
   DISPLAY STUDENT DETAILS
===================================================== */

if(result){

    document.getElementById(
        "studentName"
    ).textContent =
        result.studentName || "Student";


    document.getElementById(
        "studentYear"
    ).textContent =
        result.studentYear || "Final Year";


    document.getElementById(
        "day"
    ).textContent =
        result.day || "";


    document.getElementById(
        "topic"
    ).textContent =
        result.topic || "Java";


    document.getElementById(
        "mcqScore"
    ).textContent =
        (result.mcqScore || 0) + "/10";


    document.getElementById(
        "errorScore"
    ).textContent =
        (result.errorScore || 0) + "/2";


    document.getElementById(
        "codingScore"
    ).textContent =
        (result.codingScore || 0) + "/3";


    document.getElementById(
        "totalScore"
    ).textContent =
        (result.totalScore || 0) + "/15";


    document.getElementById(
        "percentage"
    ).textContent =
        (result.percentage || 0) + "%";


    document.getElementById(
        "status"
    ).textContent =
        result.status || "Completed";


    displayAnswers(
        result.answers || []
    );

}


/* =====================================================
   DISPLAY ANSWERS
===================================================== */

function displayAnswers(answers){

    const container =
        document.getElementById(
            "questionContainer"
        );


    container.innerHTML = "";


    if(answers.length === 0){

        container.innerHTML =
            "<p>No answers available.</p>";

        return;

    }


    answers.forEach((answer,index)=>{


        const div =
            document.createElement("div");

        div.className =
            "question";


        /* ============================================
           MCQ
        ============================================ */

        if(answer.type === "MCQ"){

            const isCorrect =
                String(answer.answer)
                    .trim()
                    .toUpperCase()
                ===
                String(answer.correctAnswer)
                    .trim()
                    .toUpperCase();


            div.innerHTML = `

                <h3>
                    ${index+1}. ${escapeHTML(
                        answer.question
                    )}
                </h3>

                <p>
                    <strong>Your Answer:</strong>
                </p>

                <div class="answer">
                    ${
                        answer.answer
                        ?
                        escapeHTML(answer.answer)
                        :
                        "Not Answered"
                    }
                </div>

                <p class="${
                    isCorrect
                    ? "correct"
                    : "wrong"
                }">

                    ${
                        isCorrect
                        ? "✓ Correct"
                        : "✗ Wrong"
                    }

                </p>

            `;

        }


        /* ============================================
           ERROR
        ============================================ */

        else if(answer.type === "ERROR"){

            const hasAnswer =
                answer.answer &&
                answer.answer.trim() !== "";


            div.innerHTML = `

                <h3>
                    ${index+1}. ${escapeHTML(
                        answer.question
                    )}
                </h3>

                <p>
                    <strong>Your Answer:</strong>
                </p>

                <div class="answer">
                    ${
                        hasAnswer
                        ?
                        escapeHTML(answer.answer)
                        :
                        "Not Answered"
                    }
                </div>

                <p>
                    <strong>Status:</strong>

                    ${
                        hasAnswer
                        ?
                        '<span class="correct">Answered</span>'
                        :
                        '<span class="wrong">Not Answered</span>'
                    }

                </p>

            `;

        }


        /* ============================================
           CODING
        ============================================ */

        else if(answer.type === "CODING"){

            let status =
                answer.status ||
                "Wrong";


            let score =
                Number(answer.score || 0);


            let statusClass =
                "wrong";


            let icon =
                "✗";


            if(status === "Complete"){

                statusClass =
                    "complete";

                icon =
                    "✓";

            }

            else if(
                status === "Partially Correct"
            ){

                statusClass =
                    "partial";

                icon =
                    "🟡";

            }


            div.innerHTML = `

                <h3>
                    ${index+1}. ${escapeHTML(
                        answer.question
                    )}
                </h3>

                <p>
                    <strong>Your Answer:</strong>
                </p>

                <div class="answer">

                    ${
                        answer.code &&
                        answer.code.trim()
                        ?
                        escapeHTML(answer.code)
                        :
                        "Not Answered"
                    }

                </div>


                <p>

                    <strong>
                        Coding Evaluation:
                    </strong>

                    <span class="${statusClass}">

                        ${icon}
                        ${escapeHTML(status)}

                    </span>

                </p>


                <p>

                    <strong>
                        Coding Mark:
                    </strong>

                    ${score}/1

                </p>

            `;

        }


        container.appendChild(div);

    });

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}

</script>

</body>

</html>
