<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment Result</title>

<link rel="stylesheet" href="style.css">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f4f6fb;
    color:#222;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

h1{
    margin-top:0;
}

.student-info{
    line-height:1.8;
    margin-bottom:20px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:20px 0;
}

.summary-box{
    background:#eef3ff;
    padding:18px 10px;
    border-radius:10px;
    text-align:center;
}

.summary-title{
    font-size:14px;
}

.summary-value{
    font-size:25px;
    font-weight:bold;
    margin-top:7px;
}

.answer{
    border:1px solid #ddd;
    border-radius:10px;
    padding:18px;
    margin:15px 0;
    background:#fff;
}

.answer h3{
    margin-top:0;
    line-height:1.5;
}

.answer-code{
    background:#1e1e1e;
    color:white;
    padding:15px;
    border-radius:8px;
    white-space:pre-wrap;
    overflow-x:auto;
    font-family:Consolas,monospace;
}

.correct{
    color:green;
    font-weight:bold;
}

.wrong{
    color:red;
    font-weight:bold;
}

.partial{
    color:#b36b00;
    font-weight:bold;
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:25px;
}

button{
    border:0;
    padding:13px 20px;
    border-radius:8px;
    color:white;
    background:#2864d7;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.secondary{
    background:#555;
}

.success{
    background:#edf9ef;
    border:1px solid #b7dfbc;
    color:#17621d;
    padding:15px;
    border-radius:8px;
}

@media(max-width:700px){

    body{
        padding:10px;
    }

    .card{
        padding:18px;
    }

    .summary{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Assessment Result</h1>

<div class="student-info">

<div>
<b>Name:</b>
<span id="studentName">Student</span>
</div>

<div>
<b>Username:</b>
<span id="studentUsername">-</span>
</div>

<div>
<b>Year:</b>
<span id="studentYear">Final Year</span>
</div>

<div>
<b>Assessment:</b>
Day <span id="assessmentDay">-</span>
</div>

</div>

<div class="success">
Assessment submitted successfully.
</div>

</div>


<div class="card">

<h2>Score Summary</h2>

<div class="summary">

<div class="summary-box">

<div class="summary-title">
MCQ + Error
</div>

<div
id="objectiveScore"
class="summary-value">
0/12
</div>

</div>


<div class="summary-box">

<div class="summary-title">
Coding
</div>

<div
id="codingScore"
class="summary-value">
0/3
</div>

</div>


<div class="summary-box">

<div class="summary-title">
Total
</div>

<div
id="totalScore"
class="summary-value">
0/15
</div>

</div>


<div class="summary-box">

<div class="summary-title">
Percentage
</div>

<div
id="percentage"
class="summary-value">
0%
</div>

</div>

</div>

<div>
<b>Status:</b>
<span id="status">Completed</span>
</div>

</div>


<div class="card">

<h2>Answer Sheet</h2>

<div id="answers">
Loading answers...
</div>

<div class="buttons">

<button onclick="goDashboard()">
Back to Dashboard
</button>

<button
class="secondary"
onclick="goReports()">
View Reports
</button>

</div>

</div>

</div>


<script>

/*
=====================================================
GET STORED RESULT
=====================================================
*/

function getStoredResult(){

    const possibleKeys = [

        "latestAssessmentResult",

        "lastAssessmentResult",

        "assessmentResult",

        "result"

    ];


    for(
        const key of possibleKeys
    ){

        try{

            const value =
                localStorage.getItem(
                    key
                );


            if(!value){

                continue;

            }


            const result =
                JSON.parse(
                    value
                );


            if(result){

                return result;

            }

        }catch(error){

            console.error(
                "Result read error:",
                error
            );

        }

    }


    return null;

}


const result =
    getStoredResult();


/*
=====================================================
STUDENT DETAILS
=====================================================
*/

let student = null;


try{

    student =
        JSON.parse(
            localStorage.getItem(
                "loggedInStudent"
            ) || "null"
        );

}catch(error){

    student=null;

}


const studentName =
    result?.name ||
    result?.studentName ||
    student?.name ||
    student?.Name ||
    localStorage.getItem(
        "studentName"
    ) ||
    "Student";


const studentUsername =
    result?.username ||
    result?.studentUsername ||
    student?.username ||
    student?.Username ||
    localStorage.getItem(
        "studentUsername"
    ) ||
    "-";


const studentYear =
    result?.year ||
    result?.studentYear ||
    student?.year ||
    student?.Year ||
    localStorage.getItem(
        "studentYear"
    ) ||
    "Final Year";


const day =
    parseDay(
        result?.day ||
        result?.Day ||
        localStorage.getItem(
            "assessmentDay"
        )
    );


document.getElementById(
    "studentName"
).textContent =
    studentName;


document.getElementById(
    "studentUsername"
).textContent =
    studentUsername;


document.getElementById(
    "studentYear"
).textContent =
    studentYear;


document.getElementById(
    "assessmentDay"
).textContent =
    day;


/*
=====================================================
PARSE DAY
=====================================================
*/

function parseDay(value){

    const match =
        String(
            value || ""
        ).match(
            /\d+/
        );


    return match
        ? parseInt(
            match[0],
            10
        )
        : 0;

}


/*
=====================================================
PARSE NUMBER
=====================================================
*/

function parseNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return 0;

    }


    const match =
        String(
            value
        ).match(
            /-?\d+(?:\.\d+)?/
        );


    return match
        ? Number(
            match[0]
        )
        : 0;

}


/*
=====================================================
GET ANSWERS
=====================================================
*/

let answers = [];


if(
    result &&
    Array.isArray(
        result.answers
    )
){

    answers =
        result.answers;

}
else if(
    result &&
    Array.isArray(
        result.Answers
    )
){

    answers =
        result.Answers;

}
else if(
    result &&
    typeof result.Answers ===
    "string"
){

    try{

        answers =
            JSON.parse(
                result.Answers
            );

    }catch(error){

        answers=[];

    }

}


/*
=====================================================
IMPORTANT BUG FIX

NOT ANSWERED CODING QUESTION
MUST ALWAYS BE:

Wrong
0/1

It can NEVER be:

Correct
1/1
=====================================================
*/

answers =
    answers.map(
        function(answer){

            const item =
                {
                    ...answer
                };


            const type =
                String(
                    item.type ||
                    item.Type ||
                    ""
                )
                .trim()
                .toUpperCase();


            const rawCode =
                item.studentAnswer ||
                item.code ||
                item.answer ||
                "";


            const isNotAnswered =
                rawCode === null ||
                rawCode === undefined ||
                String(
                    rawCode
                ).trim() === "" ||
                String(
                    rawCode
                )
                .trim()
                .toLowerCase() ===
                "not answered";


            /*
            HARD FIX
            */

            if(
                type === "CODING" &&
                isNotAnswered
            ){

                item.studentAnswer =
                    "Not Answered";

                item.status =
                    "Wrong";

                item.score =
                    0;

                item.evaluation =
                    "No code submitted.";

            }


            return item;

        }
    );


/*
=====================================================
CALCULATE SCORES FROM ANSWERS
=====================================================
*/

let mcqScore = 0;
let errorScore = 0;
let codingScore = 0;


answers.forEach(
    function(answer){

        const type =
            String(
                answer.type ||
                answer.Type ||
                ""
            )
            .trim()
            .toUpperCase();


        const rawAnswer =
            answer.studentAnswer ||
            answer.answer ||
            answer.code ||
            "";


        const unanswered =
            rawAnswer === null ||
            rawAnswer === undefined ||
            String(
                rawAnswer
            ).trim() === "" ||
            String(
                rawAnswer
            )
            .trim()
            .toLowerCase() ===
            "not answered";


        if(
            type === "CODING"
        ){

            /*
            NEVER give marks
            to an unanswered coding question.
            */

            if(unanswered){

                answer.status =
                    "Wrong";

                answer.score =
                    0;

                return;

            }


            codingScore +=
                parseNumber(
                    answer.score
                );

            return;

        }


        const score =
            parseNumber(
                answer.score
            );


        if(
            type === "MCQ"
        ){

            mcqScore +=
                score;

        }
        else if(
            type === "ERROR"
        ){

            errorScore +=
                score;

        }

    }
);


/*
=====================================================
FALLBACK FOR OLD RESULTS
=====================================================
*/

if(
    answers.length === 0 &&
    result
){

    mcqScore =
        parseNumber(
            result.mcqScore
        );


    errorScore =
        parseNumber(
            result.errorScore
        );


    codingScore =
        parseNumber(
            result.codingScore
        );

}


/*
=====================================================
FINAL SCORE
=====================================================
*/

const objectiveScore =
    mcqScore +
    errorScore;


const totalScore =
    objectiveScore +
    codingScore;


const percentage =
    (
        totalScore /
        15 *
        100
    );


document.getElementById(
    "objectiveScore"
).textContent =
    objectiveScore +
    "/12";


document.getElementById(
    "codingScore"
).textContent =
    codingScore +
    "/3";


document.getElementById(
    "totalScore"
).textContent =
    totalScore +
    "/15";


document.getElementById(
    "percentage"
).textContent =
    percentage.toFixed(2) +
    "%";


document.getElementById(
    "status"
).textContent =
    result?.status ||
    "Completed";


/*
=====================================================
DISPLAY ANSWERS
=====================================================
*/

function displayAnswers(){

    const container =
        document.getElementById(
            "answers"
        );


    container.innerHTML = "";


    if(
        !answers.length
    ){

        container.innerHTML =
            "<p>No answer details available.</p>";

        return;

    }


    answers.forEach(
        function(answer,index){

            const type =
                String(
                    answer.type ||
                    answer.Type ||
                    ""
                )
                .trim()
                .toUpperCase();


            const question =
                answer.question ||
                answer.Question ||
                "Question " +
                (index + 1);


            let rawAnswer =
                answer.studentAnswer ||
                answer.answer ||
                answer.code ||
                "";


            const unanswered =
                rawAnswer === null ||
                rawAnswer === undefined ||
                String(
                    rawAnswer
                ).trim() === "" ||
                String(
                    rawAnswer
                )
                .trim()
                .toLowerCase() ===
                "not answered";


            /*
            FINAL SAFETY CHECK
            */

            let status =
                answer.status ||
                "";


            let score =
                parseNumber(
                    answer.score
                );


            if(
                type === "CODING" &&
                unanswered
            ){

                rawAnswer =
                    "Not Answered";

                status =
                    "Wrong";

                score =
                    0;

            }


            if(!status){

                if(
                    score >= 1
                ){

                    status =
                        "Correct";

                }
                else if(
                    score > 0
                ){

                    status =
                        "Partial";

                }
                else{

                    status =
                        "Wrong";

                }

            }


            let statusClass =
                "wrong";


            const lower =
                status
                .toLowerCase();


            if(
                lower.includes(
                    "partial"
                )
            ){

                statusClass =
                    "partial";

            }
            else if(
                lower.includes(
                    "correct"
                ) &&
                !lower.includes(
                    "incorrect"
                )
            ){

                statusClass =
                    "correct";

            }


            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "answer";


            let html =

                "<h3>Q" +
                (index + 1) +
                ". " +
                escapeHTML(
                    question
                ) +
                "</h3>" +

                "<p><b>Type:</b> " +
                escapeHTML(
                    type
                ) +
                "</p>";


            if(
                type === "CODING"
            ){

                html +=

                    "<p><b>Your Answer:</b></p>" +

                    "<pre class='answer-code'>" +

                    escapeHTML(
                        unanswered
                        ? "Not Answered"
                        : rawAnswer
                    ) +

                    "</pre>" +

                    "<p class='" +
                    statusClass +
                    "'>" +

                    "Coding Evaluation: " +

                    (
                        status === "Correct"
                        ? "✓ "
                        : status === "Partial"
                        ? "⚠ "
                        : "✕ "
                    ) +

                    escapeHTML(
                        status
                    ) +

                    "</p>" +

                    "<p><b>Coding Mark:</b> " +

                    score +

                    "/1</p>";

            }
            else{

                html +=

                    "<p><b>Your Answer:</b> " +

                    escapeHTML(
                        unanswered
                        ? "Not Answered"
                        : rawAnswer
                    ) +

                    "</p>";


                if(
                    answer.correctAnswer !==
                    undefined &&
                    answer.correctAnswer !== ""
                ){

                    html +=

                        "<p><b>Correct Answer:</b> " +

                        escapeHTML(
                            answer.correctAnswer
                        ) +

                        "</p>";

                }


                html +=

                    "<p class='" +
                    statusClass +
                    "'>" +

                    "Status: " +

                    escapeHTML(
                        status
                    ) +

                    "</p>";

            }


            box.innerHTML =
                html;


            container.appendChild(
                box
            );

        }
    );

}


/*
=====================================================
ESCAPE HTML
=====================================================
*/

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/*
=====================================================
NAVIGATION
=====================================================
*/

function goDashboard(){

    window.location.href =
        "student.html";

}


function goReports(){

    window.location.href =
        "reports.html";

}


/*
=====================================================
SHOW ANSWERS
=====================================================
*/

displayAnswers();

</script>

</body>
</html>
