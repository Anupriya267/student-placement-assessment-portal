<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assessment Result</title>

<link rel="stylesheet" href="style.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    color: #1f2937;
}

.container {
    width: min(1000px, calc(100% - 30px));
    margin: 0 auto;
    padding: 30px 0 50px;
}

.card {
    background: #ffffff;
    padding: 25px;
    margin-bottom: 22px;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
}

.main-title {
    position: sticky;
    top: 0;
    z-index: 100;
    margin: -30px 0 22px;
    padding: 20px 0;
    background: #ffffff;
    color: #1d4ed8;
    font-size: 30px;
    border-bottom: 1px solid #e5e7eb;
}

.student-info {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.info-box {
    padding: 13px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 9px;
}

.info-box span {
    display: block;
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 5px;
}

.info-box b {
    color: #111827;
}

.success {
    padding: 14px;
    border-radius: 9px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    color: #047857;
    font-weight: 600;
}

.summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin: 20px 0;
}

.summary-box {
    padding: 20px 10px;
    border-radius: 12px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    text-align: center;
}

.summary-title {
    color: #6b7280;
    font-size: 14px;
}

.summary-value {
    color: #1d4ed8;
    font-size: 25px;
    font-weight: bold;
    margin-top: 7px;
}

.status-box {
    margin-top: 15px;
    padding: 12px;
    background: #eff6ff;
    border-radius: 8px;
}

.answer {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
    margin: 15px 0;
    background: #ffffff;
}

.answer h3 {
    margin-top: 0;
    line-height: 1.55;
    color: #111827;
}

.answer-code {
    background: #111827;
    color: #f9fafb;
    padding: 15px;
    border-radius: 9px;
    white-space: pre-wrap;
    overflow-x: auto;
    font-family: Consolas, Monaco, monospace;
    font-size: 14px;
    line-height: 1.5;
}

.correct {
    color: #047857;
    font-weight: bold;
}

.wrong {
    color: #dc2626;
    font-weight: bold;
}

.partial {
    color: #b45309;
    font-weight: bold;
}

.mark-box {
    display: inline-block;
    margin-top: 5px;
    padding: 7px 10px;
    border-radius: 7px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    font-weight: 600;
}

.buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 25px;
}

button {
    border: 0;
    padding: 13px 20px;
    border-radius: 9px;
    color: #ffffff;
    background: #2563eb;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.secondary {
    background: #475569;
}

.secondary:hover {
    background: #334155;
}

@media (max-width: 700px) {

    .container {
        width: calc(100% - 16px);
        padding-top: 15px;
    }

    .main-title {
        margin-top: -15px;
        font-size: 24px;
    }

    .card {
        padding: 18px;
    }

    .student-info {
        grid-template-columns: 1fr;
    }

    .summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .buttons button {
        width: 100%;
    }
}

@media (max-width: 430px) {

    .summary {
        grid-template-columns: 1fr;
    }
}
</style>

</head>

<body>

<div class="container">


<!-- =====================================================
     STUDENT INFORMATION
     ===================================================== -->

<div class="card">

    <h1 class="main-title">
        Assessment Result
    </h1>

    <div class="student-info">

        <div class="info-box">
            <span>Name</span>
            <b id="studentName">Student</b>
        </div>

        <div class="info-box">
            <span>Username</span>
            <b id="studentUsername">-</b>
        </div>

        <div class="info-box">
            <span>Year</span>
            <b id="studentYear">Final Year</b>
        </div>

        <div class="info-box">
            <span>Assessment</span>
            <b>
                Day <span id="assessmentDay">-</span>
            </b>
        </div>

    </div>

    <div class="success">
        Assessment submitted successfully.
    </div>

</div>


<!-- =====================================================
     SCORE SUMMARY
     ===================================================== -->

<div class="card">

    <h2>Score Summary</h2>

    <div class="summary">

        <div class="summary-box">

            <div class="summary-title">
                MCQ + Error
            </div>

            <div
                id="objectiveScore"
                class="summary-value">
                0/12
            </div>

        </div>


        <div class="summary-box">

            <div class="summary-title">
                Coding
            </div>

            <div
                id="codingScore"
                class="summary-value">
                0/3
            </div>

        </div>


        <div class="summary-box">

            <div class="summary-title">
                Total
            </div>

            <div
                id="totalScore"
                class="summary-value">
                0/15
            </div>

        </div>


        <div class="summary-box">

            <div class="summary-title">
                Percentage
            </div>

            <div
                id="percentage"
                class="summary-value">
                0%
            </div>

        </div>

    </div>


    <div class="status-box">

        <b>Status:</b>

        <span id="status">
            Completed
        </span>

    </div>

</div>


<!-- =====================================================
     ANSWER SHEET
     ===================================================== -->

<div class="card">

    <h2>Answer Sheet</h2>

    <div id="answers">
        Loading answers...
    </div>


    <div class="buttons">

        <button onclick="goDashboard()">
            Back to Dashboard
        </button>

        <button
            class="secondary"
            onclick="goReports()">
            View Reports
        </button>

    </div>

</div>

</div>


<script>

/* =====================================================
   GET STORED RESULT
   ===================================================== */

function getStoredResult() {

    const possibleKeys = [

        "latestAssessmentResult",
        "lastAssessmentResult",
        "assessmentResult",
        "result"

    ];

    for (const key of possibleKeys) {

        try {

            const value =
                localStorage.getItem(key);

            if (!value) {
                continue;
            }

            const result =
                JSON.parse(value);

            if (result) {
                return result;
            }

        } catch (error) {

            console.error(
                "Result read error:",
                error
            );

        }

    }

    return null;
}


const result =
    getStoredResult();


/* =====================================================
   STUDENT
   ===================================================== */

let student = null;

try {

    student =
        JSON.parse(
            localStorage.getItem(
                "loggedInStudent"
            ) || "null"
        );

} catch (error) {

    student = null;

}


const studentName =
    result?.name ||
    result?.studentName ||
    student?.name ||
    student?.Name ||
    localStorage.getItem(
        "studentName"
    ) ||
    "Student";


const studentUsername =
    result?.username ||
    result?.studentUsername ||
    student?.username ||
    student?.Username ||
    localStorage.getItem(
        "studentUsername"
    ) ||
    "-";


const studentYear =
    result?.year ||
    result?.studentYear ||
    student?.year ||
    student?.Year ||
    localStorage.getItem(
        "studentYear"
    ) ||
    "Final Year";


/* =====================================================
   DAY
   ===================================================== */

function parseDay(value) {

    const match =
        String(
            value || ""
        ).match(/\d+/);

    return match
        ? parseInt(
            match[0],
            10
        )
        : 0;
}


const day =
    parseDay(
        result?.day ||
        result?.Day ||
        localStorage.getItem(
            "assessmentDay"
        )
    );


document.getElementById(
    "studentName"
).textContent =
    studentName;


document.getElementById(
    "studentUsername"
).textContent =
    studentUsername;


document.getElementById(
    "studentYear"
).textContent =
    studentYear;


document.getElementById(
    "assessmentDay"
).textContent =
    day;


/* =====================================================
   NUMBER PARSER
   ===================================================== */

function parseNumber(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return 0;
    }

    const match =
        String(value).match(
            /-?\d+(?:\.\d+)?/
        );

    return match
        ? Number(match[0])
        : 0;
}


/* =====================================================
   ANSWERS
   ===================================================== */

let answers = [];


if (
    result &&
    Array.isArray(result.answers)
) {

    answers =
        result.answers;

}
else if (
    result &&
    Array.isArray(result.Answers)
) {

    answers =
        result.Answers;

}
else if (
    result &&
    typeof result.Answers === "string"
) {

    try {

        answers =
            JSON.parse(
                result.Answers
            );

    } catch (error) {

        answers = [];

    }

}


/* =====================================================
   HARD FIX:
   UNANSWERED CODING = WRONG / 0
   ===================================================== */

answers =
    answers.map(
        function(answer) {

            const item = {
                ...answer
            };

            const type =
                String(
                    item.type ||
                    item.Type ||
                    ""
                )
                .trim()
                .toUpperCase();


            const rawCode =
                item.studentAnswer ||
                item.code ||
                item.answer ||
                "";


            const isNotAnswered =
                rawCode === null ||
                rawCode === undefined ||
                String(
                    rawCode
                ).trim() === "" ||
                String(
                    rawCode
                )
                .trim()
                .toLowerCase() ===
                "not answered";


            /*
             * CRITICAL FIX
             *
             * If coding has no code:
             * status = Wrong
             * score = 0
             */

            if (
                type === "CODING" &&
                isNotAnswered
            ) {

                item.studentAnswer =
                    "Not Answered";

                item.status =
                    "Wrong";

                item.score =
                    0;

                item.evaluation =
                    "No code submitted.";

            }

            return item;

        }
    );


/* =====================================================
   CALCULATE SCORES
   ===================================================== */

let mcqScore = 0;
let errorScore = 0;
let codingScore = 0;


answers.forEach(
    function(answer) {

        const type =
            String(
                answer.type ||
                answer.Type ||
                ""
            )
            .trim()
            .toUpperCase();


        const rawAnswer =
            answer.studentAnswer ||
            answer.answer ||
            answer.code ||
            "";


        const unanswered =
            rawAnswer === null ||
            rawAnswer === undefined ||
            String(
                rawAnswer
            ).trim() === "" ||
            String(
                rawAnswer
            )
            .trim()
            .toLowerCase() ===
            "not answered";


        /* CODING */

        if (
            type === "CODING"
        ) {

            if (unanswered) {

                answer.status =
                    "Wrong";

                answer.score =
                    0;

                return;

            }


            codingScore +=
                parseNumber(
                    answer.score
                );

            return;

        }


        /* MCQ */

        const score =
            parseNumber(
                answer.score
            );


        if (
            type === "MCQ"
        ) {

            mcqScore +=
                score;

        }
        else if (
            type === "ERROR"
        ) {

            errorScore +=
                score;

        }

    }
);


/* =====================================================
   FALLBACK FOR OLD RESULTS
   ===================================================== */

if (
    answers.length === 0 &&
    result
) {

    mcqScore =
        parseNumber(
            result.mcqScore
        );

    errorScore =
        parseNumber(
            result.errorScore
        );

    codingScore =
        parseNumber(
            result.codingScore
        );

}


/* =====================================================
   FINAL SCORE
   ===================================================== */

const objectiveScore =
    mcqScore +
    errorScore;


const totalScore =
    objectiveScore +
    codingScore;


const percentage =
    (
        totalScore /
        15 *
        100
    );


document.getElementById(
    "objectiveScore"
).textContent =
    objectiveScore +
    "/12";


document.getElementById(
    "codingScore"
).textContent =
    codingScore +
    "/3";


document.getElementById(
    "totalScore"
).textContent =
    totalScore +
    "/15";


document.getElementById(
    "percentage"
).textContent =
    percentage.toFixed(2) +
    "%";


document.getElementById(
    "status"
).textContent =
    result?.status ||
    "Completed";


/* =====================================================
   DISPLAY ANSWERS
   ===================================================== */

function displayAnswers() {

    const container =
        document.getElementById(
            "answers"
        );

    container.innerHTML = "";


    if (!answers.length) {

        container.innerHTML =
            "<p>No answer details available.</p>";

        return;

    }


    answers.forEach(
        function(answer,index) {

            const type =
                String(
                    answer.type ||
                    answer.Type ||
                    ""
                )
                .trim()
                .toUpperCase();


            const question =
                answer.question ||
                answer.Question ||
                "Question " +
                (index + 1);


            let rawAnswer =
                answer.studentAnswer ||
                answer.answer ||
                answer.code ||
                "";


            const unanswered =
                rawAnswer === null ||
                rawAnswer === undefined ||
                String(
                    rawAnswer
                ).trim() === "" ||
                String(
                    rawAnswer
                )
                .trim()
                .toLowerCase() ===
                "not answered";


            let status =
                answer.status ||
                "";


            let score =
                parseNumber(
                    answer.score
                );


            /*
             * SECOND SAFETY CHECK
             *
             * This prevents old bad records from
             * displaying Correct 1/1.
             */

            if (
                type === "CODING" &&
                unanswered
            ) {

                rawAnswer =
                    "Not Answered";

                status =
                    "Wrong";

                score =
                    0;

            }


            /* STATUS FALLBACK */

            if (!status) {

                if (
                    score >= 1
                ) {

                    status =
                        "Correct";

                }
                else if (
                    score > 0
                ) {

                    status =
                        "Partial";

                }
                else {

                    status =
                        "Wrong";

                }

            }


            /* STATUS CLASS */

            let statusClass =
                "wrong";


            const lower =
                status.toLowerCase();


            if (
                lower.includes("partial")
            ) {

                statusClass =
                    "partial";

            }
            else if (
                lower.includes("correct") &&
                !lower.includes("incorrect")
            ) {

                statusClass =
                    "correct";

            }


            /* ANSWER CARD */

            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "answer";


            let html =

                "<h3>Q" +
                (index + 1) +
                ". " +
                escapeHTML(
                    question
                ) +
                "</h3>" +

                "<p><b>Type:</b> " +
                escapeHTML(
                    type
                ) +
                "</p>";


            /* CODING */

            if (
                type === "CODING"
            ) {

                html +=

                    "<p><b>Your Answer:</b></p>" +

                    "<pre class='answer-code'>" +

                    escapeHTML(
                        unanswered
                        ? "Not Answered"
                        : rawAnswer
                    ) +

                    "</pre>" +

                    "<p class='" +
                    statusClass +
                    "'>" +

                    "Coding Evaluation: " +

                    (
                        status === "Correct"
                        ? "✓ "
                        : status === "Partial"
                        ? "⚠ "
                        : "✕ "
                    ) +

                    escapeHTML(
                        status
                    ) +

                    "</p>" +

                    "<div class='mark-box'>" +

                    "<b>Coding Mark:</b> " +

                    score +

                    "/1" +

                    "</div>";


                if (
                    answer.evaluation &&
                    !unanswered
                ) {

                    html +=

                        "<p><b>Evaluation Details:</b> " +

                        escapeHTML(
                            answer.evaluation
                        ) +

                        "</p>";

                }

            }


            /* MCQ / ERROR */

            else {

                html +=

                    "<p><b>Your Answer:</b> " +

                    escapeHTML(
                        unanswered
                        ? "Not Answered"
                        : rawAnswer
                    ) +

                    "</p>";


                if (
                    answer.correctAnswer !==
                    undefined &&
                    answer.correctAnswer !== ""
                ) {

                    html +=

                        "<p><b>Correct Answer:</b> " +

                        escapeHTML(
                            answer.correctAnswer
                        ) +

                        "</p>";

                }


                html +=

                    "<p class='" +
                    statusClass +
                    "'>" +

                    "Status: " +

                    escapeHTML(
                        status
                    ) +

                    "</p>";

            }


            box.innerHTML =
                html;


            container.appendChild(
                box
            );

        }
    );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   NAVIGATION
   ===================================================== */

function goDashboard() {

    window.location.href =
        "student.html";

}


function goReports() {

    window.location.href =
        "reports.html";

}


/* =====================================================
   DISPLAY
   ===================================================== */

displayAnswers();

</script>

</body>
</html>
