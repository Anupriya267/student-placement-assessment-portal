<!DOCTYPE html>
<html>

<head>

<title>Assessment Result</title>

<link rel="stylesheet" href="style.css">

<!-- PDF LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>


<body>

<div class="dashboard">

<h1>Assessment Result</h1>


<div class="card">

<h2>Student Assessment Report</h2>


<p>
<b>Student:</b>
<span id="studentName">Student 1</span>
</p>


<p>
<b>Year:</b>
<span id="studentYear">Final Year</span>
</p>


<p>
<b>Assessment:</b>
Day 1 Java Placement Assessment
</p>


<p>
<b>Topic:</b>
Loops, Conditions, Operators
</p>


<p>
<b>Marks:</b>
<span id="marks">0 / 12</span>
</p>


<p>
<b>Percentage:</b>
<span id="percentage">0</span>%
</p>


<p>
<b>Status:</b>
<span id="status">Completed</span>
</p>


<br>


<button type="button" onclick="downloadPDF()">
Download PDF Report
</button>


</div>

</div>


<script>

// ===============================
// GET SCORE
// ===============================

let score = Number(localStorage.getItem("score")) || 0;

let total = Number(localStorage.getItem("total")) || 12;


// ===============================
// CALCULATE PERCENTAGE
// ===============================

let percentage = 0;

if(total > 0){

percentage = (score / total) * 100;

}


// ===============================
// DISPLAY RESULT
// ===============================

document.getElementById("marks").innerHTML =
score + " / " + total;


document.getElementById("percentage").innerHTML =
percentage.toFixed(0);


// ===============================
// DOWNLOAD REAL PDF
// ===============================

function downloadPDF(){

const { jsPDF } = window.jspdf;

let doc = new jsPDF();


/* TITLE */

doc.setFontSize(18);

doc.text(
"STUDENT PLACEMENT ASSESSMENT REPORT",
20,
25
);


/* LINE */

doc.line(20,30,190,30);


/* STUDENT DETAILS */

doc.setFontSize(12);

doc.text(
"Student Name: Student 1",
20,
45
);

doc.text(
"Year: Final Year",
20,
55
);

doc.text(
"Assessment: Day 1 Java Placement Assessment",
20,
65
);

doc.text(
"Topic: Loops, Conditions, Operators",
20,
75
);


/* RESULT */

doc.text(
"Marks: " + score + " / " + total,
20,
90
);

doc.text(
"Percentage: " + percentage.toFixed(0) + "%",
20,
100
);

doc.text(
"Status: Completed",
20,
110
);


/* FOOTER */

doc.line(20,120,190,120);

doc.text(
"Generated by Student Placement Assessment Portal",
20,
135
);


/* SAVE */

doc.save(
"Student_1_Day_1_Assessment_Report.pdf"
);

}

</script>


</body>

</html>
