<!DOCTYPE html>
<html>

<head>

<title>Student Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

<h1>
Student Dashboard
</h1>


<div class="card">

<h2>
Welcome Student
</h2>

<p>
Name: <span id="studentName"></span>
</p>

<p>
Year: <span id="studentYear"></span>
</p>

</div>


<div class="card">

<h2>
Assigned Assessment
</h2>

<p>
Day <span id="assignedDay"></span> Java Placement Assessment
</p>

<p>
Topic:
<span id="topic"></span>
</p>

<p>
Duration:
40 Minutes
</p>

<button onclick="startAssessment()">
START ASSESSMENT
</button>

</div>


<div class="card">

<h2>
Previous Results
</h2>

<div id="previousResults">
No results available
</div>

</div>


</div>


<script>


// ================= STUDENT DETAILS =================

let studentName =
    localStorage.getItem("studentName")
    || "Student";

let studentYear =
    localStorage.getItem("studentYear")
    || "Final Year";

let assignedDay =
    parseInt(
        localStorage.getItem("assignedDay")
        || "1"
    );


document.getElementById("studentName")
    .innerText = studentName;

document.getElementById("studentYear")
    .innerText = studentYear;

document.getElementById("assignedDay")
    .innerText = assignedDay;


// ================= TOPIC =================

let topics = {

    1: "Loops, Conditions, Operators",

    2: "Loops and Conditional Logic",

    3: "Operators, Conditions and Loops",

    4: "Loop Problem Solving",

    5: "Array Basics and Loop Traversal"

};


document.getElementById("topic")
    .innerText =
    topics[assignedDay]
    || "Java Placement Practice";


// ================= START =================

function startAssessment(){

    window.location.href =
        "assessment.html";

}


// ================= PREVIOUS RESULTS =================

let reports =
    JSON.parse(
        localStorage.getItem("studentReports")
        || "[]"
    );

let username =
    localStorage.getItem("studentUsername");


let myReports =
    reports.filter(function(report){

        return String(report.username)
            ===
            String(username);

    });


if(myReports.length > 0){

    let html = "";

    myReports
        .slice()
        .reverse()
        .forEach(function(report){

            html +=
                "<p>" +
                "Day " +
                report.day +
                " — " +
                report.score +
                "/" +
                report.total +
                " — " +
                report.percentage +
                "%" +
                "</p>";

        });

    document.getElementById(
        "previousResults"
    ).innerHTML = html;

}

</script>

</body>

</html>
