<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>
/* =====================================================
   STUDENT DASHBOARD
   ===================================================== */

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    color: #1f2937;
}

.dashboard {
    width: min(1000px, calc(100% - 32px));
    margin: 0 auto;
    padding: 30px 0 50px;
}

.dashboard h1 {
    position: sticky;
    top: 0;
    z-index: 100;
    margin: 0 -16px 25px;
    padding: 20px 16px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    color: #1d4ed8;
    font-size: 30px;
    font-weight: 700;
}

.card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 22px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
}

.card h2 {
    margin: 0 0 20px;
    color: #111827;
    font-size: 21px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    padding: 13px 0;
    border-bottom: 1px solid #eef2f7;
}

.info-row:last-child {
    border-bottom: none;
}

.label {
    font-weight: 600;
    color: #6b7280;
}

#studentName,
#studentUsername,
#studentYear {
    font-weight: 600;
    color: #111827;
}

.day-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 22px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
}

.day-number {
    color: #1d4ed8;
    font-size: 28px;
    font-weight: 700;
}

.day-topic {
    margin-top: 6px;
    color: #6b7280;
    font-size: 14px;
}

.start-btn {
    min-width: 180px;
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.start-btn:hover {
    background: #1d4ed8;
}

.report-btn {
    background: #059669;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.report-btn:hover {
    background: #047857;
}

.logout-btn {
    background: #dc2626;
    color: white;
    border: none;
    padding: 13px 22px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.logout-btn:hover {
    background: #b91c1c;
}

#message {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    display: none;
}

@media (max-width: 700px) {

    .dashboard {
        width: calc(100% - 20px);
        padding-top: 20px;
    }

    .dashboard h1 {
        font-size: 24px;
        margin-left: -10px;
        margin-right: -10px;
    }

    .card {
        padding: 18px;
    }

    .info-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
    }

    .day-box {
        flex-direction: column;
        align-items: stretch;
    }

    .start-btn,
    .report-btn,
    .logout-btn {
        width: 100%;
    }
}
</style>

</head>

<body>

<div class="dashboard">

    <h1>Student Dashboard</h1>


    <!-- =================================================
         STUDENT INFORMATION
         ================================================= -->

    <div class="card">

        <h2>Student Information</h2>

        <div class="info-row">
            <span class="label">Name</span>
            <span id="studentName">-</span>
        </div>

        <div class="info-row">
            <span class="label">Username</span>
            <span id="studentUsername">-</span>
        </div>

        <div class="info-row">
            <span class="label">Year</span>
            <span id="studentYear">-</span>
        </div>

    </div>


    <!-- =================================================
         TODAY'S ASSESSMENT
         ================================================= -->

    <div class="card">

        <h2>Today's Assessment</h2>

        <div class="day-box">

            <div>

                <div class="day-number" id="currentDay">
                    Day 1
                </div>

                <div class="day-topic" id="currentTopic">
                    Java Placement Assessment
                </div>

            </div>

            <button
                class="start-btn"
                onclick="startAssessment()"
            >
                Start Assessment
            </button>

        </div>

        <div id="message"></div>

    </div>


    <!-- =================================================
         REPORTS
         ================================================= -->

    <div class="card">

        <h2>My Reports</h2>

        <p>
            View your completed daily assessment reports,
            scores and coding evaluation.
        </p>

        <button
            class="report-btn"
            onclick="viewReports()"
        >
            View My Reports
        </button>

    </div>


    <!-- =================================================
         LOGOUT
         ================================================= -->

    <div class="card">

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</div>


<script>

/* =====================================================
   41-DAY TOPICS
   ===================================================== */

const topics = {

    1: "Loops, Conditions, Operators",

    2: "Loops and Conditional Logic",

    3: "Operators and Loop Logic",

    4: "Nested Loops and Patterns",

    5: "Array Basics",

    6: "Array Basics and Traversal",

    7: "Array Input and Output",

    8: "Array Operations",

    9: "Array Searching and Logic",

    10: "Array Thinking Programs",

    11: "Array + String Basics",

    12: "String Basics",

    13: "String Operations",

    14: "String Methods",

    15: "String Logic Programs",

    16: "Arrays + Strings",

    17: "Arrays + Strings + Methods",

    18: "Class and Object",

    19: "OOP Concepts + String",

    20: "Inheritance",

    21: "Polymorphism",

    22: "OOP + String Programs",

    23: "OOP + Placement Questions",

    24: "Advanced OOP + String",

    25: "String + OOP Interview Practice",

    26: "Advanced String + OOP",

    27: "String Manipulation + Inheritance",

    28: "OOP Concepts + Placement Logic",

    29: "Advanced String + Object Design",

    30: "String + OOP Interview Mock",

    31: "Collection Framework Basics",

    32: "ArrayList Basics",

    33: "ArrayList Methods",

    34: "ArrayList Logic",

    35: "ArrayList Medium Problems",

    36: "LinkedList + ArrayList",

    37: "Collection Methods",

    38: "Collections + Previous Topics",

    39: "ArrayList Placement Practice",

    40: "LinkedList + ArrayList Placement",

    41: "Final Collections + Core Java Mock"

};


/* =====================================================
   GET CURRENT STUDENT
   ===================================================== */

function getStudentName() {

    return (
        localStorage.getItem("studentName") ||
        ""
    ).trim();

}


function getStudentUsername() {

    return (
        localStorage.getItem("studentUsername") ||
        ""
    ).trim();

}


function getStudentYear() {

    return (
        localStorage.getItem("studentYear") ||
        "Final Year"
    ).trim();

}


/* =====================================================
   GET ASSIGNED DAY
   ===================================================== */

function getAssignedDay() {

    const values = [

        localStorage.getItem("assignedDay"),

        localStorage.getItem("assessmentDay"),

        localStorage.getItem("currentDay")

    ];

    for (const value of values) {

        if (
            value !== null &&
            value !== ""
        ) {

            const match =
                String(value).match(/\d+/);

            if (match) {

                const day =
                    parseInt(
                        match[0],
                        10
                    );

                if (
                    Number.isFinite(day) &&
                    day >= 1 &&
                    day <= 41
                ) {

                    return day;

                }

            }

        }

    }

    return 1;

}


/* =====================================================
   GET COMPLETED DAYS
   ===================================================== */

function getCompletedDays() {

    const username =
        getStudentUsername();

    const reports =
        JSON.parse(
            localStorage.getItem(
                "assessmentReports"
            ) || "[]"
        );

    return reports.filter(report => {

        return String(
            report.username || ""
        ).trim().toLowerCase()
        === username.toLowerCase();

    });

}


/* =====================================================
   CALCULATE NEXT DAY
   ===================================================== */

function calculateNextDay() {

    const assignedDay =
        getAssignedDay();

    const reports =
        getCompletedDays();

    let highestDay =
        assignedDay - 1;

    reports.forEach(report => {

        const day =
            parseInt(
                String(
                    report.day ||
                    report.assessmentDay ||
                    report.submittedDay ||
                    ""
                ).replace(/\D/g, ""),
                10
            );

        if (
            Number.isFinite(day) &&
            day > highestDay
        ) {

            highestDay = day;

        }

    });

    const nextDay =
        Math.min(
            highestDay + 1,
            41
        );

    return nextDay;

}


/* =====================================================
   SET CURRENT DAY
   ===================================================== */

function setCurrentDay(day) {

    day =
        Math.max(
            1,
            Math.min(41, Number(day) || 1)
        );

    localStorage.setItem(
        "currentDay",
        String(day)
    );

    localStorage.setItem(
        "assessmentDay",
        String(day)
    );

}


/* =====================================================
   DISPLAY STUDENT
   ===================================================== */

function displayStudent() {

    const name =
        getStudentName();

    const username =
        getStudentUsername();

    const year =
        getStudentYear();

    document.getElementById(
        "studentName"
    ).textContent =
        name || "-";

    document.getElementById(
        "studentUsername"
    ).textContent =
        username || "-";

    document.getElementById(
        "studentYear"
    ).textContent =
        year || "-";

}


/* =====================================================
   DISPLAY DAY
   ===================================================== */

function displayDay() {

    const day =
        calculateNextDay();

    setCurrentDay(day);

    document.getElementById(
        "currentDay"
    ).textContent =
        "Day " + day;

    document.getElementById(
        "currentTopic"
    ).textContent =
        topics[day] ||
        "Java Placement Assessment";

}


/* =====================================================
   START ASSESSMENT
   ===================================================== */

function startAssessment() {

    const day =
        calculateNextDay();

    setCurrentDay(day);

    localStorage.setItem(
        "assessmentDay",
        String(day)
    );

    window.location.href =
        "assessment.html";

}


/* =====================================================
   VIEW REPORTS
   ===================================================== */

function viewReports() {

    window.location.href =
        "reports.html";

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout() {

    localStorage.removeItem(
        "loggedInUser"
    );

    localStorage.removeItem(
        "studentName"
    );

    localStorage.removeItem(
        "studentUsername"
    );

    localStorage.removeItem(
        "studentYear"
    );

    localStorage.removeItem(
        "assignedDay"
    );

    localStorage.removeItem(
        "currentDay"
    );

    localStorage.removeItem(
        "assessmentDay"
    );

    window.location.href =
        "index.html";

}


/* =====================================================
   PAGE LOAD
   ===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        displayStudent();

        displayDay();

    }
);

</script>

</body>
</html>
