<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f7fb;
}

.dashboard{
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    margin-bottom:30px;
}

h2{
    margin-top:0;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.info-row:last-child{
    border-bottom:none;
}

.label{
    font-weight:bold;
}

.day-box{
    text-align:center;
    padding:25px;
    background:#eef4ff;
    border-radius:10px;
    margin-top:20px;
}

.day-number{
    font-size:42px;
    font-weight:bold;
}

button{
    border:none;
    padding:13px 22px;
    border-radius:7px;
    cursor:pointer;
    font-size:16px;
}

.start-btn{
    background:#2864dc;
    color:white;
    width:100%;
    margin-top:20px;
}

.start-btn:hover{
    opacity:.9;
}

.report-btn{
    background:#28a745;
    color:white;
    margin-top:10px;
}

.logout-btn{
    background:#dc3545;
    color:white;
    margin-top:10px;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="dashboard">

<h1>Student Dashboard</h1>

<div class="card">

<h2>Student Details</h2>

<div class="info-row">
<span class="label">Name</span>
<span id="studentName">-</span>
</div>

<div class="info-row">
<span class="label">Username</span>
<span id="studentUsername">-</span>
</div>

<div class="info-row">
<span class="label">Year</span>
<span id="studentYear">-</span>
</div>

</div>


<div class="card">

<h2>Today's Assessment</h2>

<div class="day-box">

<div>Assigned Assessment</div>

<div class="day-number">
Day <span id="assignedDay">1</span>
</div>

<h3 id="topic">
Java Placement Practice
</h3>

<button
class="start-btn"
onclick="startAssessment()">

Start Today's Assessment

</button>

<div id="message"></div>

</div>

</div>


<div class="card">

<h2>My Reports</h2>

<button
class="report-btn"
onclick="viewReports()">

View My Reports

</button>

<br>

<button
class="logout-btn"
onclick="logout()">

Logout

</button>

</div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzS_bzFzjBlBo_k6Jdm0w7qulI0PJypJglUqnYe4pnBXuj4p54A0iahIZfumbSrSzd3Ow/exec";


/* =====================================================
   TOPICS
===================================================== */

const topics = {

1:"Java Basics and Input Output",
2:"Variables Data Types and Operators",
3:"Operators Conditions and Loops",
4:"Loops and Conditional Problems",
5:"Loops Conditional and Basic Coding",
6:"Array Basics",
7:"Array Operations",
8:"Array Problem Solving",
9:"Array Searching and Sorting",
10:"Array Interview Problems",
11:"Array and String Basics",
12:"String Basics",
13:"String Operations",
14:"Array and String Problem Solving",
15:"String Manipulation",
16:"Array and String Interview Questions",
17:"Array and String Placement Problems",
18:"OOP Concepts and String Programs",
19:"Classes and Objects",
20:"Inheritance and Polymorphism",
21:"Encapsulation and Abstraction",
22:"OOP and String Programs",
23:"Java Frequently Asked Questions",
24:"OOP Placement Questions",
25:"String Placement Problems",
26:"Advanced String Problems",
27:"String and OOP Interview Questions",
28:"String Problem Solving",
29:"String and OOP Practice",
30:"Placement Coding Problems",
31:"Java Framework Basics",
32:"Collections Framework",
33:"ArrayList Basics",
34:"ArrayList Problem Solving",
35:"ArrayList Interview Questions",
36:"Collections and Generics",
37:"Collection Framework Problems",
38:"Java Placement Practice",
39:"Java Interview Questions",
40:"Java Coding and Placement Practice",
41:"Final Java Placement Assessment"

};


/* =====================================================
   GET LOGGED-IN STUDENT
===================================================== */

function getStudent(){

    let student = null;

    try{

        student =
            JSON.parse(
                localStorage.getItem("loggedInStudent")
                || "null"
            );

    }
    catch(e){

        student = null;

    }

    return student;

}


/* =====================================================
   FALLBACK STUDENT INFORMATION
===================================================== */

function getStudentInformation(){

    const student = getStudent();

    let name =
        localStorage.getItem("studentName")
        || "";

    let username =
        localStorage.getItem("studentUsername")
        || "";

    let year =
        localStorage.getItem("studentYear")
        || "";

    if(student){

        name =
            student.name
            || student.Name
            || name;

        username =
            student.username
            || student.Username
            || username;

        year =
            student.year
            || student.Year
            || year;

    }

    return {
        name:name,
        username:username,
        year:year
    };

}


/* =====================================================
   LOCAL REPORTS
===================================================== */

function getLocalReports(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem("studentReports")
                || "[]"
            );

        return Array.isArray(data)
            ? data
            : [];

    }
    catch(e){

        return [];

    }

}


/* =====================================================
   GET NEXT DAY
===================================================== */

function calculateNextDay(){

    const student =
        getStudentInformation();

    let baseDay =
        parseInt(
            localStorage.getItem("assignedDay")
            || "1",
            10
        );

    if(
        isNaN(baseDay)
        ||
        baseDay < 1
    ){

        baseDay = 1;

    }

    if(baseDay > 41){

        baseDay = 41;

    }


    /*
       Check local reports first.
       This supports the existing browser
       result history.
    */

    const reports =
        getLocalReports();


    const mine =
        reports.filter(function(report){

            return String(
                report.username
                || report.Username
                || ""
            ).trim().toLowerCase()
            ===
            String(
                student.username
                || ""
            ).trim().toLowerCase();

        });


    let highestCompletedDay = 0;


    mine.forEach(function(report){

        const day =
            parseInt(
                report.day
                || report.Day
                || "0",
                10
            );

        if(
            !isNaN(day)
            &&
            day > highestCompletedDay
        ){

            highestCompletedDay = day;

        }

    });


    /*
       IMPORTANT:
       If a previous assessment exists,
       next day = previous highest day + 1.
    */

    if(highestCompletedDay >= 41){

        return 41;

    }


    if(highestCompletedDay >= 1){

        return highestCompletedDay + 1;

    }


    return baseDay;

}


/* =====================================================
   SET CURRENT DAY
===================================================== */

function setCurrentDay(day){

    day =
        parseInt(day,10);

    if(
        isNaN(day)
        ||
        day < 1
    ){

        day = 1;

    }

    if(day > 41){

        day = 41;

    }


    /*
       Store all three names because older
       pages in this project used different keys.
    */

    localStorage.setItem(
        "assignedDay",
        String(day)
    );

    localStorage.setItem(
        "assessmentDay",
        String(day)
    );

    localStorage.setItem(
        "currentDay",
        String(day)
    );

}


/* =====================================================
   DISPLAY STUDENT
===================================================== */

function displayStudent(){

    const student =
        getStudentInformation();

    document.getElementById(
        "studentName"
    ).textContent =
        student.name || "-";

    document.getElementById(
        "studentUsername"
    ).textContent =
        student.username || "-";

    document.getElementById(
        "studentYear"
    ).textContent =
        student.year || "-";

}


/* =====================================================
   DISPLAY DAY
===================================================== */

function displayDay(){

    const day =
        calculateNextDay();


    setCurrentDay(day);


    document.getElementById(
        "assignedDay"
    ).textContent =
        day;


    document.getElementById(
        "topic"
    ).textContent =
        topics[day]
        ||
        "Java Placement Practice";

}


/* =====================================================
   START ASSESSMENT
===================================================== */

function startAssessment(){

    const day =
        calculateNextDay();


    setCurrentDay(day);


    localStorage.setItem(
        "assessmentStartedDay",
        String(day)
    );


    window.location.href =
        "assessment.html";

}


/* =====================================================
   VIEW REPORTS
===================================================== */

function viewReports(){

    window.location.href =
        "results.html";

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    localStorage.removeItem(
        "loggedInStudent"
    );

    localStorage.removeItem(
        "studentName"
    );

    localStorage.removeItem(
        "studentUsername"
    );

    localStorage.removeItem(
        "studentYear"
    );

    localStorage.removeItem(
        "assignedDay"
    );

    localStorage.removeItem(
        "assessmentDay"
    );

    localStorage.removeItem(
        "currentDay"
    );


    window.location.href =
        "index.html";

}


/* =====================================================
   INITIALIZE
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        displayStudent();

        displayDay();

    }
);

</script>

</body>

</html>
