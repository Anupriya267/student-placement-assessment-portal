<!DOCTYPE html>
<html>

<head>

    <title>Student Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="dashboard">


    <h1>
        Student Dashboard
    </h1>


    <!-- ================= STUDENT DETAILS ================= -->

    <div class="card">

        <h2>
            Welcome Student
        </h2>

        <p>
            <b>Name:</b>
            <span id="studentName"></span>
        </p>

        <p>
            <b>Year:</b>
            <span id="studentYear"></span>
        </p>

    </div>


    <!-- ================= ASSIGNED ASSESSMENT ================= -->

    <div class="card">

        <h2>
            Assigned Assessment
        </h2>


        <p>
            <b>Day:</b>
            <span id="assignedDay"></span>
        </p>


        <p>
            <b>Assessment:</b>
            Day
            <span id="assignedDay2"></span>
            Java Placement Assessment
        </p>


        <p>
            <b>Topic:</b>
            <span id="topic"></span>
        </p>


        <p>
            <b>Duration:</b>
            40 Minutes
        </p>


        <button onclick="startAssessment()">
            START ASSESSMENT
        </button>

    </div>


    <!-- ================= PREVIOUS RESULTS ================= -->

    <div class="card">

        <h2>
            Previous Results
        </h2>


        <div id="previousResults">

            No results available

        </div>

    </div>


</div>



<script>


// =====================================================
// STUDENT INFORMATION
// =====================================================


let studentName =
    localStorage.getItem(
        "studentName"
    )
    ||
    "Student";


let studentYear =
    localStorage.getItem(
        "studentYear"
    )
    ||
    "Final Year";


let username =
    localStorage.getItem(
        "studentUsername"
    )
    ||
    "student1";



// =====================================================
// GET ALL REPORTS
// =====================================================


let reports =
    JSON.parse(
        localStorage.getItem(
            "studentReports"
        )
        ||
        "[]"
    );



// =====================================================
// GET ONLY THIS STUDENT'S REPORTS
// =====================================================


let myReports =
    reports.filter(
        function(report){

            return String(
                report.username
            ).trim()
            ===
            String(
                username
            ).trim();

        }
    );



// =====================================================
// DETERMINE ASSIGNED DAY
// =====================================================


// Start with the saved assigned day

let assignedDay =
    parseInt(
        localStorage.getItem(
            "assignedDay"
        )
        ||
        "1"
    );


// If this student already has completed reports,
// find the highest completed day.

if(
    myReports.length > 0
){

    let completedDays =
        myReports.map(
            function(report){

                return parseInt(
                    report.day
                )
                ||
                0;

            }
        );


    let highestCompletedDay =
        Math.max.apply(
            null,
            completedDays
        );


    // Next day after highest completed day

    if(
        highestCompletedDay >= 1
        &&
        highestCompletedDay < 41
    ){

        assignedDay =
            highestCompletedDay + 1;

    }


    // If Day 41 is completed,
    // keep the student at Day 41.

    if(
        highestCompletedDay >= 41
    ){

        assignedDay = 41;

    }

}



// Make sure day stays between 1 and 41

if(
    assignedDay < 1
){

    assignedDay = 1;

}


if(
    assignedDay > 41
){

    assignedDay = 41;

}



// Save the current assigned day

localStorage.setItem(
    "assignedDay",
    assignedDay
);



// =====================================================
// DISPLAY STUDENT DETAILS
// =====================================================


document.getElementById(
    "studentName"
).innerText =
    studentName;


document.getElementById(
    "studentYear"
).innerText =
    studentYear;


document.getElementById(
    "assignedDay"
).innerText =
    assignedDay;


document.getElementById(
    "assignedDay2"
).innerText =
    assignedDay;



// =====================================================
// TOPICS
// =====================================================


let topics = {

    1:
        "Loops, Conditions, Operators",

    2:
        "Loops and Conditional Logic",

    3:
        "Operators, Conditions and Loops",

    4:
        "Loop Problem Solving and Edge Cases",

    5:
        "Array Basics and Loop Traversal",

    6:
        "Array Basics",

    7:
        "Array Operations",

    8:
        "Array Problem Solving",

    9:
        "Array Searching and Sorting",

    10:
        "Array Interview Problems",

    11:
        "Array and String Basics",

    12:
        "String Basics",

    13:
        "String Operations",

    14:
        "Array and String Problem Solving",

    15:
        "String Manipulation",

    16:
        "Array and String Interview Problems",

    17:
        "Array and String Placement Problems",

    18:
        "OOP Concepts and String Programs",

    19:
        "Classes and Objects",

    20:
        "Inheritance and Polymorphism",

    21:
        "Encapsulation and Abstraction",

    22:
        "OOP and String Programs",

    23:
        "Java Frequently Asked Questions",

    24:
        "OOP Placement Questions",

    25:
        "String Placement Problems",

    26:
        "Advanced String Problems",

    27:
        "String and OOP Interview Questions",

    28:
        "String Problem Solving",

    29:
        "String and OOP Practice",

    30:
        "Placement Coding Problems",

    31:
        "Java Framework Basics",

    32:
        "Collections Framework",

    33:
        "ArrayList Basics",

    34:
        "ArrayList Problem Solving",

    35:
        "ArrayList Interview Questions",

    36:
        "Collections and Generics",

    37:
        "Collection Framework Problems",

    38:
        "Java Placement Practice",

    39:
        "Java Interview Questions",

    40:
        "Java Coding and Placement Practice",

    41:
        "Final Java Placement Assessment"

};



document.getElementById(
    "topic"
).innerText =

    topics[assignedDay]
    ||
    "Java Placement Practice";



// =====================================================
// START ASSESSMENT
// =====================================================


function startAssessment(){

    window.location.href =
        "assessment.html";

}



// =====================================================
// DISPLAY PREVIOUS RESULTS
// =====================================================


if(
    myReports.length > 0
){

    let html = "";


    myReports
        .slice()
        .sort(
            function(a,b){

                return (
                    parseInt(a.day)
                    -
                    parseInt(b.day)
                );

            }
        )
        .forEach(
            function(report){

                html +=

                    "<div style='" +
                    "border:1px solid #ddd;" +
                    "padding:10px;" +
                    "margin:8px 0;" +
                    "border-radius:6px;" +
                    "'>" +

                    "<b>Day " +
                    report.day +
                    "</b>" +

                    " — Score: " +

                    report.score +
                    "/" +
                    report.total +

                    " — " +

                    report.percentage +
                    "%" +

                    " — " +

                    report.status +

                    "</div>";

            }
        );


    document.getElementById(
        "previousResults"
    ).innerHTML =
        html;

}


else{

    document.getElementById(
        "previousResults"
    ).innerText =
        "No results available";

}


</script>


</body>

</html>
