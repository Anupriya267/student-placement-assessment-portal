<!DOCTYPE html>
<html>

<head>

<title>Student Reports</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<style>

.report-card {
    background: white;
    padding: 15px;
    margin: 15px 0;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.report-table {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
}

th {
    background: #2864dc;
    color: white;
}

.no-data {
    padding: 20px;
    text-align: center;
}

</style>

</head>


<body>


<div class="dashboard">


<h1>Student Reports</h1>


<div class="card">

<h2>Assessment Reports</h2>

<div id="reportsContainer">

<p class="no-data">
No student reports available yet.
</p>

</div>

</div>


<div class="card">

<button onclick="goBack()">
Back to Admin Dashboard
</button>

</div>


</div>



<script>


function loadReports(){

    let students =
        JSON.parse(
            localStorage.getItem("students")
            ||
            "[]"
        );


    let reports =
        JSON.parse(
            localStorage.getItem("studentReports")
            ||
            "[]"
        );


    let container =
        document.getElementById(
            "reportsContainer"
        );


    container.innerHTML = "";


    if(
        reports.length === 0
    ){

        container.innerHTML =

            "<p class='no-data'>" +

            "No student reports available yet." +

            "</p>";

        return;

    }


    let table =
        document.createElement("table");


    table.innerHTML =

        "<thead>" +

        "<tr>" +

        "<th>Name</th>" +

        "<th>Username</th>" +

        "<th>Year</th>" +

        "<th>Day</th>" +

        "<th>Score</th>" +

        "<th>Percentage</th>" +

        "<th>Status</th>" +

        "</tr>" +

        "</thead>" +

        "<tbody></tbody>";


    let tbody =
        table.querySelector("tbody");


    reports.forEach(
        function(report){

            let student =
                students.find(
                    function(s){

                        return s.username
                        ===
                        report.username;

                    }
                );


            let row =
                document.createElement("tr");


            row.innerHTML =

                "<td>" +

                escapeHTML(
                    report.name ||
                    (student
                    ? student.name
                    : "")
                ) +

                "</td>" +


                "<td>" +

                escapeHTML(
                    report.username
                    ||
                    ""
                ) +

                "</td>" +


                "<td>" +

                escapeHTML(
                    report.year ||
                    (student
                    ? student.year
                    : "")
                ) +

                "</td>" +


                "<td>" +

                escapeHTML(
                    String(
                        report.day ||
                        ""
                    )
                ) +

                "</td>" +


                "<td>" +

                escapeHTML(
                    String(
                        report.score ||
                        "0"
                    )
                ) +

                "</td>" +


                "<td>" +

                escapeHTML(
                    String(
                        report.percentage ||
                        "0"
                    )
                ) +

                "%" +

                "</td>" +


                "<td>" +

                escapeHTML(
                    report.status ||
                    "Completed"
                ) +

                "</td>";


            tbody.appendChild(row);

        }
    );


    container.appendChild(table);

}



function goBack(){

    window.location.href =
        "admin.html";

}



function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}



window.onload =
    loadReports;

</script>


</body>

</html>
