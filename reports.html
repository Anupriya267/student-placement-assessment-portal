<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment Reports</title>
<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

.container{
    max-width:1150px;
    margin:auto;
}

.header,.table-container,.loading{
    background:#fff;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

.header{
    padding:25px;
    margin-bottom:20px;
}

.header h1{
    margin:0 0 15px;
}

.student-info{
    line-height:1.8;
}

.back-btn,.view-btn{
    border:0;
    border-radius:7px;
    padding:10px 18px;
    color:#fff;
    cursor:pointer;
}

.back-btn{
    margin-top:15px;
    background:#555;
}

.view-btn{
    background:#2864d7;
}

.loading{
    padding:30px;
    text-align:center;
}

.success{
    background:#edf9ef;
    border:1px solid #b7dfbc;
    color:#17621d;
    padding:14px 18px;
    border-radius:8px;
    margin-bottom:15px;
}

.table-container{
    padding:20px;
    overflow-x:auto;
    display:none;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:13px 12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#f0f2f5;
}

.modal{
    display:none;
    position:fixed;
    z-index:9999;
    inset:0;
    background:rgba(0,0,0,.6);
    overflow:auto;
}

.modal-content{
    background:#fff;
    width:92%;
    max-width:900px;
    margin:35px auto;
    padding:28px;
    border-radius:14px;
    position:relative;
}

.close{
    position:absolute;
    right:22px;
    top:15px;
    font-size:30px;
    font-weight:bold;
    cursor:pointer;
}

.report-student{
    background:#f6f8fc;
    padding:15px;
    border-radius:9px;
    line-height:1.8;
    margin-bottom:20px;
}

.summary-box{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:20px 0;
}

.summary-item{
    background:#eef3ff;
    padding:17px 10px;
    border-radius:9px;
    text-align:center;
}

.summary-title{
    font-size:15px;
}

.summary-value{
    margin-top:6px;
    font-size:25px;
    font-weight:bold;
}

.answer-box{
    border:1px solid #ddd;
    border-radius:9px;
    padding:17px;
    margin:13px 0;
    background:#fff;
}

.answer-box h3{
    margin-top:0;
    line-height:1.5;
}

.answer-code{
    background:#f4f4f4;
    padding:14px;
    border-radius:7px;
    white-space:pre-wrap;
    overflow-x:auto;
    font-family:Consolas,monospace;
}

.correct{
    color:green;
    font-weight:bold;
}

.wrong{
    color:red;
    font-weight:bold;
}

.partial{
    color:#b36b00;
    font-weight:bold;
}

@media(max-width:700px){

    body{
        padding:10px;
    }

    .header{
        padding:18px;
    }

    .summary-box{
        grid-template-columns:repeat(2,1fr);
    }

    .modal-content{
        width:96%;
        padding:18px;
        margin:20px auto;
    }

    th,td{
        padding:10px 8px;
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">

<h1 id="pageTitle">Student Reports</h1>

<div class="student-info">

<div>
<b>Name:</b>
<span id="studentName">Loading...</span>
</div>

<div>
<b>Username:</b>
<span id="studentUsername">Loading...</span>
</div>

<div>
<b>Year:</b>
<span id="studentYear">Loading...</span>
</div>

</div>

<button
class="back-btn"
onclick="goBack()">
Back to Dashboard
</button>

</div>


<div id="loading" class="loading">
Loading reports...
</div>


<div
id="success"
class="success"
style="display:none">
</div>


<div
id="reportArea"
class="table-container">

<table>

<thead>

<tr>
<th>Day</th>
<th>Topic</th>
<th>MCQ + Error</th>
<th>Coding</th>
<th>Total</th>
<th>Percentage</th>
<th>Status</th>
<th>Date</th>
<th>Report</th>
</tr>

</thead>

<tbody id="reportBody">
</tbody>

</table>

</div>

</div>


<div id="reportModal" class="modal">

<div class="modal-content">

<span
class="close"
onclick="closeModal()">
&times;
</span>

<h2>Assessment Report</h2>


<div
id="modalStudent"
class="report-student">
</div>


<div class="summary-box">

<div class="summary-item">

<div class="summary-title">
MCQ + Error
</div>

<div
id="modalObjective"
class="summary-value">
0/12
</div>

</div>


<div class="summary-item">

<div class="summary-title">
Coding
</div>

<div
id="modalCoding"
class="summary-value">
0/3
</div>

</div>


<div class="summary-item">

<div class="summary-title">
Total
</div>

<div
id="modalTotal"
class="summary-value">
0/15
</div>

</div>


<div class="summary-item">

<div class="summary-title">
Percentage
</div>

<div
id="modalPercentage"
class="summary-value">
0%
</div>

</div>

</div>


<div id="modalDetails"></div>

</div>
</div>


<script>

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxrrb6gSB12hmilk7j5BEWqeOmSAJad9Zi-ZbpaoS1kaJRHhUAoDh02-teDu2O_hbSnRA/exec";


function getLoggedStudent(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "loggedInStudent"
            ) || "null"
        );

    }catch(e){

        return null;

    }

}


const loggedStudent =
getLoggedStudent();


const isAdmin =
String(
    localStorage.getItem(
        "loggedInUser"
    ) || ""
)
.trim()
.toLowerCase()
===
"admin";


const studentName =
String(
    loggedStudent?.name ||
    loggedStudent?.Name ||
    localStorage.getItem(
        "studentName"
    ) ||
    "Student"
).trim();


const studentUsername =
String(
    loggedStudent?.username ||
    loggedStudent?.Username ||
    localStorage.getItem(
        "studentUsername"
    ) ||
    ""
).trim();


const studentYear =
String(
    loggedStudent?.year ||
    loggedStudent?.Year ||
    localStorage.getItem(
        "studentYear"
    ) ||
    "Final Year"
).trim();


const normalizedUsername =
studentUsername.toLowerCase();


document.getElementById(
    "studentName"
).textContent =
isAdmin
? "Administrator"
: studentName;


document.getElementById(
    "studentUsername"
).textContent =
isAdmin
? "admin"
: (
    studentUsername ||
    "Not available"
);


document.getElementById(
    "studentYear"
).textContent =
isAdmin
? "All Students"
: studentYear;


if(isAdmin){

    document.getElementById(
        "pageTitle"
    ).textContent =
    "Admin Assessment Reports";

}


let studentResults=[];


function parseNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return 0;

    }


    const match =
    String(value).match(
        /-?\d+(?:\.\d+)?/
    );


    return match
    ? Number(match[0])
    : 0;

}


function normalizeReport(
    row,
    source
){

    let answers =
    row.answers ??
    row.Answers ??
    [];


    if(
        typeof answers ===
        "string"
    ){

        try{

            answers =
            JSON.parse(
                answers
            );

        }catch(e){

            answers=[];

        }

    }


    if(
        !Array.isArray(
            answers
        )
    ){

        answers=[];

    }


    /*
    =====================================================
    IMPORTANT FIX

    NOT ANSWERED CODING QUESTION
    CAN NEVER BE CORRECT.

    Blank / Not Answered
    => Wrong
    => 0
    =====================================================
    */

    answers =
    answers.map(
        function(answer){

            const item =
            {
                ...answer
            };


            const type =
            String(
                item.type ??
                item.Type ??
                ""
            )
            .trim()
            .toUpperCase();


            const rawAnswer =
            item.studentAnswer ??
            item.answer ??
            item.code ??
            "";


            const empty =
            rawAnswer === null ||
            rawAnswer === undefined ||
            String(
                rawAnswer
            ).trim() === "" ||
            String(
                rawAnswer
            )
            .trim()
            .toLowerCase() ===
            "not answered";


            if(
                type === "CODING" &&
                empty
            ){

                item.studentAnswer =
                    "Not Answered";

                item.status =
                    "Wrong";

                item.score =
                    0;

                item.evaluation =
                    "No code submitted.";

            }


            return item;

        }
    );


    let mcq =
    parseNumber(
        row.mcqScore ??
        row.MCQScore
    );


    let error =
    parseNumber(
        row.errorScore ??
        row.ErrorScore
    );


    let coding =
    parseNumber(
        row.codingScore ??
        row.CodingScore
    );


    const objectiveRaw =
    row["MCQ + Error"];


    if(
        row.mcqScore === undefined &&
        row.errorScore === undefined &&
        objectiveRaw !== undefined
    ){

        mcq =
        parseNumber(
            objectiveRaw
        );

        error=0;

    }


    /*
    Recalculate coding score
    from individual coding answers.
    */

    const codingAnswers =
    answers.filter(
        function(answer){

            return String(
                answer.type ??
                answer.Type ??
                ""
            )
            .trim()
            .toUpperCase()
            ===
            "CODING";

        }
    );


    if(
        codingAnswers.length
    ){

        coding =
        codingAnswers.reduce(
            function(sum,answer){

                const raw =
                answer.studentAnswer ??
                answer.answer ??
                answer.code ??
                "";


                const empty =
                raw === null ||
                raw === undefined ||
                String(raw).trim()==="" ||
                String(raw)
                .trim()
                .toLowerCase() ===
                "not answered";


                if(empty){

                    return sum;

                }


                return (
                    sum +
                    parseNumber(
                        answer.score
                    )
                );

            },
            0
        );

    }


    let total =
    parseNumber(
        row.totalScore ??
        row.TotalScore
    );


    if(
        answers.length
    ){

        total =
        mcq +
        error +
        coding;

    }
    else if(
        total === 0
    ){

        total =
        mcq +
        error +
        coding;

    }


    let percentage;


    if(
        answers.length
    ){

        percentage =
        total /
        15 *
        100;

    }
    else{

        percentage =
        parseNumber(
            row.percentage ??
            row.Percentage
        );

    }


    const rawDay =
    row.day ??
    row.Day ??
    row.assessmentDay ??
    row.assignedDay ??
    "";


    const dayMatch =
    String(
        rawDay
    ).match(
        /\d+/
    );


    const day =
    dayMatch
    ? parseInt(
        dayMatch[0],
        10
      )
    : 0;


    return {

        source:source,

        name:String(
            row.name ??
            row.Name ??
            row.studentName ??
            row.StudentName ??
            studentName
        ).trim(),

        username:String(
            row.username ??
            row.Username ??
            row.studentUsername ??
            row.StudentUsername ??
            studentUsername
        ).trim(),

        year:String(
            row.year ??
            row.Year ??
            row.studentYear ??
            row.StudentYear ??
            studentYear
        ).trim(),

        day:day,

        topic:String(
            row.topic ??
            row.Topic ??
            "Java Placement Practice"
        ).trim(),

        mcqScore:mcq,

        errorScore:error,

        codingScore:coding,

        totalScore:total,

        percentage:percentage,

        status:String(
            row.status ??
            row.Status ??
            "Completed"
        ).trim(),

        submittedAt:
            row.submittedAt ??
            row["Submission Date"] ??
            row.submissionDate ??
            "",

        answers:answers

    };

}


function loadLocal(){

    try{

        const reports =
        JSON.parse(
            localStorage.getItem(
                "studentReports"
            ) || "[]"
        );


        if(
            !Array.isArray(
                reports
            )
        ){

            return [];

        }


        if(isAdmin){

            return reports;

        }


        return reports.filter(
            function(report){

                const username =
                String(
                    report.username ??
                    report.Username ??
                    report.studentUsername ??
                    ""
                )
                .trim()
                .toLowerCase();


                return (
                    !username ||
                    username ===
                    normalizedUsername
                );

            }
        );

    }catch(e){

        return [];

    }

}


window.handleAssessmentResults =
function(data){

    const google =
    Array.isArray(data)
    ? data
    : [];


    const filtered =
    isAdmin
    ? google
    : google.filter(
        function(row){

            return String(
                row.Username ??
                row.username ??
                row.studentUsername ??
                ""
            )
            .trim()
            .toLowerCase()
            ===
            normalizedUsername;

        }
    );


    merge(
        loadLocal(),
        filtered
    );

};


function loadGoogle(){

    const old =
    document.getElementById(
        "googleResultsScript"
    );


    if(old){

        old.remove();

    }


    const script =
    document.createElement(
        "script"
    );


    script.id =
    "googleResultsScript";


    script.src =
    GOOGLE_SCRIPT_URL +
    "?action=getResults" +
    "&callback=handleAssessmentResults" +
    "&_=" +
    Date.now();


    script.onerror =
    function(){

        merge(
            loadLocal(),
            []
        );

    };


    document.body.appendChild(
        script
    );

}


function merge(
    local,
    google
){

    const map =
    new Map();


    [
        ...local,
        ...google
    ]
    .forEach(
        function(raw,index){

            const report =
            normalizeReport(
                raw,
                index < local.length
                ? "local"
                : "google"
            );


            if(
                report.day <= 0
            ){

                return;

            }


            const key =
            (
                isAdmin
                ? report.username
                    .toLowerCase()
                : normalizedUsername
            ) +
            "_day_" +
            report.day;


            const old =
            map.get(key);


            if(
                !old ||
                report.answers.length >
                old.answers.length ||
                (
                    report.source ===
                    "local" &&
                    old.source ===
                    "google"
                )
            ){

                map.set(
                    key,
                    report
                );

            }

        }
    );


    studentResults =
    Array.from(
        map.values()
    );


    studentResults.sort(
        function(a,b){

            return (
                Number(a.day) -
                Number(b.day)
            );

        }
    );


    window.studentResults =
    studentResults;


    displayReports();

}


function displayReports(){

    document.getElementById(
        "loading"
    ).style.display =
    "none";


    document.getElementById(
        "reportArea"
    ).style.display =
    "block";


    const body =
    document.getElementById(
        "reportBody"
    );


    body.innerHTML="";


    if(
        !studentResults.length
    ){

        body.innerHTML =
        "<tr>" +
        "<td colspan='9' " +
        "style='text-align:center;padding:30px'>" +
        "No assessment reports found." +
        "</td>" +
        "</tr>";

        return;

    }


    studentResults.forEach(
        function(report,index){

            const objective =
            report.mcqScore +
            report.errorScore;


            const tr =
            document.createElement(
                "tr"
            );


            tr.innerHTML =

            "<td>Day " +
            report.day +
            "</td>" +

            "<td>" +
            escapeHTML(
                report.topic
            ) +
            "</td>" +

            "<td>" +
            objective +
            "/12</td>" +

            "<td>" +
            report.codingScore +
            "/3</td>" +

            "<td>" +
            report.totalScore +
            "/15</td>" +

            "<td>" +
            Number(
                report.percentage
            ).toFixed(2) +
            "%</td>" +

            "<td>" +
            escapeHTML(
                report.status
            ) +
            "</td>" +

            "<td>" +
            escapeHTML(
                formatDate(
                    report.submittedAt
                )
            ) +
            "</td>" +

            "<td>" +

            "<button " +
            "class='view-btn' " +
            "onclick='openReport(" +
            index +
            ")'>" +

            "View" +

            "</button>" +

            "</td>";


            body.appendChild(
                tr
            );

        }
    );


    const success =
    document.getElementById(
        "success"
    );


    success.style.display =
    "block";


    success.textContent =
    studentResults.length +
    " assessment report" +
    (
        studentResults.length === 1
        ? ""
        : "s"
    ) +
    " found.";

}


function openReport(index){

    const report =
    window.studentResults[
        index
    ];


    if(!report){

        return;

    }


    const objective =
    report.mcqScore +
    report.errorScore;


    document.getElementById(
        "modalObjective"
    ).textContent =
    objective +
    "/12";


    document.getElementById(
        "modalCoding"
    ).textContent =
    report.codingScore +
    "/3";


    document.getElementById(
        "modalTotal"
    ).textContent =
    report.totalScore +
    "/15";


    document.getElementById(
        "modalPercentage"
    ).textContent =
    Number(
        report.percentage
    ).toFixed(2) +
    "%";


    const name =
    isAdmin
    ? (
        report.name ||
        "Student"
      )
    : studentName;


    const username =
    isAdmin
    ? (
        report.username ||
        "Not available"
      )
    : studentUsername;


    const year =
    isAdmin
    ? (
        report.year ||
        "Not available"
      )
    : studentYear;


    document.getElementById(
        "modalStudent"
    ).innerHTML =

    "<b>Name:</b> " +
    escapeHTML(name) +

    "<br>" +

    "<b>Username:</b> " +
    escapeHTML(username) +

    "<br>" +

    "<b>Year:</b> " +
    escapeHTML(year) +

    "<br>" +

    "<b>Day:</b> Day " +
    report.day +

    "<br>" +

    "<b>Topic:</b> " +
    escapeHTML(
        report.topic
    ) +

    "<br>" +

    "<b>Status:</b> " +
    escapeHTML(
        report.status
    ) +

    "<br>" +

    "<b>Submitted:</b> " +
    escapeHTML(
        formatDate(
            report.submittedAt
        )
    );


    displayAnswerDetails(
        report
    );


    document.getElementById(
        "reportModal"
    ).style.display =
    "block";

}


function displayAnswerDetails(
    report
){

    const details =
    document.getElementById(
        "modalDetails"
    );


    details.innerHTML =
    "<h2>Answer Details</h2>";


    const answers =
    Array.isArray(
        report.answers
    )
    ? report.answers
    : [];


    if(
        !answers.length
    ){

        details.innerHTML +=
        "<div class='answer-box'>" +
        "<b>Detailed answers are not available " +
        "for this stored report.</b>" +
        "</div>";

        return;

    }


    answers.forEach(
        function(answer,index){

            const type =
            String(
                answer.type ??
                answer.Type ??
                ""
            )
            .trim()
            .toUpperCase();


            const question =
            answer.question ??
            answer.Question ??
            "Question " +
            (index + 1);


            const raw =
            answer.studentAnswer ??
            answer.answer ??
            answer.code ??
            "";


            const unanswered =
            raw === null ||
            raw === undefined ||
            String(
                raw
            ).trim() === "" ||
            String(
                raw
            )
            .trim()
            .toLowerCase() ===
            "not answered";


            let status =
            String(
                answer.status ??
                ""
            ).trim();


            let score =
            parseNumber(
                answer.score
            );


            /*
            FINAL SAFETY CHECK

            Coding without an answer
            is ALWAYS Wrong and 0.
            */

            if(
                type === "CODING" &&
                unanswered
            ){

                status =
                "Wrong";

                score =
                0;

            }


            if(!status){

                if(score >= 1){

                    status =
                    "Correct";

                }
                else if(score > 0){

                    status =
                    "Partial";

                }
                else{

                    status =
                    "Wrong";

                }

            }


            let statusClass =
            "wrong";


            const lowerStatus =
            status.toLowerCase();


            if(
                lowerStatus.includes(
                    "partial"
                )
            ){

                statusClass =
                "partial";

            }
            else if(
                lowerStatus.includes(
                    "correct"
                ) &&
                !lowerStatus.includes(
                    "incorrect"
                )
            ){

                statusClass =
                "correct";

            }


            const box =
            document.createElement(
                "div"
            );


            box.className =
            "answer-box";


            let html =

            "<h3>Q" +
            (index + 1) +
            ". " +
            escapeHTML(
                question
            ) +
            "</h3>" +

            "<p><b>Type:</b> " +
            escapeHTML(
                type
            ) +
            "</p>";


            if(
                type === "CODING"
            ){

                html +=

                "<p><b>Your Java Code:</b></p>" +

                "<pre class='answer-code'>" +

                escapeHTML(
                    unanswered
                    ? "Not Answered"
                    : raw
                ) +

                "</pre>";

            }
            else{

                html +=

                "<p><b>Your Answer:</b> " +

                escapeHTML(
                    unanswered
                    ? "Not Answered"
                    : raw
                ) +

                "</p>";

            }


            const correct =
            answer.correctAnswer ??
            answer.correct ??
            "";


            if(
                correct !== ""
            ){

                html +=

                "<p><b>Correct Answer:</b> " +

                escapeHTML(
                    correct
                ) +

                "</p>";

            }


            html +=

            "<p class='" +
            statusClass +
            "'>" +

            "<b>Coding Evaluation:</b> " +

            escapeHTML(
                status
            ) +

            "</p>" +

            "<p><b>Mark:</b> " +

            score +

            "</p>";


            if(
                answer.evaluation
            ){

                html +=

                "<p><b>Evaluation:</b> " +

                escapeHTML(
                    answer.evaluation
                ) +

                "</p>";

            }


            box.innerHTML =
            html;


            details.appendChild(
                box
            );

        }
    );

}


function closeModal(){

    document.getElementById(
        "reportModal"
    ).style.display =
    "none";

}


window.onclick =
function(event){

    if(
        event.target ===
        document.getElementById(
            "reportModal"
        )
    ){

        closeModal();

    }

};


function goBack(){

    window.location.href =
    isAdmin
    ? "admin.html"
    : "student.html";

}


function formatDate(value){

    if(!value){

        return "Not available";

    }


    const date =
    new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }


    return date.toLocaleString();

}


function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

merge(

);
