<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assessment Reports</title>

<link rel="stylesheet" href="style.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

.container{
    max-width:1300px;
    margin:auto;
}

.header{
    background:#ffffff;
    padding:25px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.10);
    margin-bottom:20px;
}

.header h1{
    margin:0 0 18px;
    font-size:32px;
}

.info{
    line-height:1.9;
    font-size:16px;
}

.info b{
    color:#111;
}

.admin-badge{
    display:inline-block;
    background:#222;
    color:#fff;
    font-size:13px;
    padding:5px 10px;
    border-radius:20px;
    margin-left:8px;
    vertical-align:middle;
}

.back-btn,
.refresh-btn{
    border:none;
    padding:11px 20px;
    border-radius:7px;
    color:white;
    cursor:pointer;
    font-size:15px;
    margin-top:15px;
    margin-right:8px;
}

.back-btn{
    background:#555;
}

.refresh-btn{
    background:#2864d7;
}

.back-btn:hover,
.refresh-btn:hover{
    opacity:.9;
}

.loading{
    background:#fff;
    padding:30px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.message{
    display:none;
    padding:14px 18px;
    border-radius:8px;
    margin-bottom:15px;
}

.success{
    background:#edf9ef;
    border:1px solid #b7dfbc;
    color:#17621d;
}

.error{
    background:#fff1f1;
    border:1px solid #e1b1b1;
    color:#9b111e;
}

.table-container{
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.10);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
    white-space:nowrap;
}

th{
    background:#eef2f7;
    font-weight:bold;
}

tr:hover{
    background:#fafafa;
}

.view-btn{
    border:none;
    padding:8px 15px;
    border-radius:6px;
    background:#2864d7;
    color:white;
    cursor:pointer;
}

.view-btn:hover{
    background:#1e4fae;
}

.no-report{
    text-align:center;
    padding:30px !important;
    color:#666;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.65);
    overflow:auto;
}

.modal-content{
    background:#fff;
    width:92%;
    max-width:900px;
    margin:35px auto;
    padding:28px;
    border-radius:14px;
    position:relative;
}

.close{
    position:absolute;
    right:20px;
    top:12px;
    font-size:30px;
    font-weight:bold;
    cursor:pointer;
}

.close:hover{
    color:red;
}

.report-student{
    background:#f6f8fc;
    padding:15px;
    border-radius:9px;
    line-height:1.8;
    margin-bottom:20px;
}

.summary-box{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:20px 0;
}

.summary-item{
    background:#eef3ff;
    padding:17px 10px;
    border-radius:9px;
    text-align:center;
}

.summary-title{
    font-size:14px;
}

.summary-value{
    margin-top:6px;
    font-size:24px;
    font-weight:bold;
}

.answer-box{
    border:1px solid #ddd;
    border-radius:9px;
    padding:17px;
    margin:13px 0;
    background:#fff;
}

.answer-box h3{
    line-height:1.5;
}

.answer-code{
    background:#f4f4f4;
    padding:14px;
    border-radius:7px;
    white-space:pre-wrap;
    overflow-x:auto;
    font-family:Consolas,monospace;
}

.correct{
    color:green;
    font-weight:bold;
}

.wrong{
    color:red;
    font-weight:bold;
}

.partial{
    color:#b36b00;
    font-weight:bold;
}

@media(max-width:700px){

    body{
        padding:10px;
    }

    .header{
        padding:18px;
    }

    .header h1{
        font-size:25px;
    }

    .summary-box{
        grid-template-columns:repeat(2,1fr);
    }

    .modal-content{
        width:96%;
        padding:18px;
        margin:20px auto;
    }

    th,
    td{
        padding:9px;
        font-size:13px;
    }

}

</style>
</head>


<body>

<div class="container">


<!-- HEADER -->

<div class="header">

    <h1>
        Assessment Reports
        <span id="adminBadge"></span>
    </h1>


    <div class="info">

        <div>
            <b>Name:</b>
            <span id="studentName">Loading...</span>
        </div>

        <div>
            <b>Username:</b>
            <span id="studentUsername">Loading...</span>
        </div>

        <div>
            <b>Year:</b>
            <span id="studentYear">Loading...</span>
        </div>

        <div>
            <b>Access:</b>
            <span id="accessType">Loading...</span>
        </div>

    </div>


    <button
        class="back-btn"
        onclick="goBack()">

        Back to Dashboard

    </button>


    <button
        class="refresh-btn"
        onclick="startReports()">

        Refresh Reports

    </button>

</div>


<!-- LOADING -->

<div
    id="loading"
    class="loading">

    Loading assessment reports...

</div>


<!-- SUCCESS -->

<div
    id="success"
    class="message success">
</div>


<!-- ERROR -->

<div
    id="error"
    class="message error">
</div>


<!-- REPORT TABLE -->

<div
    id="reportArea"
    class="table-container"
    style="display:none;">

    <table>

        <thead>

            <tr>

                <th>Name</th>

                <th>Username</th>

                <th>Year</th>

                <th>Day</th>

                <th>Topic</th>

                <th>MCQ + Error</th>

                <th>Coding</th>

                <th>Total</th>

                <th>Percentage</th>

                <th>Status</th>

                <th>Date</th>

                <th>Report</th>

            </tr>

        </thead>


        <tbody id="reportBody">

        </tbody>

    </table>

</div>

</div>


<!-- REPORT MODAL -->

<div
    id="reportModal"
    class="modal">

    <div class="modal-content">

        <span
            class="close"
            onclick="closeModal()">

            &times;

        </span>


        <h2>
            Assessment Report
        </h2>


        <div
            id="modalStudent"
            class="report-student">

        </div>


        <div class="summary-box">


            <div class="summary-item">

                <div class="summary-title">
                    MCQ + Error
                </div>

                <div
                    id="modalObjective"
                    class="summary-value">

                    0/12

                </div>

            </div>


            <div class="summary-item">

                <div class="summary-title">
                    Coding
                </div>

                <div
                    id="modalCoding"
                    class="summary-value">

                    0/3

                </div>

            </div>


            <div class="summary-item">

                <div class="summary-title">
                    Total
                </div>

                <div
                    id="modalTotal"
                    class="summary-value">

                    0/15

                </div>

            </div>


            <div class="summary-item">

                <div class="summary-title">
                    Percentage
                </div>

                <div
                    id="modalPercentage"
                    class="summary-value">

                    0%

                </div>

            </div>

        </div>


        <div id="modalDetails">

        </div>

    </div>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxrrb6gSB12hmilk7j5BEWqeOmSAJad9Zi-ZbpaoS1kaJRHhUAoDh02-teDu2O_hbSnRA/exec";


/* =====================================================
   GET LOGGED STUDENT
===================================================== */

function getLoggedStudent(){

    try{

        const value =
            localStorage.getItem(
                "loggedInStudent"
            );

        if(value){

            return JSON.parse(value);

        }

    }
    catch(error){

        console.error(
            "Login data error:",
            error
        );

    }

    return null;

}


const loggedStudent =
    getLoggedStudent();


/* =====================================================
   ADMIN CHECK
===================================================== */

const isAdmin =
    String(
        localStorage.getItem(
            "loggedInUser"
        )
        ||
        ""
    )
    .trim()
    .toLowerCase()
    ===
    "admin";


/* =====================================================
   STUDENT IDENTITY
===================================================== */

const studentName =

    isAdmin

    ?

    "Administrator"

    :

    String(

        loggedStudent?.name

        ||

        loggedStudent?.Name

        ||

        localStorage.getItem(
            "studentName"
        )

        ||

        "Student"

    ).trim();


const studentUsername =

    isAdmin

    ?

    "admin"

    :

    String(

        loggedStudent?.username

        ||

        loggedStudent?.Username

        ||

        localStorage.getItem(
            "studentUsername"
        )

        ||

        ""

    ).trim();


const studentYear =

    isAdmin

    ?

    "Administrator"

    :

    String(

        loggedStudent?.year

        ||

        loggedStudent?.Year

        ||

        localStorage.getItem(
            "studentYear"
        )

        ||

        ""

    ).trim();


const normalizedUsername =
    studentUsername
    .toLowerCase();


/* =====================================================
   HEADER DISPLAY
===================================================== */

document.getElementById(
    "studentName"
).textContent =
    studentName;


document.getElementById(
    "studentUsername"
).textContent =
    studentUsername
    ||
    "Not available";


document.getElementById(
    "studentYear"
).textContent =
    studentYear
    ||
    "Not available";


document.getElementById(
    "accessType"
).textContent =

    isAdmin

    ?

    "All Student Reports"

    :

    "My Reports";


if(isAdmin){

    document.getElementById(
        "adminBadge"
    ).innerHTML =
        "<span class='admin-badge'>ADMIN</span>";

}


/* =====================================================
   REPORT ARRAYS
===================================================== */

let localReports = [];

let googleReports = [];

let studentResults = [];


/* =====================================================
   LOAD LOCAL REPORTS
===================================================== */

function loadLocalReports(){

    try{

        const saved =
            localStorage.getItem(
                "studentReports"
            );


        if(!saved){

            return [];

        }


        const parsed =
            JSON.parse(saved);


        if(!Array.isArray(parsed)){

            return [];

        }


        return parsed;

    }
    catch(error){

        console.error(
            "Local report error:",
            error
        );

        return [];

    }

}


/* =====================================================
   GOOGLE JSONP CALLBACK
===================================================== */

window.handleAssessmentResults =
function(data){

    try{

        if(!Array.isArray(data)){

            googleReports = [];

            mergeReports();

            return;

        }


        /*
         * IMPORTANT:
         *
         * ADMIN:
         * ALL reports are loaded.
         *
         * STUDENT:
         * only their own reports are loaded.
         */

        if(isAdmin){

            googleReports =
                data;

        }
        else{

            googleReports =
                data.filter(
                    function(row){

                        const username =
                            String(

                                row["Username"]

                                ||

                                row.username

                                ||

                                row.studentUsername

                                ||

                                ""

                            )
                            .trim()
                            .toLowerCase();


                        return (

                            username ===
                            normalizedUsername

                        );

                    }
                );

        }


        mergeReports();

    }
    catch(error){

        console.error(
            "Google report error:",
            error
        );

        googleReports = [];

        mergeReports();

    }

};


/* =====================================================
   LOAD GOOGLE RESULTS
===================================================== */

function loadGoogleReports(){

    const oldScript =
        document.getElementById(
            "googleResultsScript"
        );


    if(oldScript){

        oldScript.remove();

    }


    const script =
        document.createElement(
            "script"
        );


    script.id =
        "googleResultsScript";


    script.src =

        GOOGLE_SCRIPT_URL

        +

        "?action=getResults"

        +

        "&callback=handleAssessmentResults"

        +

        "&_="

        +

        Date.now();


    script.onerror =
    function(){

        const error =
            document.getElementById(
                "error"
            );


        error.style.display =
            "block";


        error.textContent =
            "Google Sheet reports could not be loaded.";

        mergeReports();

    };


    document.body.appendChild(
        script
    );

}


/* =====================================================
   MERGE REPORTS
===================================================== */

function mergeReports(){

    const combined = [];


    /* LOCAL */

    localReports.forEach(
        function(report){

            combined.push(
                normalizeReport(
                    report,
                    "local"
                )
            );

        }
    );


    /* GOOGLE */

    googleReports.forEach(
        function(report){

            combined.push(
                normalizeReport(
                    report,
                    "google"
                )
            );

        }
    );


    /*
     * Remove invalid reports.
     */

    const validReports =
        combined.filter(
            function(report){

                return (
                    report.day > 0
                );

            }
        );


    /*
     * Remove duplicates.
     *
     * ADMIN:
     * Student + Day
     *
     * STUDENT:
     * Username + Day
     */

    const reportMap =
        new Map();


    validReports.forEach(
        function(report){

            let identity;


            if(isAdmin){

                identity =
                    String(

                        report.username

                        ||

                        report.name

                        ||

                        "unknown"

                    )
                    .trim()
                    .toLowerCase();

            }
            else{

                identity =
                    normalizedUsername;

            }


            const key =
                identity
                +
                "_day_"
                +
                report.day;


            if(
                !reportMap.has(key)
            ){

                reportMap.set(
                    key,
                    report
                );

            }
            else{

                const existing =
                    reportMap.get(key);


                /*
                 * Prefer report with
                 * detailed answers.
                 */

                if(

                    report.answers.length
                    >

                    existing.answers.length

                ){

                    reportMap.set(
                        key,
                        report
                    );

                }

            }

        }
    );


    studentResults =
        Array.from(
            reportMap.values()
        );


    /* SORT */

    studentResults.sort(
        function(a,b){

            if(isAdmin){

                const nameA =
                    String(
                        a.name || ""
                    )
                    .toLowerCase();


                const nameB =
                    String(
                        b.name || ""
                    )
                    .toLowerCase();


                if(
                    nameA < nameB
                ){

                    return -1;

                }


                if(
                    nameA > nameB
                ){

                    return 1;

                }

            }


            return (

                Number(a.day)
                -
                Number(b.day)

            );

        }
    );


    window.studentResults =
        studentResults;


    displayReports();

}


/* =====================================================
   NORMALIZE REPORT
===================================================== */

function normalizeReport(
    row,
    source
){

    /* DAY */

    const rawDay =

        row.day

        ??

        row.Day

        ??

        row.assessmentDay

        ??

        row.assignedDay

        ??

        "";


    const dayText =
        String(
            rawDay
        ).trim();


    const dayMatch =
        dayText.match(
            /\d+/
        );


    const day =

        dayMatch

        ?

        parseInt(
            dayMatch[0],
            10
        )

        :

        0;


    /* NAME */

    let name =

        String(

            row.name

            ??

            row.Name

            ??

            row.studentName

            ??

            row.StudentName

            ??

            ""

        ).trim();


    /* USERNAME */

    let username =

        String(

            row.username

            ??

            row.Username

            ??

            row.studentUsername

            ??

            row.StudentUsername

            ??

            ""

        ).trim();


    /*
     * Name and username should
     * be the same when one is missing.
     */

    if(
        !name
        &&
        username
    ){

        name =
            username;

    }


    if(
        !username
        &&
        name
    ){

        username =
            name;

    }


    /*
     * Student fallback.
     */

    if(!isAdmin){

        if(!name){

            name =
                studentName;

        }


        if(!username){

            username =
                studentUsername;

        }

    }


    /* YEAR */

    const year =

        String(

            row.year

            ??

            row.Year

            ??

            row.studentYear

            ??

            row.StudentYear

            ??

            (!isAdmin
                ?
                studentYear
                :
                "")

            ??

            ""

        ).trim();


    /* TOPIC */

    const topic =

        String(

            row.topic

            ??

            row.Topic

            ??

            "Java Placement Practice"

        ).trim();


    /* SCORES */

    let mcqScore =

        row.mcqScore

        ??

        row.MCQScore

        ??

        "";


    let errorScore =

        row.errorScore

        ??

        row.ErrorScore

        ??

        "";


    let codingScore =

        row.codingScore

        ??

        row.CodingScore

        ??

        "";


    let totalScore =

        row.totalScore

        ??

        row.TotalScore

        ??

        "";


    let percentage =

        row.percentage

        ??

        row.Percentage

        ??

        "";


    /*
     * Google Sheet stores
     * MCQ + Error together.
     */

    if(

        mcqScore === ""

        &&

        errorScore === ""

    ){

        const objectiveText =

            String(

                row["MCQ + Error"]

                ??

                "0"

            );


        const match =

            objectiveText.match(
                /-?\d+(?:\.\d+)?/
            );


        mcqScore =

            match

            ?

            Number(
                match[0]
            )

            :

            0;


        errorScore =
            0;

    }


    mcqScore =
        parseReportNumber(
            mcqScore
        );


    errorScore =
        parseReportNumber(
            errorScore
        );


    codingScore =
        parseReportNumber(
            codingScore
        );


    totalScore =
        parseReportNumber(
            totalScore
        );


    /*
     * Calculate total if missing.
     */

    if(

        totalScore === 0

        &&

        (
            mcqScore > 0
            ||
            errorScore > 0
            ||
            codingScore > 0
        )

    ){

        totalScore =

            mcqScore
            +
            errorScore
            +
            codingScore;

    }


    /*
     * Percentage.
     */

    if(

        percentage === ""

        ||

        percentage === null

        ||

        percentage === undefined

    ){

        percentage =

            totalScore
            /
            15
            *
            100;

    }
    else{

        percentage =

            parseReportNumber(

                String(
                    percentage
                )
                .replace(
                    "%",
                    ""
                )

            );

    }


    /* ANSWERS */

    let answers =

        row.answers

        ??

        row.Answers

        ??

        [];


    if(
        typeof answers === "string"
    ){

        try{

            answers =
                JSON.parse(
                    answers
                );

        }
        catch(error){

            answers = [];

        }

    }


    if(
        !Array.isArray(
            answers
        )
    ){

        answers = [];

    }


    /* CODING EVALUATION */

    let codingEvaluations =

        row.codingEvaluations

        ??

        row["Coding Evaluation"]

        ??

        [];


    if(
        typeof codingEvaluations === "string"
    ){

        try{

            codingEvaluations =
                JSON.parse(
                    codingEvaluations
                );

        }
        catch(error){

            /* Keep original value */

        }

    }


    /* DATE */

    const submittedAt =

        row.submittedAt

        ??

        row["Submission Date"]

        ??

        row.submissionDate

        ??

        "";


    /* STATUS */

    const status =

        String(

            row.status

            ??

            row.Status

            ??

            "Completed"

        ).trim();


    return {

        source:source,

        name:name,

        username:username,

        year:year,

        day:day,

        topic:topic,

        mcqScore:mcqScore,

        errorScore:errorScore,

        codingScore:codingScore,

        totalScore:totalScore,

        percentage:percentage,

        status:status,

        submittedAt:submittedAt,

        answers:answers,

        codingEvaluations:codingEvaluations

    };

}


/* =====================================================
   NUMBER HELPER
===================================================== */

function parseReportNumber(
    value
){

    if(

        value === null

        ||

        value === undefined

        ||

        value === ""

    ){

        return 0;

    }


    const match =

        String(value).match(
            /-?\d+(?:\.\d+)?/
        );


    return match

        ?

        Number(
            match[0]
        )

        :

        0;

}


/* =====================================================
   DISPLAY REPORTS
===================================================== */

function displayReports(){

    const loading =
        document.getElementById(
            "loading"
        );


    const area =
        document.getElementById(
            "reportArea"
        );


    const body =
        document.getElementById(
            "reportBody"
        );


    loading.style.display =
        "none";


    area.style.display =
        "block";


    body.innerHTML =
        "";


    if(
        studentResults.length === 0
    ){

        body.innerHTML =

            "<tr>" +

            "<td colspan='12' class='no-report'>" +

            (

                isAdmin

                ?

                "No student assessment reports found in Google Sheet."

                :

                "No assessment reports found."

            )

            +

            "</td>" +

            "</tr>";


        return;

    }


    studentResults.forEach(
        function(
            report,
            index
        ){

            const objective =

                Number(
                    report.mcqScore
                )

                +

                Number(
                    report.errorScore
                );


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML =

                "<td>" +

                escapeHTML(
                    report.name
                ) +

                "</td>" +


                "<td>" +

                escapeHTML(
                    report.username
                ) +

                "</td>" +


                "<td>" +

                escapeHTML(
                    report.year
                ) +

                "</td>" +


                "<td>Day " +

                escapeHTML(
                    report.day
                ) +

                "</td>" +


                "<td>" +

                escapeHTML(
                    report.topic
                ) +

                "</td>" +


                "<td>" +

                objective +

                "/12" +

                "</td>" +


                "<td>" +

                report.codingScore +

                "/3" +

                "</td>" +


                "<td>" +

                report.totalScore +

                "/15" +

                "</td>" +


                "<td>" +

                Number(
                    report.percentage
                ).toFixed(2) +

                "%" +

                "</td>" +


                "<td>" +

                escapeHTML(
                    report.status
                ) +

                "</td>" +


                "<td>" +

                escapeHTML(
                    formatDate(
                        report.submittedAt
                    )
                ) +

                "</td>" +


                "<td>" +

                "<button " +

                "class='view-btn' " +

                "onclick='openReport(" +

                index +

                ")'>" +

                "View" +

                "</button>" +

                "</td>";


            body.appendChild(
                tr
            );

        }
    );


    const success =
        document.getElementById(
            "success"
        );


    success.style.display =
        "block";


    success.textContent =

        studentResults.length

        +

        " assessment report"

        +

        (

            studentResults.length === 1

            ?

            ""

            :

            "s"

        )

        +

        " found.";

}


/* =====================================================
   OPEN REPORT
===================================================== */

function openReport(
    index
){

    const report =
        window.studentResults[
            index
        ];


    if(!report){

        return;

    }


    const objective =

        Number(
            report.mcqScore || 0
        )

        +

        Number(
            report.errorScore || 0
        );


    const coding =

        Number(
            report.codingScore || 0
        );


    const total =

        Number(
            report.totalScore || 0
        );


    const percentage =

        Number(
            report.percentage || 0
        );


    document.getElementById(
        "modalObjective"
    ).textContent =

        objective +
        "/12";


    document.getElementById(
        "modalCoding"
    ).textContent =

        coding +
        "/3";


    document.getElementById(
        "modalTotal"
    ).textContent =

        total +
        "/15";


    document.getElementById(
        "modalPercentage"
    ).textContent =

        percentage.toFixed(2) +
        "%";


    document.getElementById(
        "modalStudent"
    ).innerHTML =

        "<b>Name:</b> " +

        escapeHTML(
            report.name ||
            "Not available"
        ) +

        "<br>" +


        "<b>Username:</b> " +

        escapeHTML(
            report.username ||
            "Not available"
        ) +

        "<br>" +


        "<b>Year:</b> " +

        escapeHTML(
            report.year ||
            "Not available"
        ) +

        "<br>" +


        "<b>Day:</b> Day " +

        escapeHTML(
            report.day
        ) +

        "<br>" +


        "<b>Topic:</b> " +

        escapeHTML(
            report.topic
        ) +

        "<br>" +


        "<b>Status:</b> " +

        escapeHTML(
            report.status
        ) +

        "<br>" +


        "<b>Submitted:</b> " +

        escapeHTML(
            formatDate(
                report.submittedAt
            )
        );


    displayAnswerDetails(
        report
    );


    document.getElementById(
        "reportModal"
    ).style.display =
        "block";

}


/* =====================================================
   ANSWER DETAILS
===================================================== */

function displayAnswerDetails(
    report
){

    const details =
        document.getElementById(
            "modalDetails"
        );


    details.innerHTML =
        "<h2>Answer Details</h2>";


    const answers =

        Array.isArray(
            report.answers
        )

        ?

        report.answers

        :

        [];


    if(
        answers.length === 0
    ){

        details.innerHTML +=

            "<div class='answer-box'>" +

            "<p><b>Assessment submitted successfully.</b></p>" +

            "<p>" +

            "Detailed answers are not available " +

            "for this stored report." +

            "</p>" +

            "</div>";


        return;

    }


    answers.forEach(
        function(
            answer,
            index
        ){

            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "answer-box";


            const type =

                String(

                    answer.type

                    ||

                    answer.Type

                    ||

                    ""

                ).toUpperCase();


            const question =

                answer.question

                ||

                answer.Question

                ||

                "Question " +
                (index + 1);


            const studentAnswer =

                answer.studentAnswer

                ??

                answer.answer

                ??

                answer.code

                ??

                "Not Answered";


            const correctAnswer =

                answer.correctAnswer

                ??

                answer.correct

                ??

                "";


            const status =

                answer.status

                ||

                "Not evaluated";


            const score =

                answer.score

                ??

                0;


            let statusClass =
                "wrong";


            const statusText =
                String(
                    status
                ).toLowerCase();


            if(

                statusText.includes(
                    "correct"
                )

                &&

                !statusText.includes(
                    "incorrect"
                )

            ){

                statusClass =
                    "correct";

            }


            if(

                statusText.includes(
                    "partial"
                )

            ){

                statusClass =
                    "partial";

            }


            let html =

                "<h3>" +

                "Q" +

                (index + 1) +

                ". " +

                escapeHTML(
                    question
                ) +

                "</h3>" +


                "<p>" +

                "<b>Type:</b> " +

                escapeHTML(
                    type
                ) +

                "</p>";


            if(
                type === "CODING"
            ){

                html +=

                    "<p><b>Your Java Code:</b></p>" +

                    "<pre class='answer-code'>" +

                    escapeHTML(
                        studentAnswer
                    ) +

                    "</pre>";

            }
            else{

                html +=

                    "<p><b>Your Answer:</b> " +

                    escapeHTML(
                        studentAnswer
                    ) +

                    "</p>";

            }


            if(
                correctAnswer !== ""
            ){

                html +=

                    "<p><b>Correct Answer:</b> " +

                    escapeHTML(
                        correctAnswer
                    ) +

                    "</p>";

            }


            html +=

                "<p class='" +

                statusClass +

                "'>" +

                "<b>Status:</b> " +

                escapeHTML(
                    status
                ) +

                "</p>" +


                "<p><b>Score:</b> " +

                escapeHTML(
                    score
                ) +

                "</p>";


            box.innerHTML =
                html;


            details.appendChild(
                box
            );

        }
    );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
    value
){

    if(!value){

        return "Not available";

    }


    const date =
        new Date(
            value
        );


    if(

        isNaN(
            date.getTime()
        )

    ){

        return String(
            value
        );

    }


    return date.toLocaleString();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

    document.getElementById(
        "reportModal"
    ).style.display =
        "none";

}


window.onclick =
function(event){

    const modal =
        document.getElementById(
            "reportModal"
        );


    if(
        event.target === modal
    ){

        closeModal();

    }

};

    ).style.display =

    ).style.display =

    document.getElementById(

    ).style.display =

        "error"
    ).style.display =

        loadLocalReports();

    /*

     */

    mergeReports();


    /*
     * Then get latest Google Sheet data.
     */

    loadGoogleReports();

}

startReports();
