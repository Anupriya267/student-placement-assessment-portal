<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student Reports</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f4f6fb;
}

.container{
    max-width:1100px;
    margin:auto;
}

.header{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
    margin-bottom:20px;
}

.header h1{
    margin-top:0;
}

.info{
    color:#555;
    line-height:1.7;
}

.loading{
    background:white;
    padding:25px;
    border-radius:10px;
    text-align:center;
}

.error{
    background:#fff1f1;
    border:1px solid #e0aaaa;
    padding:18px;
    border-radius:10px;
    color:#a00000;
}

.success{
    background:#effaf0;
    border:1px solid #a8d5aa;
    padding:15px;
    border-radius:10px;
    color:#17651b;
    margin-bottom:15px;
}

.table-container{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
    white-space:nowrap;
}

th{
    background:#eeeeee;
}

tr:hover{
    background:#f8f8f8;
}

.completed{
    font-weight:bold;
}

.view-btn{
    background:#2864d7;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
}

.view-btn:hover{
    background:#1e4fae;
}

.back-btn{
    background:#555;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:7px;
    cursor:pointer;
    margin-top:15px;
}

.modal{
    display:none;
    position:fixed;
    z-index:999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.55);
    overflow:auto;
}

.modal-content{
    background:white;
    width:90%;
    max-width:850px;
    margin:40px auto;
    padding:25px;
    border-radius:12px;
}

.close{
    float:right;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
}

.summary-box{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:20px 0;
}

.summary-item{
    background:#f1f5ff;
    padding:15px;
    border-radius:8px;
    text-align:center;
}

.summary-value{
    font-size:24px;
    font-weight:bold;
    margin-top:5px;
}

.answer-box{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin:12px 0;
}

.answer-code{
    background:#f4f4f4;
    padding:12px;
    border-radius:6px;
    white-space:pre-wrap;
    font-family:Consolas,monospace;
    overflow:auto;
}

.correct{
    color:green;
    font-weight:bold;
}

.wrong{
    color:red;
    font-weight:bold;
}

.partial{
    color:#c47a00;
    font-weight:bold;
}

@media(max-width:700px){

    .summary-box{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

<h1>Student Reports</h1>

<div class="info">

Student:
<b id="studentName">Loading...</b>

<br>

Username:
<b id="studentUsername">Loading...</b>

<br>

Year:
<b id="studentYear">Loading...</b>

</div>


<button
class="back-btn"
onclick="goBack()">

Back to Dashboard

</button>

</div>


<!-- =====================================================
     LOADING
===================================================== -->

<div id="loading"
     class="loading">

Loading reports...

</div>


<!-- =====================================================
     ERROR
===================================================== -->

<div id="error"
     class="error"
     style="display:none;">

</div>


<!-- =====================================================
     SUCCESS
===================================================== -->

<div id="success"
     class="success"
     style="display:none;">

</div>


<!-- =====================================================
     REPORT TABLE
===================================================== -->

<div id="reportArea"
     class="table-container"
     style="display:none;">

<table>

<thead>

<tr>

<th>Day</th>

<th>Topic</th>

<th>MCQ + Error</th>

<th>Coding</th>

<th>Total</th>

<th>Percentage</th>

<th>Status</th>

<th>Date</th>

<th>Report</th>

</tr>

</thead>


<tbody id="reportBody">

</tbody>

</table>

</div>


</div>


<!-- =====================================================
     REPORT MODAL
===================================================== -->

<div id="reportModal"
     class="modal">

<div class="modal-content">


<span
class="close"
onclick="closeModal()">

&times;

</span>


<h2>Assessment Report</h2>


<div id="modalStudent"></div>


<div class="summary-box">


<div class="summary-item">

<div>MCQ + Error</div>

<div
class="summary-value"
id="modalObjective">

0/12

</div>

</div>


<div class="summary-item">

<div>Coding</div>

<div
class="summary-value"
id="modalCoding">

0/3

</div>

</div>


<div class="summary-item">

<div>Total</div>

<div
class="summary-value"
id="modalTotal">

0/15

</div>

</div>


<div class="summary-item">

<div>Percentage</div>

<div
class="summary-value"
id="modalPercentage">

0%

</div>

</div>


</div>


<div id="modalDetails"></div>


</div>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxrrb6gSB12hmilk7j5BEWqeOmSAJad9Zi-ZbpaoS1kaJRHhUAoDh02-teDu2O_hbSnRA/exec";


/* =====================================================
   STUDENT INFORMATION
===================================================== */

function getLoggedStudent(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "loggedInStudent"
            )
            ||
            "null"
        );

    }
    catch(error){

        return null;

    }

}


const loggedStudent =
getLoggedStudent();


/* =====================================================
   NORMALIZE STUDENT IDENTITY
===================================================== */

const studentName =
    loggedStudent?.name
    ||
    loggedStudent?.Name
    ||
    localStorage.getItem("studentName")
    ||
    "Student";


const studentUsername =
    loggedStudent?.username
    ||
    loggedStudent?.Username
    ||
    localStorage.getItem("studentUsername")
    ||
    "";


const studentYear =
    loggedStudent?.year
    ||
    loggedStudent?.Year
    ||
    localStorage.getItem("studentYear")
    ||
    "";


const normalizedUsername =
    String(studentUsername)
    .trim()
    .toLowerCase();


/* =====================================================
   DISPLAY STUDENT
===================================================== */

document.getElementById(
    "studentName"
).textContent =
    studentName;


document.getElementById(
    "studentUsername"
).textContent =
    studentUsername;


document.getElementById(
    "studentYear"
).textContent =
    studentYear;


/* =====================================================
   STORAGE
===================================================== */

let localReports = [];

let googleReports = [];

let studentResults = [];


/* =====================================================
   READ LOCAL REPORTS
===================================================== */

function loadLocalReports(){

    try{

        const saved =
            localStorage.getItem(
                "studentReports"
            );


        if(!saved){

            return [];

        }


        const parsed =
            JSON.parse(saved);


        if(!Array.isArray(parsed)){

            return [];

        }


        return parsed.filter(
            function(report){

                const username =
                    String(
                        report.username
                        ||
                        report.Username
                        ||
                        ""
                    )
                    .trim()
                    .toLowerCase();


                return (
                    username ===
                    normalizedUsername
                );

            }
        );

    }
    catch(error){

        console.error(
            "Local reports error:",
            error
        );

        return [];

    }

}


/* =====================================================
   GOOGLE JSONP CALLBACK
===================================================== */

window.handleAssessmentResults =
function(data){

    try{

        if(!Array.isArray(data)){

            throw new Error(
                "Invalid Google Sheet result data."
            );

        }


        googleReports =
            data.filter(
                function(row){

                    const username =
                        String(
                            row["Username"]
                            ||
                            row.username
                            ||
                            ""
                        )
                        .trim()
                        .toLowerCase();


                    return (
                        username ===
                        normalizedUsername
                    );

                }
            );


        mergeReports();

    }
    catch(error){

        console.error(
            error
        );


        mergeReports();

    }

};


/* =====================================================
   LOAD GOOGLE RESULTS
===================================================== */

function loadGoogleReports(){

    const oldScript =
        document.getElementById(
            "googleResultsScript"
        );


    if(oldScript){

        oldScript.remove();

    }


    const script =
        document.createElement(
            "script"
        );


    script.id =
        "googleResultsScript";


    script.src =
        GOOGLE_SCRIPT_URL
        +
        "?action=getResults"
        +
        "&callback=handleAssessmentResults"
        +
        "&_="
        +
        Date.now();


    script.onerror =
        function(){

            console.warn(
                "Google Sheet could not be loaded."
            );


            mergeReports();

        };


    document.body.appendChild(
        script
    );

}


/* =====================================================
   MERGE LOCAL + GOOGLE RESULTS
===================================================== */

function mergeReports(){

    const combined = [];


    /* LOCAL FIRST */

    localReports.forEach(
        function(report){

            combined.push(
                normalizeReport(
                    report,
                    "local"
                )
            );

        }
    );


    /* GOOGLE RESULTS */

    googleReports.forEach(
        function(report){

            combined.push(
                normalizeReport(
                    report,
                    "google"
                )
            );

        }
    );


    /*
       Remove duplicate student/day reports.
       Local report is preferred because it is
       immediately available after submission.
    */

    const map =
        new Map();


    combined.forEach(
        function(report){

            const key =
                normalizedUsername
                +
                "_"
                +
                String(
                    report.day
                );


            if(!map.has(key)){

                map.set(
                    key,
                    report
                );

            }
            else{

                const existing =
                    map.get(key);


                /*
                   Prefer Google if it has
                   actual Answers data,
                   otherwise keep local.
                */

                if(
                    report.source === "google"
                    &&
                    report.answers
                    &&
                    report.answers.length
                ){

                    map.set(
                        key,
                        report
                    );

                }

            }

        }
    );


    studentResults =
        Array.from(
            map.values()
        );


    studentResults.sort(
        function(a,b){

            return (
                Number(a.day || 0)
                -
                Number(b.day || 0)
            );

        }
    );


    displayReports();

}


/* =====================================================
   NORMALIZE REPORT
===================================================== */

function normalizeReport(
    row,
    source
){

    const day =
        parseInt(
            row.day
            ||
            row.Day
            ||
            0,
            10
        );


    const topic =
        row.topic
        ||
        row.Topic
        ||
        "Java Placement Practice";


    let mcqScore =
        row.mcqScore;


    let errorScore =
        row.errorScore;


    let codingScore =
        row.codingScore;


    let totalScore =
        row.totalScore;


    let percentage =
        row.percentage;


    /* GOOGLE FORMAT */

    if(
        mcqScore === undefined
        &&
        errorScore === undefined
    ){

        const objective =
            String(
                row["MCQ + Error"]
                ||
                "0"
            );


        const match =
            objective.match(
                /[\d.]+/
            );


        mcqScore =
            match
            ?
            parseFloat(match[0])
            :
            0;


        errorScore = 0;

    }


    if(codingScore === undefined){

        const coding =
            String(
                row.Coding
                ||
                "0"
            );


        const match =
            coding.match(
                /[\d.]+/
            );


        codingScore =
            match
            ?
            parseFloat(match[0])
            :
            0;

    }


    if(totalScore === undefined){

        const total =
            String(
                row.Total
                ||
                ""
            );


        const match =
            total.match(
                /[\d.]+/
            );


        if(match){

            totalScore =
                parseFloat(
                    match[0]
                );

        }
        else{

            totalScore =
                Number(mcqScore || 0)
                +
                Number(errorScore || 0)
                +
                Number(codingScore || 0);

        }

    }


    if(percentage === undefined){

        const p =
            String(
                row.Percentage
                ||
                ""
            )
            .replace(
                "%",
                ""
            );


        percentage =
            parseFloat(p);


        if(isNaN(percentage)){

            percentage =
                (
                    Number(totalScore || 0)
                    /
                    15
                    *
                    100
                ).toFixed(2);

        }

    }


    let answers =
        row.answers
        ||
        row.Answers
        ||
        [];


    if(typeof answers === "string"){

        try{

            answers =
                JSON.parse(
                    answers
                );

        }
        catch(error){

            answers = [];

        }

    }


    return {

        source:
            source,

        day:
            day,

        topic:
            topic,

        mcqScore:
            Number(
                mcqScore || 0
            ),

        errorScore:
            Number(
                errorScore || 0
            ),

        codingScore:
            Number(
                codingScore || 0
            ),

        totalScore:
            Number(
                totalScore || 0
            ),

        percentage:
            Number(
                percentage || 0
            ),

        status:
            row.status
            ||
            row.Status
            ||
            "Completed",

        submittedAt:
            row.submittedAt
            ||
            row["Submission Date"]
            ||
            "",

        answers:
            Array.isArray(answers)
            ?
            answers
            :
            [],

        codingEvaluations:
            row.codingEvaluations
            ||
            row["Coding Evaluation"]
            ||
            []

    };

}


/* =====================================================
   DISPLAY REPORTS
===================================================== */

function displayReports(){

    const loading =
        document.getElementById(
            "loading"
        );


    const reportArea =
        document.getElementById(
            "reportArea"
        );


    const body =
        document.getElementById(
            "reportBody"
        );


    loading.style.display =
        "none";


    reportArea.style.display =
        "block";


    body.innerHTML =
        "";


    if(studentResults.length === 0){

        body.innerHTML =

            "<tr>" +

            "<td colspan='9' " +
            "style='text-align:center'>" +

            "No assessment reports found."

            +

            "</td>" +

            "</tr>";


        return;

    }


    studentResults.forEach(
        function(report,index){

            const tr =
                document.createElement(
                    "tr"
                );


            const objective =
                report.mcqScore
                +
                report.errorScore;


            tr.innerHTML =

                "<td>Day " +
                escapeHTML(
                    report.day
                ) +
                "</td>"


                +

                "<td>" +
                escapeHTML(
                    report.topic
                ) +
                "</td>"


                +

                "<td>" +
                escapeHTML(
                    objective +
                    "/12"
                ) +
                "</td>"


                +

                "<td>" +
                escapeHTML(
                    report.codingScore +
                    "/3"
                ) +
                "</td>"


                +

                "<td>" +
                escapeHTML(
                    report.totalScore +
                    "/15"
                ) +
                "</td>"


                +

                "<td>" +
                escapeHTML(
                    Number(
                        report.percentage
                    ).toFixed(2)
                    +
                    "%"
                ) +
                "</td>"


                +

                "<td class='completed'>" +
                escapeHTML(
                    report.status
                ) +
                "</td>"


                +

                "<td>" +
                escapeHTML(
                    formatDate(
                        report.submittedAt
                    )
                ) +
                "</td>"


                +

                "<td>" +

                "<button " +

                "class='view-btn' " +

                "onclick='openReport(" +
                index +
                ")'>" +

                "View" +

                "</button>" +

                "</td>";


            body.appendChild(
                tr
            );

        }
    );


    window.studentResults =
        studentResults;


    const success =
        document.getElementById(
            "success"
        );


    success.style.display =
        "block";


    success.textContent =
        studentResults.length
        +
        " assessment report"
        +
        (
            studentResults.length === 1
            ?
            ""
            :
            "s"
        )
        +
        " found.";

}


/* =====================================================
   OPEN REPORT
===================================================== */

function openReport(index){

    const report =
        studentResults[index];


    if(!report){

        return;

    }


    const objective =
        report.mcqScore
        +
        report.errorScore;


    document.getElementById(
        "modalObjective"
    ).textContent =
        objective + "/12";


    document.getElementById(
        "modalCoding"
    ).textContent =
        report.codingScore + "/3";


    document.getElementById(
        "modalTotal"
    ).textContent =
        report.totalScore + "/15";


    document.getElementById(
        "modalPercentage"
    ).textContent =
        Number(
            report.percentage
        ).toFixed(2)
        +
        "%";


    document.getElementById(
        "modalStudent"
    ).innerHTML =

        "<p>" +

        "<b>Name:</b> " +
        escapeHTML(
            studentName
        )

        +

        "<br>" +

        "<b>Username:</b> " +
        escapeHTML(
            studentUsername
        )

        +

        "<br>" +

        "<b>Year:</b> " +
        escapeHTML(
            studentYear
        )

        +

        "<br>" +

        "<b>Day:</b> " +
        escapeHTML(
            report.day
        )

        +

        "<br>" +

        "<b>Topic:</b> " +
        escapeHTML(
            report.topic
        )

        +

        "<br>" +

        "<b>Status:</b> " +
        escapeHTML(
            report.status
        )

        +

        "<br>" +

        "<b>Submitted:</b> " +
        escapeHTML(
            formatDate(
                report.submittedAt
            )
        )

        +

        "</p>";


    displayAnswerDetails(
        report
    );


    document.getElementById(
        "reportModal"
    ).style.display =
        "block";

}


/* =====================================================
   DISPLAY ANSWERS
===================================================== */

function displayAnswerDetails(report){

    const details =
        document.getElementById(
            "modalDetails"
        );


    details.innerHTML =
        "";


    const answers =
        report.answers;


    if(
        !Array.isArray(answers)
        ||
        answers.length === 0
    ){

        details.innerHTML =

            "<h3>Answer Details</h3>" +

            "<div class='answer-box'>" +

            "Detailed answers are not available."

            +

            "</div>";

        return;

    }


    answers.forEach(
        function(answer,index){

            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "answer-box";


            let statusClass =
                "wrong";


            if(
                answer.status ===
                "Correct"
                ||
                answer.status ===
                "Complete"
            ){

                statusClass =
                    "correct";

            }


            if(
                answer.status ===
                "Partially Correct"
            ){

                statusClass =
                    "partial";

            }


            let html =

                "<h3>" +

                "Q" +
                (index + 1) +

                ". " +

                escapeHTML(
                    answer.question
                    ||
                    ""
                ) +

                "</h3>";


            html +=

                "<p><b>Type:</b> " +

                escapeHTML(
                    answer.type
                    ||
                    ""
                ) +

                "</p>";


            html +=

                "<p><b>Your Answer:</b></p>";


            if(
                answer.type ===
                "CODING"
            ){

                html +=

                    "<pre class='answer-code'>" +

                    escapeHTML(
                        answer.studentAnswer
                        ||
                        "Not Answered"
                    ) +

                    "</pre>";

            }
            else{

                html +=

                    "<p>" +

                    escapeHTML(
                        answer.studentAnswer
                        ||
                        "Not Answered"
                    ) +

                    "</p>";

            }


            if(answer.correctAnswer){

                html +=

                    "<p><b>Correct Answer:</b> " +

                    escapeHTML(
                        answer.correctAnswer
                    ) +

                    "</p>";

            }


            html +=

                "<p class='" +
                statusClass +
                "'>" +

                escapeHTML(
                    answer.status
                    ||
                    ""
                ) +

                "</p>";


            html +=

                "<p><b>Score:</b> " +

                escapeHTML(
                    answer.score
                    !== undefined
                    ?
                    answer.score
                    :
                    "0"
                ) +

                "</p>";


            box.innerHTML =
                html;


            details.appendChild(
                box
            );

        }
    );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

    document.getElementById(
        "reportModal"
    ).style.display =
        "none";

}


/* =====================================================
   CLICK OUTSIDE MODAL
===================================================== */

window.onclick =
function(event){

    const modal =
        document.getElementById(
            "reportModal"
        );


    if(event.target === modal){

        closeModal();

    }

};


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

    if(!value){

        return "-";

    }


    const date =
        new Date(value);


    if(isNaN(date.getTime())){

        return String(value);

    }


    return date.toLocaleString();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   BACK TO DASHBOARD
===================================================== */

function goBack(){

    window.location.href =
        "student.html";

}


/* =====================================================
   START
===================================================== */

function startReports(){

    /*
       Load local reports immediately.
       This is important because the assessment
       has just saved the result locally.
    */

    localReports =
        loadLocalReports();


    /*
       Display immediately.
    */

    mergeReports();


    /*
       Then also fetch Google Sheet results.
    */

    loadGoogleReports();

}


startReports();


</script>

</body>

</html>
