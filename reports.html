<!DOCTYPE html>
<html>

<head>

    <title>Student Reports</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<div class="container">

    <h1>Student Reports</h1>

    <div class="card">

        <h2>Assessment Reports</h2>

        <div style="overflow-x:auto;">

            <table border="1" width="100%" cellpadding="8">

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Username</th>
                        <th>Year</th>
                        <th>Day</th>
                        <th>MCQ + Error</th>
                        <th>Coding</th>
                        <th>Total</th>
                        <th>Percentage</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="reportTable"></tbody>

            </table>

        </div>

    </div>


    <div class="card">

        <button onclick="backToAdmin()">
            Back to Admin Dashboard
        </button>

    </div>

</div>



<!-- ================= REPORT MODAL ================= -->

<div id="reportModal"
     style="
     display:none;
     position:fixed;
     top:0;
     left:0;
     width:100%;
     height:100%;
     background:rgba(0,0,0,0.6);
     overflow:auto;
     z-index:1000;
     ">

    <div style="
        background:white;
        width:90%;
        max-width:800px;
        margin:40px auto;
        padding:20px;
        border-radius:10px;
        ">

        <h2 id="modalTitle">
            Student Report
        </h2>

        <div id="reportDetails"></div>

        <br>

        <button onclick="downloadPDF()">
            Download PDF
        </button>

        <button onclick="closeReport()">
            Close
        </button>

    </div>

</div>



<script>


// ================= LOAD REPORTS =================

let reports =
    JSON.parse(
        localStorage.getItem("studentReports") || "[]"
    );


let selectedReport = null;



// ================= DISPLAY REPORTS =================

function displayReports(){

    const table =
        document.getElementById("reportTable");

    table.innerHTML = "";


    if(reports.length === 0){

        table.innerHTML =
            "<tr>" +
            "<td colspan='10'>" +
            "No student reports available yet." +
            "</td>" +
            "</tr>";

        return;

    }


    reports.forEach(function(report,index){

        const row =
            document.createElement("tr");


        // ================= MCQ + ERROR =================

        let objectiveScore =
            getObjectiveScore(report);


        // ================= CODING =================

        let codingScore = 0;


        if(report.codingScore !== undefined){

            codingScore =
                Number(report.codingScore) || 0;

        }


        // ================= TOTAL =================

        let totalScore =
            objectiveScore + codingScore;


        const totalQuestions = 15;


        // ================= PERCENTAGE =================

        let percentage =
            (totalScore / totalQuestions) * 100;


        percentage =
            percentage.toFixed(2);


        row.innerHTML =

            "<td>" +
            escapeHTML(report.name) +
            "</td>" +

            "<td>" +
            escapeHTML(report.username) +
            "</td>" +

            "<td>" +
            escapeHTML(report.year) +
            "</td>" +

            "<td>" +
            escapeHTML(report.day) +
            "</td>" +

            "<td>" +
            objectiveScore +
            "/12" +
            "</td>" +

            "<td>" +
            codingScore +
            "/3" +
            " - Pending" +
            "</td>" +

            "<td>" +
            totalScore +
            "/15" +
            "</td>" +

            "<td>" +
            percentage +
            "%" +
            "</td>" +

            "<td>" +
            escapeHTML(report.status) +
            "</td>" +

            "<td>" +

            "<button onclick='viewReport(" +
            index +
            ")'>" +

            "View Report" +

            "</button>" +

            "</td>";


        table.appendChild(row);

    });

}



// ================= OBJECTIVE SCORE =================

function getObjectiveScore(report){

    /*
       New reports may contain objectiveScore.
       Older reports may only contain score.
    */

    if(report.objectiveScore !== undefined){

        return Number(report.objectiveScore) || 0;

    }


    if(report.score !== undefined){

        /*
          Old reports were scored out of 12.
        */

        return Number(report.score) || 0;

    }


    return 0;

}



// ================= VIEW REPORT =================

function viewReport(index){

    selectedReport =
        reports[index];


    document.getElementById(
        "modalTitle"
    ).innerText =

        selectedReport.name +
        " - Day " +
        selectedReport.day;



    let objectiveScore =
        getObjectiveScore(selectedReport);


    let codingScore = 0;


    if(selectedReport.codingScore !== undefined){

        codingScore =
            Number(selectedReport.codingScore) || 0;

    }


    let totalScore =
        objectiveScore + codingScore;


    let percentage =
        ((totalScore / 15) * 100).toFixed(2);



    let html =

        "<h3>Student Details</h3>" +

        "<p><b>Name:</b> " +
        escapeHTML(selectedReport.name) +
        "</p>" +

        "<p><b>Username:</b> " +
        escapeHTML(selectedReport.username) +
        "</p>" +

        "<p><b>Year:</b> " +
        escapeHTML(selectedReport.year) +
        "</p>" +

        "<p><b>Day:</b> " +
        escapeHTML(selectedReport.day) +
        "</p>" +

        "<hr>" +

        "<h3>Assessment Score</h3>" +

        "<p><b>MCQ + Error Correction:</b> " +
        objectiveScore +
        " / 12</p>" +

        "<p><b>Coding:</b> " +
        codingScore +
        " / 3 - Pending Evaluation</p>" +

        "<p><b>TOTAL:</b> " +
        totalScore +
        " / 15</p>" +

        "<p><b>Percentage:</b> " +
        percentage +
        "%</p>" +

        "<p><b>Status:</b> " +
        escapeHTML(selectedReport.status) +
        "</p>" +

        "<p><b>Date:</b> " +
        escapeHTML(selectedReport.date) +
        "</p>" +

        "<hr>" +

        "<h3>Answer Sheet</h3>";



    // ================= ANSWERS =================

    if(
        !selectedReport.answers ||
        selectedReport.answers.length === 0
    ){

        html +=
            "<p>No answers available.</p>";

    }

    else{

        selectedReport.answers.forEach(
            function(answer,index){

                let answerStatus =
                    answer.status || "Pending";


                let correctAnswer =
                    answer.correctAnswer ||
                    "Coding evaluation pending";


                html +=

                    "<div style='" +

                    "border:1px solid #ddd;" +

                    "padding:12px;" +

                    "margin-bottom:10px;" +

                    "border-radius:6px;" +

                    "'>" +

                    "<b>Question " +
                    (index + 1) +
                    "</b><br><br>" +

                    "<b>Question:</b><br>" +

                    escapeHTML(
                        answer.question
                    ) +

                    "<br><br>" +

                    "<b>Student Answer:</b><br>" +

                    escapeHTML(
                        answer.studentAnswer
                    ) +

                    "<br><br>" +

                    "<b>Correct Answer:</b><br>" +

                    escapeHTML(
                        correctAnswer
                    ) +

                    "<br><br>" +

                    "<b>Status:</b> " +

                    escapeHTML(
                        answerStatus
                    ) +

                    "</div>";

            }
        );

    }



    document.getElementById(
        "reportDetails"
    ).innerHTML = html;


    document.getElementById(
        "reportModal"
    ).style.display = "block";

}



// ================= CLOSE REPORT =================

function closeReport(){

    document.getElementById(
        "reportModal"
    ).style.display = "none";

}



// ================= PDF =================

function downloadPDF(){

    if(!selectedReport){

        alert(
            "Please open a report first."
        );

        return;

    }


    const { jsPDF } =
        window.jspdf;


    const doc =
        new jsPDF();


    let y = 15;



    function addText(text){

        const lines =
            doc.splitTextToSize(
                String(text),
                175
            );


        if(
            y +
            lines.length * 7 >
            280
        ){

            doc.addPage();

            y = 15;

        }


        doc.text(
            lines,
            15,
            y
        );


        y +=
            lines.length * 7 + 3;

    }



    let objectiveScore =
        getObjectiveScore(
            selectedReport
        );


    let codingScore = 0;


    if(selectedReport.codingScore !== undefined){

        codingScore =
            Number(
                selectedReport.codingScore
            ) || 0;

    }


    let totalScore =
        objectiveScore +
        codingScore;


    let percentage =
        (
            (totalScore / 15) *
            100
        ).toFixed(2);



    doc.setFontSize(18);


    addText(
        "Student Placement Assessment Report"
    );


    doc.setFontSize(11);


    addText(
        "Name: " +
        selectedReport.name
    );


    addText(
        "Username: " +
        selectedReport.username
    );


    addText(
        "Year: " +
        selectedReport.year
    );


    addText(
        "Day: " +
        selectedReport.day
    );


    addText(
        "MCQ + Error Correction: " +
        objectiveScore +
        "/12"
    );


    addText(
        "Coding: " +
        codingScore +
        "/3 - Pending Evaluation"
    );


    addText(
        "TOTAL: " +
        totalScore +
        "/15"
    );


    addText(
        "Percentage: " +
        percentage +
        "%"
    );


    addText(
        "Status: " +
        selectedReport.status
    );


    addText(
        "Date: " +
        selectedReport.date
    );


    y += 5;


    addText(
        "ANSWER SHEET"
    );



    if(selectedReport.answers){

        selectedReport.answers.forEach(
            function(answer,index){

                addText(
                    "Question " +
                    (index + 1)
                );


                addText(
                    "Question: " +
                    answer.question
                );


                addText(
                    "Student Answer: " +
                    answer.studentAnswer
                );


                addText(
                    "Correct Answer: " +
                    (
                        answer.correctAnswer ||
                        "Coding evaluation pending"
                    )
                );


                addText(
                    "Status: " +
                    (
                        answer.status ||
                        "Pending"
                    )
                );


                y += 3;

            }
        );

    }



    doc.save(

        selectedReport.name.replace(
            /[^a-z0-9]/gi,
            "_"
        ) +

        "_Day_" +

        selectedReport.day +

        "_Report.pdf"

    );

}



// ================= BACK =================

function backToAdmin(){

    window.location.href =
        "admin.html";

}



// ================= SECURITY =================

function escapeHTML(value){

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ================= START =================

displayReports();


</script>

</body>

</html>
