<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student Reports</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f4f6fb;
}

.container{
    max-width:1100px;
    margin:auto;
}

.header{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
    margin-bottom:20px;
}

.header h1{
    margin-top:0;
}

.info{
    color:#555;
}

.loading{
    background:white;
    padding:25px;
    border-radius:10px;
    text-align:center;
}

.error{
    background:#fff1f1;
    border:1px solid #e0aaaa;
    padding:18px;
    border-radius:10px;
    color:#a00000;
}

.table-container{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
    white-space:nowrap;
}

th{
    background:#eeeeee;
}

tr:hover{
    background:#f8f8f8;
}

.completed{
    font-weight:bold;
}

.view-btn{
    background:#2864d7;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
}

.view-btn:hover{
    background:#1e4fae;
}

.back-btn{
    background:#555;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:7px;
    cursor:pointer;
    margin-top:15px;
}

.modal{
    display:none;
    position:fixed;
    z-index:999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.55);
    overflow:auto;
}

.modal-content{
    background:white;
    width:90%;
    max-width:850px;
    margin:40px auto;
    padding:25px;
    border-radius:12px;
}

.close{
    float:right;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
}

.summary-box{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:20px 0;
}

.summary-item{
    background:#f1f5ff;
    padding:15px;
    border-radius:8px;
    text-align:center;
}

.summary-value{
    font-size:24px;
    font-weight:bold;
    margin-top:5px;
}

.answer-box{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin:12px 0;
}

.answer-code{
    background:#f4f4f4;
    padding:12px;
    border-radius:6px;
    white-space:pre-wrap;
    font-family:Consolas,monospace;
    overflow:auto;
}

.correct{
    color:green;
    font-weight:bold;
}

.wrong{
    color:red;
    font-weight:bold;
}

.partial{
    color:#c47a00;
    font-weight:bold;
}

@media(max-width:700px){

    .summary-box{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>Student Reports</h1>

<div class="info">

Student:
<b id="studentName">Loading...</b>

<br>

Username:
<b id="studentUsername">Loading...</b>

<br>

Year:
<b id="studentYear">Loading...</b>

</div>

<button
class="back-btn"
onclick="goBack()">

Back to Dashboard

</button>

</div>


<div id="loading"
     class="loading">

Loading reports...

</div>


<div id="error"
     class="error"
     style="display:none;">

</div>


<div id="reportArea"
     class="table-container"
     style="display:none;">

<table>

<thead>

<tr>

<th>Day</th>

<th>Topic</th>

<th>MCQ + Error</th>

<th>Coding</th>

<th>Total</th>

<th>Percentage</th>

<th>Status</th>

<th>Date</th>

<th>Report</th>

</tr>

</thead>

<tbody id="reportBody">

</tbody>

</table>

</div>


</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div id="reportModal"
     class="modal">

<div class="modal-content">

<span
class="close"
onclick="closeModal()">

&times;

</span>


<h2>Assessment Report</h2>


<div id="modalStudent"></div>


<div class="summary-box">


<div class="summary-item">

<div>MCQ + Error</div>

<div
class="summary-value"
id="modalObjective">

0/12

</div>

</div>


<div class="summary-item">

<div>Coding</div>

<div
class="summary-value"
id="modalCoding">

0/3

</div>

</div>


<div class="summary-item">

<div>Total</div>

<div
class="summary-value"
id="modalTotal">

0/15

</div>

</div>


<div class="summary-item">

<div>Percentage</div>

<div
class="summary-value"
id="modalPercentage">

0%

</div>

</div>


</div>


<div id="modalDetails"></div>


</div>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzS_bzFzjBlBo_k6Jdm0w7qulI0PJypJglUqnYe4pnBXuj4p54A0iahIZfumbSrSzd3Ow/exec";


/* =====================================================
   STUDENT INFORMATION
===================================================== */

function getStudent(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "loggedInStudent"
            )
            ||
            "null"
        );

    }
    catch(e){

        return null;

    }

}


const loggedStudent =
getStudent();


const studentName =
loggedStudent?.name
||
loggedStudent?.Name
||
localStorage.getItem("studentName")
||
"Student";


const studentUsername =
loggedStudent?.username
||
loggedStudent?.Username
||
localStorage.getItem("studentUsername")
||
"";


const studentYear =
loggedStudent?.year
||
loggedStudent?.Year
||
localStorage.getItem("studentYear")
||
"";


document.getElementById(
    "studentName"
).textContent =
studentName;


document.getElementById(
    "studentUsername"
).textContent =
studentUsername;


document.getElementById(
    "studentYear"
).textContent =
studentYear;


/* =====================================================
   JSONP CALLBACK
===================================================== */

window.handleAssessmentResults =
function(data){

    try{

        if(
            !Array.isArray(data)
        ){

            throw new Error(
                "Invalid result data received."
            );

        }


        displayReports(data);

    }
    catch(error){

        showError(
            error.message
        );

    }

};


/* =====================================================
   LOAD GOOGLE RESULTS
===================================================== */

function loadReports(){

    /*
       Remove previous callback script
    */

    const oldScript =
        document.getElementById(
            "googleResultsScript"
        );


    if(oldScript){

        oldScript.remove();

    }


    const script =
        document.createElement(
            "script"
        );


    script.id =
        "googleResultsScript";


    script.src =
        GOOGLE_SCRIPT_URL
        +
        "?action=getResults"
        +
        "&callback=handleAssessmentResults"
        +
        "&_="
        +
        Date.now();


    script.onerror =
        function(){

            showError(
                "Unable to connect to Google Sheet. Please check the Apps Script deployment."
            );

        };


    document.body.appendChild(
        script
    );

}


/* =====================================================
   DISPLAY REPORTS
===================================================== */

function displayReports(
    allResults
){

    const loading =
        document.getElementById(
            "loading"
        );


    const reportArea =
        document.getElementById(
            "reportArea"
        );


    const body =
        document.getElementById(
            "reportBody"
        );


    /*
       Match username safely.
    */

    const myUsername =
        String(
            studentUsername
            ||
            ""
        )
        .trim()
        .toLowerCase();


    const myResults =
        allResults.filter(
            function(row){

                const username =
                    String(
                        row["Username"]
                        ||
                        row.username
                        ||
                        ""
                    )
                    .trim()
                    .toLowerCase();


                return (
                    username
                    ===
                    myUsername
                );

            }
        );


    /*
       Sort Day ascending.
    */

    myResults.sort(
        function(a,b){

            return (
                parseInt(
                    a["Day"]
                    ||
                    0,
                    10
                )
                -
                parseInt(
                    b["Day"]
                    ||
                    0,
                    10
                )
            );

        }
    );


    loading.style.display =
        "none";


    reportArea.style.display =
        "block";


    body.innerHTML =
        "";


    if(
        myResults.length === 0
    ){

        body.innerHTML =

        "<tr>" +

        "<td colspan='9' style='text-align:center'>" +

        "No assessment reports found."

        +

        "</td>" +

        "</tr>";

        return;

    }


    myResults.forEach(
        function(row,index){

            const day =
                getField(
                    row,
                    "Day"
                );


            const topic =
                getField(
                    row,
                    "Topic"
                )
                ||
                "Java Placement Practice";


            const objective =
                getObjectiveScore(
                    row
                );


            const coding =
                getCodingScore(
                    row
                );


            const total =
                getTotalScore(
                    row
                );


            const percentage =
                getPercentage(
                    row
                );


            const status =
                getField(
                    row,
                    "Status"
                )
                ||
                "Completed";


            const date =
                formatDate(
                    getField(
                        row,
                        "Submission Date"
                    )
                );


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML =

            "<td>Day "
            +
            escapeHTML(day)
            +
            "</td>"


            +

            "<td>"
            +
            escapeHTML(topic)
            +
            "</td>"


            +

            "<td>"
            +
            escapeHTML(
                objective
                +
                "/12"
            )
            +
            "</td>"


            +

            "<td>"
            +
            escapeHTML(
                coding
                +
                "/3"
            )
            +
            "</td>"


            +

            "<td>"
            +
            escapeHTML(
                total
                +
                "/15"
            )
            +
            "</td>"


            +

            "<td>"
            +
            escapeHTML(
                percentage
                +
                "%"
            )
            +
            "</td>"


            +

            "<td class='completed'>"
            +
            escapeHTML(
                status
            )
            +
            "</td>"


            +

            "<td>"
            +
            escapeHTML(
                date
            )
            +
            "</td>"


            +

            "<td>" +

            "<button class='view-btn' " +

            "onclick='openReport("
            +
            index
            +
            ")'>" +

            "View" +

            "</button>" +

            "</td>";


            body.appendChild(
                tr
            );

        }
    );


    /*
       Keep reports available to modal.
    */

    window.studentResults =
        myResults;

}


/* =====================================================
   GET FIELD
===================================================== */

function getField(
    row,
    field
){

    if(
        row[field] !== undefined
        &&
        row[field] !== null
    ){

        return String(
            row[field]
        );

    }


    return "";

}


/* =====================================================
   OBJECTIVE SCORE
===================================================== */

function getObjectiveScore(
    row
){

    const value =
        getField(
            row,
            "MCQ + Error"
        );


    if(!value){

        return "0";

    }


    /*
       Example:
       8/12
    */

    const match =
        value.match(
            /[\d.]+/
        );


    return match
        ? match[0]
        : "0";

}


/* =====================================================
   CODING SCORE
===================================================== */

function getCodingScore(
    row
){

    const value =
        getField(
            row,
            "Coding"
        );


    if(!value){

        return "0";

    }


    /*
       Example:
       2.5/3
    */

    const match =
        value.match(
            /[\d.]+/
        );


    return match
        ? match[0]
        : "0";

}


/* =====================================================
   TOTAL SCORE
===================================================== */

function getTotalScore(
    row
){

    const value =
        getField(
            row,
            "Total"
        );


    if(!value){

        const objective =
            parseFloat(
                getObjectiveScore(
                    row
                )
            )
            ||
            0;


        const coding =
            parseFloat(
                getCodingScore(
                    row
                )
            )
            ||
            0;


        return String(
            objective
            +
            coding
        );

    }


    const match =
        value.match(
            /[\d.]+/
        );


    return match
        ? match[0]
        : "0";

}


/* =====================================================
   PERCENTAGE
===================================================== */

function getPercentage(
    row
){

    let value =
        getField(
            row,
            "Percentage"
        );


    if(!value){

        const total =
            parseFloat(
                getTotalScore(
                    row
                )
            )
            ||
            0;


        return (
            total
            /
            15
            *
            100
        ).toFixed(2);

    }


    value =
        value.replace(
            "%",
            ""
        );


    const number =
        parseFloat(
            value
        );


    return isNaN(number)
        ? "0.00"
        : number.toFixed(2);

}


/* =====================================================
   OPEN REPORT
===================================================== */

function openReport(
    index
){

    const row =
        window.studentResults[
            index
        ];


    if(!row){

        return;

    }


    const objective =
        getObjectiveScore(
            row
        );


    const coding =
        getCodingScore(
            row
        );


    const total =
        getTotalScore(
            row
        );


    const percentage =
        getPercentage(
            row
        );


    const day =
        getField(
            row,
            "Day"
        );


    const topic =
        getField(
            row,
            "Topic"
        );


    const status =
        getField(
            row,
            "Status"
        )
        ||
        "Completed";


    const date =
        formatDate(
            getField(
                row,
                "Submission Date"
            )
        );


    document.getElementById(
        "modalObjective"
    ).textContent =
        objective
        +
        "/12";


    document.getElementById(
        "modalCoding"
    ).textContent =
        coding
        +
        "/3";


    document.getElementById(
        "modalTotal"
    ).textContent =
        total
        +
        "/15";


    document.getElementById(
        "modalPercentage"
    ).textContent =
        percentage
        +
        "%";


    document.getElementById(
        "modalStudent"
    ).innerHTML =

        "<p>" +

        "<b>Name:</b> "
        +
        escapeHTML(
            studentName
        )

        +

        "<br>" +

        "<b>Username:</b> "
        +
        escapeHTML(
            studentUsername
        )

        +

        "<br>" +

        "<b>Year:</b> "
        +
        escapeHTML(
            studentYear
        )

        +

        "<br>" +

        "<b>Day:</b> "
        +
        escapeHTML(
            day
        )

        +

        "<br>" +

        "<b>Topic:</b> "
        +
        escapeHTML(
            topic
        )

        +

        "<br>" +

        "<b>Status:</b> "
        +
        escapeHTML(
            status
        )

        +

        "<br>" +

        "<b>Submitted:</b> "
        +
        escapeHTML(
            date
        )

        +

        "</p>";


    displayAnswerDetails(
        row
    );


    document.getElementById(
        "reportModal"
    ).style.display =
        "block";

}


/* =====================================================
   DISPLAY ANSWERS
===================================================== */

function displayAnswerDetails(
    row
){

    const details =
        document.getElementById(
            "modalDetails"
        );


    details.innerHTML =
        "";


    let answers = [];


    const answerText =
        getField(
            row,
            "Answers"
        );


    if(answerText){

        try{

            answers =
                JSON.parse(
                    answerText
                );

        }
        catch(error){

            /*
               Older reports may contain
               plain text instead of JSON.
            */

            details.innerHTML =

                "<h3>Answer Details</h3>" +

                "<div class='answer-box'>" +

                "<pre class='answer-code'>"
                +
                escapeHTML(
                    answerText
                )
                +
                "</pre>" +

                "</div>";

        }

    }


    if(
        !Array.isArray(answers)
        ||
        answers.length === 0
    ){

        /*
           Show coding evaluation text
           if available.
        */

        const codingEvaluation =
            getField(
                row,
                "Coding Evaluation"
            );


        if(codingEvaluation){

            details.innerHTML +=

                "<h3>Coding Evaluation</h3>" +

                "<div class='answer-box'>" +

                "<pre class='answer-code'>"
                +
                escapeHTML(
                    codingEvaluation
                )
                +
                "</pre>" +

                "</div>";

        }


        return;

    }


    const title =
        document.createElement(
            "h3"
        );


    title.textContent =
        "Answer Details";


    details.appendChild(
        title
    );


    answers.forEach(
        function(answer,index){

            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "answer-box";


            const question =
                answer.question
                ||
                "";


            const type =
                String(
                    answer.type
                    ||
                    ""
                )
                .toUpperCase();


            const studentAnswer =
                answer.studentAnswer
                ||
                answer.answer
                ||
                "Not Answered";


            const status =
                answer.status
                ||
                "Wrong";


            const score =
                Number(
                    answer.score
                    ||
                    0
                );


            let html =

                "<b>Question "
                +
                (index + 1)
                +
                ":</b> "
                +
                escapeHTML(
                    question
                )
                +
                "<br><br>";


            if(
                type === "CODING"
            ){

                html +=

                    "<b>Your Java Code:</b>" +

                    "<div class='answer-code'>"
                    +
                    escapeHTML(
                        studentAnswer
                    )
                    +
                    "</div>" +

                    "<br>" +

                    "<b>Status:</b> "
                    +
                    getStatusHTML(
                        status
                    )

                    +

                    "<br>" +

                    "<b>Mark:</b> "
                    +
                    score
                    +
                    "/1";

            }
            else {

                html +=

                    "<b>Your Answer:</b> "
                    +
                    escapeHTML(
                        studentAnswer
                    )

                    +

                    "<br>" +

                    "<b>Correct Answer:</b> "
                    +
                    escapeHTML(
                        answer.correctAnswer
                        ||
                        "-"
                    )

                    +

                    "<br>" +

                    "<b>Status:</b> "
                    +
                    getStatusHTML(
                        status
                    );

            }


            box.innerHTML =
                html;


            details.appendChild(
                box
            );

        }
    );

}


/* =====================================================
   STATUS HTML
===================================================== */

function getStatusHTML(
    status
){

    const value =
        String(
            status
        );


    const lower =
        value.toLowerCase();


    if(
        lower.includes(
            "complete"
        )
        ||
        lower.includes(
            "correct"
        )
    ){

        return (
            "<span class='correct'>"
            +
            escapeHTML(
                value
            )
            +
            "</span>"
        );

    }


    if(
        lower.includes(
            "partial"
        )
    ){

        return (
            "<span class='partial'>"
            +
            escapeHTML(
                value
            )
            +
            "</span>"
        );

    }


    return (
        "<span class='wrong'>"
        +
        escapeHTML(
            value
        )
        +
        "</span>"
    );

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(
    value
){

    if(!value){

        return "-";

    }


    const date =
        new Date(
            value
        );


    if(
        isNaN(
            date.getTime()
        )
    ){

        return String(
            value
        );

    }


    return date.toLocaleString();

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

    document.getElementById(
        "reportModal"
    ).style.display =
        "none";

}


window.onclick =
function(event){

    const modal =
        document.getElementById(
            "reportModal"
        );


    if(
        event.target === modal
    ){

        closeModal();

    }

};


/* =====================================================
   BACK
===================================================== */

function goBack(){

    window.location.href =
        "student.html";

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    message
){

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    const error =
        document.getElementById(
            "error"
        );


    error.style.display =
        "block";


    error.textContent =
        message;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

loadReports();

</script>

</body>

</html>
