<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Management</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   PROFESSIONAL STUDENT MANAGEMENT PAGE
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#eef4ff,#f8fbff);
    color:#1e293b;
    min-height:100%;
}

/* Fixed header */

.top-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:72px;
    background:#ffffff;
    border-bottom:1px solid #e2e8f0;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    z-index:1000;
}

.header-inner{
    max-width:1150px;
    height:100%;
    margin:auto;
    padding:0 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    font-size:21px;
    font-weight:700;
    color:#2855d9;
}

.brand-subtitle{
    margin-top:3px;
    font-size:12px;
    color:#64748b;
}

.back-btn{
    border:none;
    background:#475569;
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

.back-btn:hover{
    background:#334155;
}

/* Main */

.container{
    width:100%;
    max-width:1150px;
    margin:auto;
    padding:105px 22px 40px;
}

/* Page heading */

.page-heading{
    margin-bottom:25px;
}

.page-heading h1{
    margin:0;
    font-size:31px;
    color:#172554;
}

.page-heading p{
    margin:8px 0 0;
    color:#64748b;
    font-size:15px;
}

/* Cards */

.card{
    background:#ffffff;
    border:1px solid #e2e8f0;
    border-radius:16px;
    padding:26px;
    margin-bottom:22px;
    box-shadow:0 8px 25px rgba(15,23,42,.07);
}

.card h2{
    margin:0 0 20px;
    font-size:21px;
    color:#172554;
}

/* Form */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    font-size:14px;
    font-weight:700;
    color:#475569;
    margin-bottom:7px;
}

.form-group input,
.form-group select{
    width:100%;
    height:46px;
    padding:10px 13px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    background:#fff;
    color:#1e293b;
    font-size:15px;
    outline:none;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#2855d9;
    box-shadow:0 0 0 3px rgba(40,85,217,.10);
}

.full-width{
    grid-column:1 / -1;
}

/* Add button */

.add-btn{
    width:100%;
    height:48px;
    margin-top:20px;
    border:none;
    border-radius:9px;
    background:#2855d9;
    color:#ffffff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.add-btn:hover{
    background:#1d4ed8;
    box-shadow:0 5px 15px rgba(40,85,217,.20);
}

/* Message */

#message{
    min-height:20px;
    margin-top:14px;
    text-align:center;
    font-weight:700;
}

/* Student table */

.table-wrapper{
    width:100%;
    overflow-x:auto;
    border:1px solid #e2e8f0;
    border-radius:12px;
}

table{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
    background:#ffffff;
}

thead{
    background:#eef4ff;
}

th{
    padding:14px 12px;
    text-align:left;
    font-size:13px;
    color:#334155;
    font-weight:700;
    border-bottom:1px solid #dbe4f0;
    white-space:nowrap;
}

td{
    padding:13px 12px;
    border-bottom:1px solid #edf2f7;
    font-size:14px;
    color:#475569;
    vertical-align:middle;
}

tbody tr:hover{
    background:#f8fbff;
}

tbody tr:last-child td{
    border-bottom:none;
}

/* Delete */

.delete-btn{
    border:none;
    background:#ef4444;
    color:#ffffff;
    padding:8px 13px;
    border-radius:7px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
}

.delete-btn:hover{
    background:#dc2626;
}

/* Empty state */

.empty-message{
    text-align:center;
    padding:30px;
    color:#64748b;
}

/* Student count */

.student-count{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:34px;
    height:30px;
    padding:0 10px;
    border-radius:20px;
    background:#eef4ff;
    color:#2855d9;
    font-weight:700;
    font-size:14px;
}

/* Footer */

.footer{
    text-align:center;
    color:#94a3b8;
    font-size:13px;
    padding:5px 0 20px;
}

/* Mobile */

@media(max-width:750px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full-width{
        grid-column:auto;
    }

    .container{
        padding-left:15px;
        padding-right:15px;
    }

    .card{
        padding:20px;
    }

    .page-heading h1{
        font-size:25px;
    }

}

@media(max-width:600px){

    .top-header{
        height:64px;
    }

    .header-inner{
        padding:0 14px;
    }

    .brand{
        font-size:17px;
    }

    .brand-subtitle{
        font-size:10px;
    }

    .back-btn{
        padding:8px 12px;
        font-size:12px;
    }

    .container{
        padding-top:85px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     FIXED HEADER
===================================================== -->

<header class="top-header">

    <div class="header-inner">

        <div>

            <div class="brand">
                Java Placement Portal
            </div>

            <div class="brand-subtitle">
                Student Management
            </div>

        </div>


        <button
            class="back-btn"
            onclick="goBack()">

            ← Back to Admin

        </button>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <div class="page-heading">

        <h1>
            Student Management
        </h1>

        <p>
            Add, manage and assign assessment days to students.
        </p>

    </div>


    <!-- =================================================
         ADD STUDENT
    ================================================== -->

    <section class="card">

        <h2>
            Add New Student
        </h2>


        <form
            id="studentForm"
            onsubmit="addStudent(event)">


            <div class="form-grid">


                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required>

                </div>


                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="text"
                        id="password"
                        placeholder="Enter password"
                        required>

                </div>


                <!-- Year -->

                <div class="form-group">

                    <label for="year">
                        Year
                    </label>

                    <select
                        id="year"
                        required>

                        <option value="">
                            Select Year
                        </option>

                        <option value="Final Year">
                            Final Year
                        </option>

                        <option value="Third Year">
                            Third Year
                        </option>

                        <option value="Second Year">
                            Second Year
                        </option>

                        <option value="First Year">
                            First Year
                        </option>

                    </select>

                </div>


                <!-- Assigned Day -->

                <div class="form-group full-width">

                    <label for="assignedDay">
                        Assigned Assessment Day
                    </label>

                    <select
                        id="assignedDay"
                        required>

                        <option value="">
                            Loading assessment days...
                        </option>

                    </select>

                </div>


            </div>


            <button
                type="submit"
                class="add-btn">

                + Add Student

            </button>


        </form>


        <div id="message"></div>

    </section>


    <!-- =================================================
         STUDENT LIST
    ================================================== -->

    <section class="card">

        <div style="
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
            margin-bottom:20px;
        ">

            <h2 style="margin:0;">
                Registered Students
            </h2>

            <span
                id="studentCount"
                class="student-count">

                0

            </span>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Username
                        </th>

                        <th>
                            Password
                        </th>

                        <th>
                            Year
                        </th>

                        <th>
                            Assigned Day
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="studentTableBody">

                </tbody>

            </table>

        </div>

    </section>


    <div class="footer">

        Java Placement Assessment Portal

    </div>


</main>


<script>

/* =====================================================
   LOAD ASSESSMENT DAYS
===================================================== */

function loadDays(){

    const daySelect =
        document.getElementById("assignedDay");


    daySelect.innerHTML =
        '<option value="">Select Assessment Day</option>';


    let days = [];


    try{

        const stored =
            JSON.parse(
                localStorage.getItem(
                    "questionBankDays"
                )
                || "[]"
            );


        if(Array.isArray(stored)){

            days = stored;

        }

    }

    catch(error){

        days = [];

    }


    /*
       If questionBankDays exists, use it.
       Otherwise provide all 41 days so the
       student management page remains usable.
    */

    if(days.length === 0){

        for(let i = 1; i <= 41; i++){

            days.push(i);

        }

    }


    days
        .map(function(day){

            return parseInt(day,10);

        })
        .filter(function(day){

            return !isNaN(day)
                && day >= 1
                && day <= 41;

        })
        .sort(function(a,b){

            return a-b;

        })
        .forEach(function(day){

            const option =
                document.createElement("option");


            option.value =
                String(day);


            option.textContent =
                "Day " + day;


            daySelect.appendChild(option);

        });

}


/* =====================================================
   GET STUDENTS
===================================================== */

function getStudents(){

    try{

        const students =
            JSON.parse(
                localStorage.getItem(
                    "students"
                )
                || "[]"
            );


        return Array.isArray(students)
            ? students
            : [];

    }

    catch(error){

        return [];

    }

}


/* =====================================================
   SAVE STUDENTS
===================================================== */

function saveStudents(students){

    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ADD STUDENT
===================================================== */

function addStudent(event){

    event.preventDefault();


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const username =
        document.getElementById(
            "username"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value.trim();


    const year =
        document.getElementById(
            "year"
        ).value;


    const assignedDay =
        parseInt(
            document.getElementById(
                "assignedDay"
            ).value,
            10
        );


    const message =
        document.getElementById(
            "message"
        );


    message.textContent = "";


    /* Validation */

    if(!name){

        message.textContent =
            "Please enter student name.";

        message.style.color =
            "#dc2626";

        return;

    }


    if(!username){

        message.textContent =
            "Please enter username.";

        message.style.color =
            "#dc2626";

        return;

    }


    if(!password){

        message.textContent =
            "Please enter password.";

        message.style.color =
            "#dc2626";

        return;

    }


    if(!year){

        message.textContent =
            "Please select year.";

        message.style.color =
            "#dc2626";

        return;

    }


    if(
        isNaN(assignedDay)
        ||
        assignedDay < 1
        ||
        assignedDay > 41
    ){

        message.textContent =
            "Please select a valid assessment day.";

        message.style.color =
            "#dc2626";

        return;

    }


    const students =
        getStudents();


    /* Duplicate username check */

    const duplicate =
        students.some(function(student){

            return String(
                student.username
                || ""
            )
            .trim()
            .toLowerCase()
            ===
            username
                .trim()
                .toLowerCase();

        });


    if(duplicate){

        message.textContent =
            "Username already exists.";

        message.style.color =
            "#dc2626";

        return;

    }


    /* Create student */

    const student = {

        id:
            Date.now().toString(),

        name:name,

        username:username,

        password:password,

        year:year,

        assignedDay:assignedDay

    };


    students.push(student);


    saveStudents(students);


    /* Clear form */

    document.getElementById(
        "studentForm"
    ).reset();


    message.textContent =
        "Student added successfully.";

    message.style.color =
        "#16a34a";


    displayStudents();

}


/* =====================================================
   DISPLAY STUDENTS
===================================================== */

function displayStudents(){

    const students =
        getStudents();


    const tableBody =
        document.getElementById(
            "studentTableBody"
        );


    const count =
        document.getElementById(
            "studentCount"
        );


    count.textContent =
        students.length;


    tableBody.innerHTML = "";


    if(students.length === 0){

        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty-message">

                    No students added yet.

                </td>

            </tr>

        `;

        return;

    }


    students.forEach(function(student,index){

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>
                ${escapeHTML(student.name)}
            </td>

            <td>
                ${escapeHTML(student.username)}
            </td>

            <td>
                ${escapeHTML(student.password)}
            </td>

            <td>
                ${escapeHTML(student.year)}
            </td>

            <td>
                Day ${escapeHTML(student.assignedDay)}
            </td>

            <td>

                <button
                    class="delete-btn"
                    onclick="deleteStudent('${escapeHTML(student.id)}')">

                    Delete

                </button>

            </td>

        `;


        tableBody.appendChild(row);

    });

}


/* =====================================================
   DELETE STUDENT
===================================================== */

function deleteStudent(id){

    const students =
        getStudents();


    const student =
        students.find(function(item){

            return String(item.id)
                ===
                String(id);

        });


    if(!student){

        return;

    }


    const confirmed =
        confirm(
            "Delete student \"" +
            student.name +
            "\"?"
        );


    if(!confirmed){

        return;

    }


    const updatedStudents =
        students.filter(function(item){

            return String(item.id)
                !==
                String(id);

        });


    saveStudents(updatedStudents);


    displayStudents();


    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        "Student deleted successfully.";

    message.style.color =
        "#16a34a";

}


/* =====================================================
   BACK TO ADMIN
===================================================== */

function goBack(){

    window.location.href =
        "admin.html";

}


/* =====================================================
   INITIALIZE
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        loadDays();

        displayStudents();

    }
);

</script>


</body>

</html>
