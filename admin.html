<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>
/* =========================================================
   ADMIN DASHBOARD PROFESSIONAL DESIGN
   ========================================================= */

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    color: #1f2937;
}

.dashboard {
    width: min(1200px, calc(100% - 32px));
    margin: 0 auto;
    padding: 32px 0 50px;
}

.dashboard > h1 {
    position: sticky;
    top: 0;
    z-index: 100;
    margin: 0 -16px 24px;
    padding: 20px 16px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    color: #1d4ed8;
    font-size: 30px;
    font-weight: 700;
}

.card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 22px;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
}

.card h2 {
    margin: 0 0 18px;
    color: #111827;
    font-size: 21px;
}

.card h3 {
    color: #1f2937;
}

button {
    border: none;
    border-radius: 9px;
    padding: 11px 18px;
    background: #2563eb;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

input,
select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 14px;
    background: #ffffff;
}

input:focus,
select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
    color: #374151;
}

.import-area {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
}

#importFile {
    max-width: 420px;
}

#importStatus {
    margin-top: 14px;
    padding: 12px;
    border-radius: 8px;
    display: none;
}

.day-card {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
}

.day-card h3 {
    margin: 0 0 10px;
    color: #1d4ed8;
}

.question-modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 23, 42, 0.65);
    box-sizing: border-box;
}

.question-modal-content {
    width: min(1000px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}

.question-modal-header {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 18px 22px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
}

.question-modal-header h2 {
    margin: 0;
    color: #1d4ed8;
}

.question-modal-body {
    padding: 22px;
}

.question-item {
    margin-bottom: 18px;
    padding: 18px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    background: #ffffff;
}

.question-type {
    display: inline-block;
    margin-bottom: 10px;
    padding: 5px 9px;
    border-radius: 6px;
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 12px;
    font-weight: 700;
}

.question-text {
    white-space: pre-wrap;
    line-height: 1.6;
    color: #111827;
}

.option {
    padding: 9px 12px;
    margin: 7px 0;
    background: #f8fafc;
    border-radius: 7px;
}

.answer-box {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    background: #ecfdf5;
    border-left: 4px solid #10b981;
}

.coding-box {
    margin-top: 12px;
    padding: 14px;
    background: #f8fafc;
    border-radius: 9px;
}

.coding-box pre {
    overflow-x: auto;
    margin: 0;
    white-space: pre-wrap;
}

.coding-evaluation {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: #eff6ff;
}

.error-code {
    margin: 12px 0;
    padding: 14px;
    overflow-x: auto;
    background: #111827;
    color: #f9fafb;
    border-radius: 9px;
}

.error-code pre {
    margin: 0;
    white-space: pre-wrap;
}

.summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.summary-box {
    padding: 18px;
    border-radius: 12px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    text-align: center;
}

.summary-box strong {
    display: block;
    margin-top: 5px;
    font-size: 25px;
    color: #1d4ed8;
}

.action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

@media (max-width: 800px) {
    .summary-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .dashboard {
        width: min(100% - 20px, 1200px);
        padding-top: 20px;
    }

    .dashboard > h1 {
        font-size: 24px;
        margin-left: -10px;
        margin-right: -10px;
    }
}

@media (max-width: 500px) {
    .summary-grid {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 16px;
    }

    .question-modal {
        padding: 8px;
    }

    .question-modal-body {
        padding: 14px;
    }

    .question-modal-header {
        padding: 14px;
    }

    button {
        width: 100%;
    }

    .import-area {
        flex-direction: column;
        align-items: stretch;
    }

    #importFile {
        max-width: none;
    }
}
</style>
</head>

<body>

<div class="dashboard">

<h1>Admin Dashboard</h1>

<!-- =====================================================
     QUESTION BANK IMPORT
     ===================================================== -->

<div class="card">

<h2>Question Bank Import</h2>

<div class="import-area">

<input
    type="file"
    id="excelFile"
    accept=".xlsx,.xls"
/>

<button onclick="importExcel()">
    Import Excel
</button>

</div>

<div id="importStatus"></div>

</div>


<!-- =====================================================
     SUMMARY
     ===================================================== -->

<div class="card">

<h2>Question Bank Summary</h2>

<div class="summary-grid">

<div class="summary-box">
    <div>Total Questions</div>
    <strong id="totalQuestions">0</strong>
</div>

<div class="summary-box">
    <div>MCQ</div>
    <strong id="mcqCount">0</strong>
</div>

<div class="summary-box">
    <div>Error Correction</div>
    <strong id="errorCount">0</strong>
</div>

<div class="summary-box">
    <div>Coding</div>
    <strong id="codingCount">0</strong>
</div>

</div>

</div>


<!-- =====================================================
     DAILY ASSESSMENTS
     ===================================================== -->

<div class="card">

<h2>Daily Assessments</h2>

<div id="dailyAssessments">
    <p>Loading question bank...</p>
</div>

</div>


<!-- =====================================================
     STUDENT MANAGEMENT
     ===================================================== -->

<div class="card">

<h2>Student Management</h2>

<div class="action-row">

<button onclick="goStudents()">
    Manage Students
</button>

</div>

</div>


<!-- =====================================================
     REPORTS
     ===================================================== -->

<div class="card">

<h2>Reports</h2>

<div class="action-row">

<button onclick="viewReports()">
    View Student Reports
</button>

</div>

</div>

</div>


<!-- =====================================================
     QUESTION VIEWER MODAL
     ===================================================== -->

<div
    id="questionModal"
    class="question-modal"
    onclick="closeModalOnOutside(event)"
>

<div class="question-modal-content">

<div class="question-modal-header">

<h2 id="modalTitle">
    Questions
</h2>

<button onclick="closeQuestionModal()">
    Close
</button>

</div>

<div
    id="modalBody"
    class="question-modal-body"
>
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

/* =========================================================
   GLOBAL DATA
   ========================================================= */

let questionBank = [];
let questionBankDays = {};


/* =========================================================
   SAFE HTML
   ========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   NORMALIZE VALUE
   ========================================================= */

function normalize(value) {

    return String(value ?? "")
        .trim();

}


/* =========================================================
   NORMALIZE QUESTION TYPE
   ========================================================= */

function normalizeType(value) {

    const type = normalize(value).toUpperCase();

    if (
        type.includes("MCQ") ||
        type.includes("MULTIPLE")
    ) {
        return "MCQ";
    }

    if (
        type.includes("ERROR") ||
        type.includes("DEBUG")
    ) {
        return "ERROR";
    }

    if (
        type.includes("CODING") ||
        type.includes("PROGRAM")
    ) {
        return "CODING";
    }

    return type || "MCQ";

}


/* =========================================================
   FIND COLUMN
   ========================================================= */

function getColumn(row, names) {

    const keys = Object.keys(row);

    for (const name of names) {

        const exact = keys.find(
            key =>
                key.trim().toLowerCase() ===
                name.trim().toLowerCase()
        );

        if (exact !== undefined) {
            return row[exact];
        }

    }

    return "";

}


/* =========================================================
   NORMALIZE QUESTION
   ========================================================= */

function normalizeQuestion(row, index) {

    const question =
        getColumn(row, [
            "Question",
            "question",
            "Questions"
        ]);

    const type =
        normalizeType(
            getColumn(row, [
                "Type",
                "Question Type",
                "QuestionType"
            ])
        );

    const dayValue =
        getColumn(row, [
            "Day",
            "day",
            "Day Number",
            "DayNumber"
        ]);

    let day =
        parseInt(
            String(dayValue).replace(/\D/g, ""),
            10
        );

    if (!Number.isFinite(day) || day < 1) {
        day = 1;
    }

    const optionA =
        getColumn(row, ["Option A", "A"]);

    const optionB =
        getColumn(row, ["Option B", "B"]);

    const optionC =
        getColumn(row, ["Option C", "C"]);

    const optionD =
        getColumn(row, ["Option D", "D"]);

    const correctAnswer =
        getColumn(row, [
            "Correct Answer",
            "Answer",
            "CorrectAnswer"
        ]);

    const errorCode =
        getColumn(row, [
            "Error Code",
            "Buggy Code",
            "Code"
        ]);

    const solution =
        getColumn(row, [
            "Corrected Code",
            "Solution",
            "Answer Code"
        ]);

    const codingEvaluation =
        getColumn(row, [
            "Coding Evaluation",
            "Evaluation"
        ]);

    const logic =
        getColumn(row, [
            "Full-Mark Logic",
            "Full Mark Logic",
            "Answer Key",
            "Logic"
        ]);

    const constraints =
        getColumn(row, [
            "Constraints",
            "Contract"
        ]);

    return {

        id:
            index + 1,

        day,

        type,

        question:
            normalize(question),

        optionA:
            normalize(optionA),

        optionB:
            normalize(optionB),

        optionC:
            normalize(optionC),

        optionD:
            normalize(optionD),

        correctAnswer:
            normalize(correctAnswer),

        errorCode:
            normalize(errorCode),

        solution:
            normalize(solution),

        codingEvaluation:
            normalize(codingEvaluation),

        logic:
            normalize(logic),

        constraints:
            normalize(constraints),

        raw:
            row

    };

}


/* =========================================================
   IMPORT EXCEL
   ========================================================= */

function importExcel() {

    const fileInput =
        document.getElementById("excelFile");

    const status =
        document.getElementById("importStatus");

    if (!fileInput.files.length) {

        status.style.display = "block";

        status.style.background = "#fef2f2";

        status.style.color = "#b91c1c";

        status.textContent =
            "Please select an Excel file.";

        return;

    }

    const file =
        fileInput.files[0];

    const reader =
        new FileReader();

    reader.onload = function(event) {

        try {

            const data =
                new Uint8Array(
                    event.target.result
                );

            const workbook =
                XLSX.read(
                    data,
                    { type: "array" }
                );

            const firstSheet =
                workbook.Sheets[
                    workbook.SheetNames[0]
                ];

            const rows =
                XLSX.utils.sheet_to_json(
                    firstSheet,
                    {
                        defval: ""
                    }
                );

            if (!rows.length) {

                throw new Error(
                    "The Excel file is empty."
                );

            }

            questionBank =
                rows
                    .map(normalizeQuestion)
                    .filter(
                        q =>
                            q.question ||
                            q.type === "CODING"
                    );

            questionBankDays = {};

            questionBank.forEach(question => {

                if (!questionBankDays[question.day]) {
                    questionBankDays[question.day] = [];
                }

                questionBankDays[
                    question.day
                ].push(question);

            });

            localStorage.setItem(
                "questionBank",
                JSON.stringify(questionBank)
            );

            localStorage.setItem(
                "questionBankDays",
                JSON.stringify(questionBankDays)
            );

            updateSummary();

            displayDailyAssessments();

            status.style.display = "block";

            status.style.background = "#ecfdf5";

            status.style.color = "#047857";

            status.textContent =
                "Excel imported successfully. " +
                questionBank.length +
                " questions loaded.";

        } catch (error) {

            console.error(error);

            status.style.display = "block";

            status.style.background = "#fef2f2";

            status.style.color = "#b91c1c";

            status.textContent =
                "Import failed: " +
                error.message;

        }

    };

    reader.readAsArrayBuffer(file);

}


/* =========================================================
   LOAD STORED QUESTION BANK
   ========================================================= */

function loadQuestionBank() {

    try {

        const stored =
            localStorage.getItem(
                "questionBank"
            );

        if (stored) {

            questionBank =
                JSON.parse(stored);

        }

        const storedDays =
            localStorage.getItem(
                "questionBankDays"
            );

        if (storedDays) {

            questionBankDays =
                JSON.parse(storedDays);

        }

    } catch (error) {

        console.error(
            "Question bank loading error:",
            error
        );

        questionBank = [];

        questionBankDays = {};

    }

}


/* =========================================================
   SUMMARY
   ========================================================= */

function updateSummary() {

    const mcq =
        questionBank.filter(
            q => q.type === "MCQ"
        ).length;

    const error =
        questionBank.filter(
            q => q.type === "ERROR"
        ).length;

    const coding =
        questionBank.filter(
            q => q.type === "CODING"
        ).length;

    document.getElementById(
        "totalQuestions"
    ).textContent =
        questionBank.length;

    document.getElementById(
        "mcqCount"
    ).textContent =
        mcq;

    document.getElementById(
        "errorCount"
    ).textContent =
        error;

    document.getElementById(
        "codingCount"
    ).textContent =
        coding;

}


/* =========================================================
   DAILY ASSESSMENTS
   ========================================================= */

function displayDailyAssessments() {

    const container =
        document.getElementById(
            "dailyAssessments"
        );

    const days =
        Object.keys(questionBankDays)
            .map(Number)
            .sort((a, b) => a - b);

    if (!days.length) {

        container.innerHTML =
            "<p>No question bank imported yet.</p>";

        return;

    }

    container.innerHTML = "";

    days.forEach(day => {

        const questions =
            questionBankDays[day] || [];

        const mcq =
            questions.filter(
                q => q.type === "MCQ"
            ).length;

        const error =
            questions.filter(
                q => q.type === "ERROR"
            ).length;

        const coding =
            questions.filter(
                q => q.type === "CODING"
            ).length;

        const card =
            document.createElement("div");

        card.className = "day-card";

        card.innerHTML = `

            <h3>Day ${day}</h3>

            <p>
                <strong>MCQ:</strong> ${mcq}
                &nbsp;&nbsp;
                <strong>Error:</strong> ${error}
                &nbsp;&nbsp;
                <strong>Coding:</strong> ${coding}
            </p>

            <div class="action-row">

                <button
                    onclick="viewDayQuestions(${day})"
                >
                    View Questions
                </button>

            </div>
        `;

        container.appendChild(card);

    });

}


/* =========================================================
   VIEW DAY QUESTIONS
   ========================================================= */

function viewDayQuestions(day) {

    const questions =
        questionBankDays[day] || [];

    document.getElementById(
        "modalTitle"
    ).textContent =
        `Day ${day} Questions`;

    const body =
        document.getElementById(
            "modalBody"
        );

    if (!questions.length) {

        body.innerHTML =
            "<p>No questions found for this day.</p>";

        openQuestionModal();

        return;

    }

    body.innerHTML = "";

    questions.forEach(
        (question, index) => {

            const item =
                document.createElement("div");

            item.className =
                "question-item";

            let html = `

                <div class="question-type">
                    ${escapeHTML(question.type)}
                </div>

                <h3>
                    Question ${index + 1}
                </h3>

                <div class="question-text">
                    ${escapeHTML(question.question)}
                </div>
            `;

            if (question.type === "MCQ") {

                html += `

                    <div class="option">
                        A. ${escapeHTML(question.optionA)}
                    </div>

                    <div class="option">
                        B. ${escapeHTML(question.optionB)}
                    </div>

                    <div class="option">
                        C. ${escapeHTML(question.optionC)}
                    </div>

                    <div class="option">
                        D. ${escapeHTML(question.optionD)}
                    </div>

                    <div class="answer-box">
                        <strong>
                            Correct Answer:
                        </strong>
                        ${escapeHTML(question.correctAnswer)}
                    </div>
                `;

            }

            if (question.type === "ERROR") {

                if (question.errorCode) {

                    html += `

                        <div class="error-code">
                            <pre>${escapeHTML(
                                question.errorCode
                            )}</pre>
                        </div>
                    `;

                }

                html += `

                    <div class="answer-box">
                        <strong>
                            Correct Answer:
                        </strong>
                        ${escapeHTML(
                            question.correctAnswer
                        )}
                    </div>
                `;

                if (question.solution) {

                    html += `

                        <div class="coding-box">

                            <strong>
                                Corrected Code:
                            </strong>

                            <pre>${escapeHTML(
                                question.solution
                            )}</pre>

                        </div>
                    `;

                }

            }

            if (question.type === "CODING") {

                if (question.logic) {

                    html += `

                        <div class="coding-box">

                            <strong>
                                Full-Mark Logic / Answer Key
                            </strong>

                            <p>
                                ${escapeHTML(
                                    question.logic
                                )}
                            </p>

                        </div>
                    `;

                }

                if (question.constraints) {

                    html += `

                        <div class="coding-box">

                            <strong>
                                Constraints / Contract
                            </strong>

                            <p>
                                ${escapeHTML(
                                    question.constraints
                                )}
                            </p>

                        </div>
                    `;

                }

                if (question.codingEvaluation) {

                    html += `

                        <div class="coding-evaluation">

                            <strong>
                                Coding Evaluation:
                            </strong>

                            <p>
                                ${escapeHTML(
                                    question.codingEvaluation
                                )}
                            </p>

                        </div>
                    `;

                }

            }

            item.innerHTML = html;

            body.appendChild(item);

        }
    );

    openQuestionModal();

}


/* =========================================================
   MODAL
   ========================================================= */

function openQuestionModal() {

    document.getElementById(
        "questionModal"
    ).style.display =
        "flex";

    document.body.style.overflow =
        "hidden";

}


function closeQuestionModal() {

    document.getElementById(
        "questionModal"
    ).style.display =
        "none";

    document.body.style.overflow =
        "";

}


function closeModalOnOutside(event) {

    if (
        event.target.id ===
        "questionModal"
    ) {

        closeQuestionModal();

    }

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function goStudents() {

    window.location.href =
        "students.html";

}


function viewReports() {

    window.location.href =
        "reports.html";

}


/* =========================================================
   INITIAL LOAD
   ========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        loadQuestionBank();

        updateSummary();

        displayDailyAssessments();

    }
);

</script>

</body>
</html>
