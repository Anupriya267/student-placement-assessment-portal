<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Admin Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

.question-modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.65);
}

.question-modal-content {
    background: white;
    width: 92%;
    max-width: 900px;
    height: 90vh;
    margin: 5vh auto;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.question-modal-header {
    padding: 15px 20px;
    background: #2864dc;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.question-modal-header h2 {
    margin: 0;
    font-size: 20px;
}

.close-button {
    font-size: 30px;
    cursor: pointer;
    font-weight: bold;
}

.question-modal-body {
    padding: 15px;
    overflow-y: auto;
    flex: 1;
}

.question-item {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    background: #fafafa;
}

.question-item h3 {
    margin-top: 0;
    font-size: 17px;
}

.question-type {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
}

.option {
    padding: 6px 0;
}

.answer-box {
    margin-top: 12px;
    padding: 10px;
    background: #eaf7ed;
    border-radius: 6px;
}

.coding-box {
    background: #f1f5ff;
    padding: 12px;
    border-radius: 6px;
    margin-top: 10px;
}

.coding-evaluation {
    background: #fff7e6;
    padding: 12px;
    border-radius: 6px;
    margin-top: 10px;
}

.coding-question {
    border-left: 5px solid #2864dc;
}

.error-question {
    border-left: 5px solid #f39c12;
}

.mcq-question {
    border-left: 5px solid #28a745;
}

#importStatus {
    font-weight: bold;
}

.success-message {
    color: #16803c;
}

.error-message {
    color: #c62828;
}

.day-card {
    margin-bottom: 15px;
}

.day-title {
    margin-bottom: 5px;
}

</style>

</head>


<body>

<div class="dashboard">

<h1>Admin Dashboard</h1>


<!-- QUESTION BANK IMPORT -->

<div class="card">

<h2>Question Bank Import</h2>

<p>
Upload the 41-Day Java Placement Question Bank Excel file.
</p>

<input
    type="file"
    id="excelFile"
    accept=".xlsx,.xls"
>

<br><br>

<button
    type="button"
    onclick="importExcel()"
>
Import Question Bank
</button>

<p id="importStatus"></p>

</div>


<!-- QUESTION BANK SUMMARY -->

<div class="card">

<h2>Question Bank Summary</h2>

<p>
Total Questions:
<strong id="totalQuestions">0</strong>
</p>

<p>
Total Days:
<strong id="totalDays">0</strong>
</p>

</div>


<!-- DAILY ASSESSMENTS -->

<div class="card">

<h2>Daily Assessments</h2>

<div id="dayList">

<p>
No question bank imported yet.
</p>

</div>

</div>


<!-- STUDENT MANAGEMENT -->

<div class="card">

<h2>Student Management</h2>

<button
    type="button"
    onclick="studentManagement()"
>
Manage Students
</button>

</div>


<!-- REPORTS -->

<div class="card">

<h2>Reports</h2>

<button
    type="button"
    onclick="viewReports()"
>
View Student Reports
</button>

</div>

</div>


<!-- QUESTION MODAL -->

<div
    id="questionModal"
    class="question-modal"
>

<div class="question-modal-content">

<div class="question-modal-header">

<h2 id="modalTitle">
Day Questions
</h2>

<span
    class="close-button"
    onclick="closeQuestionModal()"
>
&times;
</span>

</div>

<div
    id="modalQuestions"
    class="question-modal-body"
>
</div>

</div>

</div>


<script>


/* =====================================================
   FIND COLUMN
===================================================== */

function findColumn(row, names) {

    const keys = Object.keys(row);

    for (let i = 0; i < names.length; i++) {

        const wanted =
            String(names[i])
                .trim()
                .toLowerCase();

        const found = keys.find(function(key) {

            return String(key)
                .trim()
                .toLowerCase() === wanted;

        });

        if (found) {
            return found;
        }

    }

    return null;
}


/* =====================================================
   NORMALIZE QUESTION
===================================================== */

function normalizeQuestion(row) {

    const dayKey = findColumn(row, [
        "Day"
    ]);

    const typeKey = findColumn(row, [
        "Question Type",
        "Type"
    ]);

    const numberKey = findColumn(row, [
        "Question No.",
        "Question No",
        "Number"
    ]);

    const questionKey = findColumn(row, [
        "Question"
    ]);

    const optionAKey = findColumn(row, [
        "Option A"
    ]);

    const optionBKey = findColumn(row, [
        "Option B"
    ]);

    const optionCKey = findColumn(row, [
        "Option C"
    ]);

    const optionDKey = findColumn(row, [
        "Option D"
    ]);

    const answerKey = findColumn(row, [
        "Correct Answer",
        "Answer"
    ]);

    const sourceKey = findColumn(row, [
        "Source Date / Assessment"
    ]);

    const codingRequirementKey = findColumn(row, [
        "Coding Requirement"
    ]);

    const codingEvaluationKey = findColumn(row, [
        "Coding Evaluation"
    ]);


    return {

        Day: dayKey
            ? String(row[dayKey] || "").trim()
            : "",

        "Question Type": typeKey
            ? String(row[typeKey] || "").trim()
            : "",

        "Question No.": numberKey
            ? String(row[numberKey] || "").trim()
            : "",

        Question: questionKey
            ? String(row[questionKey] || "").trim()
            : "",

        "Option A": optionAKey
            ? String(row[optionAKey] || "").trim()
            : "",

        "Option B": optionBKey
            ? String(row[optionBKey] || "").trim()
            : "",

        "Option C": optionCKey
            ? String(row[optionCKey] || "").trim()
            : "",

        "Option D": optionDKey
            ? String(row[optionDKey] || "").trim()
            : "",

        "Correct Answer": answerKey
            ? String(row[answerKey] || "").trim()
            : "",

        "Source Date / Assessment": sourceKey
            ? String(row[sourceKey] || "").trim()
            : "",

        "Coding Requirement": codingRequirementKey
            ? String(row[codingRequirementKey] || "").trim()
            : "",

        "Coding Evaluation": codingEvaluationKey
            ? String(row[codingEvaluationKey] || "").trim()
            : ""

    };

}


/* =====================================================
   IMPORT EXCEL
===================================================== */

function importExcel() {

    const fileInput =
        document.getElementById("excelFile");

    const file =
        fileInput.files[0];


    if (!file) {

        alert(
            "Please select the Excel file first."
        );

        return;
    }


    const status =
        document.getElementById("importStatus");


    status.className = "";

    status.innerHTML =
        "Reading Excel file...";


    const reader =
        new FileReader();


    reader.onload = function(event) {

        try {

            const data =
                new Uint8Array(
                    event.target.result
                );


            const workbook =
                XLSX.read(
                    data,
                    {
                        type: "array"
                    }
                );


            /* FIND QUESTION BANK SHEET */

            let sheetName = null;


            const exactQuestionBank =
                workbook.SheetNames.find(
                    function(name) {

                        return String(name)
                            .trim()
                            .toLowerCase()
                            === "question bank";

                    }
                );


            const exactQuestions =
                workbook.SheetNames.find(
                    function(name) {

                        return String(name)
                            .trim()
                            .toLowerCase()
                            === "questions";

                    }
                );


            if (exactQuestionBank) {

                sheetName =
                    exactQuestionBank;

            } else if (exactQuestions) {

                sheetName =
                    exactQuestions;

            } else if (
                workbook.SheetNames.length > 0
            ) {

                sheetName =
                    workbook.SheetNames[0];

            }


            if (!sheetName) {

                throw new Error(
                    "No worksheet found in the Excel file."
                );

            }


            console.log(
                "Using sheet:",
                sheetName
            );


            /* READ SHEET */

            const worksheet =
                workbook.Sheets[sheetName];


            const rawQuestions =
                XLSX.utils.sheet_to_json(
                    worksheet,
                    {
                        defval: ""
                    }
                );


            if (
                rawQuestions.length === 0
            ) {

                throw new Error(
                    "The selected sheet contains no data."
                );

            }


            /* NORMALIZE */

            const questions =
                rawQuestions
                    .map(normalizeQuestion)
                    .filter(function(q) {

                        return (
                            q.Day !== "" &&
                            q.Question !== ""
                        );

                    });


            if (
                questions.length === 0
            ) {

                throw new Error(
                    "No valid questions were found. Check that the Excel has Day and Question columns."
                );

            }


            /* FIND DAYS */

            const dayMap = {};


            questions.forEach(function(q) {

                const day =
                    String(q.Day).trim();


                if (day !== "") {

                    dayMap[day] = true;

                }

            });


            const days =
                Object.keys(dayMap);


            days.sort(function(a, b) {

                const numberA =
                    parseInt(
                        String(a).replace(
                            /[^0-9]/g,
                            ""
                        )
                    ) || 0;


                const numberB =
                    parseInt(
                        String(b).replace(
                            /[^0-9]/g,
                            ""
                        )
                    ) || 0;


                return numberA - numberB;

            });


            /* SAVE */

            localStorage.setItem(
                "questionBank",
                JSON.stringify(questions)
            );


            localStorage.setItem(
                "questionBankDays",
                JSON.stringify(days)
            );


            /* SHOW */

            showSummary(
                questions,
                days
            );


            status.className =
                "success-message";


            status.innerHTML =
                "Question Bank imported successfully.";


            alert(
                "Question Bank imported successfully!\n\n" +
                "Total Questions: " +
                questions.length +
                "\nTotal Days: " +
                days.length
            );


        } catch(error) {

            console.error(
                "Import error:",
                error
            );


            status.className =
                "error-message";


            status.innerHTML =
                "Import failed: " +
                escapeHTML(error.message);


            alert(
                "Question Bank import failed.\n\n" +
                error.message
            );

        }

    };


    reader.onerror = function() {

        alert(
            "Unable to read the Excel file."
        );

    };


    reader.readAsArrayBuffer(file);

}


/* =====================================================
   SHOW SUMMARY
===================================================== */

function showSummary(
    questions,
    days
) {

    document.getElementById(
        "totalQuestions"
    ).innerText =
        questions.length;


    document.getElementById(
        "totalDays"
    ).innerText =
        days.length;


    const dayList =
        document.getElementById(
            "dayList"
        );


    dayList.innerHTML = "";


    days.forEach(function(day) {

        const dayQuestions =
            questions.filter(function(q) {

                return (
                    String(q.Day).trim()
                    ===
                    String(day).trim()
                );

            });


        let topic =
            "Java Placement Assessment";


        if (
            dayQuestions.length > 0 &&
            dayQuestions[0][
                "Source Date / Assessment"
            ]
        ) {

            topic =
                dayQuestions[0][
                    "Source Date / Assessment"
                ];

        }


        const card =
            document.createElement("div");


        card.className =
            "card day-card";


        card.innerHTML =

            "<h3 class='day-title'>" +
            "Day " +
            escapeHTML(day) +
            "</h3>" +

            "<p>" +
            escapeHTML(topic) +
            "</p>" +

            "<p><strong>Questions:</strong> " +
            dayQuestions.length +
            "</p>" +

            "<button " +
            "type='button' " +
            "onclick=\"viewDay('" +
            escapeJS(day) +
            "')\">" +
            "View Questions" +
            "</button>";


        dayList.appendChild(card);

    });

}


/* =====================================================
   VIEW DAY QUESTIONS
===================================================== */

function viewDay(day) {

    const saved =
        localStorage.getItem(
            "questionBank"
        );


    if (!saved) {

        alert(
            "No question bank imported yet."
        );

        return;

    }


    let questions;


    try {

        questions =
            JSON.parse(saved);

    } catch(error) {

        alert(
            "Question bank data is corrupted. Please import the Excel file again."
        );

        return;

    }


    const dayQuestions =
        questions.filter(function(q) {

            return (
                String(q.Day).trim()
                ===
                String(day).trim()
            );

        });


    if (
        dayQuestions.length === 0
    ) {

        alert(
            "No questions found for Day " +
            day
        );

        return;

    }


    const modal =
        document.getElementById(
            "questionModal"
        );


    const title =
        document.getElementById(
            "modalTitle"
        );


    const container =
        document.getElementById(
            "modalQuestions"
        );


    title.innerText =
        "Day " +
        day +
        " - " +
        dayQuestions.length +
        " Questions";


    container.innerHTML = "";


    dayQuestions.forEach(
        function(q, index) {

            const type =
                String(
                    q["Question Type"] || ""
                )
                .trim()
                .toUpperCase();


            const box =
                document.createElement("div");


            box.className =
                "question-item";


            if (
                type.includes("MCQ")
            ) {

                box.classList.add(
                    "mcq-question"
                );

            }


            if (
                type.includes("ERROR")
            ) {

                box.classList.add(
                    "error-question"
                );

            }


            if (
                type.includes("CODING")
            ) {

                box.classList.add(
                    "coding-question"
                );

            }


            let html = "";


            html +=
                "<div class='question-type'>" +
                escapeHTML(
                    type || "QUESTION"
                ) +
                "</div>";


            html +=
                "<h3>Question " +
                (index + 1) +
                ". " +
                escapeHTML(
                    q.Question || ""
                ) +
                "</h3>";


            /* OPTIONS */

            if (
                q["Option A"] ||
                q["Option B"] ||
                q["Option C"] ||
                q["Option D"]
            ) {

                html +=
                    "<div class='option'><b>A.</b> " +
                    escapeHTML(
                        q["Option A"] || ""
                    ) +
                    "</div>";

                html +=
                    "<div class='option'><b>B.</b> " +
                    escapeHTML(
                        q["Option B"] || ""
                    ) +
                    "</div>";

                html +=
                    "<div class='option'><b>C.</b> " +
                    escapeHTML(
                        q["Option C"] || ""
                    ) +
                    "</div>";

                html +=
                    "<div class='option'><b>D.</b> " +
                    escapeHTML(
                        q["Option D"] || ""
                    ) +
                    "</div>";

            }


            /* CORRECT ANSWER */

            if (
                q["Correct Answer"]
            ) {

                html +=
                    "<div class='answer-box'>" +
                    "<strong>Correct Answer:</strong><br>" +
                    escapeHTML(
                        q["Correct Answer"]
                    ) +
                    "</div>";

            }


            /* CODING REQUIREMENT */

            if (
                q["Coding Requirement"]
            ) {

                html +=
                    "<div class='coding-box'>" +
                    "<strong>Coding Requirement:</strong><br><br>" +
                    escapeHTML(
                        q["Coding Requirement"]
                    ) +
                    "</div>";

            }


            /* CODING EVALUATION */

            if (
                q["Coding Evaluation"]
            ) {

                html +=
                    "<div class='coding-evaluation'>" +
                    "<strong>Coding Evaluation:</strong><br><br>" +
                    escapeHTML(
                        q["Coding Evaluation"]
                    ) +
                    "</div>";

            }


            box.innerHTML =
                html;


            container.appendChild(box);

        }
    );


    modal.style.display =
        "block";

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeQuestionModal() {

    document.getElementById(
        "questionModal"
    ).style.display =
        "none";

}


window.onclick =
    function(event) {

        const modal =
            document.getElementById(
                "questionModal"
            );


        if (
            event.target === modal
        ) {

            modal.style.display =
                "none";

        }

    };


/* =====================================================
   STUDENT MANAGEMENT
===================================================== */

function studentManagement() {

    window.location.href =
        "students.html";

}


/* =====================================================
   REPORTS
===================================================== */

function viewReports() {

    window.location.href =
        "reports.html";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJS(value) {

    return String(value)

        .replace(/\\/g, "\\\\")

        .replace(/'/g, "\\'");

}


/* =====================================================
   LOAD SAVED QUESTIONS
===================================================== */

window.onload =
    function() {

        try {

            const saved =
                localStorage.getItem(
                    "questionBank"
                );


            const savedDays =
                localStorage.getItem(
                    "questionBankDays"
                );


            if (
                saved &&
                savedDays
            ) {

                const questions =
                    JSON.parse(saved);


                const days =
                    JSON.parse(savedDays);


                if (
                    Array.isArray(questions) &&
                    Array.isArray(days)
                ) {

                    showSummary(
                        questions,
                        days
                    );


                    document.getElementById(
                        "importStatus"
                    ).innerHTML =
                        "Previously imported question bank loaded.";

                }

            }

        } catch(error) {

            console.error(
                "Could not load saved question bank:",
                error
            );

        }

    };

</script>

</body>

</html>
