<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

.question-modal {
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);
}

.question-modal-content {
    background:white;
    width:92%;
    max-width:850px;
    height:90vh;
    margin:5vh auto;
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.question-modal-header {
    padding:15px 20px;
    background:#2864dc;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.question-modal-header h2 {
    margin:0;
    font-size:20px;
}

.close-button {
    font-size:30px;
    cursor:pointer;
    font-weight:bold;
}

.question-modal-body {
    padding:15px;
    overflow-y:auto;
    flex:1;
}

.question-item {
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    background:#fafafa;
}

.question-item h3 {
    margin-top:0;
    font-size:17px;
}

.question-type {
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
}

.option {
    padding:6px 0;
}

.coding-question {
    border-left:5px solid #2864dc;
}

.error-question {
    border-left:5px solid #f39c12;
}

.mcq-question {
    border-left:5px solid #28a745;
}

.coding-box {
    background:#f1f5ff;
    padding:12px;
    border-radius:6px;
    margin-top:10px;
}

</style>

</head>


<body>


<div class="dashboard">


<h1>Admin Dashboard</h1>


<!-- QUESTION BANK IMPORT -->

<div class="card">

<h2>Question Bank Import</h2>

<p>
Upload the 41-Day Java Placement Question Bank Excel file.
</p>

<input
    type="file"
    id="excelFile"
    accept=".xlsx,.xls"
>

<br><br>

<button onclick="importExcel()">
Import Question Bank
</button>

<p id="importStatus"></p>

</div>



<!-- QUESTION BANK SUMMARY -->

<div class="card">

<h2>Question Bank Summary</h2>

<p>
Total Questions:
<strong id="totalQuestions">0</strong>
</p>

<p>
Total Days:
<strong id="totalDays">0</strong>
</p>

</div>



<!-- DAILY ASSESSMENTS -->

<div class="card">

<h2>Daily Assessments</h2>

<div id="dayList">

<p>
No question bank imported yet.
</p>

</div>

</div>



<!-- STUDENT MANAGEMENT -->

<div class="card">

<h2>Student Management</h2>

<button onclick="studentManagement()">
Manage Students
</button>

</div>



<!-- REPORTS -->

<div class="card">

<h2>Reports</h2>

<button onclick="viewReports()">
View Student Reports
</button>

</div>


</div>



<!-- QUESTION VIEWER -->

<div
    id="questionModal"
    class="question-modal"
>

<div class="question-modal-content">


<div class="question-modal-header">

<h2 id="modalTitle">
Day Questions
</h2>

<span
    class="close-button"
    onclick="closeQuestionModal()"
>
&times;
</span>

</div>


<div
    id="modalQuestions"
    class="question-modal-body"
>
</div>


</div>

</div>



<script>


// ================================================
// IMPORT EXCEL
// ================================================

function importExcel(){

    let fileInput =
        document.getElementById("excelFile");

    let file =
        fileInput.files[0];

    if(!file){

        alert(
            "Please select the Excel file first."
        );

        return;

    }

    let reader =
        new FileReader();

    reader.onload =
        function(event){

            try{

                let data =
                    new Uint8Array(
                        event.target.result
                    );

                let workbook =
                    XLSX.read(
                        data,
                        {
                            type:"array"
                        }
                    );

                let sheetName =
                    "Question Bank";

                if(
                    !workbook.SheetNames.includes(
                        sheetName
                    )
                ){

                    alert(
                        "Question Bank sheet was not found."
                    );

                    return;

                }

                let worksheet =
                    workbook.Sheets[
                        sheetName
                    ];

                let questions =
                    XLSX.utils.sheet_to_json(
                        worksheet,
                        {
                            defval:""
                        }
                    );

                if(
                    questions.length === 0
                ){

                    alert(
                        "No questions found in the Excel file."
                    );

                    return;

                }

                localStorage.setItem(
                    "questionBank",
                    JSON.stringify(
                        questions
                    )
                );

                let days = [];

                questions.forEach(
                    function(q){

                        if(
                            q.Day !== undefined &&
                            !days.includes(
                                String(q.Day)
                            )
                        ){

                            days.push(
                                String(q.Day)
                            );

                        }

                    }
                );

                days.sort(
                    function(a,b){

                        return Number(a)
                        -
                        Number(b);

                    }
                );

                localStorage.setItem(
                    "questionBankDays",
                    JSON.stringify(
                        days
                    )
                );

                document.getElementById(
                    "importStatus"
                ).innerHTML =
                    "✅ Question Bank imported successfully.";

                showSummary(
                    questions,
                    days
                );

                alert(
                    "Question Bank imported successfully!"
                );

            }

            catch(error){

                console.error(error);

                alert(
                    "Error reading Excel file."
                );

            }

        };

    reader.readAsArrayBuffer(file);

}



// ================================================
// SHOW SUMMARY
// ================================================

function showSummary(
    questions,
    days
){

    document.getElementById(
        "totalQuestions"
    ).innerText =
        questions.length;

    document.getElementById(
        "totalDays"
    ).innerText =
        days.length;

    let dayList =
        document.getElementById(
            "dayList"
        );

    dayList.innerHTML = "";


    days.forEach(
        function(day){

            let dayQuestions =
                questions.filter(
                    function(q){

                        return String(q.Day)
                        ===
                        String(day);

                    }
                );


            let topic =
                dayQuestions.length > 0
                ?
                (
                    dayQuestions[0][
                        "Source Date / Assessment"
                    ]
                    ||
                    "Java Placement Assessment"
                )
                :
                "";


            let div =
                document.createElement(
                    "div"
                );

            div.className =
                "card";


            div.innerHTML =

                "<h3>Day "
                +
                escapeHTML(day)
                +
                "</h3>"

                +

                "<p>"
                +
                escapeHTML(topic)
                +
                "</p>"

                +

                "<p>"
                +
                "Questions: "
                +
                dayQuestions.length
                +
                "</p>"

                +

                "<button onclick=\"viewDay('"
                +
                escapeJS(day)
                +
                "')\">"
                +
                "View Questions"
                +
                "</button>";


            dayList.appendChild(
                div
            );

        }
    );

}



// ================================================
// VIEW DAY
// ================================================

function viewDay(day){

    let questions =
        JSON.parse(
            localStorage.getItem(
                "questionBank"
            )
            ||
            "[]"
        );


    let dayQuestions =
        questions.filter(
            function(q){

                return String(q.Day)
                ===
                String(day);

            }
        );


    if(
        dayQuestions.length === 0
    ){

        alert(
            "No questions found for Day "
            +
            day
        );

        return;

    }


    let modal =
        document.getElementById(
            "questionModal"
        );


    let modalTitle =
        document.getElementById(
            "modalTitle"
        );


    let modalQuestions =
        document.getElementById(
            "modalQuestions"
        );


    modalTitle.innerText =
        "Day "
        +
        day
        +
        " - "
        +
        dayQuestions.length
        +
        " Questions";


    modalQuestions.innerHTML = "";


    dayQuestions.forEach(
        function(q,index){

            let type =
                String(
                    q["Question Type"]
                    ||
                    ""
                )
                .trim()
                .toUpperCase();


            let questionBox =
                document.createElement(
                    "div"
                );


            questionBox.className =
                "question-item";


            if(type === "MCQ"){

                questionBox.classList.add(
                    "mcq-question"
                );

            }

            else if(type === "ERROR"){

                questionBox.classList.add(
                    "error-question"
                );

            }

            else if(type === "CODING"){

                questionBox.classList.add(
                    "coding-question"
                );

            }


            let html =

                "<div class='question-type'>"
                +
                escapeHTML(type)
                +
                "</div>"

                +

                "<h3>"
                +
                "Question "
                +
                (index + 1)
                +
                ". "
                +
                escapeHTML(
                    String(
                        q.Question
                        ||
                        ""
                    )
                )
                +
                "</h3>";


            if(
                type === "MCQ"
                ||
                type === "ERROR"
            ){

                html +=

                    "<div class='option'>"
                    +
                    "<b>A.</b> "
                    +
                    escapeHTML(
                        String(
                            q["Option A"]
                            ||
                            ""
                        )
                    )
                    +
                    "</div>"

                    +

                    "<div class='option'>"
                    +
                    "<b>B.</b> "
                    +
                    escapeHTML(
                        String(
                            q["Option B"]
                            ||
                            ""
                        )
                    )
                    +
                    "</div>"

                    +

                    "<div class='option'>"
                    +
                    "<b>C.</b> "
                    +
                    escapeHTML(
                        String(
                            q["Option C"]
                            ||
                            ""
                        )
                    )
                    +
                    "</div>"

                    +

                    "<div class='option'>"
                    +
                    "<b>D.</b> "
                    +
                    escapeHTML(
                        String(
                            q["Option D"]
                            ||
                            ""
                        )
                    )
                    +
                    "</div>";

            }


            if(
                type === "CODING"
            ){

                html +=

                    "<div class='coding-box'>"

                    +

                    "<b>Coding Requirement:</b>"

                    +

                    "<br><br>"

                    +

                    escapeHTML(
                        String(
                            q[
                                "Coding Requirement"
                            ]
                            ||
                            q.Question
                            ||
                            ""
                        )
                    )

                    +

                    "</div>";

            }


            questionBox.innerHTML =
                html;


            modalQuestions.appendChild(
                questionBox
            );

        }
    );


    modal.style.display =
        "block";

}



// ================================================
// CLOSE QUESTION VIEWER
// ================================================

function closeQuestionModal(){

    document.getElementById(
        "questionModal"
    ).style.display =
        "none";

}


window.onclick =
    function(event){

        let modal =
            document.getElementById(
                "questionModal"
            );

        if(
            event.target === modal
        ){

            modal.style.display =
                "none";

        }

    };



// ================================================
// STUDENT MANAGEMENT
// ================================================

function studentManagement(){

    window.location.href =
        "students.html";

}



// ================================================
// REPORTS
// ================================================

function viewReports(){

    alert(
        "Reports section will be connected next."
    );

}



// ================================================
// ESCAPE HTML
// ================================================

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ================================================
// ESCAPE JAVASCRIPT
// ================================================

function escapeJS(value){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        );

}



// ================================================
// LOAD SAVED QUESTION BANK
// ================================================

window.onload =
    function(){

        let saved =
            localStorage.getItem(
                "questionBank"
            );


        let savedDays =
            localStorage.getItem(
                "questionBankDays"
            );


        if(
            saved
            &&
            savedDays
        ){

            let questions =
                JSON.parse(
                    saved
                );


            let days =
                JSON.parse(
                    savedDays
                );


            showSummary(
                questions,
                days
            );


            document.getElementById(
                "importStatus"
            ).innerHTML =
                "✅ Previously imported question bank loaded.";

        }

    };


</script>


</body>

</html>
