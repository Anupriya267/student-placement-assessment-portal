<style>

/* =========================================================
   ASSESSMENT DESIGN ONLY
   NO DATA OR FUNCTIONALITY CHANGES
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #1e293b;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(40,85,217,.12),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 100%,
            rgba(16,185,129,.08),
            transparent 32%
        ),
        #f4f7fb;
}

/* =========================
   MAIN CONTAINER
========================= */

.container {

    width: min(
        1100px,
        calc(100% - 32px)
    );

    margin: 0 auto;

    padding: 110px 0 50px;
}

/* =========================
   FIXED HEADER
========================= */

.header {

    position: fixed;

    z-index: 8000;

    top: 0;
    left: 0;
    right: 0;

    width: 100%;

    margin: 0;

    padding:
        15px
        max(16px, calc((100% - 1100px) / 2));

    border-radius: 0;

    background:
        rgba(255,255,255,.97);

    border-bottom:
        1px solid #e5e7eb;

    box-shadow:
        0 4px 18px
        rgba(15,23,42,.08);

    backdrop-filter:
        blur(10px);
}

.header h1 {

    margin: 0 0 8px;

    color: #1746b8;

    font-size: 22px;

    font-weight: 800;
}

.header div {

    display: inline-block;

    margin-right: 22px;

    color: #64748b;

    font-size: 14px;
}

.header b {

    color: #1e293b;
}

/* =========================
   QUESTION CARD
========================= */

.question-card {

    background: #ffffff;

    padding: 24px;

    margin-bottom: 18px;

    border:
        1px solid #e2e8f0;

    border-radius: 16px;

    box-shadow:
        0 7px 24px
        rgba(15,23,42,.06);
}

/* =========================
   QUESTION TITLE
========================= */

.question-title {

    font-weight: 800;

    margin-bottom: 16px;

    font-size: 18px;

    line-height: 1.55;

    color: #1e293b;
}

/* =========================
   MCQ OPTIONS
========================= */

.option {

    display: block;

    margin: 10px 0;

    padding: 14px;

    border:
        1px solid #dbe3ef;

    border-radius: 10px;

    cursor: pointer;

    background: #f8fafc;

    transition:
        .18s ease;
}

.option:hover {

    background: #eef4ff;

    border-color: #9db7ee;
}

.option input {

    margin-right: 9px;
}

/* =========================
   TEXT AREA / CODING
========================= */

textarea {

    width: 100%;

    min-height: 220px;

    padding: 14px;

    box-sizing: border-box;

    font-family:
        Consolas,
        Monaco,
        monospace;

    font-size: 14px;

    border:
        1px solid #cbd5e1;

    border-radius: 10px;

    resize: vertical;

    background: #0f172a;

    color: #e2e8f0;

    outline: none;
}

textarea:focus {

    border-color: #2855d9;

    box-shadow:
        0 0 0 3px
        rgba(40,85,217,.12);
}

/* =========================
   TIMER
========================= */

.timer {

    position: sticky;

    top: 86px;

    z-index: 7000;

    background:
        linear-gradient(
            135deg,
            #172033,
            #0f172a
        );

    color: #ffffff;

    padding: 14px;

    text-align: center;

    border-radius: 12px;

    margin-bottom: 20px;

    font-size: 22px;

    font-weight: 800;

    box-shadow:
        0 6px 18px
        rgba(15,23,42,.16);
}

/* =========================
   SUBMIT BUTTON
========================= */

.submit-btn {

    width: 100%;

    padding: 16px;

    background: #2855d9;

    color: #ffffff;

    border: none;

    border-radius: 11px;

    font-size: 18px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 6px 16px
        rgba(40,85,217,.20);
}

.submit-btn:hover {

    background: #1746b8;
}

/* =========================
   SECTION TITLE
========================= */

.section-title {

    background:
        linear-gradient(
            135deg,
            #eef4ff,
            #f5f7ff
        );

    border:
        1px solid #dbe5ff;

    color: #1746b8;

    padding: 14px 16px;

    border-radius: 11px;

    margin: 25px 0 15px;

    font-size: 20px;

    font-weight: 800;
}

/* =========================
   LOADING
========================= */

.loading {

    text-align: center;

    background: #ffffff;

    padding: 30px;

    border-radius: 12px;

    box-shadow:
        0 6px 20px
        rgba(15,23,42,.06);
}

/* =========================
   ERROR
========================= */

.error {

    background: #fff1f1;

    border:
        1px solid #e0aaaa;

    padding: 20px;

    border-radius: 12px;

    color: #a00000;
}

/* =========================
   ERROR CODE
========================= */

.error-code-title {

    margin: 12px 0 6px;

    font-weight: 800;

    color: #9a5a00;
}

.error-code {

    background: #0f172a;

    color: #f5f5f5;

    padding: 14px;

    border-radius: 10px;

    overflow: auto;

    font-family:
        Consolas,
        Monaco,
        monospace;

    font-size: 14px;

    line-height: 1.5;

    white-space: pre-wrap;
}

/* =========================
   STATUS NOTE
========================= */

.status-note {

    background: #fff8e6;

    border:
        1px solid #f0d58a;

    padding: 12px 14px;

    border-radius: 10px;

    margin-bottom: 15px;

    color: #7c5a00;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .container {

        width: calc(100% - 16px);

        padding:
            150px 0 30px;
    }

    .header {

        padding:
            12px 14px;
    }

    .header h1 {

        font-size: 18px;
    }

    .header div {

        display: block;

        margin: 4px 0;

        font-size: 13px;
    }

    .timer {

        top: 135px;

        font-size: 19px;
    }

    .question-card {

        padding: 17px;
    }

    .question-title {

        font-size: 16px;
    }

    .section-title {

        font-size: 17px;
    }

    .option {

        padding: 12px;
    }

    textarea {

        min-height: 180px;

        font-size: 13px;
    }

    .submit-btn {

        min-height: 48px;
    }
}

</style>
