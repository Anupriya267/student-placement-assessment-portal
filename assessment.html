<!DOCTYPE html>
<html>
<head>
    <title>Java Placement Assessment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        #timer {
            position: sticky;
            top: 0;
            background: #222;
            color: white;
            padding: 12px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .question {
            padding: 18px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .option {
            display: block;
            padding: 8px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            box-sizing: border-box;
            font-family: monospace;
            padding: 10px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Java Placement Assessment</h1>

    <div id="timer">40:00</div>

    <div id="questions">
        Loading questions...
    </div>

    <button onclick="submitTest()">Submit Assessment</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="java_question_bank.js"></script>
<script>

let questions = [];
let timeLeft = 40 * 60;
let submitted = false;


/* ================= LOAD EXCEL ================= */

async function loadQuestions() {

    const box = document.getElementById("questions");

    try {

        const response = await fetch(
            "Java_Placement_41_Day_FINAL_Import_Ready.xlsx"
        );

        if (!response.ok) {
            throw new Error("Excel file not found");
        }

        const data = await response.arrayBuffer();

        const workbook = XLSX.read(data, {
            type: "array"
        });

        const sheet =
            workbook.Sheets["Question Bank"];

        if (!sheet) {
            throw new Error("Question Bank sheet not found");
        }

        const rows =
            XLSX.utils.sheet_to_json(sheet);

        const day =
            localStorage.getItem("assignedDay") || "1";

        questions =
            rows.filter(q =>
                String(q.Day).trim() === String(day).trim()
            );

        if (questions.length === 0) {

            box.innerHTML =
                "<h3>No questions available for Day " +
                day +
                "</h3>";

            return;
        }

        displayQuestions();

    } catch (error) {

        box.innerHTML =
            "<h3>Unable to load question bank.</h3>" +
            "<p>Make sure the Excel file is in the GitHub repository root.</p>";

        console.error(error);
    }
}


/* ================= DISPLAY ================= */

function displayQuestions() {

    const box =
        document.getElementById("questions");

    box.innerHTML = "";

    questions.forEach((q, index) => {

        const number = index + 1;

        const type =
            String(q["Question Type"] || "")
            .trim()
            .toUpperCase();

        let html =
            '<div class="question">' +
            '<h3>Question ' +
            number +
            '</h3>' +
            '<p><b>' +
            q.Question +
            '</b></p>';

        if (type === "MCQ" || type === "ERROR") {

            const options = [
                ["A", q["Option A"]],
                ["B", q["Option B"]],
                ["C", q["Option C"]],
                ["D", q["Option D"]]
            ];

            options.forEach(option => {

                if (option[1]) {

                    html +=
                        '<label class="option">' +
                        '<input type="radio" name="q' +
                        number +
                        '" value="' +
                        option[0] +
                        '">' +
                        ' ' +
                        option[0] +
                        ') ' +
                        option[1] +
                        '</label>';
                }
            });

        } else if (type === "CODING") {

            html +=
                '<textarea id="code' +
                number +
                '" placeholder="Write your Java code here..."></textarea>';
        }

        html += "</div>";

        box.innerHTML += html;
    });
}


/* ================= SUBMIT ================= */

function submitTest() {

    if (submitted) return;

    submitted = true;

    let score = 0;
    let objectiveTotal = 0;
    let answers = [];

    questions.forEach((q, index) => {

        const number = index + 1;

        const type =
            String(q["Question Type"] || "")
            .trim()
            .toUpperCase();

        if (type === "MCQ" || type === "ERROR") {

            objectiveTotal++;

            const selected =
                document.querySelector(
                    'input[name="q' +
                    number +
                    '"]:checked'
                );

            const studentAnswer =
                selected
                ? selected.value
                : "Not Answered";

            const correct =
                String(q["Correct Answer"] || "")
                .trim();

            const isCorrect =
                studentAnswer === correct;

            if (isCorrect) score++;

            answers.push({
                question: q.Question,
                studentAnswer: studentAnswer,
                correctAnswer: correct,
                status: isCorrect ? "Correct" : "Wrong"
            });

        } else if (type === "CODING") {

            const code =
                document.getElementById(
                    "code" + number
                );

            answers.push({
                question: q.Question,
                studentAnswer:
                    code && code.value.trim()
                    ? code.value.trim()
                    : "Not Answered",
                correctAnswer: "Pending coding evaluation",
                status: "Pending"
            });
        }
    });


    localStorage.setItem(
        "score",
        score
    );

    localStorage.setItem(
        "total",
        objectiveTotal
    );

    localStorage.setItem(
        "answerSheet",
        JSON.stringify(answers)
    );

    localStorage.setItem(
        "submittedDay",
        localStorage.getItem("assignedDay") || "1"
    );

    window.location.href = "results.html";
}


/* ================= TIMER ================= */

function startTimer() {

    const timer =
        document.getElementById("timer");

    const interval =
        setInterval(function () {

            if (submitted) {
                clearInterval(interval);
                return;
            }

            let minutes =
                Math.floor(timeLeft / 60);

            let seconds =
                timeLeft % 60;

            timer.textContent =
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0");

            if (timeLeft <= 0) {

                clearInterval(interval);

                alert("Time is over. Assessment submitted.");

                submitTest();

                return;
            }

            timeLeft--;

        }, 1000);
}


/* ================= START ================= */

window.onload = function () {

    loadQuestions();

    startTimer();

};

</script>

</body>
</html>
