<!DOCTYPE html>
<html>

<head>

<title>Java Placement Assessment</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

<h1>Java Placement Assessment</h1>

<h2 id="assessmentTitle">
Loading Assessment...
</h2>

<div class="card">

<h3>Time Remaining</h3>

<h2 id="timer">40:00</h2>

</div>

<div id="questionContainer">

<p>Loading questions...</p>

</div>

<br>

<button
    type="button"
    onclick="submitAssessment()"
>
Submit Assessment
</button>

</div>


<!-- QUESTION BANK FIRST -->

<script src="java_question_bank.js"></script>

<!-- MAIN SCRIPT SECOND -->

<script src="script.js"></script>


<script>

// ================= LOAD QUESTIONS =================

function loadAssessment(){

    if(!window.QUESTION_BANK){

        document.getElementById(
            "questionContainer"
        ).innerHTML =
            "<p>Question bank could not be loaded.</p>";

        return;

    }


    let assignedDay =
        localStorage.getItem("assignedDay") || "1";


    let questions =
        window.QUESTION_BANK.filter(function(q){

            return String(q.Day).trim() ===
                   String(assignedDay).trim();

        });


    if(questions.length === 0){

        document.getElementById(
            "questionContainer"
        ).innerHTML =
            "<p>No questions available for Day " +
            assignedDay +
            ".</p>";

        return;

    }


    document.getElementById(
        "assessmentTitle"
    ).innerText =
        "Day " +
        assignedDay +
        " Java Placement Assessment";


    let container =
        document.getElementById(
            "questionContainer"
        );


    container.innerHTML = "";


    let mcqCount = 0;
    let errorCount = 0;
    let codingCount = 0;


    questions.forEach(function(q){

        let type =
            String(
                q.QuestionType || ""
            )
            .trim()
            .toUpperCase();


        // ================= MCQ =================

        if(type === "MCQ"){

            mcqCount++;


            container.innerHTML +=

                "<div class='card'>" +

                "<h3>" +
                mcqCount +
                ". " +
                escapeHTML(q.Question) +
                "</h3>" +

                option(
                    "mcq_" + mcqCount,
                    "A",
                    q.OptionA
                ) +

                option(
                    "mcq_" + mcqCount,
                    "B",
                    q.OptionB
                ) +

                option(
                    "mcq_" + mcqCount,
                    "C",
                    q.OptionC
                ) +

                option(
                    "mcq_" + mcqCount,
                    "D",
                    q.OptionD
                ) +

                "</div>";

        }


        // ================= ERROR =================

        else if(
            type === "ERROR" ||
            type === "ERROR CORRECTION"
        ){

            errorCount++;


            container.innerHTML +=

                "<div class='card'>" +

                "<h3>" +
                "Error Correction " +
                errorCount +
                "</h3>" +

                "<p>" +
                escapeHTML(q.Question) +
                "</p>" +

                option(
                    "error_" + errorCount,
                    "A",
                    q.OptionA
                ) +

                option(
                    "error_" + errorCount,
                    "B",
                    q.OptionB
                ) +

                option(
                    "error_" + errorCount,
                    "C",
                    q.OptionC
                ) +

                option(
                    "error_" + errorCount,
                    "D",
                    q.OptionD
                ) +

                "</div>";

        }


        // ================= CODING =================

        else if(type === "CODING"){

            codingCount++;


            container.innerHTML +=

                "<div class='card'>" +

                "<h3>" +
                "Coding Question " +
                codingCount +
                "</h3>" +

                "<p>" +
                escapeHTML(q.Question) +
                "</p>" +

                "<textarea " +
                "id='coding_" +
                codingCount +
                "' " +
                "rows='10' " +
                "placeholder='Write your Java code here...'>" +
                "</textarea>" +

                "</div>";

        }

    });

}


// ================= OPTION =================

function option(
    name,
    value,
    text
){

    return (

        "<label>" +

        "<input " +
        "type='radio' " +
        "name='" +
        name +
        "' " +
        "value='" +
        value +
        "'>" +

        " " +
        value +
        ". " +

        escapeHTML(text) +

        "</label><br>"

    );

}


// ================= SECURITY =================

function escapeHTML(value){

    if(value === undefined ||
       value === null){

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


// ================= SUBMIT =================

function submitAssessment(){

    let responses = {};


    document
        .querySelectorAll(
            "input[type='radio']:checked"
        )
        .forEach(function(input){

            responses[input.name] =
                input.value;

        });


    document
        .querySelectorAll("textarea")
        .forEach(function(box){

            responses[box.id] =
                box.value;

        });


    localStorage.setItem(
        "studentResponses",
        JSON.stringify(responses)
    );


    // Use new scoring function

    calculateAndSaveResult();

}


// ================= TIMER =================

let timeRemaining = 40 * 60;


let timer =
    setInterval(function(){

        let timerBox =
            document.getElementById("timer");


        if(!timerBox){

            clearInterval(timer);

            return;

        }


        let minutes =
            Math.floor(
                timeRemaining / 60
            );


        let seconds =
            timeRemaining % 60;


        timerBox.innerText =
            minutes +
            ":" +
            (seconds < 10 ? "0" : "") +
            seconds;


        timeRemaining--;


        if(timeRemaining < 0){

            clearInterval(timer);


            alert(
                "Time is over. Assessment submitted automatically."
            );


            calculateAndSaveResult();

        }

    }, 1000);


// ================= START =================

window.onload = function(){

    loadAssessment();

};

</script>

</body>

</html>
