/* =====================================================

===================================================== */

const currentDay =

const currentTopic =

document.getElementById("studentYear")

document.getElementById("dayNumber")
    .textContent = currentDay;


document.getElementById("topicName")

/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzS_bzFzjBlBo_k6Jdm0w7qulI0PJypJglUqnYe4pnBXuj4p54A0iahIZfumbSrSzd3Ow/exec";


/* =====================================================
   EXCEL FILES
===================================================== */

const EXCEL_FILES = [

    "./Java_Placement_41_Day_MASTER_WITH_CODING_EVALUATION.xlsx",

    "./Java_Placement_41_Day_FINAL_CORRECTED.xlsx"

];


let mcqQuestions = [];

let errorQuestions = [];

let codingQuestions = [];

let timerInterval;

let timeLeft = 40 * 60;

let submitted = false;


/* =====================================================
   LOAD QUESTIONS
===================================================== */

async function loadQuestions(){

    let workbook = null;


    for(const file of EXCEL_FILES){

        try{

            const response =
                await fetch(file);


            if(!response.ok){
                continue;
            }


            const arrayBuffer =
                await response.arrayBuffer();


            workbook =
                XLSX.read(
                    arrayBuffer,
                    {
                        type:"array"
                    }
                );


            break;


        }catch(error){

            console.log(
                "Could not load:",
                file
            );

        }

    }


    if(!workbook){

        document.getElementById("loading")
            .innerHTML =

            '<div class="error">' +
            'Unable to load Excel question file.' +
            '</div>';

        return;

    }


    const sheet =
        workbook.Sheets["Question Bank"];


    if(!sheet){

        document.getElementById("loading")
            .innerHTML =

            '<div class="error">' +
            'Question Bank sheet not found.' +
            '</div>';

        return;

    }


    const rows =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                defval:""
            }
        );


    processQuestions(rows);

}


/* =====================================================
   PROCESS QUESTIONS
===================================================== */

function processQuestions(rows){

    const dayRows =
        rows.filter(row => {

            const day =
                parseInt(
                    row.Day ||
                    row.DAY ||
                    row.day ||
                    0
                );


            return day === currentDay;

        });


    mcqQuestions =
        dayRows.filter(row => {

            const type =
                String(
                    row.Type ||
                    row.Question_Type ||
                    row["Question Type"] ||
                    row.Category ||
                    ""
                ).toUpperCase();


            return type.includes("MCQ");

        });


    errorQuestions =
        dayRows.filter(row => {

            const type =
                String(
                    row.Type ||
                    row.Question_Type ||
                    row["Question Type"] ||
                    row.Category ||
                    ""
                ).toUpperCase();


            return type.includes("ERROR");

        });


    codingQuestions =
        dayRows.filter(row => {

            const type =
                String(
                    row.Type ||
                    row.Question_Type ||
                    row["Question Type"] ||
                    row.Category ||
                    ""
                ).toUpperCase();


            return type.includes("CODING");

        });


    mcqQuestions =
        shuffle(mcqQuestions).slice(0,10);


    errorQuestions =
        shuffle(errorQuestions).slice(0,2);


    codingQuestions =
        shuffle(codingQuestions).slice(0,3);


    if(
        mcqQuestions.length < 10 ||
        errorQuestions.length < 2 ||
        codingQuestions.length < 3
    ){

        document.getElementById("loading")
            .innerHTML =

            '<div class="error">' +

            'Questions are incomplete for Day ' +
            currentDay +

            '. Required: 10 MCQ + 2 Error + 3 Coding.' +

            '</div>';

        return;

    }


    renderMCQ();

    renderError();

    renderCoding();


    document.getElementById("loading")
        .style.display = "none";


    document.getElementById("assessmentArea")
        .style.display = "block";

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

    const copy = [...array];


    for(
        let i = copy.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [copy[i],copy[j]] =
        [copy[j],copy[i]];

    }


    return copy;

}


/* =====================================================
   QUESTION TEXT
===================================================== */

function getQuestion(row){

    return String(

        row.Question ||

        row.question ||

        row["Question Text"] ||

        row["Question"] ||

        ""

    );

}


/* =====================================================
   OPTION
===================================================== */

function getOption(row,letter){

    return String(

        row["Option " + letter] ||

        row["Option_" + letter] ||

        row[letter] ||

        ""

    );

}


/* =====================================================
   MCQ
===================================================== */

function renderMCQ(){

    const container =
        document.getElementById(
            "mcqContainer"
        );


    container.innerHTML = "";


    mcqQuestions.forEach(
        (row,index) => {


        const div =
            document.createElement("div");


        div.className =
            "question";


        div.innerHTML = `

        <div class="question-title">

            ${index + 1}.
            ${escapeHTML(
                getQuestion(row)
            )}

        </div>


        ${["A","B","C","D"]
            .map(letter => `

            <label class="option">

                <input
                    type="radio"
                    name="mcq_${index}"
                    value="${letter}"
                >

                ${escapeHTML(
                    getOption(row,letter)
                )}

            </label>

        `).join("")}

        `;


        container.appendChild(div);

    });

}

/* =====================================================
   CODING EVALUATOR
===================================================== */

function evaluateCoding(code,question){

    if(
        !code ||
        code.trim().length < 20
    ){

        return {
            status:"Wrong",
            score:0
        };

    }


    const c =
        code.toLowerCase();


    const q =
        getQuestion(question)
            .toLowerCase();


    let score = 0;

    let required = 0;


    /* JAVA STRUCTURE */

    required++;


    if(
        c.includes("class") ||
        c.includes("public static") ||
        c.includes("static void")
    ){

        score++;

    }


    /* LOOP */

    const hasLoop =

        c.includes("for(") ||
        c.includes("for (") ||
        c.includes("while(") ||
        c.includes("while (") ||
        c.includes("do{") ||
        c.includes("do {");


    const needsLoop =

        q.includes("loop") ||
        q.includes("series") ||
        q.includes("digits") ||
        q.includes("prime") ||
        q.includes("repeat") ||
        q.includes("iterate");


    if(needsLoop){

        required++;


        if(hasLoop){
            score++;
        }

    }


    /* CONDITION */

    const hasCondition =

        c.includes("if(") ||
        c.includes("if (") ||
        c.includes("switch(") ||
        c.includes("switch (");


    const needsCondition =

        q.includes("check") ||
        q.includes("whether") ||
        q.includes("condition") ||
        q.includes("prime") ||
        q.includes("even") ||
        q.includes("odd");


    if(needsCondition){

        required++;


        if(hasCondition){
            score++;
        }

    }


    /* ARRAY */

    const needsArray =

        q.includes("array") ||
        q.includes("element");


    if(needsArray){

        required++;


        if(
            c.includes("[]") ||
            c.includes("array")
        ){

            score++;

        }

    }


    /* STRING */

    const needsString =

        q.includes("string") ||
        q.includes("character") ||
        q.includes("palindrome") ||
        q.includes("reverse");


    if(needsString){

        required++;


        if(
            c.includes("string") ||
            c.includes(".length") ||
            c.includes("charat") ||
            c.includes("substring") ||
            c.includes("equals")
        ){

            score++;

        }

    }


    /* DIGIT SUM */

    if(
        q.includes("sum of digits") ||
        q.includes("sum of digit")
    ){

        required += 2;


        if(c.includes("%")){
            score++;
        }


        if(c.includes("/")){
            score++;
        }

    }


    /* FIBONACCI */

    if(q.includes("fibonacci")){

        required += 2;


        if(
            c.includes("+") &&
            hasLoop
        ){

            score++;

        }


        if(
            c.includes("a") &&
            c.includes("b") &&
            c.includes("+")
        ){

            score++;

        }

    }


    /* PRIME */

    if(q.includes("prime")){

        required += 2;


        if(hasLoop){
            score++;
        }


        if(c.includes("%")){
            score++;
        }

    }


    /* OOPS */

    const needsOOP =

        q.includes("class") ||
        q.includes("object") ||
        q.includes("inheritance") ||
        q.includes("polymorphism") ||
        q.includes("encapsulation") ||
        q.includes("constructor");


    if(needsOOP){

        required++;


        if(
            c.includes("class") ||
            c.includes("extends") ||
            c.includes("implements") ||
            c.includes("new ")
        ){

            score++;

        }

    }


    /* METHODS */

    if(
        q.includes("method") ||
        q.includes("function")
    ){

        required++;


        if(
            c.includes("(") &&
            c.includes(")")
        ){

            score++;

        }

    }


    /* COLLECTIONS */

    const needsCollection =

        q.includes("arraylist") ||
        q.includes("hashmap") ||
        q.includes("hashset") ||
        q.includes("list") ||
        q.includes("set") ||
        q.includes("map");


    if(needsCollection){

        required++;


        if(
            c.includes("arraylist") ||
            c.includes("hashmap") ||
            c.includes("hashset") ||
            c.includes("list<") ||
            c.includes("map<")
        ){

            score++;

        }

    }


    const ratio =
        required > 0
        ?
        score / required
        :
        0;


    if(ratio >= 0.75){

        return {
            status:"Complete",
            score:1
        };

    }


    if(ratio >= 0.35){

        return {
            status:"Partially Correct",
            score:0.5
        };

    }


    return {
        status:"Wrong",
        score:0
    };

}


/* =====================================================
   COLLECT ANSWERS
===================================================== */

function collectAnswers(){

    const answers = [];


    /* MCQ */

    mcqQuestions.forEach(
        (row,index) => {


        const selected =
            document.querySelector(
                `input[name="mcq_${index}"]:checked`
            );


        answers.push({

            type:"MCQ",

            question:
                getQuestion(row),

            answer:
                selected
                ?
                selected.value
                :
                "",

            correctAnswer:
                String(
                    row["Correct Answer"] ||
                    row.Answer ||
                    row["Correct"] ||
                    ""
                )

        });

    });


    /* ERROR */

    errorQuestions.forEach(
        (row,index) => {


        const field =
            document.getElementById(
                `error_${index}`
            );


        answers.push({

            type:"ERROR",

            question:
                getQuestion(row),

            answer:
                field
                ?
                field.value
                :
                "",

            correctAnswer:
                String(
                    row["Correct Answer"] ||
                    row.Answer ||
                    row["Correct"] ||
                    ""
                )

        });

    });


    /* CODING */

    codingQuestions.forEach(
        (row,index) => {


        const field =
            document.getElementById(
                `coding_${index}`
            );


        const code =
            field
            ?
            field.value
            :
            "";


        const evaluation =
            evaluateCoding(
                code,
                row
            );


        answers.push({

            type:"CODING",

            question:
                getQuestion(row),

            code:
                code,

            status:
                evaluation.status,

            score:
                evaluation.score,

            evaluation:
                "Automatic rubric evaluation"

        });

    });


    return answers;

}


/* =====================================================
   SEND RESULT TO GOOGLE SHEET
===================================================== */

async function sendResultToGoogleSheet(result){

    try{

        /*
           We use text/plain so the browser can
           send the request without a CORS preflight.
        */

        await fetch(
            GOOGLE_SCRIPT_URL,
            {

                method:"POST",

                mode:"no-cors",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(result)

            }
        );


        console.log(
            "Result sent to Google Sheet."
        );


        return true;


    }catch(error){

        console.error(
            "Google Sheet error:",
            error
        );


        return false;

    }

}


/* =====================================================
   SUBMIT ASSESSMENT
===================================================== */

async function submitAssessment(
    automaticSubmit = false
){

    if(submitted){
        return;
    }


    if(!automaticSubmit){

        const confirmSubmit =
            confirm(
                "Are you sure you want to submit the assessment?"
            );


        if(!confirmSubmit){
            return;
        }

    }


    submitted = true;


    clearInterval(timerInterval);


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    submitButton.disabled = true;


    submitButton.textContent =
        "Saving Result...";


    const answers =
        collectAnswers();


    /* MCQ */

    let mcqScore = 0;


    answers
        .filter(
            answer =>
                answer.type === "MCQ"
        )
        .forEach(answer => {


        if(

            String(answer.answer)
                .trim()
                .toUpperCase()

            ===

            String(answer.correctAnswer)
                .trim()
                .toUpperCase()

        ){

            mcqScore++;

        }

    });


    /* ERROR */

    let errorScore = 0;


    answers
        .filter(
            answer =>
                answer.type === "ERROR"
        )
        .forEach(answer => {


        if(

            answer.answer &&
            answer.answer.trim() !== "" &&
            answer.correctAnswer &&
            answer.correctAnswer.trim() !== ""

        ){

            if(

                answer.answer
                    .toLowerCase()
                    .includes(
                        answer.correctAnswer
                            .toLowerCase()
                            .trim()
                    )

            ){

                errorScore++;

            }

        }

    });


    /* CODING */

    let codingScore = 0;


    answers
        .filter(
            answer =>
                answer.type === "CODING"
        )
        .forEach(answer => {

            codingScore +=
                Number(
                    answer.score || 0
                );

        });


    /* TOTAL */

    const totalScore =
        mcqScore +
        errorScore +
        codingScore;


    const maxScore = 15;


    const percentage =
        (totalScore / maxScore) * 100;


    const result = {

        studentName:
            studentName,

        username:
            localStorage.getItem(
                "username"
            ) ||
            localStorage.getItem(
                "studentUsername"
            ) ||
            studentName,

        studentYear:
            studentYear,

        day:
            currentDay,

        topic:
            currentTopic,

        mcqScore:
            mcqScore,

        errorScore:
            errorScore,

        codingScore:
            codingScore,

        totalScore:
            totalScore,

        maxScore:
            maxScore,

        percentage:
            Number(
                percentage.toFixed(2)
            ),

        status:
            "Completed",

        answers:
            answers,

        submittedAt:
            new Date().toISOString()

    };


    /* SAVE LOCALLY FIRST */

    localStorage.setItem(

        "latestAssessmentResult",

        JSON.stringify(result)

    );


    let previousResults = [];


    try{

        previousResults =
            JSON.parse(
                localStorage.getItem(
                    "assessmentResults"
                )
            ) || [];


    }catch(error){

        previousResults = [];

    }


    previousResults.push(result);


    localStorage.setItem(

        "assessmentResults",

        JSON.stringify(
            previousResults
        )

    );


    localStorage.setItem(
        "lastScore",
        String(totalScore)
    );


    localStorage.setItem(
        "lastPercentage",
        String(
            percentage.toFixed(2)
        )
    );


    /* SEND TO GOOGLE SHEET */

    await sendResultToGoogleSheet(
        result
    );


    /* GO TO RESULTS */

    window.location.href =
        "results.html";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    timerInterval =
        setInterval(
            () => {


            const minutes =
                Math.floor(
                    timeLeft / 60
                );


            const seconds =
                timeLeft % 60;


            document.getElementById(
                "timer"
            ).textContent =

                String(minutes)
                    .padStart(2,"0")

                +

                ":"

                +

                String(seconds)
                    .padStart(2,"0");


            if(timeLeft <= 0){

                clearInterval(
                    timerInterval
                );


                alert(
                    "Time is over. Your assessment will be submitted automatically."
                );


                submitAssessment(true);


                return;

            }


            timeLeft--;


        },1000);

}


/* =====================================================
   START
===================================================== */

loadQuestions();

startTimer();

</script>
