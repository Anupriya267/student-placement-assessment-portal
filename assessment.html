<!DOCTYPE html>
<html>

<head>

<title>Java Placement Assessment</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

<h1>Java Placement Assessment</h1>

<div class="card">

<h2 id="assessmentTitle">
Java Placement Assessment
</h2>

<p>
<strong>Time:</strong> 40 Minutes
</p>

<h2>
Time Remaining
</h2>

<h1 id="timer">40:00</h1>

</div>


<div id="questionContainer">

<p>Loading assessment...</p>

</div>


<button onclick="submitAssessment()">
Submit Assessment
</button>

</div>


<script>

/* ===============================
   GET IMPORTED QUESTION BANK
================================ */

let questionBank =
    JSON.parse(
        localStorage.getItem("questionBank") || "[]"
    );


/*
   Student's assigned day.

   For now Day 1 is used.
   Later we will connect this
   automatically to student.html.
*/

let assignedDay =
    localStorage.getItem("assignedDay") || "1";


let dayQuestions =
    questionBank.filter(function(q){

        return String(q.Day) === String(assignedDay);

    });


/* ===============================
   DISPLAY QUESTIONS
================================ */

function loadAssessment(){

    let container =
        document.getElementById(
            "questionContainer"
        );


    if(dayQuestions.length === 0){

        container.innerHTML =

            "<div class='card'>" +

            "<h2>No Assessment Found</h2>" +

            "<p>" +
            "No questions are available for Day " +
            assignedDay +
            "." +
            "</p>" +

            "</div>";

        return;

    }


    document.getElementById(
        "assessmentTitle"
    ).innerText =
        "Day " + assignedDay +
        " Java Placement Assessment";


    container.innerHTML = "";


    let mcqNumber = 1;
    let errorNumber = 1;
    let codingNumber = 1;


    dayQuestions.forEach(function(q){

        let type =
            String(q["Question Type"])
            .toUpperCase();


        /* ================= MCQ ================= */

        if(type === "MCQ"){

            let card =
                document.createElement("div");

            card.className = "card";


            let html =

                "<h3>MCQ " +
                mcqNumber +
                "</h3>" +

                "<p>" +
                escapeHTML(q.Question) +
                "</p>" +

                "<label>" +
                "<input type='radio' " +
                "name='mcq_" +
                mcqNumber +
                "' " +
                "value='A'>" +
                " A. " +
                escapeHTML(q["Option A"]) +
                "</label><br>" +

                "<label>" +
                "<input type='radio' " +
                "name='mcq_" +
                mcqNumber +
                "' " +
                "value='B'>" +
                " B. " +
                escapeHTML(q["Option B"]) +
                "</label><br>" +

                "<label>" +
                "<input type='radio' " +
                "name='mcq_" +
                mcqNumber +
                "' " +
                "value='C'>" +
                " C. " +
                escapeHTML(q["Option C"]) +
                "</label><br>" +

                "<label>" +
                "<input type='radio' " +
                "name='mcq_" +
                mcqNumber +
                "' " +
                "value='D'>" +
                " D. " +
                escapeHTML(q["Option D"]) +
                "</label>";


            card.innerHTML = html;

            container.appendChild(card);

            mcqNumber++;

        }


        /* ================= ERROR ================= */

        else if(type === "ERROR"){

            let card =
                document.createElement("div");

            card.className = "card";


            let html =

                "<h3>Error Correction " +
                errorNumber +
                "</h3>" +

                "<p>" +
                escapeHTML(q.Question) +
                "</p>" +

                "<label>" +
                "<input type='radio' " +
                "name='error_" +
                errorNumber +
                "' " +
                "value='A'>" +
                " A. " +
                escapeHTML(q["Option A"]) +
                "</label><br>" +

                "<label>" +
                "<input type='radio' " +
                "name='error_" +
                errorNumber +
                "' " +
                "value='B'>" +
                " B. " +
                escapeHTML(q["Option B"]) +
                "</label><br>" +

                "<label>" +
                "<input type='radio' " +
                "name='error_" +
                errorNumber +
                "' " +
                "value='C'>" +
                " C. " +
                escapeHTML(q["Option C"]) +
                "</label><br>" +

                "<label>" +
                "<input type='radio' " +
                "name='error_" +
                errorNumber +
                "' " +
                "value='D'>" +
                " D. " +
                escapeHTML(q["Option D"]) +
                "</label>";


            card.innerHTML = html;

            container.appendChild(card);

            errorNumber++;

        }


        /* ================= CODING ================= */

        else if(type === "CODING"){

            let card =
                document.createElement("div");

            card.className = "card";


            let html =

                "<h3>Coding Question " +
                codingNumber +
                "</h3>" +

                "<p>" +
                escapeHTML(q.Question) +
                "</p>" +

                "<textarea " +
                "id='coding_" +
                codingNumber +
                "' " +
                "rows='12' " +
                "style='width:100%;' " +
                "placeholder='Write your Java code here'>" +
                "</textarea>";


            card.innerHTML = html;

            container.appendChild(card);

            codingNumber++;

        }

    });

}


/* ===============================
   SAFE HTML
================================ */

function escapeHTML(value){

    if(value === undefined ||
       value === null){

        return "";

    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ===============================
   SUBMIT
================================ */

function submitAssessment(){

    /*
       For this step we only save the
       student's answers.

       Automatic scoring will be connected
       in the next step.
    */

    let responses = [];


    dayQuestions.forEach(function(q,index){

        let type =
            String(q["Question Type"])
            .toUpperCase();


        let number =
            Number(q["Question No."]);


        if(type === "MCQ"){

            let selected =
                document.querySelector(
                    'input[name="mcq_' +
                    number +
                    '"]:checked'
                );


            responses.push({

                questionType: "MCQ",

                question:
                    q.Question,

                answer:
                    selected
                    ? selected.value
                    : "Not Answered"

            });

        }


        else if(type === "ERROR"){

            let selected =
                document.querySelector(
                    'input[name="error_' +
                    number +
                    '"]:checked'
                );


            responses.push({

                questionType: "ERROR",

                question:
                    q.Question,

                answer:
                    selected
                    ? selected.value
                    : "Not Answered"

            });

        }


        else if(type === "CODING"){

            let box =
                document.getElementById(
                    "coding_" +
                    number
                );


            responses.push({

                questionType: "CODING",

                question:
                    q.Question,

                answer:
                    box
                    ? box.value
                    : ""

            });

        }

    });


    localStorage.setItem(
        "studentResponses",
        JSON.stringify(responses)
    );


    localStorage.setItem(
        "submittedDay",
        assignedDay
    );


    alert(
        "Assessment submitted successfully."
    );


    /*
       Next step will connect this
       to automatic scoring and results.
    */

    window.location.href =
        "results.html";

}


/* ===============================
   START
================================ */

loadAssessment();


/* ===============================
   TIMER
================================ */

let time = 40 * 60;


let timer =
    setInterval(function(){

        let minutes =
            Math.floor(time / 60);

        let seconds =
            time % 60;


        document.getElementById(
            "timer"
        ).innerText =

            minutes +
            ":" +
            (seconds < 10 ? "0" : "") +
            seconds;


        time--;


        if(time < 0){

            clearInterval(timer);

            submitAssessment();

        }

    },1000);

</script>

</body>

</html>
