<!DOCTYPE html>
<html>
<head>

    <title>Java Placement Assessment</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        #timer {
            position: sticky;
            top: 0;
            background: #222;
            color: white;
            padding: 12px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .question {
            padding: 18px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .option {
            display: block;
            padding: 9px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            box-sizing: border-box;
            padding: 10px;
            font-family: monospace;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
        }

        .error {
            color: red;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Java Placement Assessment</h1>

    <div id="timer">40:00</div>

    <div id="questions">
        Loading questions...
    </div>

    <button onclick="submitAssessment()">
        Submit Assessment
    </button>

</div>


<!-- Excel reader -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
</script>


<script>

let questions = [];

let timeLeft = 40 * 60;

let submitted = false;


/* =====================================
   LOAD EXCEL
===================================== */

async function loadQuestions() {

    const questionBox =
        document.getElementById("questions");

    try {

        const response = await fetch(
            "./Java_Placement_41_Day_FINAL_Import_Ready.xlsx"
        );

        if (!response.ok) {

            throw new Error(
                "Excel file could not be loaded"
            );

        }

        const buffer =
            await response.arrayBuffer();

        const workbook =
            XLSX.read(buffer, {
                type: "array"
            });

        const sheet =
            workbook.Sheets["Question Bank"];

        if (!sheet) {

            throw new Error(
                "Question Bank sheet not found"
            );

        }

        const rows =
            XLSX.utils.sheet_to_json(sheet);


        /* ================================
           GET ASSIGNED DAY
        ================================= */

        const assignedDay =
            localStorage.getItem("assignedDay") || "1";


        /* ================================
           FILTER ONLY THAT DAY
        ================================= */

        const dayQuestions =
            rows.filter(function(q) {

                return String(q.Day).trim()
                    === String(assignedDay).trim();

            });


        /* ================================
           SEPARATE QUESTION TYPES
        ================================= */

        const mcqs =
            dayQuestions.filter(function(q) {

                return String(q["Question Type"])
                    .trim()
                    .toUpperCase() === "MCQ";

            });


        const errors =
            dayQuestions.filter(function(q) {

                return String(q["Question Type"])
                    .trim()
                    .toUpperCase() === "ERROR";

            });


        const coding =
            dayQuestions.filter(function(q) {

                return String(q["Question Type"])
                    .trim()
                    .toUpperCase() === "CODING";

            });


        /* ================================
           EXACT DAILY STRUCTURE
        ================================= */

        questions = [

            ...mcqs.slice(0, 10),

            ...errors.slice(0, 2),

            ...coding.slice(0, 3)

        ];


        /* ================================
           VALIDATE
        ================================= */

        if (questions.length === 0) {

            questionBox.innerHTML =
                "<p class='error'>" +
                "No questions found for Day " +
                assignedDay +
                "." +
                "</p>";

            return;

        }


        displayQuestions();

    }

    catch(error) {

        console.error(error);

        questionBox.innerHTML =
            "<p class='error'>" +
            "Unable to load the question bank.<br><br>" +
            "Check that the Excel file is in the " +
            "GitHub repository root." +
            "</p>";

    }

}


/* =====================================
   DISPLAY QUESTIONS
===================================== */

function displayQuestions() {

    const box =
        document.getElementById("questions");

    box.innerHTML = "";


    questions.forEach(function(q, index) {

        const number = index + 1;

        const type =
            String(q["Question Type"])
            .trim()
            .toUpperCase();


        let html =
            "<div class='question'>" +

            "<h3>Question " +
            number +
            "</h3>" +

            "<p><b>" +
            escapeHTML(q.Question) +
            "</b></p>";


        /* ================================
           MCQ / ERROR
        ================================= */

        if (
            type === "MCQ" ||
            type === "ERROR"
        ) {

            const options = [

                ["A", q["Option A"]],

                ["B", q["Option B"]],

                ["C", q["Option C"]],

                ["D", q["Option D"]]

            ];


            options.forEach(function(option) {

                if (option[1]) {

                    html +=

                        "<label class='option'>" +

                        "<input type='radio' " +

                        "name='question_" +
                        number +
                        "' " +

                        "value='" +
                        escapeAttribute(option[0]) +
                        "'>" +

                        " <b>" +
                        option[0] +
                        ")</b> " +

                        escapeHTML(option[1]) +

                        "</label>";

                }

            });

        }


        /* ================================
           CODING
        ================================= */

        else if (type === "CODING") {

            html +=

                "<textarea " +

                "id='coding_" +
                number +
                "' " +

                "placeholder='Write your Java code here...'>" +

                "</textarea>";

        }


        html += "</div>";

        box.innerHTML += html;

    });

}


/* =====================================
   SUBMIT
===================================== */

function submitAssessment() {

    if (submitted) {

        return;

    }


    submitted = true;


    let score = 0;

    let totalObjective = 0;

    let answerSheet = [];


    questions.forEach(function(q, index) {

        const number = index + 1;

        const type =
            String(q["Question Type"])
            .trim()
            .toUpperCase();


        /* ================================
           MCQ / ERROR
        ================================= */

        if (
            type === "MCQ" ||
            type === "ERROR"
        ) {

            totalObjective++;


            const selected =
                document.querySelector(
                    "input[name='question_" +
                    number +
                    "']:checked"
                );


            const studentAnswer =
                selected
                ? selected.value
                : "Not Answered";


            const correctAnswer =
                String(
                    q["Correct Answer"] || ""
                ).trim();


            const correct =
                studentAnswer === correctAnswer;


            if (correct) {

                score++;

            }


            answerSheet.push({

                question:
                    q.Question,

                studentAnswer:
                    studentAnswer,

                correctAnswer:
                    correctAnswer,

                status:
                    correct
                    ? "Correct"
                    : "Wrong"

            });

        }


        /* ================================
           CODING
        ================================= */

        else if (type === "CODING") {

            const codeBox =
                document.getElementById(
                    "coding_" + number
                );


            const code =
                codeBox
                ? codeBox.value.trim()
                : "";


            answerSheet.push({

                question:
                    q.Question,

                studentAnswer:
                    code || "Not Answered",

                correctAnswer:
                    "Pending secure coding evaluation",

                status:
                    "Pending"

            });

        }

    });


    /* ================================
       SAVE RESULTS
    ================================= */

    localStorage.setItem(
        "score",
        score
    );


    localStorage.setItem(
        "total",
        totalObjective
    );


    localStorage.setItem(
        "answerSheet",
        JSON.stringify(answerSheet)
    );


    localStorage.setItem(
        "submittedDay",
        localStorage.getItem("assignedDay") || "1"
    );


    window.location.href =
        "results.html";

}


/* =====================================
   TIMER
===================================== */

function startTimer() {

    const timer =
        document.getElementById("timer");


    const interval =
        setInterval(function() {

            if (submitted) {

                clearInterval(interval);

                return;

            }


            const minutes =
                Math.floor(timeLeft / 60);


            const seconds =
                timeLeft % 60;


            timer.textContent =
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0");


            if (timeLeft <= 0) {

                clearInterval(interval);

                alert(
                    "Time is over. Assessment submitted."
                );

                submitAssessment();

                return;

            }


            timeLeft--;

        }, 1000);

}


/* =====================================
   SECURITY HELPERS
===================================== */

function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return escapeHTML(value);

}


/* =====================================
   START
===================================== */

window.onload = function() {

    loadQuestions();

    startTimer();

};

</script>

</body>
</html>
