<script>

/* =====================================================
   VARIABLES
===================================================== */

let questions = [];

let timeLeft = 40 * 60;

let timerInterval = null;

let assessmentSubmitted = false;


/* =====================================================
   STUDENT DETAILS
===================================================== */

const studentName =
    localStorage.getItem("studentName") || "Student";

const studentUsername =
    localStorage.getItem("studentUsername") || "student1";

const studentYear =
    localStorage.getItem("studentYear") || "Final Year";


/* =====================================================
   GET STUDENT REPORTS
===================================================== */

let reports = [];

try {

    reports =
        JSON.parse(
            localStorage.getItem("studentReports") || "[]"
        );

} catch(error) {

    reports = [];

}


/* =====================================================
   FIND THIS STUDENT'S REPORTS
===================================================== */

const myReports =
    reports.filter(function(report) {

        return String(report.username).trim()
            ===
            String(studentUsername).trim();

    });


/* =====================================================
   DETERMINE CURRENT DAY
===================================================== */

let assignedDay =
    parseInt(
        localStorage.getItem("assignedDay") || "1"
    );


/*
   If reports exist, continue from the highest
   completed day.
*/

if(myReports.length > 0) {

    let completedDays =
        myReports.map(function(report) {

            return parseInt(report.day) || 0;

        });

    let highestCompletedDay =
        Math.max.apply(null, completedDays);


    if(highestCompletedDay >= 1 &&
       highestCompletedDay < 41) {

        assignedDay =
            highestCompletedDay + 1;

    }


    if(highestCompletedDay >= 41) {

        assignedDay = 41;

    }

}


/* =====================================================
   KEEP DAY BETWEEN 1 AND 41
===================================================== */

if(isNaN(assignedDay)) {

    assignedDay = 1;

}

if(assignedDay < 1) {

    assignedDay = 1;

}

if(assignedDay > 41) {

    assignedDay = 41;

}


/*
   Save the correct day.
*/

localStorage.setItem(
    "assignedDay",
    String(assignedDay)
);


/* =====================================================
   TOPICS
===================================================== */

const topics = {

1:
"Loops, Conditions, Operators",

2:
"Loops and Conditional Logic",

3:
"Operators, Conditions and Loops",

4:

5:

11:
"Array and String Basics",

13:

"Array and String Problem Solving",

15:
"String Manipulation",

16:

17:

18:

19:
"Classes and Objects",

20:
"Inheritance and Polymorphism",

21:

41:

};


/* =====================================================
   DISPLAY CURRENT DAY IMMEDIATELY
===================================================== */

document.getElementById("dayNumber").innerText =
    assignedDay;

document.getElementById("assessmentTitle").innerText =
    "Day " +
    assignedDay +
    " Java Placement Assessment";

document.getElementById("topic").innerText =
    topics[assignedDay] ||
    "Java Placement Practice";


/* =====================================================
   LOAD EXCEL QUESTION BANK
===================================================== */

async function loadQuestions() {

    try {

        /*
           Check SheetJS
        */

        if(typeof XLSX === "undefined") {

            throw new Error(
                "Excel reader could not be loaded. Please refresh the page."
            );

        }


        /*
           Load Excel file
        */

        const response =
            await fetch(
                "./Java_Placement_41_Day_FINAL_CORRECTED.xlsx?v=41"
            );


        if(!response.ok) {

            throw new Error(
                "Excel file could not be loaded. HTTP status: "
                +
                response.status
            );

        }


        /*
           Convert Excel to data
        */

        const data =
            await response.arrayBuffer();


        const workbook =
            XLSX.read(
                data,
                {
                    type: "array"
                }
            );


        /*
           Find Question Bank sheet
        */

        const sheet =
            workbook.Sheets["Question Bank"];


        if(!sheet) {

            throw new Error(
                "Question Bank sheet not found in Excel file."
            );

        }


        /*
           Convert rows
        */

        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    defval: ""
                }
            );


        /*
           Get current day's questions
        */

        const dayQuestions =
            rows.filter(function(q) {

                return String(q.Day).trim()
                    ===
                    String(assignedDay).trim();

            });


        /*
           MCQ
        */

        const mcqs =
            dayQuestions.filter(function(q) {

                return String(
                    q["Question Type"] || ""
                )
                .trim()
                .toUpperCase()
                ===
                "MCQ";

            });


        /*
           Error Correction
        */

        const errors =
            dayQuestions.filter(function(q) {

                const type =
                    String(
                        q["Question Type"] || ""
                    )
                    .trim()
                    .toUpperCase();

                return (
                    type === "ERROR"
                    ||
                    type === "ERROR CORRECTION"
                );

            });


        /*
           Coding
        */

        const coding =
            dayQuestions.filter(function(q) {

                return String(
                    q["Question Type"] || ""
                )
                .trim()
                .toUpperCase()
                ===
                "CODING";

            });


        /*
           Final assessment:
           10 MCQ
           2 Error Correction
           3 Coding
        */

        questions = [

            ...mcqs.slice(0, 10),

            ...errors.slice(0, 2),

            ...coding.slice(0, 3)

        ];


        /*
           Validate
        */

        if(questions.length === 0) {

            throw new Error(
                "No questions found for Day "
                +
                assignedDay
                +
                "."
            );

        }


        /*
           Make sure assessment has 15 questions
        */

        if(questions.length < 15) {

            throw new Error(
                "Only "
                +
                questions.length
                +
                " questions found for Day "
                +
                assignedDay
                +
                ". Expected 15."
            );

        }


        /*
           Hide loading
        */

        document.getElementById("loading")
            .style.display = "none";


        /*
           Display questions
        */

        displayQuestions();


        /*
           Start timer
        */

        startTimer();

    }


    catch(error) {

        console.error(
            "Assessment loading error:",
            error
        );


        document.getElementById("loading")
            .innerHTML =
            "<h3>Unable to load question bank.</h3>" +
            "<p>" +
            escapeHTML(error.message) +
            "</p>" +
            "<p>Please refresh the page.</p>";

    }

}


/* =====================================================
   DISPLAY QUESTIONS
===================================================== */

function displayQuestions() {

    const container =
        document.getElementById(
            "questionContainer"
        );


    container.innerHTML = "";


    questions.forEach(function(q, index) {

        const type =
            String(
                q["Question Type"] || ""
            )
            .trim()
            .toUpperCase();


        const number =
            index + 1;


        const box =
            document.createElement("div");


        box.className =
            "question-box";


        /*
           Question heading
        */

        const heading =
            document.createElement("h3");


        heading.innerText =
            "Question "
            +
            number
            +
            ". "
            +
            String(q.Question || "");


        box.appendChild(heading);


        /*
           MCQ
        */

        if(type === "MCQ") {

            addOption(
                box,
                number,
                "A",
                q["Option A"]
            );

            addOption(
                box,
                number,
                "B",
                q["Option B"]
            );

            addOption(
                box,
                number,
                "C",
                q["Option C"]
            );

            addOption(
                box,
                number,
                "D",
                q["Option D"]
            );

        }


        /*
           ERROR CORRECTION
        */

        else if(
            type === "ERROR"
            ||
            type === "ERROR CORRECTION"
        ) {

            const instruction =
                document.createElement("p");


            instruction.innerHTML =
                "<b>Error Correction:</b> Select the correct answer.";


            box.appendChild(instruction);


            addOption(
                box,
                number,
                "A",
                q["Option A"]
            );

            addOption(
                box,
                number,
                "B",
                q["Option B"]
            );

            addOption(
                box,
                number,
                "C",
                q["Option C"]
            );

            addOption(
                box,
                number,
                "D",
                q["Option D"]
            );

        }


        /*
           CODING
        */

        else if(type === "CODING") {

            const requirement =
                document.createElement("p");


            requirement.innerHTML =
                "<b>Coding Requirement:</b><br>"
                +
                escapeHTML(
                    String(
                        q["Coding Requirement"]
                        ||
                        q.Question
                        ||
                        ""
                    )
                );


            box.appendChild(
                requirement
            );


            const textarea =
                document.createElement("textarea");


            textarea.id =
                "coding_" + number;


            textarea.placeholder =
                "Write your Java code here...";


            textarea.style.width =
                "100%";


            textarea.style.minHeight =
                "180px";


            textarea.style.boxSizing =
                "border-box";


            box.appendChild(
                textarea
            );

        }


        container.appendChild(box);

    });

}


/* =====================================================
   ADD OPTION
===================================================== */

function addOption(
    box,
    number,
    letter,
    text
) {

    if(
        text === undefined
        ||
        String(text).trim() === ""
    ) {

        return;

    }


    const label =
        document.createElement("label");


    label.style.display =
        "block";


    label.style.margin =
        "10px 0";


    const radio =
        document.createElement("input");


    radio.type =
        "radio";


    radio.name =
        "question_" + number;


    radio.value =
        letter;


    label.appendChild(
        radio
    );


    const textNode =
        document.createTextNode(
            " " +
            letter +
            ". " +
            String(text)
        );


    label.appendChild(
        textNode
    );


    box.appendChild(
        label
    );

}


/* =====================================================
   SUBMIT ASSESSMENT
===================================================== */

function submitAssessment() {

    if(assessmentSubmitted) {

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to submit the assessment?"
        );


    if(!confirmed) {

        return;

    }


    finishAssessment();

}


/* =====================================================
   AUTOMATIC SUBMIT
===================================================== */

function submitAssessmentAutomatically() {

    if(assessmentSubmitted) {

        return;

    }


    finishAssessment();

}


/* =====================================================
   FINISH ASSESSMENT
===================================================== */

function finishAssessment() {

    if(assessmentSubmitted) {

        return;

    }


    assessmentSubmitted = true;


    clearInterval(
        timerInterval
    );


    let score = 0;

    let totalObjective = 0;

    let answerSheet = [];


    /*
       Evaluate all questions
    */

    questions.forEach(function(q, index) {

        const type =
            String(
                q["Question Type"] || ""
            )
            .trim()
            .toUpperCase();


        const number =
            index + 1;


        /*
           MCQ / ERROR
        */

        if(
            type === "MCQ"
            ||
            type === "ERROR"
            ||
            type === "ERROR CORRECTION"
        ) {

            totalObjective++;


            const selected =
                document.querySelector(
                    'input[name="question_' +
                    number +
                    '"]:checked'
                );


            const studentAnswer =
                selected
                ?
                selected.value
                :
                "Not Answered";


            const correctAnswer =
                String(
                    q["Correct Answer"] || ""
                )
                .trim();


            const isCorrect =
                studentAnswer
                ===
                correctAnswer;


            if(isCorrect) {

                score++;

            }


            answerSheet.push({

                question:
                    String(
                        q.Question || ""
                    ),

                studentAnswer:
                    studentAnswer,

                correctAnswer:
                    correctAnswer,

                status:
                    isCorrect
                    ?
                    "Correct"
                    :
                    "Wrong"

            });

        }


        /*
           CODING
        */

        else if(type === "CODING") {

            const codingBox =
                document.getElementById(
                    "coding_" + number
                );


            const studentCode =
                codingBox
                ?
                codingBox.value.trim()
                :
                "";


            answerSheet.push({

                question:
                    String(
                        q.Question || ""
                    ),

                studentAnswer:
                    studentCode
                    ?
                    studentCode
                    :
                    "Not Answered",

                correctAnswer:
                    "Coding evaluation pending",

                status:
                    "Pending"

            });

        }

    });


    /*
       Percentage
    */

    const percentage =
        totalObjective > 0
        ?
        (
            score
            /
            totalObjective
            *
            100
        ).toFixed(2)
        :
        "0.00";


    /*
       Save current result
    */

    localStorage.setItem(
        "score",
        String(score)
    );


    localStorage.setItem(
        "total",
        String(totalObjective)
    );


    localStorage.setItem(
        "answerSheet",
        JSON.stringify(answerSheet)
    );


    localStorage.setItem(
        "submittedDay",
        String(assignedDay)
    );


    /*
       Create report
    */

    const report = {

        id:
            Date.now(),

        name:
            studentName,

        username:
            studentUsername,

        year:
            studentYear,

        day:
            assignedDay,

        score:
            score,

        total:
            totalObjective,

        percentage:
            percentage,

        status:
            "Completed",

        date:
            new Date().toLocaleString(),

        answers:
            answerSheet

    };


    /*
       Get existing reports
    */

    let studentReports = [];


    try {

        studentReports =
            JSON.parse(
                localStorage.getItem(
                    "studentReports"
                )
                ||
                "[]"
            );

    } catch(error) {

        studentReports = [];

    }


    /*
       Remove old report for same
       student and same day
    */

    studentReports =
        studentReports.filter(
            function(r) {

                return !(
                    String(r.username).trim()
                    ===
                    String(studentUsername).trim()
                    &&
                    String(r.day)
                    ===
                    String(assignedDay)
                );
