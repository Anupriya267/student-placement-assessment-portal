// ==================================================
// LOAD QUESTIONS
// ==================================================

async function loadQuestions(){

    try{

        const response =
            await fetch(
                "./Java_Placement_41_Day_FINAL_CORRECTED.xlsx"
            );


        if(!response.ok){

            throw new Error(
                "Excel file could not be loaded."
            );

        }


        const data =
            await response.arrayBuffer();


        const workbook =
            XLSX.read(
                data,
                {
                    type:"array"
                }
            );


        const sheet =
            workbook.Sheets[
                "Question Bank"
            ];


        if(!sheet){

            throw new Error(
                "Question Bank sheet not found."
            );

        }


        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    defval:""
                }
            );



        // =========================================
        // FILTER CURRENT DAY
        // =========================================

        const dayQuestions =
            rows.filter(
                function(q){

                    return String(q.Day)
                    ===
                    String(assignedDay);

                }
            );


        // =========================================
        // GET MCQs
        // =========================================

        const mcqs =
            dayQuestions.filter(
                function(q){

                    return String(
                        q["Question Type"]
                        ||
                        ""
                    )
                    .trim()
                    .toUpperCase()
                    ===
                    "MCQ";

                }
            );



        // =========================================
        // GET ERROR QUESTIONS
        // =========================================

        const errors =
            dayQuestions.filter(
                function(q){

                    return String(
                        q["Question Type"]
                        ||
                        ""
                    )
                    .trim()
                    .toUpperCase()
                    ===
                    "ERROR";

                }
            );



        // =========================================
        // GET CODING QUESTIONS
        // =========================================

        const coding =
            dayQuestions.filter(
                function(q){

                    return String(
                        q["Question Type"]
                        ||
                        ""
                    )
                    .trim()
                    .toUpperCase()
                    ===
                    "CODING";

                }
            );



        // =========================================
        // FINAL 15 QUESTIONS
        // =========================================

        questions = [

            ...mcqs.slice(0,10),

            ...errors.slice(0,2),

            ...coding.slice(0,3)

        ];



        if(
            questions.length === 0
        ){

            throw new Error(
                "No questions found for Day "
                +
                assignedDay
                +
                "."
            );

        }



        // =========================================
        // DISPLAY DAY
        // =========================================

        document.getElementById(
            "dayNumber"
        ).innerText =
            assignedDay;


        document.getElementById(
            "assessmentTitle"
        ).innerText =

            "Day "
            +
            assignedDay
            +
            " Java Placement Assessment";


        document.getElementById(
            "topic"
        ).innerText =

            topics[assignedDay]
            ||
            "Java Placement Practice";


        document.getElementById(
            "loading"
        ).style.display =
            "none";



        displayQuestions();

        startTimer();

    }


    catch(error){

        console.error(error);


        document.getElementById(
            "loading"
        ).innerHTML =

            "<h3>Unable to load question bank.</h3>"
            +

            "<p>"
            +
            escapeHTML(error.message)
            +
            "</p>";

    }

}
