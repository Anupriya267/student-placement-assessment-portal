<!DOCTYPE html>
<html>

<head>

<title>Java Placement Assessment</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="dashboard">

<h1>Java Placement Assessment</h1>

<h2 id="assessmentTitle">
Loading Assessment...
</h2>

<div class="card">

<h3>Time Remaining</h3>

<h2 id="timer">40:00</h2>

</div>


<form id="assessmentForm">

<div id="questionContainer">

<p>Loading questions...</p>

</div>


<br>

<button
    type="button"
    onclick="submitAssessment()"
>

Submit Assessment

</button>

</form>

</div>
<script src="java_question_bank.js"></script>

<script src="script.js"></script>


<script>

// ================= LOAD ASSESSMENT =================

function loadAssessment(){

    let questionBank =
        JSON.parse(
            localStorage.getItem("questionBank") || "[]"
        );


    let assignedDay =
        localStorage.getItem("assignedDay") || "1";


    let dayQuestions =
        questionBank.filter(function(q){

            return String(q.Day) ===
                   String(assignedDay);

        });


    if(dayQuestions.length === 0){

        document.getElementById(
            "questionContainer"
        ).innerHTML =
            "<p>No questions available for Day " +
            assignedDay +
            ".</p>";

        return;

    }


    document.getElementById(
        "assessmentTitle"
    ).innerText =
        "Day " + assignedDay + " Java Placement Assessment";


    let container =
        document.getElementById(
            "questionContainer"
        );


    container.innerHTML = "";


    let mcqNumber = 0;

    let errorNumber = 0;

    let codingNumber = 0;


    dayQuestions.forEach(function(q){

        let type =
            String(q.Type || "").toUpperCase();


        // ================= MCQ =================

        if(type === "MCQ"){

            mcqNumber++;


            let div =
                document.createElement("div");

            div.className = "card";


            div.innerHTML =

                "<h3>" +
                mcqNumber +
                ". " +
                escapeHTML(q.Question) +
                "</h3>" +

                createOption(
                    "mcq_" + mcqNumber,
                    "A",
                    q["Option A"]
                ) +

                createOption(
                    "mcq_" + mcqNumber,
                    "B",
                    q["Option B"]
                ) +

                createOption(
                    "mcq_" + mcqNumber,
                    "C",
                    q["Option C"]
                ) +

                createOption(
                    "mcq_" + mcqNumber,
                    "D",
                    q["Option D"]
                );


            container.appendChild(div);

        }


        // ================= ERROR =================

        else if(
            type === "ERROR" ||
            type === "ERROR CORRECTION"
        ){

            errorNumber++;


            let div =
                document.createElement("div");

            div.className = "card";


            div.innerHTML =

                "<h3>Error Correction " +
                errorNumber +
                "</h3>" +

                "<p>" +
                escapeHTML(q.Question) +
                "</p>" +

                createOption(
                    "error_" + errorNumber,
                    "A",
                    q["Option A"]
                ) +

                createOption(
                    "error_" + errorNumber,
                    "B",
                    q["Option B"]
                ) +

                createOption(
                    "error_" + errorNumber,
                    "C",
                    q["Option C"]
                ) +

                createOption(
                    "error_" + errorNumber,
                    "D",
                    q["Option D"]
                );


            container.appendChild(div);

        }


        // ================= CODING =================

        else if(type === "CODING"){

            codingNumber++;


            let div =
                document.createElement("div");

            div.className = "card";


            div.innerHTML =

                "<h3>Coding Question " +
                codingNumber +
                "</h3>" +

                "<p>" +
                escapeHTML(q.Question) +
                "</p>" +

                "<textarea " +
                "id='coding_" +
                codingNumber +
                "' " +
                "rows='10' " +
                "placeholder='Write your Java code here...'>" +
                "</textarea>";


            container.appendChild(div);

        }

    });

}


// ================= OPTIONS =================

function createOption(
    name,
    value,
    text
){

    return (

        "<label>" +

        "<input " +
        "type='radio' " +
        "name='" +
        name +
        "' " +
        "value='" +
        value +
        "'>" +

        " " +
        value +
        ". " +
        escapeHTML(text) +

        "</label><br>"

    );

}


// ================= SECURITY =================

function escapeHTML(value){

    if(value === undefined ||
       value === null){

        return "";

    }

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


// ================= SUBMIT =================

function submitAssessment(){

    if(
        !confirm(
            "Are you sure you want to submit the assessment?"
        )
    ){

        return;

    }


    // Save current responses

    let responses = {

        submittedAt:
            new Date().toISOString(),

        day:
            localStorage.getItem(
                "assignedDay"
            ) || "1"

    };


    document
        .querySelectorAll(
            'input[type="radio"]:checked'
        )
        .forEach(function(input){

            responses[input.name] =
                input.value;

        });


    document
        .querySelectorAll("textarea")
        .forEach(function(textarea){

            responses[textarea.id] =
                textarea.value;

        });


    localStorage.setItem(
        "studentResponses",
        JSON.stringify(responses)
    );


    // Calculate score

    calculateAndSaveResult();

}


// ================= 40 MINUTE TIMER =================

let remainingTime = 40 * 60;


let assessmentTimer =
    setInterval(function(){

        let timerBox =
            document.getElementById("timer");


        if(!timerBox){

            clearInterval(assessmentTimer);

            return;

        }


        let minutes =
            Math.floor(
                remainingTime / 60
            );


        let seconds =
            remainingTime % 60;


        timerBox.innerText =
            minutes +
            ":" +
            (seconds < 10 ? "0" : "") +
            seconds;


        remainingTime--;


        if(remainingTime < 0){

            clearInterval(
                assessmentTimer
            );


            alert(
                "Time is over. Your assessment will be submitted."
            );


            // Automatic submission

            calculateAndSaveResult();

        }

    }, 1000);


// ================= START =================

window.onload = function(){

    loadAssessment();

};

</script>

</body>

</html>
