/* =========================================================
   GET CURRENT DAY
========================================================= */

function getCurrentDay(){

    /*
       student.html calculates the next day.

       assessment.html must NOT calculate another
       day from old localStorage reports.

       It simply uses assessmentDay first.
    */

    let day =
        parseInt(
            localStorage.getItem("assessmentDay")
            ||
            localStorage.getItem("assignedDay")
            ||
            localStorage.getItem("currentDay")
            ||
            "1",
            10
        );


    if(
        isNaN(day)
        ||
        day < 1
    ){

        day = 1;

    }


    if(day > 41){

        day = 41;

    }


    /*
       Keep all keys synchronized.
    */

    localStorage.setItem(
        "assessmentDay",
        String(day)
    );

    localStorage.setItem(
        "assignedDay",
        String(day)
    );

    localStorage.setItem(
        "currentDay",
        String(day)
    );


    return day;

}

getCurrentDay();

/* =========================================================
   EXCEL LOADER
========================================================= */

async function fetchExcelFile(){

    let lastError = null;


    for(
        let i = 0;
        i < EXCEL_FILES.length;
        i++
    ){

        const file =
            EXCEL_FILES[i];


        try{

            const response =
                await fetch(
                    file
                    +
                    "?v="
                    +
                    Date.now(),
                    {
                        cache:"no-store"
                    }
                );


            if(!response.ok){

                throw new Error(
                    "HTTP "
                    +
                    response.status
                );

            }


            return await response.arrayBuffer();

        }
        catch(error){

            lastError = error;

        }

    }


    throw new Error(
        "Could not load the Excel question bank. "
        +
        "Please check the Excel filename in GitHub."
        +
        (
            lastError
            ? " Last error: " + lastError.message
            : ""
        )
    );

}


/* =========================================================
   LOAD QUESTIONS
========================================================= */

async function loadQuestions(){

    try{

        if(
            typeof XLSX === "undefined"
        ){

            throw new Error(
                "Excel reader did not load. Please refresh the page."
            );

        }


        const data =
            await fetchExcelFile();


        const workbook =
            XLSX.read(
                data,
                {
                    type:"array"
                }
            );


        const sheet =
            workbook.Sheets[
                "Question Bank"
            ];


        if(!sheet){

            throw new Error(
                'The Excel file does not contain the "Question Bank" sheet.'
            );

        }


        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    defval:""
                }
            );


        /*
           Current day only.
        */

        const dayQuestions =
            rows.filter(function(row){

                return String(
                    row.Day || ""
                ).trim()
                ===
                String(assignedDay);

            });


        /*
           MCQ
        */

        const mcqs =
            dayQuestions.filter(function(row){

                return String(
                    row["Question Type"] || ""
                )
                .trim()
                .toUpperCase()
                ===
                "MCQ";

            });


        /*
           ERROR
        */

        const errors =
            dayQuestions.filter(function(row){

                const type =
                    String(
                        row["Question Type"] || ""
                    )
                    .trim()
                    .toUpperCase();


                return (
                    type === "ERROR"
                    ||
                    type === "ERROR CORRECTION"
                );

            });


        /*
           CODING
        */

        const coding =
            dayQuestions.filter(function(row){

                return String(
                    row["Question Type"] || ""
                )
                .trim()
                .toUpperCase()
                ===
                "CODING";

            });


        /*
           EXACT ASSESSMENT STRUCTURE

           10 MCQ
           2 ERROR
           3 CODING
           ----------------
           15 QUESTIONS
        */

        questions =
            mcqs.slice(0,10)
            .concat(
                errors.slice(0,2)
            )
            .concat(
                coding.slice(0,3)
            );


        /*
           Validate each section separately.
        */

        if(mcqs.length < 10){

            throw new Error(
                "Day "
                +
                assignedDay
                +
                " has only "
                +
                mcqs.length
                +
                " MCQ questions. Need 10."
            );

        }


        if(errors.length < 2){

            throw new Error(
                "Day "
                +
                assignedDay
                +
                " has only "
                +
                errors.length
                +
                " Error Correction questions. Need 2."
            );

        }


        if(coding.length < 3){

            throw new Error(
                "Day "
                +
                assignedDay
                +
                " has only "
                +
                coding.length
                +
                " Coding questions. Need 3."
            );

        }


        if(questions.length !== 15){

            throw new Error(
                "Exactly 15 questions are required."
            );

        }


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        displayQuestions();


        startTimer();

    }
    catch(error){

        console.error(error);


        document.getElementById(
            "loading"
        ).innerHTML =

        "<div class='error-box'>" +

        "<h3>Unable to load questions</h3>" +

        "<p>" +

        escapeHTML(
            error.message
        ) +

        "</p>" +

        "<p>" +

        "<b>Make sure the master Excel file is uploaded to GitHub.</b>" +

        "</p>" +

        "</div>";

    }

}

        errorTitle

            String(
                q["Question Type"] || ""

            .trim()
            .toUpperCase();


        if(
            type !== "ERROR"
            &&
            type !== "ERROR CORRECTION"

        createObjectiveQuestion(
            container,
            q,
            index + 1,

        const type =
            String(
                q["Question Type"] || ""

        }


        createCodingQuestion(
            container,
            q,
            index + 1
        );

/* =========================================================
   OBJECTIVE QUESTION
========================================================= */

function createObjectiveQuestion(
    container,
    q,
    number,
    displayNumber,
    isError
){

    const box =
        document.createElement("div");

    box.className =
        "question-box";


    const heading =
        document.createElement("h3");

    heading.textContent =
        "Question "
        +
        displayNumber
        +
        ". "
        +
        String(
            q.Question || ""
        );


    box.appendChild(
        heading
    );


    if(isError){

        const note =
            document.createElement("p");

        note.innerHTML =
            "<b>Error Correction:</b> Select the correct answer.";

        box.appendChild(
            note
        );

    }


    ["A","B","C","D"].forEach(
        function(letter){

            const text =
                q[
                    "Option "
                    +
                    letter
                ];


            if(
                text === undefined
                ||
                String(text).trim() === ""
            ){

                return;

            }


            const label =
                document.createElement("label");

            label.className =
                "option";


            const radio =
                document.createElement("input");

            radio.type =
                "radio";

            radio.name =
                "question_"
                +
                number;

            radio.value =
                letter;


            label.appendChild(
                radio
            );


            label.appendChild(
                document.createTextNode(
                    " "
                    +
                    letter
                    +
                    ". "
                    +
                    String(text)
                )
            );


            box.appendChild(
                label
            );

        }
    );


    container.appendChild(
        box
    );

}


/* =========================================================
   CODING QUESTION
========================================================= */

function createCodingQuestion(
    container,
    q,
    number
){

    const box =
        document.createElement("div");

    box.className =

    const heading =
        document.createElement("h3");

    heading.textContent =
        "Question "
        +
        number
        +
        ". "
        +
        String(
            q.Question || ""

    box.appendChild(
        heading

    const requirement =
        document.createElement("p");


    requirement.innerHTML =
        "<b>Coding Requirement:</b><br>"
        +
        escapeHTML(
            String(
                q["Coding Requirement"]
                ||
                q.Question
                ||
                ""
            )
        );


    box.appendChild(
        requirement
    );


    /*
       If the master Excel contains a contract,
       show it to the student.
    */

    if(
        q["Student Input Format"]
        ||
        q["Student Output Format"]
        ||
        q["Constraints / Contract"]
    ){

        const contract =
            document.createElement("div");

        contract.className =
            "info-note";


        let html = "";


        if(q["Student Input Format"]){

            html +=
                "<b>Input:</b><br>"
                +
                escapeHTML(
                    q["Student Input Format"]
                )
                +
                "<br><br>";

        }


        if(q["Student Output Format"]){

            html +=
                "<b>Output:</b><br>"
                +
                escapeHTML(
                    q["Student Output Format"]
                )
                +
                "<br><br>";

        }


        if(q["Constraints / Contract"]){

            html +=
                "<b>Constraints:</b><br>"
                +
                escapeHTML(
                    q["Constraints / Contract"]
                );

        }


        contract.innerHTML =
            html;


        box.appendChild(
            contract
        );

    }


    const textarea =
        document.createElement("textarea");


    textarea.id =
        "coding_"
        +
        number;


    textarea.placeholder =
        "Write your Java code here...";


    box.appendChild(
        textarea
    );


    container.appendChild(
        box
    );

}


/* =========================================================
   CODING EVALUATOR
========================================================= */

function evaluateCoding(
    code,
    question
){

    if(
        !code
        ||
        code.trim().length < 20
    ){

        return {
            status:"Wrong",
            score:0
        };

    }


    const c =
        code.toLowerCase();


    const q =
        String(
            question.Question
            ||
            ""
        ).toLowerCase();


    const requirement =
        String(
            question["Coding Requirement"]
            ||
            ""
        ).toLowerCase();


    const combined =
        q
        +
        " "
        +
        requirement;


    let required = 0;

    let achieved = 0;


    /*
       Java program structure
    */

    required++;


    if(
        c.includes("class")
        ||
        c.includes("public static void")
        ||
        c.includes("static void")
    ){

        achieved++;

    }


    /*
       Loop requirement
    */

    const needsLoop =
        combined.includes("loop")
        ||
        combined.includes("iterate")
        ||
        combined.includes("for")
        ||
        combined.includes("while")
        ||
        combined.includes("fibonacci")
        ||
        combined.includes("prime")
        ||
        combined.includes("factorial")
        ||
        combined.includes("sum");


    if(needsLoop){

        required++;


        const hasLoop =
            c.includes("for(")
            ||
            c.includes("for (")
            ||
            c.includes("while(")
            ||
            c.includes("while (")
            ||
            c.includes("do{")
            ||
            c.includes("do {");


        if(hasLoop){

            achieved++;

        }

    }


    /*
       Array requirement
    */

    const needsArray =
        combined.includes("array")
        ||
        combined.includes("[]")
        ||
        combined.includes("elements");


    if(needsArray){

        required++;


        if(
            c.includes("[]")
            ||
            c.includes("array")
            ||
            c.includes("int[")
        ){

            achieved++;

        }

    }


    /*
       String requirement
    */

    const needsString =
        combined.includes("string")
        ||
        combined.includes("character")
        ||
        combined.includes("palindrome")
        ||
        combined.includes("anagram");


    if(needsString){

        required++;


        if(
            c.includes("string")
            ||
            c.includes(".charat")
            ||
            c.includes(".length()")
        ){

            achieved++;

        }

    }


    /*
       Arithmetic requirement
    */

    const needsArithmetic =
        combined.includes("sum")
        ||
        combined.includes("add")
        ||
        combined.includes("total")
        ||
        combined.includes("average")
        ||
        combined.includes("product");


    if(needsArithmetic){

        required++;


        if(
            c.includes("+")
            ||
            c.includes("*")
            ||
            c.includes("sum")
            ||
            c.includes("total")
        ){

            achieved++;

        }

    }


    /*
       Modulus is commonly required for
       digit / prime / even / odd questions.
    */

    const needsModulo =
        combined.includes("digit")
        ||
        combined.includes("even")
        ||
        combined.includes("odd")
        ||
        combined.includes("prime");


    if(needsModulo){

        required++;


        if(
            c.includes("%")
        ){

            achieved++;

        }

    }


    /*
       OOP requirement
    */

    const needsOOP =
        combined.includes("class")
        ||
        combined.includes("object")
        ||
        combined.includes("inheritance")
        ||
        combined.includes("polymorphism")
        ||
        combined.includes("encapsulation")
        ||
        combined.includes("abstraction");


    if(needsOOP){

        required++;


        if(
            c.includes("class")
            ||
            c.includes("extends")
            ||
            c.includes("implements")
            ||
            c.includes("private")
            ||
            c.includes("public")
        ){

            achieved++;

        }

    }


    /*
       Method requirement
    */

    const needsMethod =
        combined.includes("method")
        ||
        combined.includes("function");


    if(needsMethod){

        required++;


        if(
            c.includes("(")
            &&
            c.includes(")")
        ){

            achieved++;

        }

    }


    /*
       Collection requirement
    */

    const needsCollection =
        combined.includes("arraylist")
        ||
        combined.includes("list")
        ||
        combined.includes("collection")
        ||
        combined.includes("hashmap")
        ||
        combined.includes("set");


    if(needsCollection){

        required++;


        if(
            c.includes("arraylist")
            ||
            c.includes("list<")
            ||
            c.includes("hashmap")
            ||
            c.includes("hashset")
            ||
            c.includes("collection")
        ){

            achieved++;

        }

    }


    /*
       Output requirement
    */

    required++;


    if(
        c.includes("system.out.print")
        ||
        c.includes("system.out.println")
    ){

        achieved++;

    }


    const ratio =
        required > 0
        ? achieved / required
        : 0;


    if(ratio >= 0.75){

        return {
            status:"Complete",
            score:1
        };

    }


    if(ratio >= 0.35){

        return {
            status:"Partially Correct",
            score:0.5
        };

    }


    return {
        status:"Wrong",
        score:0
    };

}


/* =========================================================
   SUBMIT
========================================================= */

function submitAssessment(){

    if(assessmentSubmitted){

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to submit the assessment?"
        );


    if(!confirmed){

        return;

    }


    finishAssessment();

}


/* =========================================================
   FINISH ASSESSMENT
========================================================= */

function finishAssessment(){

    if(assessmentSubmitted){

        return;

    }


    assessmentSubmitted = true;


    clearInterval(
        timerInterval
    );


    let objectiveScore = 0;

    let codingScore = 0;


    const answerSheet = [];

    const codingEvaluations = [];


    /*
       Evaluate all 15 questions.
    */

    questions.forEach(
        function(q,index){

            const type =
                String(
                    q["Question Type"]
                    ||
                    ""
                )
                .trim()
                .toUpperCase();


            const number =
                index + 1;


            /* =========================
               MCQ / ERROR
            ========================= */

            if(
                type === "MCQ"
                ||
                type === "ERROR"
                ||
                type === "ERROR CORRECTION"
            ){

                const selected =
                    document.querySelector(
                        'input[name="question_'
                        +
                        number
                        +
                        '"]:checked'
                    );


                const studentAnswer =
                    selected
                    ? selected.value
                    : "Not Answered";


                const correctAnswer =
                    String(
                        q["Correct Answer"]
                        ||
                        ""
                    ).trim();


                const isCorrect =
                    studentAnswer.toUpperCase()
                    ===
                    correctAnswer.toUpperCase();


                if(isCorrect){

                    objectiveScore++;

                }


                answerSheet.push({

                    type:
                        type,

                    question:
                        String(
                            q.Question
                            ||
                            ""
                        ),

                    studentAnswer:
                        studentAnswer,

                    correctAnswer:
                        correctAnswer,

                    status:
                        isCorrect
                        ? "Correct"
                        : "Wrong",

                    score:
                        isCorrect
                        ? 1
                        : 0

                });

            }


            /* =========================
               CODING
            ========================= */

            else if(
                type === "CODING"
            ){

                const codeBox =
                    document.getElementById(
                        "coding_"
                        +
                        number
                    );


                const code =
                    codeBox
                    ? codeBox.value.trim()
                    : "";


                const evaluation =
                    evaluateCoding(
                        code,
                        q
                    );


                codingScore +=
                    evaluation.score;


                answerSheet.push({

                    type:"CODING",

                    question:
                        String(
                            q.Question
                            ||
                            ""
                        ),

                    studentAnswer:
                        code
                        ||
                        "Not Answered",

                    correctAnswer:
                        "Coding evaluated using placement rubric",

                    status:
                        evaluation.status,

                    score:
                        evaluation.score

                });


                codingEvaluations.push({

                    question:
                        String(
                            q.Question
                            ||
                            ""
                        ),

                    status:
                        evaluation.status,

                    score:
                        evaluation.score

                });

            }

        }
    );


    /*
       TOTAL

       Objective = 12
       Coding = 3

       Maximum = 15
    */

    const totalScore =
        objectiveScore
        +
        codingScore;


    const percentage =
        (
            totalScore
            /
            15
            *
            100
        ).toFixed(2);


    /* =====================================================
       SAVE LOCAL RESULT
    ===================================================== */

    localStorage.setItem(
        "score",
        String(objectiveScore)
    );


    localStorage.setItem(
        "objectiveScore",
        String(objectiveScore)
    );


    localStorage.setItem(
        "codingScore",
        String(codingScore)
    );


    localStorage.setItem(
        "totalScore",
        String(totalScore)
    );


    localStorage.setItem(
        "total",
        "15"
    );


    localStorage.setItem(
        "percentage",
        String(percentage)
    );


    localStorage.setItem(
        "answerSheet",
        JSON.stringify(
            answerSheet
        )
    );


    localStorage.setItem(
        "codingEvaluations",
        JSON.stringify(
            codingEvaluations
        )
    );


    localStorage.setItem(
        "submittedDay",
        String(assignedDay)
    );


    /* =====================================================
       CREATE LOCAL REPORT
    ===================================================== */

    let studentReports = [];


    try{

        studentReports =
            JSON.parse(
                localStorage.getItem(
                    "studentReports"
                )
                ||
                "[]"
            );


        if(
            !Array.isArray(
                studentReports
            )
        ){

            studentReports = [];

        }

    }
    catch(e){

        studentReports = [];

    }


    /*
       Remove previous same-day result.
    */

    studentReports =
        studentReports.filter(
            function(report){

                const reportUsername =
                    String(
                        report.username
                        ||
                        report.Username
                        ||
                        ""
                    )
                    .trim()
                    .toLowerCase();


                const reportDay =
                    String(
                        report.day
                        ||
                        report.Day
                        ||
                        ""
                    );


                return !(
                    reportUsername
                    ===
                    String(
                        studentUsername
                    )
                    .trim()
                    .toLowerCase()
                    &&
                    reportDay
                    ===
                    String(
                        assignedDay
                    )
                );

            }
        );


    const report = {

        id:
            Date.now(),

        name:
            studentName,

        username:
            studentUsername,

        year:
            studentYear,

        day:
            assignedDay,

        topic:
            topics[assignedDay]
            ||
            "Java Placement Practice",

        objectiveScore:
            objectiveScore,

        codingScore:
            codingScore,

        score:
            totalScore,

        total:
            15,

        percentage:
            percentage,

        status:
            "Completed",

        date:
            new Date().toLocaleString(),

        answers:
            answerSheet,

        codingEvaluation:
            codingEvaluations

    };


    studentReports.push(
        report
    );


    localStorage.setItem(
        "studentReports",
        JSON.stringify(
            studentReports
        )
    );


    /* =====================================================
       SET NEXT DAY
    ===================================================== */

    const nextDay =
        assignedDay < 41
        ? assignedDay + 1
        : 41;


    localStorage.setItem(
        "assignedDay",
        String(nextDay)
    );


    localStorage.setItem(
        "assessmentDay",
        String(nextDay)
    );


    localStorage.setItem(
        "currentDay",
        String(nextDay)
    );


    /* =====================================================
       SEND TO GOOGLE SHEET
    ===================================================== */

    sendResultToGoogleSheet({

        Name:
            studentName,

        Username:
            studentUsername,

        Year:
            studentYear,

        Day:
            assignedDay,

        Topic:
            topics[assignedDay]
            ||
            "Java Placement Practice",

        "MCQ + Error":
            objectiveScore,

        Coding:
            codingScore,

        Total:
            totalScore,

        Percentage:
            percentage,

        Status:
            "Completed",

        "Submission Date":
            new Date().toISOString(),

        Answers:
            JSON.stringify(
                answerSheet
            ),

        "Coding Evaluation":
            JSON.stringify(
                codingEvaluations
            )

    });


    /*
       Small delay so Google request
       can start before redirect.
    */

    setTimeout(
        function(){

            window.location.href =
                "results.html";

        },
        500
    );

}


/* =========================================================
   GOOGLE SHEET SUBMISSION
========================================================= */

function sendResultToGoogleSheet(
    result
){

    try{

        fetch(
            GOOGLE_SCRIPT_URL,
            {

                method:"POST",

                mode:"no-cors",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(
                        result
                    )

            }
        )
        .catch(function(error){

            console.error(
                "Google Sheet submission error:",
                error
            );

        });

    }
    catch(error){

        console.error(
            "Unable to send result:",
            error
        );

    }

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    updateTimer();


    timerInterval =
        setInterval(
            function(){

                timeLeft--;


                updateTimer();


                if(
                    timeLeft <= 0
                ){

                    clearInterval(
                        timerInterval
                    );


                    if(
                        !assessmentSubmitted
                    ){

                        alert(
                            "Time is over. Your assessment will be submitted automatically."
                        );


                        finishAssessment();

                    }

                }

            },
            1000
        );

}


/* =========================================================
   UPDATE TIMER
========================================================= */

function updateTimer(){

    const minutes =
        Math.floor(
            timeLeft / 60
        );


    const seconds =
        timeLeft % 60;


    document.getElementById(
        "timer"
    ).textContent =

        String(
            minutes
        ).padStart(
            2,
            "0"
        )

        +

        ":"

        +

        String(
            seconds
        ).padStart(
            2,
            "0"
        );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   START
========================================================= */

loadQuestions();
