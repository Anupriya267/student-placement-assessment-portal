<!DOCTYPE html>
<html>

<head>

<title>Java Placement Assessment</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>


<body>

<div class="container">

<h1>Java Placement Assessment</h1>

<h2 id="assessmentTitle">
Day 1 Java Placement Assessment
</h2>

<p>
<b>Day:</b>
<span id="dayNumber">1</span>
</p>

<p>
<b>Topic:</b>
<span id="topic">Loading...</span>
</p>

<p>
<b>Duration:</b> 40 Minutes
</p>

<h2>
Time Remaining:
<span id="timer">40:00</span>
</h2>


<div id="loading">
Loading questions...
</div>


<form id="assessmentForm">

<div id="questionContainer"></div>

<button
type="button"
onclick="submitAssessment()">
Submit Assessment
</button>

</form>

</div>



<script>

let questions = [];

let timeLeft = 40 * 60;

let timerInterval;



// ==================================================
// LOAD QUESTIONS FROM EXCEL
// ==================================================

async function loadQuestions(){

    try{

        const response = await fetch(
            "./Java_Placement_41_Day_FINAL_CORRECTED.xlsx"
        );


        if(!response.ok){

            throw new Error(
                "Excel file could not be loaded"
            );

        }


        const data =
            await response.arrayBuffer();


        const workbook =
            XLSX.read(
                data,
                {
                    type: "array"
                }
            );


        const sheet =
            workbook.Sheets["Question Bank"];


        if(!sheet){

            throw new Error(
                "Question Bank sheet not found"
            );

        }


        const rows =
            XLSX.utils.sheet_to_json(
                sheet
            );


        const assignedDay =
            localStorage.getItem(
                "assignedDay"
            ) || "1";


        const dayQuestions =
            rows.filter(function(q){

                return String(q.Day).trim()
                ===
                String(assignedDay).trim();

            });


        if(dayQuestions.length === 0){

            throw new Error(
                "No questions found for Day "
                + assignedDay
            );

        }



        // ==========================================
        // 10 MCQ
        // ==========================================

        const mcqs =
            dayQuestions.filter(function(q){

                return String(
                    q["Question Type"] || ""
                )
                .trim()
                .toUpperCase()
                === "MCQ";

            });



        // ==========================================
        // 2 ERROR CORRECTION
        // ==========================================

        const errors =
            dayQuestions.filter(function(q){

                return String(
                    q["Question Type"] || ""
                )
                .trim()
                .toUpperCase()
                === "ERROR";

            });



        // ==========================================
        // 3 CODING
        // ==========================================

        const coding =
            dayQuestions.filter(function(q){

                return String(
                    q["Question Type"] || ""
                )
                .trim()
                .toUpperCase()
                === "CODING";

            });



        // ==========================================
        // FINAL 15 QUESTIONS
        // ==========================================

        questions = [

            ...mcqs.slice(0,10),

            ...errors.slice(0,2),

            ...coding.slice(0,3)

        ];



        document.getElementById(
            "dayNumber"
        ).innerText =
            assignedDay;


        document.getElementById(
            "assessmentTitle"
        ).innerText =
            "Day "
            + assignedDay
            + " Java Placement Assessment";


        document.getElementById(
            "topic"
        ).innerText =
            "Java Placement";


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        displayQuestions();

        startTimer();

    }


    catch(error){

        console.error(error);


        document.getElementById(
            "loading"
        ).innerHTML =

            "<h3>Unable to load question bank.</h3>" +

            "<p>" +
            error.message +
            "</p>";

    }

}



// ==================================================
// DISPLAY QUESTIONS
// ==================================================

function displayQuestions(){

    const container =
        document.getElementById(
            "questionContainer"
        );


    container.innerHTML = "";


    questions.forEach(
        function(q,index){

            const type =
                String(
                    q["Question Type"] || ""
                )
                .trim()
                .toUpperCase();


            const questionNumber =
                index + 1;


            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "question-box";


            const heading =
                document.createElement(
                    "h3"
                );


            heading.innerText =
                "Question "
                + questionNumber
                + ". "
                + q.Question;


            box.appendChild(
                heading
            );



            // ======================================
            // MCQ
            // ======================================

            if(type === "MCQ"){

                addOption(
                    box,
                    questionNumber,
                    "A",
                    q["Option A"]
                );


                addOption(
                    box,
                    questionNumber,
                    "B",
                    q["Option B"]
                );


                addOption(
                    box,
                    questionNumber,
                    "C",
                    q["Option C"]
                );


                addOption(
                    box,
                    questionNumber,
                    "D",
                    q["Option D"]
                );

            }



            // ======================================
            // ERROR CORRECTION
            // ======================================

            else if(type === "ERROR"){

                addOption(
                    box,
                    questionNumber,
                    "A",
                    q["Option A"]
                );


                addOption(
                    box,
                    questionNumber,
                    "B",
                    q["Option B"]
                );


                addOption(
                    box,
                    questionNumber,
                    "C",
                    q["Option C"]
                );


                addOption(
                    box,
                    questionNumber,
                    "D",
                    q["Option D"]
                );

            }



            // ======================================
            // CODING
            // ======================================

            else if(type === "CODING"){

                const requirement =
                    document.createElement(
                        "p"
                    );


                requirement.innerHTML =
                    "<b>Coding Question:</b><br>"
                    +
                    q.Question;


                box.appendChild(
                    requirement
                );


                const textarea =
                    document.createElement(
                        "textarea"
                    );


                textarea.id =
                    "coding_"
                    + questionNumber;


                textarea.placeholder =
                    "Write your Java code here...";


                textarea.style.width =
                    "100%";


                textarea.style.minHeight =
                    "180px";


                box.appendChild(
                    textarea
                );

            }


            container.appendChild(
                box
            );

        }
    );

}



// ==================================================
// ADD OPTION
// ==================================================

function addOption(
    box,
    questionNumber,
    letter,
    text
){

    if(
        text === undefined ||
        String(text).trim() === ""
    ){

        return;

    }


    const label =
        document.createElement(
            "label"
        );


    label.style.display =
        "block";


    label.style.margin =
        "10px 0";


    label.innerHTML =

        '<input type="radio" ' +

        'name="question_' +
        questionNumber +
        '" ' +

        'value="' +
        letter +
        '">' +

        " <b>" +
        letter +
        ".</b> " +

        escapeHTML(
            String(text)
        );


    box.appendChild(
        label
    );

}



// ==================================================
// SUBMIT ASSESSMENT
// ==================================================

function submitAssessment(){

    if(
        !confirm(
            "Are you sure you want to submit the assessment?"
        )
    ){

        return;

    }


    clearInterval(
        timerInterval
    );


    let score = 0;

    let totalObjective = 0;

    let answerSheet = [];



    questions.forEach(
        function(q,index){

            const type =
                String(
                    q["Question Type"] || ""
                )
                .trim()
                .toUpperCase();


            const questionNumber =
                index + 1;



            // ======================================
            // MCQ / ERROR
            // ======================================

            if(
                type === "MCQ" ||
                type === "ERROR"
            ){

                totalObjective++;


                const selected =
                    document.querySelector(
                        'input[name="question_' +
                        questionNumber +
                        '"]:checked'
                    );


                const studentAnswer =
                    selected
                    ? selected.value
                    : "Not Answered";


                const correctAnswer =
                    String(
                        q["Correct Answer"] || ""
                    )
                    .trim();


                const isCorrect =
                    studentAnswer ===
                    correctAnswer;


                if(isCorrect){

                    score++;

                }


                answerSheet.push({

                    question:
                        q.Question,

                    studentAnswer:
                        studentAnswer,

                    correctAnswer:
                        correctAnswer,

                    status:
                        isCorrect
                        ? "Correct"
                        : "Wrong"

                });

            }



            // ======================================
            // CODING
            // ======================================

            else if(type === "CODING"){

                const codingBox =
                    document.getElementById(
                        "coding_" +
                        questionNumber
                    );


                const studentCode =
                    codingBox
                    ? codingBox.value.trim()
                    : "";


                answerSheet.push({

                    question:
                        q.Question,

                    studentAnswer:
                        studentCode
                        ? studentCode
                        : "Not Answered",

                    correctAnswer:
                        "Coding evaluation pending",

                    status:
                        "Pending"

                });

            }

        }
    );



    // ==========================================
    // SAVE RESULT
    // ==========================================

    localStorage.setItem(
        "score",
        score
    );


    localStorage.setItem(
        "total",
        totalObjective
    );


    localStorage.setItem(
        "answerSheet",
        JSON.stringify(
            answerSheet
        )
    );


    localStorage.setItem(
        "submittedDay",
        localStorage.getItem(
            "assignedDay"
        ) || "1"
    );



    // ==========================================
    // RESULT PAGE
    // ==========================================

    window.location.href =
        "results.html";

}



// ==================================================
// TIMER
// ==================================================

function startTimer(){

    updateTimer();


    timerInterval =
        setInterval(
            function(){

                timeLeft--;


                updateTimer();


                if(timeLeft <= 0){

                    clearInterval(
                        timerInterval
                    );


                    alert(
                        "Time is over. Your assessment will be submitted automatically."
                    );


                    submitAssessment();

                }

            },
            1000
        );

}



function updateTimer(){

    const minutes =
        Math.floor(
            timeLeft / 60
        );


    const seconds =
        timeLeft % 60;


    document.getElementById(
        "timer"
    ).innerText =

        String(minutes)
        .padStart(2,"0")

        +

        ":"

        +

        String(seconds)
        .padStart(2,"0");

}



// ==================================================
// SECURITY / HTML ESCAPE
// ==================================================

function escapeHTML(value){

    return value

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ==================================================
// START ASSESSMENT
// ==================================================

loadQuestions();

</script>

</body>

    </html>
