<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Java Placement Assessment</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

body{

}

<body>

<div class="container">

    <div class="header">

        <h1>Java Placement Assessment</h1>

        <div class="info">
            <div>
                <strong>Student:</strong>
                <span id="studentName">Student 1</span>
            </div>

            <div>
                <strong>Year:</strong>
                <span id="studentYear">Final Year</span>
            </div>

            <div>
                <strong>Day:</strong>
                <span id="dayNumber">3</span>
            </div>

            <div>
                <strong>Topic:</strong>
                <span id="topicName">Java</span>
            </div>
        </div>

    </div>


    <div class="timer">
        Time Remaining:
        <span id="timer">40:00</span>
    </div>


    <div id="loading" class="loading">
        Loading questions...
    </div>


    <div id="assessmentArea" style="display:none;">

        <div class="section">

            <h2>Section A - MCQ</h2>

            <div id="mcqContainer"></div>

        </div>


        <div class="section">

            <h2>Section B - Error Correction</h2>

            <div id="errorContainer"></div>

        </div>


        <div class="section">

            <h2>Section C - Coding</h2>

            <div id="codingContainer"></div>

        </div>


        <div class="section">

            <button id="submitButton" onclick="submitAssessment()">
                Submit Assessment
            </button>
        </div>

    </div>

</div>


<script>

/* =========================================================
   STUDENT DETAILS
========================================================= */

const studentName =
    localStorage.getItem("studentName") || "Student 1";

const studentYear =
    localStorage.getItem("studentYear") || "Final Year";

const currentDay =
    parseInt(
        localStorage.getItem("assessmentDay") ||
        localStorage.getItem("currentDay") ||
        "3"
    );

const currentTopic =
    localStorage.getItem("assessmentTopic") ||
    "Java";


document.getElementById("studentName").textContent =
    studentName;

document.getElementById("studentYear").textContent =
    studentYear;

document.getElementById("dayNumber").textContent =
    currentDay;

document.getElementById("topicName").textContent =
    currentTopic;


/* =========================================================
   EXCEL FILES
========================================================= */

const EXCEL_FILES = [

    "./Java_Placement_41_Day_MASTER_WITH_CODING_EVALUATION.xlsx",

    "./Java_Placement_41_Day_FINAL_CORRECTED.xlsx"

];


/* =========================================================
   QUESTION ARRAYS
========================================================= */

let mcqQuestions = [];
let errorQuestions = [];
let codingQuestions = [];

let selectedQuestions = [];


/* =========================================================
   LOAD EXCEL
========================================================= */

async function loadQuestions(){

    let workbook = null;

    for(const file of EXCEL_FILES){

        try{

            const response = await fetch(file);

            if(!response.ok){
                continue;
            }

            const arrayBuffer =
                await response.arrayBuffer();

            workbook =
                XLSX.read(arrayBuffer,{
                    type:"array"
                });

            break;

        }catch(error){

            console.log(
                "Could not load:",
                file
            );

        }

    }


    if(!workbook){

        document.getElementById("loading").innerHTML =
            '<div class="error">Unable to load Excel question file.</div>';

        return;

    }


    const sheet =
        workbook.Sheets["Question Bank"];

    if(!sheet){

        document.getElementById("loading").innerHTML =
            '<div class="error">Question Bank sheet not found.</div>';

        return;

    }


    const rows =
        XLSX.utils.sheet_to_json(sheet,{
            defval:""
        });


    processQuestions(rows);

}


/* =========================================================
   PROCESS QUESTIONS
========================================================= */

function processQuestions(rows){

    const dayRows =
        rows.filter(row => {

            const day =
                parseInt(
                    row.Day ||
                    row.DAY ||
                    row.day ||
                    0
                );

            return day === currentDay;

        });


    mcqQuestions =
        dayRows.filter(row =>
            String(
                row.Type ||
                row.Question_Type ||
                row["Question Type"] ||
                ""
            ).toUpperCase().includes("MCQ")
        );


    errorQuestions =
        dayRows.filter(row =>
            String(
                row.Type ||
                row.Question_Type ||
                row["Question Type"] ||
                ""
            ).toUpperCase().includes("ERROR")
        );


    codingQuestions =
        dayRows.filter(row =>
            String(
                row.Type ||
                row.Question_Type ||
                row["Question Type"] ||
                ""
            ).toUpperCase().includes("CODING")
        );


    /*
       If the workbook uses Category instead of Type,
       try that as backup.
    */

    if(
        mcqQuestions.length === 0 &&
        errorQuestions.length === 0 &&
        codingQuestions.length === 0
    ){

        mcqQuestions =
            dayRows.filter(row =>
                String(
                    row.Category ||
                    row.category ||
                    ""
                ).toUpperCase().includes("MCQ")
            );

        errorQuestions =
            dayRows.filter(row =>
                String(
                    row.Category ||
                    row.category ||
                    ""
                ).toUpperCase().includes("ERROR")
            );

        codingQuestions =
            dayRows.filter(row =>
                String(
                    row.Category ||
                    row.category ||
                    ""
                ).toUpperCase().includes("CODING")
            );

    }


    /*
       Select exactly:
       10 MCQ
       2 ERROR
       3 CODING
    */

    mcqQuestions =
        shuffle([...mcqQuestions]).slice(0,10);

    errorQuestions =
        shuffle([...errorQuestions]).slice(0,2);

    codingQuestions =
        shuffle([...codingQuestions]).slice(0,3);


    selectedQuestions = [

        ...mcqQuestions,

        ...errorQuestions,

        ...codingQuestions

    ];


    if(selectedQuestions.length < 15){

        document.getElementById("loading").innerHTML =
            `
            <div class="error">
                Only ${selectedQuestions.length} questions were found for Day ${currentDay}.
                Required: 10 MCQ + 2 Error + 3 Coding.
            </div>
            `;

        return;

    }


    renderMCQ();

    renderError();

    renderCoding();


    document.getElementById("loading").style.display =
        "none";

    document.getElementById("assessmentArea").style.display =
        "block";

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [array[i],array[j]] =
        [array[j],array[i]];

    }

    return array;

}


/* =========================================================
   GET QUESTION TEXT
========================================================= */

function getQuestion(row){

    return String(
        row.Question ||
        row.question ||
        row["Question Text"] ||
        row["Question"] ||
        ""
    );

}


/* =========================================================
   GET OPTION
========================================================= */

function getOption(row,letter){

    return String(
        row["Option "+letter] ||
        row["Option_"+letter] ||
        row[letter] ||
        ""
    );

}


/* =========================================================
   MCQ
========================================================= */

function renderMCQ(){

    const container =
        document.getElementById("mcqContainer");

    container.innerHTML = "";


    mcqQuestions.forEach((row,index)=>{

        const div =
            document.createElement("div");

        div.className = "question";


        const question =
            getQuestion(row);


        div.innerHTML = `

            <div class="question-title">
                ${index+1}. ${escapeHTML(question)}
            </div>

            ${["A","B","C","D"].map(letter => `

                <label class="option">

                    <input
                        type="radio"
                        name="mcq_${index}"
                        value="${letter}"
                    >

                    ${escapeHTML(
                        getOption(row,letter)
                    )}

                </label>

            `).join("")}

        `;


        container.appendChild(div);

    });

}


/* =========================================================
   ERROR CORRECTION
========================================================= */

function renderError(){

    const container =
        document.getElementById("errorContainer");

    container.innerHTML = "";


    errorQuestions.forEach((row,index)=>{

        const div =
            document.createElement("div");

        div.className = "question";


        const question =
            getQuestion(row);


        div.innerHTML = `

            <div class="question-title">

                ${index+1}.
                ${escapeHTML(question)}

            </div>

            <textarea
                id="error_${index}"
                placeholder="Write the corrected Java code here..."
            ></textarea>

        `;


        container.appendChild(div);

    });

}


/* =========================================================
   CODING
========================================================= */

function renderCoding(){

    const container =
        document.getElementById("codingContainer");

    container.innerHTML = "";


    codingQuestions.forEach((row,index)=>{

        const div =
            document.createElement("div");

        div.className = "question";


        const question =
            getQuestion(row);


        const requirement =
            String(
                row["Student Input Format"] ||
                row["Coding Requirement"] ||
                row.Requirement ||
                ""
            );


        const inputFormat =
            String(
                row["Student Input Format"] ||
                ""
            );


        const outputFormat =
            String(
                row["Student Output Format"] ||
                ""
            );


        const constraints =
            String(
                row["Constraints / Contract"] ||
                ""
            );


        const sampleInput =
            String(
                row["Sample Input"] ||
                ""
            );


        const sampleOutput =
            String(
                row["Sample Output"] ||
                ""
            );


        div.innerHTML = `

            <div class="question-title">

                Coding Question ${index+1}

            </div>

            <p>
                <strong>Question:</strong><br>
                ${escapeHTML(question)}
            </p>

            ${
                requirement
                ?
                `
                <p>
                    <strong>Requirement:</strong><br>
                    ${escapeHTML(requirement)}
                </p>
                `
                :
                ""
            }


            ${
                inputFormat
                ?
                `
                <p>
                    <strong>Input:</strong><br>
                    ${escapeHTML(inputFormat)}
                </p>
                `
                :
                ""
            }


            ${
                outputFormat
                ?
                `
                <p>
                    <strong>Output:</strong><br>
                    ${escapeHTML(outputFormat)}
                </p>
                `
                :
                ""
            }


            ${
                constraints
                ?
                `
                <p>
                    <strong>Constraints:</strong><br>
                    ${escapeHTML(constraints)}
                </p>
                `
                :
                ""
            }


            ${
                sampleInput
                ?
                `
                <div class="sample">

                    <strong>Sample Input:</strong>

                    ${escapeHTML(sampleInput)}

                </div>
                `
                :
                ""
            }


            ${
                sampleOutput
                ?
                `
                <div class="sample">

                    <strong>Sample Output:</strong>

                    ${escapeHTML(sampleOutput)}

                </div>
                `
                :
                ""
            }


            <br>

            <textarea
                id="coding_${index}"
                placeholder="Write your Java code here..."
            ></textarea>

        `;


        container.appendChild(div);

    });

}


/* =========================================================
   SIMPLE CODING EVALUATOR
========================================================= */

function evaluateCoding(code, question){

    if(!code || code.trim().length < 20){

        return {
            status:"Wrong",
            score:0
        };

    }


    const c =
        code.toLowerCase();


    const q =
        getQuestion(question).toLowerCase();


    /*
       Count meaningful Java features.
    */

    let score = 0;

    let required = 0;


    /* -----------------------------------------------------
       GENERAL JAVA STRUCTURE
    ----------------------------------------------------- */

    const hasJavaStructure =
        c.includes("class") ||
        c.includes("static") ||
        c.includes("public");


    if(hasJavaStructure){
        score++;
    }

    required++;


    /* -----------------------------------------------------
       LOOPS
    ----------------------------------------------------- */

    const hasLoop =
        c.includes("for(") ||
        c.includes("for (") ||
        c.includes("while(") ||
        c.includes("while (") ||
        c.includes("do{") ||
        c.includes("do {");


    const questionNeedsLoop =
        q.includes("loop") ||
        q.includes("series") ||
        q.includes("digits") ||
        q.includes("prime") ||
        q.includes("repeat") ||
        q.includes("iterate");


    if(questionNeedsLoop){

        required++;

        if(hasLoop){
            score++;
        }

    }


    /* -----------------------------------------------------
       CONDITIONS
    ----------------------------------------------------- */

    const hasCondition =
        c.includes("if(") ||
        c.includes("if (") ||
        c.includes("switch(") ||
        c.includes("switch (") ||
        c.includes("?");


    const questionNeedsCondition =
        q.includes("check") ||
        q.includes("whether") ||
        q.includes("condition") ||
        q.includes("even") ||
        q.includes("odd") ||
        q.includes("prime") ||
        q.includes("greater") ||
        q.includes("smaller");


    if(questionNeedsCondition){

        required++;

        if(hasCondition){
            score++;
        }

    }


    /* -----------------------------------------------------
       ARRAY
    ----------------------------------------------------- */

    const hasArray =
        c.includes("[]") ||
        c.includes("array");


    const questionNeedsArray =
        q.includes("array") ||
        q.includes("element") ||
        q.includes("sort") ||
        q.includes("search");


    if(questionNeedsArray){

        required++;

        if(hasArray){
            score++;
        }

    }


    /* -----------------------------------------------------
       STRING
    ----------------------------------------------------- */

    const hasString =
        c.includes("string") ||
        c.includes(".length") ||
        c.includes("charat") ||
        c.includes("substring") ||
        c.includes("equals");


    const questionNeedsString =
        q.includes("string") ||
        q.includes("character") ||
        q.includes("palindrome") ||
        q.includes("reverse");


    if(questionNeedsString){

        required++;

        if(hasString){
            score++;
        }

    }


    /* -----------------------------------------------------
       DIGIT OPERATIONS
    ----------------------------------------------------- */

    const digitQuestion =
        q.includes("digit") ||
        q.includes("sum of digits");


    if(digitQuestion){

        required += 2;

        if(c.includes("%")){
            score++;
        }

        if(c.includes("/")){
            score++;
        }

    }


    /* -----------------------------------------------------
       FIBONACCI
    ----------------------------------------------------- */

    const fibonacciQuestion =
        q.includes("fibonacci");


    if(fibonacciQuestion){

        required += 2;

        if(
            c.includes("fibonacci") ||
            (
                c.includes("+") &&
                hasLoop
            )
        ){
            score++;
        }


        if(
            c.includes("a") &&
            c.includes("b") &&
            c.includes("+")
        ){
            score++;
        }

    }


    /* -----------------------------------------------------
       PRIME
    ----------------------------------------------------- */

    const primeQuestion =
        q.includes("prime");


    if(primeQuestion){

        required += 2;

        if(hasLoop){
            score++;
        }

        if(
            c.includes("%")
        ){
            score++;
        }

    }


    /* -----------------------------------------------------
       OOPS
    ----------------------------------------------------- */

    const oopQuestion =
        q.includes("class") ||
        q.includes("object") ||
        q.includes("inheritance") ||
        q.includes("polymorphism") ||
        q.includes("encapsulation") ||
        q.includes("constructor");


    if(oopQuestion){

        required++;

        if(
            c.includes("class") ||
            c.includes("extends") ||
            c.includes("implements") ||
            c.includes("new ")
        ){
            score++;
        }

    }


    /* -----------------------------------------------------
       METHODS
    ----------------------------------------------------- */

    const methodQuestion =
        q.includes("method") ||
        q.includes("function");


    if(methodQuestion){

        required++;

        if(
            c.includes("(") &&
            c.includes(")")
        ){
            score++;
        }

    }


    /* -----------------------------------------------------
       COLLECTIONS
    ----------------------------------------------------- */

    const collectionQuestion =
        q.includes("arraylist") ||
        q.includes("list") ||
        q.includes("set") ||
        q.includes("map") ||
        q.includes("hashmap");


    if(collectionQuestion){

        required++;

        if(
            c.includes("arraylist") ||
            c.includes("list<") ||
            c.includes("hashset") ||
            c.includes("hashmap") ||
            c.includes("map<")
        ){
            score++;
        }

    }


    /* -----------------------------------------------------
       FINAL DECISION
    ----------------------------------------------------- */

    const ratio =
        required > 0
        ?
        score / required
        :
        0;


    if(ratio >= 0.75){

        return {
            status:"Complete",
            score:1
        };

    }


    if(ratio >= 0.35){

        return {
            status:"Partially Correct",
            score:0.5
        };

    }


    return {
        status:"Wrong",
        score:0
    };

}


/* =========================================================
   COLLECT ANSWERS
========================================================= */

function collectAnswers(){

    const answers = [];


    /* -----------------------------------------------------
       MCQ ANSWERS
    ----------------------------------------------------- */

    mcqQuestions.forEach((row,index)=>{

        const selected =
            document.querySelector(
                `input[name="mcq_${index}"]:checked`
            );


        answers.push({

            type:"MCQ",

            question:getQuestion(row),

            answer:
                selected
                ?
                selected.value
                :
                "",

            correctAnswer:
                String(
                    row["Correct Answer"] ||
                    row.Answer ||
                    row["Correct"] ||
                    ""
                )

        });

    });


    /* -----------------------------------------------------
       ERROR ANSWERS
    ----------------------------------------------------- */

    errorQuestions.forEach((row,index)=>{

        const field =
            document.getElementById(
                `error_${index}`
            );


        answers.push({

            type:"ERROR",

            question:getQuestion(row),

            answer:
                field
                ?
                field.value
                :
                "",

            correctAnswer:
                String(
                    row["Correct Answer"] ||
                    row.Answer ||
                    row["Correct"] ||
                    ""
                )

        });

    });


    /* -----------------------------------------------------
       CODING ANSWERS
    ----------------------------------------------------- */

    codingQuestions.forEach((row,index)=>{

        const field =
            document.getElementById(
                `coding_${index}`
            );


        const code =
            field
            ?
            field.value
            :
            "";


        const evaluation =
            evaluateCoding(
                code,
                row
            );


        answers.push({

            type:"CODING",

            question:getQuestion(row),

            code:code,

            status:evaluation.status,

            score:evaluation.score,

            evaluation:"Automatic rubric evaluation"

        });

    });


    return answers;

}


/* =========================================================
   SUBMIT
========================================================= */

function submitAssessment(){

    if(
        !confirm(
            "Are you sure you want to submit the assessment?"
        )
    ){

        return;

    }


    clearInterval(timerInterval);


    document.getElementById("submitButton").disabled =
        true;


    const answers =
        collectAnswers();


    /* -----------------------------------------------------
       MCQ SCORE
    ----------------------------------------------------- */

    let mcqScore = 0;


    answers
        .filter(a => a.type === "MCQ")
        .forEach(a => {

            if(
                String(a.answer).trim().toUpperCase() ===
                String(a.correctAnswer).trim().toUpperCase()
            ){

                mcqScore++;

            }

        });


    /* -----------------------------------------------------
       ERROR SCORE
       Simple answer comparison
    ----------------------------------------------------- */

    let errorScore = 0;


    answers
        .filter(a => a.type === "ERROR")
        .forEach(a => {

            if(
                a.answer.trim() !== "" &&
                a.correctAnswer.trim() !== "" &&
                a.answer
                    .toLowerCase()
                    .includes(
                        a.correctAnswer
                            .toLowerCase()
                            .trim()
                    )
            ){

                errorScore++;

            }

        });


    /* -----------------------------------------------------
       CODING SCORE
    ----------------------------------------------------- */

    let codingScore = 0;


    answers
        .filter(a => a.type === "CODING")
        .forEach(a => {

            codingScore +=
                Number(a.score || 0);

        });


    /* -----------------------------------------------------
       TOTAL
    ----------------------------------------------------- */

    const totalScore =
        mcqScore +
        errorScore +
        codingScore;


    const maxScore = 15;


    const percentage =
        (totalScore / maxScore) * 100;


    /* -----------------------------------------------------
       STATUS
    ----------------------------------------------------- */

    const status =
        "Completed";


    /* -----------------------------------------------------
       RESULT OBJECT
    ----------------------------------------------------- */

    const result = {

        studentName:studentName,

        studentYear:studentYear,

        day:currentDay,

        topic:currentTopic,

        mcqScore:mcqScore,

        errorScore:errorScore,

        codingScore:codingScore,

        totalScore:totalScore,

        maxScore:maxScore,

        percentage:
            Number(
                percentage.toFixed(2)
            ),

        status:status,

        answers:answers,

        submittedAt:
            new Date().toISOString()

    };


    /* -----------------------------------------------------
       SAVE LATEST RESULT
    ----------------------------------------------------- */

    localStorage.setItem(
        "latestAssessmentResult",
        JSON.stringify(result)
    );


    /* -----------------------------------------------------
       SAVE ALL RESULTS
    ----------------------------------------------------- */

    let previousResults = [];


    try{

        previousResults =
            JSON.parse(
                localStorage.getItem(
                    "assessmentResults"
                )
            ) || [];

    }catch(e){

        previousResults = [];

    }


    previousResults.push(result);


    localStorage.setItem(
        "assessmentResults",
        JSON.stringify(previousResults)
    );


    /* -----------------------------------------------------
       SAVE SIMPLE SCORE
    ----------------------------------------------------- */

    localStorage.setItem(
        "lastScore",
        String(totalScore)
    );


    localStorage.setItem(
        "lastPercentage",
        String(
            percentage.toFixed(2)
        )
    );


    /* -----------------------------------------------------
       GO TO RESULTS
    ----------------------------------------------------- */

    window.location.href =
        "results.html";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   TIMER
========================================================= */

let timeLeft = 40 * 60;

let timerInterval;


function startTimer(){

    timerInterval =
        setInterval(()=>{

            const minutes =
                Math.floor(
                    timeLeft / 60
                );

            const seconds =
                timeLeft % 60;


            document.getElementById("timer")
                .textContent =
                    String(minutes).padStart(2,"0") +
                    ":" +
                    String(seconds).padStart(2,"0");


            if(timeLeft <= 0){

                clearInterval(timerInterval);

                alert(
                    "Time is over. Your assessment will be submitted automatically."
                );

                submitAssessment();

                return;

            }


            timeLeft--;

        },1000);

}

loadQuestions();

startTimer();

</script>
