<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Java Placement Assessment</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

}

}

.section-title{

    font-weight:bold;
}

.loading{
    text-align:center;

.error{

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Java Placement Assessment</h1>

        <div>
            Student:
            <b id="studentName">Loading...</b>
        </div>

        <div>
            Username:
            <b id="studentUsername">Loading...</b>
        </div>

        <div>
            Year:
            <b id="studentYear">Loading...</b>
        </div>

        <div>
            Assessment Day:
            <b id="assessmentDay">Loading...</b>
        </div>

    </div>


    <div id="loading" class="loading">
        Loading questions...
    </div>


    <div id="error"
         class="error"
         style="display:none;">
    </div>


    <div id="assessmentArea"
         style="display:none;">

        <div class="timer">
            Time Remaining:
            <span id="timer">40:00</span>
        </div>


        <form id="assessmentForm">

            <div id="questionContainer"></div>

            <button
                type="button"
                class="submit-btn"
                onclick="finishAssessment()">

                Submit Assessment

            </button>

        </form>

    </div>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxrrb6gSB12hmilk7j5BEWqeOmSAJad9Zi-ZbpaoS1kaJRHhUAoDh02-teDu2O_hbSnRA/exec";


/* =====================================================
   EXCEL FILES
===================================================== */

const EXCEL_FILES = [

    "./Java_Placement_41_Day_MASTER_WITH_CODING_EVALUATION (2).xlsx",

    "./Java_Placement_41_Day_FINAL_CORRECTED.xlsx"

];


/* =====================================================
   GET LOGGED STUDENT
===================================================== */

function getLoggedStudent(){

    try{

        return JSON.parse(
            localStorage.getItem("loggedInStudent") || "null"
        );

    }
    catch(error){

        return null;

    }

}


const loggedStudent = getLoggedStudent();


const studentName =
    loggedStudent?.name ||
    loggedStudent?.Name ||
    localStorage.getItem("studentName") ||
    "Student";


const studentUsername =
    loggedStudent?.username ||
    loggedStudent?.Username ||
    localStorage.getItem("studentUsername") ||
    "";


const studentYear =
    loggedStudent?.year ||
    loggedStudent?.Year ||
    localStorage.getItem("studentYear") ||
    "";


/* =====================================================
   GET ASSESSMENT DAY
===================================================== */

let assignedDay = parseInt(

    localStorage.getItem("assessmentDay") ||

    localStorage.getItem("assignedDay") ||

    localStorage.getItem("currentDay") ||

    "1",

    10

);


if(isNaN(assignedDay) || assignedDay < 1){

    assignedDay = 1;

}


if(assignedDay > 41){

    assignedDay = 41;

}


/* =====================================================
   DISPLAY STUDENT
===================================================== */

document.getElementById("studentName").textContent =
    studentName;

document.getElementById("studentUsername").textContent =
    studentUsername;

document.getElementById("studentYear").textContent =
    studentYear;

document.getElementById("assessmentDay").textContent =
    "Day " + assignedDay;


/* =====================================================
   VARIABLES
===================================================== */

let allQuestions = [];

let selectedQuestions = [];

let timeRemaining = 40 * 60;

let timerInterval = null;

let submitting = false;


/* =====================================================
   LOAD EXCEL
===================================================== */

async function loadExcel(){

    let workbook = null;

    let lastError = null;


    for(const file of EXCEL_FILES){

        try{

            const response = await fetch(
                file + "?v=" + Date.now()
            );


            if(!response.ok){

                throw new Error(
                    "Unable to load " + file
                );

            }


            const buffer =
                await response.arrayBuffer();


            workbook =
                XLSX.read(
                    buffer,
                    {
                        type:"array"
                    }
                );


            if(workbook){

                break;

            }

        }
        catch(error){

            lastError = error;

        }

    }


    if(!workbook){

        throw lastError ||
        new Error(
            "Excel file could not be loaded."
        );

    }


    let sheetName =

        workbook.SheetNames.includes("Question Bank")

        ?

        "Question Bank"

        :

        workbook.SheetNames[0];


    const sheet =
        workbook.Sheets[sheetName];


    const rows =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                defval:""
            }
        );


    if(!rows.length){

        throw new Error(
            "No questions found in Excel."
        );

    }


    allQuestions = rows;


    console.log(
        "Total imported questions:",
        allQuestions.length
    );


    prepareQuestions();

}


/* =====================================================
   GENERIC EXCEL FIELD
===================================================== */

function getExcelField(row,names){

    for(const name of names){

        if(
            row[name] !== undefined &&
            row[name] !== null &&
            String(row[name]).trim() !== ""
        ){

            return String(row[name]).trim();

        }

    }


    return "";

}


/* =====================================================
   QUESTION
===================================================== */

function getQuestion(row){

    return getExcelField(
        row,
        [
            "Question",
            "question",
            "Question Text",
            "QuestionText",
            "questionText",
            "Question Text/Problem",
            "Problem",
            "problem"
        ]
    );

}


/* =====================================================
   DAY
===================================================== */

function getDay(row){

    const value =
        getExcelField(
            row,
            [
                "Day",
                "day",
                "Day Number",
                "day number",
                "DayNumber",
                "dayNumber"
            ]
        );


    return parseInt(value,10);

}


/* =====================================================
   QUESTION TYPE / SECTION
===================================================== */

function getSection(row){

    const value =
        getExcelField(
            row,
            [
                "Section",
                "section",
                "Type",
                "type",
                "Question Type",
                "question type",
                "QuestionType",
                "questionType",
                "Question_Type",
                "QUESTION TYPE",
                "Category",
                "category"
            ]
        );


    return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/[_-]+/g," ")
        .replace(/\s+/g," ");

}


/* =====================================================
   CHECK MCQ
===================================================== */

function isMCQ(row){

    const section = getSection(row);


    return (

        section === "MCQ"

        ||

        section.includes("MCQ")

        ||

        section.includes("MULTIPLE CHOICE")

    );

}


/* =====================================================
   CHECK ERROR
===================================================== */

function isErrorQuestion(row){

    const section = getSection(row);


    return (

        section.includes("ERROR")

        ||

        section.includes("DEBUG")

        ||

        section.includes("ERROR FINDING")

        ||

        section.includes("ERROR CORRECTION")

    );

}


/* =====================================================
   CHECK CODING
===================================================== */

function isCoding(row){

    const section = getSection(row);


    return (

        section.includes("CODING")

        ||

        section.includes("PROGRAM")

        ||

        section.includes("PROGRAMMING")

    );

}


/* =====================================================
   OPTIONS
===================================================== */

function getOption(row,letter){

    return getExcelField(
        row,
        [
            "Option " + letter,
            "option " + letter,
            "option" + letter,
            "Option" + letter,
            letter
        ]
    );

}


/* =====================================================
   CORRECT ANSWER
===================================================== */

function getCorrectAnswer(row){

    return getExcelField(
        row,
        [
            "Correct Answer",
            "correctAnswer",
            "CorrectAnswer",
            "Answer",
            "answer"
        ]
    );

}


/* =====================================================
   PREPARE DAY QUESTIONS
===================================================== */

function prepareQuestions(){

    const dayQuestions =
        allQuestions.filter(
            row =>
                getDay(row) === assignedDay
        );


    console.log(
        "Questions for Day " + assignedDay + ":",
        dayQuestions.length
    );


    if(dayQuestions.length === 0){

        throw new Error(
            "No questions found for Day " +
            assignedDay +
            "."
        );

    }


    const mcq =
        dayQuestions.filter(isMCQ);


    const errorQuestions =
        dayQuestions.filter(isErrorQuestion);


    const coding =
        dayQuestions.filter(isCoding);


    console.log(
        "Day " + assignedDay +
        " MCQ:",
        mcq.length
    );

    console.log(
        "Day " + assignedDay +
        " Error:",
        errorQuestions.length
    );

    console.log(
        "Day " + assignedDay +
        " Coding:",
        coding.length
    );


    shuffle(mcq);

    shuffle(errorQuestions);

    shuffle(coding);


    const selectedMCQ =
        mcq.slice(0,10);


    const selectedError =
        errorQuestions.slice(0,2);


    const selectedCoding =
        coding.slice(0,3);


    if(selectedMCQ.length < 10){

        throw new Error(
            "Day " +
            assignedDay +
            " has only " +
            selectedMCQ.length +
            " MCQ questions. Need 10."
        );

    }


    if(selectedError.length < 2){

        throw new Error(
            "Day " +
            assignedDay +
            " has only " +
            selectedError.length +
            " Error questions. Need 2."
        );

    }


    if(selectedCoding.length < 3){

        throw new Error(
            "Day " +
            assignedDay +
            " has only " +
            selectedCoding.length +
            " Coding questions. Need 3."
        );

    }


    selectedQuestions = [

        ...selectedMCQ,

        ...selectedError,

        ...selectedCoding

    ];


    renderQuestions();

    startTimer();

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

    for(
        let i = array.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];

    }

}


/* =====================================================
   RENDER ALL QUESTIONS
===================================================== */

function renderQuestions(){

    const container =
        document.getElementById(
            "questionContainer"
        );


    container.innerHTML = "";


    selectedQuestions.forEach(
        (row,index) => {


            if(index === 0){

                container.innerHTML +=
                    "<div class='section-title'>" +
                    "MCQ Questions" +
                    "</div>";

            }


            if(index === 10){

                container.innerHTML +=
                    "<div class='section-title'>" +
                    "Error Correction Questions" +
                    "</div>";

            }


            if(index === 12){

                container.innerHTML +=
                    "<div class='section-title'>" +
                    "Coding Questions" +
                    "</div>";

            }


            const card =
                document.createElement("div");


            card.className =
                "question-card";


            const question =
                getQuestion(row);


            let html =

                "<div class='question-title'>" +

                "Q" +
                (index + 1) +
                ". " +

                escapeHTML(question) +

                "</div>";


            if(index < 12){

                html +=
                    renderObjective(
                        row,
                        index
                    );

            }
            else{

                html +=
                    renderCoding(
                        row,
                        index
                    );

            }


            card.innerHTML = html;


            container.appendChild(card);

        }
    );


    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "assessmentArea"
    ).style.display = "block";

}


/* =====================================================
   RENDER MCQ / ERROR
===================================================== */

function renderObjective(row,index){

    const letters =
        ["A","B","C","D"];


    let html = "";


    letters.forEach(letter => {

        const option =
            getOption(row,letter);


        if(!option){

            return;

        }


        html +=

            "<label class='option'>" +

            "<input " +

            "type='radio' " +

            "name='q" +
            index +
            "' " +

            "value='" +
            escapeAttribute(letter) +
            "'>" +

            "<b>" +
            letter +
            ".</b> " +

            escapeHTML(option) +

            "</label>";

    });


    return html;

}


/* =====================================================
   RENDER CODING
===================================================== */

function renderCoding(row,index){

    return (

        "<p><b>Write your Java code:</b></p>" +

        "<textarea " +

        "id='coding" +
        index +
        "' " +

        "placeholder='Write your Java code here...'>" +

        "</textarea>"

    );

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    clearInterval(timerInterval);


    updateTimer();


    timerInterval =
        setInterval(
            () => {

                timeRemaining--;


                updateTimer();


                if(timeRemaining <= 0){

                    clearInterval(
                        timerInterval
                    );


                    alert(
                        "Time is over. Your assessment will be submitted."
                    );


                    finishAssessment(true);

                }

            },
            1000
        );

}


/* =====================================================
   UPDATE TIMER
===================================================== */

function updateTimer(){

    const minutes =
        Math.floor(
            timeRemaining / 60
        );


    const seconds =
        timeRemaining % 60;


    document.getElementById(
        "timer"
    ).textContent =

        String(minutes)
            .padStart(2,"0")

        +

        ":"

        +

        String(seconds)
            .padStart(2,"0");

}


/* =====================================================
   FINISH ASSESSMENT
===================================================== */

async function finishAssessment(
    automaticSubmit = false
){

    if(submitting){

        return;

    }


    if(!automaticSubmit){

        const ok =
            confirm(
                "Are you sure you want to submit the assessment?"
            );


        if(!ok){

            return;

        }

    }


    submitting = true;


    clearInterval(
        timerInterval
    );


    let mcqScore = 0;

    let errorScore = 0;

    let codingScore = 0;


    const answerSheet = [];


    /* =================================================
       COLLECT ANSWERS
    ================================================= */

    selectedQuestions.forEach(
        (row,index) => {


            const question =
                getQuestion(row);


            /* OBJECTIVE */

            if(index < 12){

                const selected =
                    document.querySelector(
                        "input[name='q" +
                        index +
                        "']:checked"
                    );


                const studentAnswer =
                    selected
                    ?
                    selected.value
                    :
                    "";


                const correctAnswer =
                    getCorrectAnswer(row);


                const isCorrect =
                    normalizeAnswer(
                        studentAnswer
                    )
                    ===
                    normalizeAnswer(
                        correctAnswer
                    );


                let status =
                    isCorrect
                    ?
                    "Correct"
                    :
                    "Wrong";


                if(isCorrect){

                    if(index < 10){

                        mcqScore++;

                    }
                    else{

                        errorScore++;

                    }

                }


                answerSheet.push({

                    type:
                        index < 10
                        ?
                        "MCQ"
                        :
                        "ERROR",

                    question:
                        question,

                    studentAnswer:
                        studentAnswer ||
                        "Not Answered",

                    correctAnswer:
                        correctAnswer ||
                        "-",

                    status:
                        status,

                    score:
                        isCorrect
                        ?
                        1
                        :
                        0

                });

            }


            /* CODING */

            else{

                const textarea =
                    document.getElementById(
                        "coding" + index
                    );


                const code =
                    textarea
                    ?
                    textarea.value
                    :
                    "";


                const evaluation =
                    evaluateCoding(
                        code,
                        question
                    );


                codingScore +=
                    evaluation.score;


                answerSheet.push({

                    type:
                        "CODING",

                    question:
                        question,

                    studentAnswer:
                        code ||
                        "Not Answered",

                    status:
                        evaluation.status,

                    score:
                        evaluation.score,

                    evaluation:
                        "Automatic rubric evaluation"

                });

            }

        }
    );


    /* =================================================
       SCORE
    ================================================= */

    const totalScore =
        mcqScore +
        errorScore +
        codingScore;


    const percentage =
        (
            totalScore / 15 * 100
        ).toFixed(2);


    const codingEvaluations =
        answerSheet.filter(
            answer =>
                answer.type === "CODING"
        );


    /* =================================================
       REPORT
    ================================================= */

    const report = {

        name:
            studentName,

        studentName:
            studentName,

        username:
            studentUsername,

        studentUsername:
            studentUsername,

        year:
            studentYear,

        studentYear:
            studentYear,

        day:
            assignedDay,

        topic:
            "Java Placement Practice",

        mcqScore:
            mcqScore,

        errorScore:
            errorScore,

        codingScore:
            codingScore,

        totalScore:
            totalScore,

        percentage:
            percentage,

        status:
            "Completed",

        submittedAt:
            new Date().toISOString(),

        answers:
            answerSheet,

        codingEvaluations:
            codingEvaluations

    };


    /* =================================================
       SAVE STUDENT REPORT
    ================================================= */

    saveLocalReport(report);


    /* =================================================
       SAVE RESULT PAGE DATA
    ================================================= */

    localStorage.setItem(
        "latestAssessmentResult",
        JSON.stringify(report)
    );


    localStorage.setItem(
        "lastAssessmentResult",
        JSON.stringify(report)
    );


    /* =================================================
       SEND TO GOOGLE SHEET
    ================================================= */

    try{

        await sendToGoogleSheet(report);

    }
    catch(error){

        console.error(
            "Google Sheet error:",
            error
        );

    }


    /* =================================================
       NEXT DAY
    ================================================= */

    const completedDay =
        assignedDay;


    let nextDay =
        completedDay + 1;


    if(nextDay > 41){

        nextDay = 41;

    }


    /*
       Keep all three keys synchronized.
    */

    localStorage.setItem(
        "assignedDay",
        String(nextDay)
    );


    localStorage.setItem(
        "assessmentDay",
        String(nextDay)
    );


    localStorage.setItem(
        "currentDay",
        String(nextDay)
    );


    /* =================================================
       FINAL DAY FLAG
    ================================================= */

    if(completedDay === 41){

        localStorage.setItem(
            "allAssessmentsCompleted",
            "true"
        );

    }


    /* =================================================
       OPEN RESULTS
    ================================================= */

    window.location.href =
        "results.html";

}


/* =====================================================
   SAVE LOCAL REPORT
===================================================== */

function saveLocalReport(report){

    let reports = [];


    try{

        reports =
            JSON.parse(
                localStorage.getItem(
                    "studentReports"
                ) || "[]"
            );

    }
    catch(error){

        reports = [];

    }


    /*
       Prevent duplicate submission
       for the same student and day.
    */

    reports =
        reports.filter(
            item => !(
                String(item.username) ===
                String(report.username)

                &&

                Number(item.day) ===
                Number(report.day)
            )
        );


    reports.push(report);


    localStorage.setItem(
        "studentReports",
        JSON.stringify(reports)
    );

}


/* =====================================================
   SEND TO GOOGLE SHEET
===================================================== */

async function sendToGoogleSheet(report){

    const payload = {

        Name:
            report.name,

        Username:
            report.username,

        Year:
            report.year,

        Day:
            report.day,

        Topic:
            report.topic,

        "MCQ + Error":
            (
                report.mcqScore +
                report.errorScore
            )
            +
            "/12",

        Coding:
            report.codingScore +
            "/3",

        Total:
            report.totalScore +
            "/15",

        Percentage:
            report.percentage +
            "%",

        Status:
            "Completed",

        "Submission Date":
            report.submittedAt,

        Answers:
            JSON.stringify(
                report.answers
            ),

        "Coding Evaluation":
            JSON.stringify(
                report.codingEvaluations
            )

    };


    await fetch(
        GOOGLE_SCRIPT_URL,
        {

            method:"POST",

            mode:"no-cors",

            headers:{
                "Content-Type":
                    "text/plain"
            },

            body:
                JSON.stringify(payload)

        }
    );

}


/* =====================================================
   CODING EVALUATION
===================================================== */

function evaluateCoding(
    code,
    question
){

    if(
        !code ||
        code.trim().length < 20
    ){

        return {

            status:
                "Wrong",

            score:
                0

        };

    }


    const c =
        code
        .toLowerCase()
        .replace(/\s+/g," ");


    const q =
        question
        .toLowerCase();


    let score = 0;

    let required = 0;


    /* JAVA STRUCTURE */

    required++;


    if(
        c.includes("class")
        ||
        c.includes("public static void")
        ||
        c.includes("static void")
    ){

        score++;

    }


    /* LOOP */

    const needsLoop =

        q.includes("loop")
        ||
        q.includes("for")
        ||
        q.includes("while")
        ||
        q.includes("iterate")
        ||
        q.includes("fibonacci")
        ||
        q.includes("prime")
        ||
        q.includes("factorial")
        ||
        q.includes("sum");


    if(needsLoop){

        required++;


        if(
            c.includes("for(")
            ||
            c.includes("for (")
            ||
            c.includes("while(")
            ||
            c.includes("while (")
            ||
            c.includes("do{")
            ||
            c.includes("do {")
        ){

            score++;

        }

    }


    /* ARRAY */

    const needsArray =

        q.includes("array")
        ||
        q.includes("elements");


    if(needsArray){

        required++;


        if(
            c.includes("[]")
            ||
            c.includes("array")
        ){

            score++;

        }

    }


    /* STRING */

    const needsString =

        q.includes("string")
        ||
        q.includes("character")
        ||
        q.includes("palindrome");


    if(needsString){

        required++;


        if(
            c.includes("string")
            ||
            c.includes(".length")
            ||
            c.includes("charat")
            ||
            c.includes("substring")
            ||
            c.includes("tolowercase")
            ||
            c.includes("touppercase")
        ){

            score++;

        }

    }


    /* MODULO */

    const needsModulo =

        q.includes("digit")
        ||
        q.includes("remainder")
        ||
        q.includes("even")
        ||
        q.includes("odd")
        ||
        q.includes("divisible")
        ||
        q.includes("prime");


    if(needsModulo){

        required++;


        if(c.includes("%")){

            score++;

        }

    }


    /* ARITHMETIC */

    const needsArithmetic =

        q.includes("sum")
        ||
        q.includes("add")
        ||
        q.includes("average")
        ||
        q.includes("area")
        ||
        q.includes("perimeter")
        ||
        q.includes("product");


    if(needsArithmetic){

        required++;


        if(
            c.includes("+")
            ||
            c.includes("-")
            ||
            c.includes("*")
            ||
            c.includes("/")
        ){

            score++;

        }

    }


    /* OUTPUT */

    const needsOutput =

        q.includes("print")
        ||
        q.includes("display")
        ||
        q.includes("output")
        ||
        q.includes("find");


    if(needsOutput){

        required++;


        if(
            c.includes("system.out.print")
        ){

            score++;

        }

    }


    /* METHOD */

    const needsMethod =

        q.includes("method")
        ||
        q.includes("function");


    if(needsMethod){

        required++;


        if(
            c.includes("(")
            &&
            c.includes(")")
        ){

            score++;

        }

    }


    /* OOP */

    const needsOOP =

        q.includes("class")
        ||
        q.includes("object")
        ||
        q.includes("inheritance")
        ||
        q.includes("polymorphism")
        ||
        q.includes("encapsulation")
        ||
        q.includes("constructor");


    if(needsOOP){

        required++;


        if(
            c.includes("class")
            ||
            c.includes("extends")
            ||
            c.includes("new ")
            ||
            c.includes("private")
            ||
            c.includes("public")
            ||
            c.includes("interface")
        ){

            score++;

        }

    }


    /* COLLECTIONS */

    const needsCollection =

        q.includes("arraylist")
        ||
        q.includes("list")
        ||
        q.includes("set")
        ||
        q.includes("map")
        ||
        q.includes("hashmap");


    if(needsCollection){

        required++;


        if(
            c.includes("arraylist")
            ||
            c.includes("hashmap")
            ||
            c.includes("hashset")
            ||
            c.includes("list<")
            ||
            c.includes("set<")
            ||
            c.includes("map<")
        ){

            score++;

        }

    }


    /* FINAL CODING SCORE */

    const ratio =
        required > 0
        ?
        score / required
        :
        0;


    if(ratio >= 0.75){

        return {

            status:
                "Complete",

            score:
                1

        };

    }


    if(ratio >= 0.35){

        return {

            status:
                "Partially Correct",

            score:
                0.5

        };

    }


    return {

        status:
            "Wrong",

        score:
            0

    };

}


/* =====================================================
   NORMALIZE ANSWER
===================================================== */

function normalizeAnswer(value){

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ")
        .replace(
            /^[a-d]\.\s*/,
            ""
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value){

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}
