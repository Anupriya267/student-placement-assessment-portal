<!DOCTYPE html>
<html>

<head>

<title>Java Placement Assessment</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</head>


<body>


<div class="container">

<h1>Java Placement Assessment</h1>

<h2 id="assessmentTitle">
Java Placement Assessment
</h2>

<p>
<b>Day:</b>
<span id="dayNumber">1</span>
</p>

<p>
<b>Topic:</b>
<span id="topic">Loading...</span>
</p>

<p>
<b>Duration:</b> 40 Minutes
</p>

<h2>
Time Remaining:
<span id="timer">40:00</span>
</h2>


<div id="loading">
Loading questions...
</div>


<form id="assessmentForm">

<div id="questionContainer"></div>


<button
type="button"
onclick="submitAssessment()">

Submit Assessment

</button>


</form>

</div>



<script>


let questions = [];

let timeLeft = 40 * 60;

let timerInterval;



// ==================================================
// LOAD QUESTIONS
// ==================================================

async function loadQuestions(){

    try{

        const response =
            await fetch(
                "./Java_Placement_41_Day_FINAL_CORRECTED.xlsx"
            );


        if(!response.ok){

            throw new Error(
                "Excel file could not be loaded"
            );

        }


        const data =
            await response.arrayBuffer();


        const workbook =
            XLSX.read(
                data,
                {
                    type:"array"
                }
            );


        const sheet =
            workbook.Sheets[
                "Question Bank"
            ];


        if(!sheet){

            throw new Error(
                "Question Bank sheet not found"
            );

        }


        const rows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    defval:""
                }
            );


        const assignedDay =
            localStorage.getItem(
                "assignedDay"
            )
            ||
            "1";


        const dayQuestions =
            rows.filter(
                function(q){

                    return String(q.Day)
                    ===
                    String(assignedDay);

                }
            );


        const mcqs =
            dayQuestions.filter(
                function(q){

                    return String(
                        q["Question Type"]
                        ||
                        ""
                    )
                    .trim()
                    .toUpperCase()
                    ===
                    "MCQ";

                }
            );


        const errors =
            dayQuestions.filter(
                function(q){

                    return String(
                        q["Question Type"]
                        ||
                        ""
                    )
                    .trim()
                    .toUpperCase()
                    ===
                    "ERROR";

                }
            );


        const coding =
            dayQuestions.filter(
                function(q){

                    return String(
                        q["Question Type"]
                        ||
                        ""
                    )
                    .trim()
                    .toUpperCase()
                    ===
                    "CODING";

                }
            );


        questions = [

            ...mcqs.slice(0,10),

            ...errors.slice(0,2),

            ...coding.slice(0,3)

        ];


        if(
            questions.length === 0
        ){

            throw new Error(
                "No questions found for this day."
            );

        }


        document.getElementById(
            "dayNumber"
        ).innerText =
            assignedDay;


        document.getElementById(
            "assessmentTitle"
        ).innerText =
            "Day "
            +
            assignedDay
            +
            " Java Placement Assessment";


        document.getElementById(
            "topic"
        ).innerText =
            "Java Placement";


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        displayQuestions();

        startTimer();

    }


    catch(error){

        console.error(error);


        document.getElementById(
            "loading"
        ).innerHTML =

            "<h3>Unable to load question bank.</h3>"
            +
            "<p>"
            +
            error.message
            +
            "</p>";

    }

}



// ==================================================
// DISPLAY QUESTIONS
// ==================================================

function displayQuestions(){

    const container =
        document.getElementById(
            "questionContainer"
        );


    container.innerHTML = "";


    questions.forEach(
        function(q,index){

            const type =
                String(
                    q["Question Type"]
                    ||
                    ""
                )
                .trim()
                .toUpperCase();


            const number =
                index + 1;


            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "question-box";


            const heading =
                document.createElement(
                    "h3"
                );


            heading.innerText =
                "Question "
                +
                number
                +
                ". "
                +
                q.Question;


            box.appendChild(
                heading
            );



            // ======================================
            // MCQ
            // ======================================

            if(type === "MCQ"){

                addOption(
                    box,
                    number,
                    "A",
                    q["Option A"]
                );


                addOption(
                    box,
                    number,
                    "B",
                    q["Option B"]
                );


                addOption(
                    box,
                    number,
                    "C",
                    q["Option C"]
                );


                addOption(
                    box,
                    number,
                    "D",
                    q["Option D"]
                );

            }



            // ======================================
            // ERROR
            // ======================================

            else if(type === "ERROR"){

                addOption(
                    box,
                    number,
                    "A",
                    q["Option A"]
                );


                addOption(
                    box,
                    number,
                    "B",
                    q["Option B"]
                );


                addOption(
                    box,
                    number,
                    "C",
                    q["Option C"]
                );


                addOption(
                    box,
                    number,
                    "D",
                    q["Option D"]
                );

            }



            // ======================================
            // CODING
            // ======================================

            else if(type === "CODING"){

                const requirement =
                    document.createElement(
                        "p"
                    );


                requirement.innerHTML =
                    "<b>Coding Requirement:</b><br>"
                    +
                    escapeHTML(
                        String(
                            q[
                                "Coding Requirement"
                            ]
                            ||
                            q.Question
                            ||
                            ""
                        )
                    );


                box.appendChild(
                    requirement
                );


                const textarea =
                    document.createElement(
                        "textarea"
                    );


                textarea.id =
                    "coding_"
                    +
                    number;


                textarea.placeholder =
                    "Write your Java code here...";


                textarea.style.width =
                    "100%";


                textarea.style.minHeight =
                    "180px";


                box.appendChild(
                    textarea
                );

            }


            container.appendChild(
                box
            );

        }
    );

}



// ==================================================
// ADD OPTION
// ==================================================

function addOption(
    box,
    number,
    letter,
    text
){

    if(
        text === undefined
        ||
        String(text).trim() === ""
    ){

        return;

    }


    const label =
        document.createElement(
            "label"
        );


    label.style.display =
        "block";


    label.style.margin =
        "10px 0";


    label.innerHTML =

        '<input type="radio" ' +

        'name="question_' +
        number +
        '" ' +

        'value="' +
        letter +
        '">' +

        " <b>" +
        letter +
        ".</b> " +

        escapeHTML(
            String(text)
        );


    box.appendChild(
        label
    );

}



// ==================================================
// SUBMIT ASSESSMENT
// ==================================================

function submitAssessment(){

    if(
        !confirm(
            "Are you sure you want to submit the assessment?"
        )
    ){

        return;

    }


    clearInterval(
        timerInterval
    );


    let score = 0;

    let totalObjective = 0;

    let answerSheet = [];


    questions.forEach(
        function(q,index){

            const type =
                String(
                    q["Question Type"]
                    ||
                    ""
                )
                .trim()
                .toUpperCase();


            const number =
                index + 1;


            // ======================================
            // MCQ / ERROR
            // ======================================

            if(
                type === "MCQ"
                ||
                type === "ERROR"
            ){

                totalObjective++;


                const selected =
                    document.querySelector(
                        'input[name="question_' +
                        number +
                        '"]:checked'
                    );


                const studentAnswer =
                    selected
                    ?
                    selected.value
                    :
                    "Not Answered";


                const correctAnswer =
                    String(
                        q["Correct Answer"]
                        ||
                        ""
                    )
                    .trim();


                const correct =
                    studentAnswer
                    ===
                    correctAnswer;


                if(correct){

                    score++;

                }


                answerSheet.push({

                    question:
                        q.Question,

                    studentAnswer:
                        studentAnswer,

                    correctAnswer:
                        correctAnswer,

                    status:
                        correct
                        ?
                        "Correct"
                        :
                        "Wrong"

                });

            }



            // ======================================
            // CODING
            // ======================================

            else if(
                type === "CODING"
            ){

                const box =
                    document.getElementById(
                        "coding_" +
                        number
                    );


                const code =
                    box
                    ?
                    box.value.trim()
                    :
                    "";


                answerSheet.push({

                    question:
                        q.Question,

                    studentAnswer:
                        code
                        ?
                        code
                        :
                        "Not Answered",

                    correctAnswer:
                        "Coding evaluation pending",

                    status:
                        "Pending"

                });

            }

        }
    );



    // =================================================
    // STUDENT INFORMATION
    // =================================================

    const studentName =
        localStorage.getItem(
            "studentName"
        )
        ||
        "Student";


    const studentUsername =
        localStorage.getItem(
            "studentUsername"
        )
        ||
        "student1";


    const studentYear =
        localStorage.getItem(
            "studentYear"
        )
        ||
        "Final Year";


    const assignedDay =
        localStorage.getItem(
            "assignedDay"
        )
        ||
        "1";



    // =================================================
    // PERCENTAGE
    // =================================================

    const percentage =

        totalObjective > 0

        ?

        (
            score
            /
            totalObjective
            *
            100
        ).toFixed(2)

        :

        "0.00";



    // =================================================
    // SAVE RESULT FOR RESULT PAGE
    // =================================================

    localStorage.setItem(
        "score",
        score
    );


    localStorage.setItem(
        "total",
        totalObjective
    );


    localStorage.setItem(
        "answerSheet",
        JSON.stringify(
            answerSheet
        )
    );


    localStorage.setItem("submittedDay", assignedDay);
    // Move student to the next day
let currentDay = parseInt(assignedDay);

if (currentDay < 41) {
    let nextDay = currentDay + 1;

    localStorage.setItem(
        "assignedDay",
        nextDay
    );

    // Also update the student's saved record
    let students =
        JSON.parse(
            localStorage.getItem("students") || "[]"
        );

    let studentUsername =
        localStorage.getItem("studentUsername");

    let studentIndex =
        students.findIndex(function(student) {
            return String(student.username) ===
                   String(studentUsername);
        });

    if (studentIndex !== -1) {

        students[studentIndex].assignedDay =
            nextDay;

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );
    }
}



    // =================================================
    // CREATE ADMIN REPORT
    // =================================================

    const report = {

        id:
            Date.now(),

        name:
            studentName,

        username:
            studentUsername,

        year:
            studentYear,

        day:
            assignedDay,

        score:
            score,

        total:
            totalObjective,

        percentage:
            percentage,

        status:
            "Completed",

        date:
            new Date().toLocaleString(),

        answers:
            answerSheet

    };



    // =================================================
    // SAVE REPORT
    // =================================================

    let reports =
        JSON.parse(
            localStorage.getItem(
                "studentReports"
            )
            ||
            "[]"
        );


    // Replace previous submission
    // for same student + same day

    reports =
        reports.filter(
            function(r){

                return !(
                    r.username
                    ===
                    studentUsername
                    &&
                    String(r.day)
                    ===
                    String(assignedDay)
                );

            }
        );


    reports.push(
        report
    );


    localStorage.setItem(
        "studentReports",
        JSON.stringify(
            reports
        )
    );



    // =================================================
    // GO TO RESULT
    // =================================================

    window.location.href =
        "results.html";

}



// ==================================================
// TIMER
// ==================================================

function startTimer(){

    updateTimer();


    timerInterval =
        setInterval(
            function(){

                timeLeft--;


                updateTimer();


                if(
                    timeLeft <= 0
                ){

                    clearInterval(
                        timerInterval
                    );


                    alert(
                        "Time is over. Your assessment will be submitted automatically."
                    );


                    submitAssessment();

                }

            },
            1000
        );

}



function updateTimer(){

    const minutes =
        Math.floor(
            timeLeft / 60
        );


    const seconds =
        timeLeft % 60;


    document.getElementById(
        "timer"
    ).innerText =

        String(minutes)
        .padStart(2,"0")

        +

        ":"

        +

        String(seconds)
        .padStart(2,"0");

}



// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ==================================================
// START
// ==================================================

loadQuestions();

</script>


</body>

    </html>
