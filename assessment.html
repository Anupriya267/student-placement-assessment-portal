<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java Placement Assessment</title>

    <link rel="stylesheet" href="style.css">

    <!-- Excel Reader -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .info {
            background: #f1f5ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .timer {
            position: sticky;
            top: 10px;
            background: #222;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
        }

        .question {
            border: 1px solid #ddd;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            background: #fff;
        }

        .question h3 {
            margin-top: 0;
        }

        .option {
            display: block;
            padding: 10px;
            margin: 8px 0;
            background: #f7f7f7;
            border-radius: 6px;
            cursor: pointer;
        }

        .option:hover {
            background: #eaf0ff;
        }

        textarea {
            width: 100%;
            min-height: 220px;
            padding: 12px;
            box-sizing: border-box;
            font-family: Consolas, monospace;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .loading {
            text-align: center;
            padding: 30px;
            font-size: 18px;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .section-title {
            background: #1e293b;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Java Placement Assessment</h1>

    <div class="info">
        <p><strong>Student:</strong> <span id="studentName">Student</span></p>
        <p><strong>Year:</strong> <span id="studentYear">Final Year</span></p>
        <p><strong>Assessment:</strong> <span id="assessmentName">Java Placement Assessment</span></p>
        <p><strong>Topic:</strong> <span id="assessmentTopic">Loading...</span></p>
        <p><strong>Duration:</strong> 40 Minutes</p>
    </div>

    <div class="timer">
        Time Remaining:
        <span id="timer">40:00</span>
    </div>

    <div id="loading" class="loading">
        Loading questions...
    </div>

    <div id="errorBox" class="error" style="display:none;"></div>

    <form id="assessmentForm" style="display:none;">

        <div class="section-title">
            Section A — Multiple Choice Questions
        </div>

        <div id="mcqContainer"></div>

        <div class="section-title">
            Section B — Error Correction
        </div>

        <div id="errorContainer"></div>

        <div class="section-title">
            Section C — Coding Questions
        </div>

        <div id="codingContainer"></div>

        <br>

        <button type="submit" class="submit-btn">
            Submit Assessment
        </button>

    </form>

</div>

<script>

/* =========================================================
   SETTINGS
========================================================= */

const EXCEL_FILE =
    "./Java_Placement_41_Day_MASTER_WITH_CODING_EVALUATION.xlsx?v=" +
    Date.now();

const ASSESSMENT_DURATION = 40 * 60;

let timeRemaining = ASSESSMENT_DURATION;
let timerInterval = null;

let allQuestions = [];
let selectedQuestions = [];

let studentName = localStorage.getItem("studentName") || "Student 1";
let studentYear = localStorage.getItem("studentYear") || "Final Year";

let currentDay =
    parseInt(
        localStorage.getItem("assessmentDay") ||
        localStorage.getItem("currentDay") ||
        "3"
    );

let currentTopic =
    localStorage.getItem("assessmentTopic") ||
    "Operators, Conditions and Loops";


/* =========================================================
   DISPLAY STUDENT INFORMATION
========================================================= */

document.getElementById("studentName").textContent = studentName;
document.getElementById("studentYear").textContent = studentYear;
document.getElementById("assessmentTopic").textContent = currentTopic;

document.getElementById("assessmentName").textContent =
    "Day " + currentDay + " Java Placement Assessment";


/* =========================================================
   HELPER FUNCTIONS
========================================================= */

function clean(value) {
    if (value === undefined || value === null) {
        return "";
    }

    return String(value).trim();
}


function normalizeQuestionType(type) {

    const value = clean(type).toUpperCase();

    if (
        value === "MCQ" ||
        value.includes("MULTIPLE")
    ) {
        return "MCQ";
    }

    if (
        value === "ERROR" ||
        value.includes("ERROR")
    ) {
        return "ERROR";
    }

    if (
        value === "CODING" ||
        value.includes("CODE")
    ) {
        return "CODING";
    }

    return value;
}


/* =========================================================
   RANDOM SELECTION
========================================================= */

function shuffle(array) {

    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] =
        [copy[j], copy[i]];
    }

    return copy;
}


function selectQuestions(questions) {

    const mcqs = questions.filter(
        q => normalizeQuestionType(q["Question Type"]) === "MCQ"
    );

    const errors = questions.filter(
        q => normalizeQuestionType(q["Question Type"]) === "ERROR"
    );

    const coding = questions.filter(
        q => normalizeQuestionType(q["Question Type"]) === "CODING"
    );

    /*
       Required structure:

       10 MCQ
       2 Error Correction
       3 Coding
    */

    if (mcqs.length < 10) {
        throw new Error(
            "Not enough MCQ questions for Day " + currentDay
        );
    }

    if (errors.length < 2) {
        throw new Error(
            "Not enough Error Correction questions for Day " +
            currentDay
        );
    }

    if (coding.length < 3) {
        throw new Error(
            "Not enough Coding questions for Day " +
            currentDay
        );
    }

    const selectedMCQ =
        shuffle(mcqs).slice(0, 10);

    const selectedError =
        shuffle(errors).slice(0, 2);

    const selectedCoding =
        shuffle(coding).slice(0, 3);

    return [
        ...selectedMCQ,
        ...selectedError,
        ...selectedCoding
    ];
}


/* =========================================================
   LOAD EXCEL
========================================================= */

async function loadQuestions() {

    try {

        document.getElementById("loading").style.display = "block";

        const response = await fetch(
            EXCEL_FILE,
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {

            throw new Error(
                "Excel file could not be loaded. HTTP Status: " +
                response.status
            );
        }

        const arrayBuffer =
            await response.arrayBuffer();

        const workbook =
            XLSX.read(arrayBuffer, {
                type: "array"
            });

        if (!workbook.SheetNames.includes("Question Bank")) {

            throw new Error(
                "Question Bank sheet was not found in the Excel file."
            );
        }

        const sheet =
            workbook.Sheets["Question Bank"];

        const data =
            XLSX.utils.sheet_to_json(sheet, {
                defval: ""
            });

        if (!data.length) {

            throw new Error(
                "Question Bank is empty."
            );
        }

        /*
           Filter questions for current day.
        */

        const dayQuestions =
            data.filter(q => {

                const day =
                    parseInt(clean(q["Day"]));

                return day === currentDay;
            });

        if (!dayQuestions.length) {

            throw new Error(
                "No questions found for Day " +
                currentDay +
                ". Please check the Day column in Excel."
            );
        }

        allQuestions = dayQuestions;

        selectedQuestions =
            selectQuestions(dayQuestions);

        renderQuestions();

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("assessmentForm").style.display =
            "block";

        startTimer();

    } catch (error) {

        console.error(error);

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("errorBox").style.display =
            "block";

        document.getElementById("errorBox").innerHTML =
            "<strong>Unable to load assessment.</strong><br><br>" +
            error.message +
            "<br><br>" +
            "Please check that the Excel file is uploaded to GitHub with this exact name:<br>" +
            "<strong>Java_Placement_41_Day_MASTER_WITH_CODING_EVALUATION.xlsx</strong>";
    }
}


/* =========================================================
   RENDER QUESTIONS
========================================================= */

function renderQuestions() {

    const mcqContainer =
        document.getElementById("mcqContainer");

    const errorContainer =
        document.getElementById("errorContainer");

    const codingContainer =
        document.getElementById("codingContainer");

    mcqContainer.innerHTML = "";
    errorContainer.innerHTML = "";
    codingContainer.innerHTML = "";

    let mcqNumber = 0;
    let errorNumber = 0;
    let codingNumber = 0;

    selectedQuestions.forEach((q, index) => {

        const type =
            normalizeQuestionType(q["Question Type"]);

        if (type === "MCQ") {

            mcqNumber++;

            renderMCQ(
                q,
                mcqNumber,
                mcqContainer
            );
        }

        else if (type === "ERROR") {

            errorNumber++;

            renderErrorQuestion(
                q,
                errorNumber,
                errorContainer
            );
        }

        else if (type === "CODING") {

            codingNumber++;

            renderCodingQuestion(
                q,
                codingNumber,
                codingContainer
            );
        }

    });
}


/* =========================================================
   MCQ
========================================================= */

function renderMCQ(q, number, container) {

    const question =
        clean(q["Question"]);

    const optionA =
        clean(q["Option A"]);

    const optionB =
        clean(q["Option B"]);

    const optionC =
        clean(q["Option C"]);

    const optionD =
        clean(q["Option D"]);

    const div =
        document.createElement("div");

    div.className = "question";

    div.innerHTML = `

        <h3>
            ${number}. ${escapeHTML(question)}
        </h3>

        <label class="option">
            <input
                type="radio"
                name="mcq_${number}"
                value="A"
            >
            A. ${escapeHTML(optionA)}
        </label>

        <label class="option">
            <input
                type="radio"
                name="mcq_${number}"
                value="B"
            >
            B. ${escapeHTML(optionB)}
        </label>

        <label class="option">
            <input
                type="radio"
                name="mcq_${number}"
                value="C"
            >
            C. ${escapeHTML(optionC)}
        </label>

        <label class="option">
            <input
                type="radio"
                name="mcq_${number}"
                value="D"
            >
            D. ${escapeHTML(optionD)}
        </label>

    `;

    container.appendChild(div);
}


/* =========================================================
   ERROR CORRECTION
========================================================= */

function renderErrorQuestion(q, number, container) {

    const question =
        clean(q["Question"]);

    const div =
        document.createElement("div");

    div.className = "question";

    div.innerHTML = `

        <h3>
            ${number}. ${escapeHTML(question)}
        </h3>

        <p>
            Identify the error and provide the corrected answer.
        </p>

        <textarea
            name="error_${number}"
            placeholder="Enter your corrected answer..."
        ></textarea>

    `;

    container.appendChild(div);
}


/* =========================================================
   CODING QUESTION
========================================================= */

function renderCodingQuestion(q, number, container) {

    const question =
        clean(q["Question"]);

    const requirement =
        clean(q["Coding Requirement"]);

    const evaluationMode =
        clean(q["Evaluation Mode"]);

    const inputFormat =
        clean(q["Student Input Format"]);

    const outputFormat =
        clean(q["Student Output Format"]);

    const constraints =
        clean(q["Constraints / Contract"]);

    const sampleInput =
        clean(q["Sample Input"]);

    const sampleOutput =
        clean(q["Sample Output"]);

    const div =
        document.createElement("div");

    div.className = "question";

    div.innerHTML = `

        <h3>
            Coding Question ${number}
        </h3>

        <p>
            <strong>Problem:</strong>
        </p>

        <p>
            ${formatText(question)}
        </p>

        ${
            requirement
            ?
            `
            <p>
                <strong>Requirement:</strong><br>
                ${formatText(requirement)}
            </p>
            `
            :
            ""
        }

        ${
            inputFormat
            ?
            `
            <p>
                <strong>Input Format:</strong><br>
                ${formatText(inputFormat)}
            </p>
            `
            :
            ""
        }

        ${
            outputFormat
            ?
            `
            <p>
                <strong>Output Format:</strong><br>
                ${formatText(outputFormat)}
            </p>
            `
            :
            ""
        }

        ${
            constraints
            ?
            `
            <p>
                <strong>Constraints / Contract:</strong><br>
                ${formatText(constraints)}
            </p>
            `
            :
            ""
        }

        ${
            sampleInput
            ?
            `
            <p>
                <strong>Sample Input:</strong>
            </p>

            <pre>${escapeHTML(sampleInput)}</pre>
            `
            :
            ""
        }

        ${
            sampleOutput
            ?
            `
            <p>
                <strong>Sample Output:</strong>
            </p>

            <pre>${escapeHTML(sampleOutput)}</pre>
            `
            :
            ""
        }

        ${
            evaluationMode
            ?
            `
            <p>
                <strong>Evaluation:</strong>
                ${escapeHTML(evaluationMode)}
            </p>
            `
            :
            ""
        }

        <p>
            <strong>Write your Java code:</strong>
        </p>

        <textarea
            id="coding_${number}"
            name="coding_${number}"
            placeholder="Write your Java code here..."
        ></textarea>

    `;

    container.appendChild(div);
}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatText(value) {

    return escapeHTML(value)
        .replace(/\r?\n/g, "<br>");
}


/* =========================================================
   TIMER
========================================================= */

function startTimer() {

    updateTimerDisplay();

    timerInterval =
        setInterval(() => {

            timeRemaining--;

            updateTimerDisplay();

            if (timeRemaining <= 0) {

                clearInterval(timerInterval);

                alert(
                    "Time is over. Your assessment will be submitted automatically."
                );

                submitAssessment(true);
            }

        }, 1000);
}


function updateTimerDisplay() {

    const minutes =
        Math.floor(timeRemaining / 60);

    const seconds =
        timeRemaining % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");
}


/* =========================================================
   GET STUDENT ANSWERS
========================================================= */

function collectAnswers() {

    const answerSheet = [];

    let mcqNumber = 0;
    let errorNumber = 0;
    let codingNumber = 0;

    selectedQuestions.forEach((q) => {

        const type =
            normalizeQuestionType(q["Question Type"]);

        if (type === "MCQ") {

            mcqNumber++;

            const selected =
                document.querySelector(
                    `input[name="mcq_${mcqNumber}"]:checked`
                );

            answerSheet.push({

                questionType: "MCQ",

                questionNumber:
                    clean(q["Question No."]),

                question:
                    clean(q["Question"]),

                studentAnswer:
                    selected ? selected.value : "",

                correctAnswer:
                    clean(q["Correct Answer"]),

                marks: 1

            });

        }

        else if (type === "ERROR") {

            errorNumber++;

            const textarea =
                document.querySelector(
                    `textarea[name="error_${errorNumber}"]`
                );

            answerSheet.push({

                questionType: "ERROR",

                questionNumber:
                    clean(q["Question No."]),

                question:
                    clean(q["Question"]),

                studentAnswer:
                    textarea ? textarea.value : "",

                correctAnswer:
                    clean(q["Correct Answer"]),

                marks: 1

            });

        }

        else if (type === "CODING") {

            codingNumber++;

            const textarea =
                document.getElementById(
                    `coding_${codingNumber}`
                );

            answerSheet.push({

                questionType: "CODING",

                questionNumber:
                    clean(q["Question No."]),

                question:
                    clean(q["Question"]),

                studentAnswer:
                    textarea ? textarea.value : "",

                correctAnswer:
                    clean(q["Full-Mark Logic / Answer Key"]),

                evaluationMode:
                    clean(q["Evaluation Mode"]),

                studentInputFormat:
                    clean(q["Student Input Format"]),

                studentOutputFormat:
                    clean(q["Student Output Format"]),

                constraints:
                    clean(q["Constraints / Contract"]),

                sampleInput:
                    clean(q["Sample Input"]),

                sampleOutput:
                    clean(q["Sample Output"]),

                status:
                    "Pending Evaluation",

                marks: 0

            });

        }

    });

    return answerSheet;
}


/* =========================================================
   OBJECTIVE MARKING
========================================================= */

function calculateObjectiveScore(answerSheet) {

    let score = 0;

    answerSheet.forEach(answer => {

        if (
            answer.questionType === "MCQ" ||
            answer.questionType === "ERROR"
        ) {

            const student =
                normalizeAnswer(answer.studentAnswer);

            const correct =
                normalizeAnswer(answer.correctAnswer);

            if (
                student &&
                correct &&
                (
                    student === correct ||
                    student.includes(correct) ||
                    correct.includes(student)
                )
            ) {
                score++;
            }

        }

    });

    return score;
}


function normalizeAnswer(value) {

    return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, " ");
}


/* =========================================================
   SUBMIT
========================================================= */

document
    .getElementById("assessmentForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            submitAssessment(false);

        }
    );


function submitAssessment(autoSubmit) {

    if (!autoSubmit) {

        const confirmation =
            confirm(
                "Are you sure you want to submit the assessment?"
            );

        if (!confirmation) {
            return;
        }

    }

    if (timerInterval) {
        clearInterval(timerInterval);
    }

    const answerSheet =
        collectAnswers();

    const objectiveScore =
        calculateObjectiveScore(answerSheet);

    const codingCount =
        answerSheet.filter(
            a => a.questionType === "CODING"
        ).length;

    const totalQuestions =
        answerSheet.length;

    /*
       Current scoring:

       MCQ = 10
       Error = 2
       Coding = 3

       Coding remains Pending until the
       secure evaluator is connected.
    */

    const objectiveTotal = 12;

    const codingScore = 0;

    const totalScore =
        objectiveScore + codingScore;

    const percentage =
        (totalScore / totalQuestions) * 100;

    const result = {

        studentName:
            studentName,

        year:
            studentYear,

        day:
            currentDay,

        topic:
            currentTopic,

        assessment:
            "Day " + currentDay +
            " Java Placement Assessment",

        mcqErrorScore:
            objectiveScore,

        mcqErrorTotal:
            objectiveTotal,

        codingScore:
            codingScore,

        codingTotal:
            codingCount,

        totalScore:
            totalScore,

        total:
            totalQuestions,

        percentage:
            Number(percentage.toFixed(2)),

        status:
            "Completed",

        codingStatus:
            codingCount > 0
            ? "Pending Evaluation"
            : "Completed",

        submittedAt:
            new Date().toISOString(),

        answerSheet:
            answerSheet,

        report:
            {
                studentName:
                    studentName,

                year:
                    studentYear,

                day:
                    currentDay,

                topic:
                    currentTopic,

                mcqError:
                    objectiveScore +
                    " / " +
                    objectiveTotal,

                coding:
                    codingScore +
                    " / " +
                    codingCount +
                    " - Pending Evaluation",

                total:
                    totalScore +
                    " / " +
                    totalQuestions,

                percentage:
                    Number(percentage.toFixed(2)),

                status:
                    "Completed"
            }

    };


    /*
       Save current result.
    */

    localStorage.setItem(
        "latestAssessmentResult",
        JSON.stringify(result)
    );


    /*
       Save result history.
    */

    let history = [];

    try {

        history =
            JSON.parse(
                localStorage.getItem(
                    "assessmentResults"
                )
            ) || [];

    } catch (e) {

        history = [];

    }

    history.push(result);

    localStorage.setItem(
        "assessmentResults",
        JSON.stringify(history)
    );


    /*
       Save current student's result.
    */

    localStorage.setItem(
        "lastScore",
        objectiveScore
    );

    localStorage.setItem(
        "lastTotal",
        totalQuestions
    );

    localStorage.setItem(
        "lastPercentage",
        Number(percentage.toFixed(2))
    );

    localStorage.setItem(
        "lastDay",
        currentDay
    );

    localStorage.setItem(
        "lastTopic",
        currentTopic
    );


    /*
       Move to results page.
    */

    window.location.href =
        "results.html";

}


/* =========================================================
   PREVENT ACCIDENTAL REFRESH WARNING
========================================================= */

let assessmentStarted = false;

window.addEventListener(
    "beforeunload",
    function(event) {

        if (
            document.getElementById(
                "assessmentForm"
            ).style.display !== "none"
        ) {

            event.preventDefault();

            event.returnValue = "";

        }

    }
);


/* =========================================================
   START
========================================================= */

loadQuestions();

</script>

</body>
</html>
