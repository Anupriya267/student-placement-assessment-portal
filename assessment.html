<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>

/* ===============================
   VARIABLES
================================ */

let questions = [];

let timeLeft = 40 * 60;

let timerInterval = null;

let assessmentSubmitted = false;


/* ===============================
   STUDENT DETAILS
================================ */

const studentName =
localStorage.getItem("studentName") || "Student";

const studentUsername =
localStorage.getItem("studentUsername") || "student1";

const studentYear =
localStorage.getItem("studentYear") || "Final Year";


/* ===============================
   TOPICS
================================ */

const topics = {

1:"Loops, Conditions, Operators",
2:"Loops and Conditional Logic",
3:"Operators, Conditions and Loops",
4:"Loop Problem Solving and Edge Cases",
5:"Array Basics and Loop Traversal",

14:"Array and String Problem Solving",
15:"String Manipulation",
16:"Array and String Interview Questions",
17:"Array and String Placement Problems",
18:"OOP Concepts and String Programs",
19:"Classes and Objects",
20:"Inheritance and Polymorphism",
21:"Encapsulation and Abstraction",
22:"OOP and String Programs",
23:"Java Frequently Asked Questions",
24:"OOP Placement Questions",
25:"String Placement Problems",
26:"Advanced String Problems",
27:"String and OOP Interview Questions",
28:"String Problem Solving",
29:"String and OOP Practice",
30:"Placement Coding Problems",

/* ===============================
   GET CURRENT DAY
================================ */

function getCurrentDay(){

    let day =
    parseInt(
        localStorage.getItem("assignedDay") || "1",
        10
    );


    if(isNaN(day)){
        day = 1;
    }


    if(day < 1){
        day = 1;
    }


    if(day > 41){
        day = 41;
    }


    /*
       Check completed reports.
       If Day 1 is completed,
       automatically use Day 2, etc.
    */

    let reports = [];


    try{

        reports =
        JSON.parse(
            localStorage.getItem("studentReports") || "[]"
        );

    }

    catch(error){

        reports = [];

    }


    const myReports =
    reports.filter(function(report){

        return String(report.username || "").trim()
        ===
        String(studentUsername).trim();

    });


    if(myReports.length > 0){

        let highestDay = 0;


        myReports.forEach(function(report){

            const d =
            parseInt(report.day,10);


            if(!isNaN(d) && d > highestDay){

                highestDay = d;

            }

        });


        if(highestDay >= 41){

            day = 41;

        }

        else if(highestDay >= 1){

            day = highestDay + 1;

        }

    }


    localStorage.setItem(
        "assignedDay",
        String(day)
    );


    return day;

}


const assignedDay =
getCurrentDay();


/* ===============================
   SHOW DAY IMMEDIATELY
================================ */

document.getElementById(
    "dayNumber"
).innerText =
assignedDay;


document.getElementById(
    "assessmentTitle"
).innerText =
"Day " +
assignedDay +
" Java Placement Assessment";


document.getElementById(
    "topic"
).innerText =
topics[assignedDay] ||
"Java Placement Practice";


/* ===============================
   LOAD EXCEL
================================ */

async function loadQuestions(){

    try{


        if(typeof XLSX === "undefined"){

            throw new Error(
                "Excel reader could not be loaded."
            );

        }


        const response =
        await fetch(
            "./Java_Placement_41_Day_FINAL_CORRECTED.xlsx?v=" +
            Date.now(),
            {
                cache:"no-store"
            }
        );


        if(!response.ok){

            throw new Error(
                "Excel file could not be loaded. HTTP Status: " +
                response.status
            );

        }


        const data =
        await response.arrayBuffer();


        const workbook =
        XLSX.read(
            data,
            {
                type:"array"
            }
        );


        const sheet =
        workbook.Sheets["Question Bank"];


        if(!sheet){

            throw new Error(
                "Question Bank sheet not found."
            );

        }


        const rows =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                defval:""
            }
        );


        /* ===============================
           CURRENT DAY QUESTIONS
        ================================ */

        const dayQuestions =
        rows.filter(function(q){

            return String(q.Day || "").trim()
            ===
            String(assignedDay);

        });


        /* ===============================
           MCQ
        ================================ */

        const mcqs =
        dayQuestions.filter(function(q){

            return String(
                q["Question Type"] || ""
            )
            .trim()
            .toUpperCase()
            ===
            "MCQ";

        });


        /* ===============================
           ERROR
        ================================ */

        const errors =
        dayQuestions.filter(function(q){

            const type =
            String(
                q["Question Type"] || ""
            )
            .trim()
            .toUpperCase();


            return (
                type === "ERROR"
                ||
                type === "ERROR CORRECTION"
            );

        });


        /* ===============================
           CODING
        ================================ */

        const coding =
        dayQuestions.filter(function(q){

            return String(
                q["Question Type"] || ""
            )
            .trim()
            .toUpperCase()
            ===
            "CODING";

        });


        /* ===============================
           CREATE 15 QUESTIONS
        ================================ */

        questions =
        mcqs.slice(0,10)
        .concat(
            errors.slice(0,2)
        )
        .concat(
            coding.slice(0,3)
        );


        if(questions.length !== 15){

            throw new Error(
                "Day " +
                assignedDay +
                " has only " +
                questions.length +
                " questions. Expected 15."
            );

        }


        document.getElementById(
            "loading"
        ).style.display =
        "none";


        displayQuestions();


        startTimer();

    }


    catch(error){

        console.error(error);


        document.getElementById(
            "loading"
        ).innerHTML =

        "<h3>Unable to load question bank.</h3>" +

        "<p>" +
        escapeHTML(error.message) +
        "</p>";

    }

}


/* ===============================
   DISPLAY QUESTIONS
================================ */

function displayQuestions(){

    const container =
    document.getElementById(
        "questionContainer"
    );


    container.innerHTML = "";


    questions.forEach(function(q,index){

        const type =
        String(
            q["Question Type"] || ""
        )
        .trim()
        .toUpperCase();


        const number =
        index + 1;


        const box =
        document.createElement("div");


        box.className =
        "question-box";


        const heading =
        document.createElement("h3");


        heading.innerText =
        "Question " +
        number +
        ". " +
        String(q.Question || "");


        box.appendChild(
            heading
        );


        /* ===============================
           MCQ
        ================================ */

        if(type === "MCQ"){

            addOption(
                box,
                number,
                "A",
                q["Option A"]
            );


            addOption(
                box,
                number,
                "B",
                q["Option B"]
            );


            addOption(
                box,
                number,
                "C",
                q["Option C"]
            );


            addOption(
                box,
                number,
                "D",
                q["Option D"]
            );

        }


        /* ===============================
           ERROR CORRECTION
        ================================ */

        else if(
            type === "ERROR"
            ||
            type === "ERROR CORRECTION"
        ){

            const instruction =
            document.createElement("p");


            instruction.innerHTML =
            "<b>Error Correction:</b> Select the correct answer.";


            box.appendChild(
                instruction
            );


            addOption(
                box,
                number,
                "A",
                q["Option A"]
            );


            addOption(
                box,
                number,
                "B",
                q["Option B"]
            );


            addOption(
                box,
                number,
                "C",
                q["Option C"]
            );


            addOption(
                box,
                number,
                "D",
                q["Option D"]
            );

        }


        /* ===============================
           CODING
        ================================ */

        else if(type === "CODING"){

            const requirement =
            document.createElement("p");


            requirement.innerHTML =
            "<b>Coding Requirement:</b><br>" +

            escapeHTML(
                String(
                    q["Coding Requirement"]
                    ||
                    q.Question
                    ||
                    ""
                )
            );


            box.appendChild(
                requirement
            );


            const textarea =
            document.createElement("textarea");


            textarea.id =
            "coding_" + number;


            textarea.placeholder =
            "Write your Java code here...";


            textarea.style.width =
            "100%";


            textarea.style.minHeight =
            "180px";


            textarea.style.boxSizing =
            "border-box";


            box.appendChild(
                textarea
            );

        }


        container.appendChild(
            box
        );

    });

}


/* ===============================
   ADD OPTION
================================ */

function addOption(
    box,
    number,
    letter,
    text
){

    if(
        text === undefined
        ||
        String(text).trim() === ""
    ){

        return;

    }


    const label =
    document.createElement("label");


    label.style.display =
    "block";


    label.style.margin =
    "10px 0";


    const radio =
    document.createElement("input");


    radio.type =
    "radio";


    radio.name =
    "question_" + number;


    radio.value =
    letter;


    label.appendChild(
        radio
    );


    label.appendChild(
        document.createTextNode(
            " " +
            letter +
            ". " +
            String(text)
        )
    );


    box.appendChild(
        label
    );

}


/* ===============================
   SUBMIT
================================ */

function submitAssessment(){

    if(assessmentSubmitted){

        return;

    }


    const confirmed =
    confirm(
        "Are you sure you want to submit the assessment?"
    );


    if(!confirmed){

        return;

    }


    finishAssessment();

}


/* ===============================
   FINISH ASSESSMENT
================================ */

function finishAssessment(){

    if(assessmentSubmitted){

        return;

    }


    assessmentSubmitted =
    true;


    clearInterval(
        timerInterval
    );


    let score = 0;

    let totalObjective = 0;

    let answerSheet = [];


    questions.forEach(function(q,index){

        const type =
        String(
            q["Question Type"] || ""
        )
        .trim()
        .toUpperCase();


        const number =
        index + 1;


        /* ===============================
           MCQ / ERROR
        ================================ */

        if(
            type === "MCQ"
            ||
            type === "ERROR"
            ||
            type === "ERROR CORRECTION"
        ){

            totalObjective++;


            const selected =
            document.querySelector(
                'input[name="question_' +
                number +
                '"]:checked'
            );


            const studentAnswer =
            selected
            ?
            selected.value
            :
            "Not Answered";


            const correctAnswer =
            String(
                q["Correct Answer"] || ""
            )
            .trim();


            const isCorrect =
            studentAnswer === correctAnswer;


            if(isCorrect){

                score++;

            }


            answerSheet.push({

                question:
                String(
                    q.Question || ""
                ),

                studentAnswer:
                studentAnswer,

                correctAnswer:
                correctAnswer,

                status:
                isCorrect
                ?
                "Correct"
                :
                "Wrong"

            });

        }


        /* ===============================
           CODING
        ================================ */

        else if(type === "CODING"){

            const codeBox =
            document.getElementById(
                "coding_" + number
            );


            const code =
            codeBox
            ?
            codeBox.value.trim()
            :
            "";


            answerSheet.push({

                question:
                String(
                    q.Question || ""
                ),

                studentAnswer:
                code
                ?
                code
                :
                "Not Answered",

                correctAnswer:
                "Coding evaluation pending",

                status:
                "Pending"

            });

        }

    });


    /* ===============================
       PERCENTAGE
    ================================ */

    const percentage =
    totalObjective > 0
    ?
    (
        score /
        totalObjective *
        100
    ).toFixed(2)
    :
    "0.00";


    /* ===============================
       SAVE RESULT
    ================================ */

    localStorage.setItem(
        "score",
        String(score)
    );


    localStorage.setItem(
        "total",
        String(totalObjective)
    );


    localStorage.setItem(
        "answerSheet",
        JSON.stringify(answerSheet)
    );


    localStorage.setItem(
        "submittedDay",
        String(assignedDay)
    );


    /* ===============================
       GET REPORTS
    ================================ */

    let studentReports = [];


    try{

        studentReports =
        JSON.parse(
            localStorage.getItem(
                "studentReports"
            )
            ||
            "[]"
        );

    }

    catch(error){

        studentReports = [];

    }


    /* ===============================
       CREATE REPORT
    ================================ */

    const report = {

        id:
        Date.now(),

        name:
        studentName,

        username:
        studentUsername,

        year:
        studentYear,

        day:
        assignedDay,

        score:
        score,

        total:
        totalObjective,

        percentage:
        percentage,

        status:
        "Completed",

        date:
        new Date().toLocaleString(),

        answers:
        answerSheet

    };


    /* ===============================
       REMOVE OLD SAME-DAY REPORT
    ================================ */

    studentReports =
    studentReports.filter(function(r){

        return !(
            String(r.username || "").trim()
            ===
            String(studentUsername).trim()
            &&
            String(r.day || "")
            ===
            String(assignedDay)
        );

    });


    /* ===============================
       SAVE NEW REPORT
    ================================ */

    studentReports.push(
        report
    );


    localStorage.setItem(
        "studentReports",
        JSON.stringify(studentReports)
    );


    /* ===============================
       NEXT DAY
    ================================ */

    if(assignedDay < 41){

        const nextDay =
        assignedDay + 1;


        localStorage.setItem(
            "assignedDay",
            String(nextDay)
        );


        /* Update student record */

        let students = [];


        try{

            students =
            JSON.parse(
                localStorage.getItem(
                    "students"
                )
                ||
                "[]"
            );

        }

        catch(error){

            students = [];

        }


        const studentIndex =
        students.findIndex(function(student){

            return String(
                student.username || ""
            )
            .trim()
            ===
            String(
                studentUsername
            )
            .trim();

        });


        if(studentIndex !== -1){

            students[studentIndex].assignedDay =
            nextDay;


            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );

        }

    }


    /* ===============================
       GO TO RESULTS
    ================================ */

    window.location.href =
    "results.html";

}


/* ===============================
   TIMER
================================ */

function startTimer(){

    updateTimer();


    timerInterval =
    setInterval(function(){

        timeLeft--;


        updateTimer();


        if(timeLeft <= 0){

            clearInterval(
                timerInterval
            );


            if(!assessmentSubmitted){

                alert(
                    "Time is over. Your assessment will be submitted automatically."
                );


                finishAssessment();

            }

        }

    },1000);

}
